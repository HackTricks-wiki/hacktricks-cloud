# Reviewed source techniques without a supported principal escalation edge.
- source: src/pentesting-ci-cd/github-security/basic-github-information.md#git-action-runner
  source_revision: 0b36331
  technique: Read AWS/GCP metadata from self-hosted runner
  reason: The self-hosted runner must actually run attacker-controlled code and expose a reachable AWS/GCP
    metadata identity; GitHub runner-to-host and cloud-role bindings are missing.
- source: src/pentesting-ci-cd/pentesting-ci-cd-methodology.md#exploitation-benefits
  source_revision: 0b36331
  technique: Select more privileged runner/agent and steal metadata identity
  reason: Requires control of runner scheduling or code execution on a host with reachable metadata credentials.
    CI scheduling and host identity binding are not collected.
- source: src/pentesting-ci-cd/teamcity-security/README.md#agent-cloud-pivoting
  source_revision: 0b36331
  technique: Read AWS/Azure/GCP metadata or Kubernetes SA token on agent
  reason: Requires code on a TeamCity agent and reachable cloud metadata or Kubernetes SA token tied to that
    agent. Existing K8s pod rules have a different source permission; TeamCity agent placement is uncollected.
