# Role targets removed where the service exposes only bounded operations.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-appflow-post-exploitation/README.md#createflowupdateflow--iampassrole-to-aws-glue-catalog-authority
  technique: aws-appflow-passrole-glue-catalog
  reason: AppFlow can make selected Glue Data Catalog metadata writes through the passed role, but does not give
    Alice that role session or its general permissions.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-region-switch-privesc/README.md#arc-region-switchcreateplan--updateplan--iampassrole--run-steps-as-the-execution-role
  technique: aws-arc-region-switch-passrole-createplan
  reason: ARC can run only configured plan step types through the role; the target cannot be the full passable IAM
    role.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-region-switch-privesc/README.md#ssm-run-command-step--execute-on-a-managed-node
  technique: aws-arc-region-switch-ssm-sendcommand-host-role
  reason: A plan can call SSM SendCommand through its execution role and may reach a selected managed node's IAM role. CSPM does not yet join the command document and parameters, plan execution path, online node, and node-to-role binding; plan write and PassRole alone cannot produce this edge.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-budgets-privesc/README.md#budgetscreatebudgetaction-iampassrole--budgetsexecutebudgetaction--attach-a-policy-through-a-budget-action
  technique: aws-budgets-passrole-createbudgetaction
  reason: Budget actions have three bounded operation types, and RUN_SSM_DOCUMENTS can only stop EC2 or RDS
    instances. An exact IAM policy attachment may grant a controlled principal permissions, but the retired entry
    targets the full passed role without proving an existing budget, triggered action, attach authority and recipient gain.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-chatbot-privesc/README.md#chatbotcreateslackchannelconfiguration--createmicrosoftteamschannelconfiguration--iampassrole
  technique: aws-chatbot-passrole-create-channel-configuration
  reason: Chat CLI requests are constrained by channel guardrails. The full role target overstates the authority
    actually available.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-chime-sdk-post-exploitation/README.md#chimecreatemediainsightspipelineconfiguration--iampassrole
  technique: aws-chime-passrole-mediainsightspipelineconfiguration
  reason: The media pipeline can read/write only configured media sources and sinks; the entry explicitly says this
    is not a role session.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-datasync-privesc/README.md#datasynccreatelocations3-datasynccreatetask-datasyncstarttaskexecution-iampassrole
  technique: aws-datasync-passrole-createlocations3-createtask
  reason: DataSync transfers selected S3 data through the role; it does not yield the role identity or broad IAM
    permissions.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-fis-privesc/README.md#updateexperimenttemplate--startexperiment-through-the-stored-role
  technique: aws-fis-updateexperimenttemplate-startexperiment
  reason: FIS can perform only configured experiment actions through its stored role, so a full-role escalation
    edge is unsupported.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#redshiftmodifyclusteriamroles-iampassrole--redshift-serverlessupdatenamespace-iampassrole---repoint-the-databases-aws-role
  technique: aws-redshift-passrole-attach-warehouse-role
  reason: Attaching a role to a Redshift warehouse yields only SQL integration operations, not the full IAM role
    session or permissions.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-post-exploitation/README.md#s3createjob-s3-batch-operations-iampassrole--mass-copyexposelock-a-whole-bucket-as-a-passed-role
  technique: aws-s3-batchoperations-passrole-createjob
  reason: S3 Batch Operations executes a bounded S3/Lambda job. The source does not gain general access to the passed
    role.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-s3-files-privesc/README.md#s3filescreatefilesystem-iampassrole--connect-a-bucket-through-a-service-role
  historical_source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-s3-files-privesc/README.md#s3filescreatefilesystem-iampassrole--mount-any-buckets-data-as-a-chosen-role
  technique: aws-s3files-passrole-createfilesystem
  reason: S3 Files synchronizes a selected bucket or prefix through its service role, subject to role, bucket and KMS authorization. A separate authorized NFS client is required for file access; the caller does not receive the role's credentials or its general IAM permissions.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#transfercreateuserupdateusercreateaccessupdateaccess--iampassrole--attach-a-chosen-role-to-an-sftp-identity
  technique: aws-transfer-passrole-createuser-access
  reason: Transfer Family grants file access scoped to S3/EFS locations through its role, not the full passed role
    identity.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#managed-workflow-role-abuse--execute-storage-actions-on-upload
  technique: aws-transfer-workflow-passrole-updateserver
  reason: Transfer workflow steps are fixed copy/tag/delete/decrypt/Lambda operations, not arbitrary IAM role permissions.
