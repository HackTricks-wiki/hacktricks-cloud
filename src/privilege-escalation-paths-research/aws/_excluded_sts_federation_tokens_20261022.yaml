# Federation API grants alone do not prove control of a usable external assertion.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#stsassumerolewithsaml
  source_revision: 582f48435f
  technique: Assume an IAM role using a controlled SAML assertion
  reason: A role trust for a SAML provider does not show that the source can obtain or sign an unexpired assertion for the exact role and principal. A usable edge needs the assertion issuer, audience, role claim, source control and trust-condition joins; these are not collected from AWS IAM permissions alone.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#stsassumerolewithwebidentity
  source_revision: 582f48435f
  technique: Assume an IAM role using a controlled web identity token
  reason: Web identity role trust alone does not prove possession of a valid token with the exact issuer, audience and subject. A usable edge needs token control, freshness, matching provider and trust conditions and any pod or workload access proof; these are not inferable from IAM permission inventory alone.
