# Legacy notebook editor routes need a supported editor and a cluster-role join.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#elasticmapreducecreateeditor-iamlistroles-elasticmapreducelistclusters-iampassrole-elasticmapreducedescribeeditor-elasticmapreduceopeneditorinconsole
  source_revision: e0ecce7ba7
  technique: Create and open a legacy EMR notebook on a privileged cluster
  reason: AWS has disabled creation of new notebooks in the old console. Passing the notebook service role supports networking and notebook storage, not automatic kernel access to that role. A principal edge requires proof that the legacy editor API still works, a READY editor attached to a compatible cluster, source access to its kernel, the exact cluster instance-profile or runtime role, and an accepted workload. Current inventory does not join these facts.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#legacy-elasticmapreduceopeneditorinconsole-boundary
  source_revision: e0ecce7ba7
  technique: Open an existing legacy EMR editor attached to a privileged cluster
  reason: OpenEditorInConsole alone is not AWS credential access. A principal edge needs a supported existing editor, exact attached cluster and active kernel, source authorization to the editor, executable notebook access, the cluster's effective instance-profile or runtime role, and a role-authorized effect. Current inventory does not collect this join.
