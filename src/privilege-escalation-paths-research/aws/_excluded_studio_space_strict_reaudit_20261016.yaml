- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#set-lifecycle-configuration-on-sagemaker-studio
  source_revision: b587e6bd26
  technique: Attach a controlled Studio lifecycle configuration to an existing space
  reason: The space inventory now joins a collected space ARN, app type, sharing type and
    owner to either the domain's shared-space role or the private owner's profile role.
    An executable edge still needs a creatable lifecycle configuration of the matching
    app type, UpdateSpace authorization for that exact space and a compatible later app
    start. Until those configuration and startup conditions are checked, the role mapping
    alone does not prove script execution. A generic SageMaker trust relationship cannot
    substitute for any of these joins.
  prior_id: aws-sagemaker-attach-studio-lifecycle-config-space
