  source_revision: 4d874afe90
  technique: Deploy a malicious Greengrass component to core devices and use their token exchange
    role
  reason: 'The caller may create a component with executable lifecycle code and deploy it to
    a permitted thing or thing group; a group target also needs iot:DescribeThingGroup. A role
    edge requires a specific connected core device that receives and runs the component, its
    nucleus iotRoleAlias setting, an IoT policy permitting that alias, the alias target IAM role
    and a usable token exchange service on the device. The evaluator collects none of the exact
    deployment-to-device-to-alias-to-role joins. Trust in credentials.iot.amazonaws.com alone
    identifies neither the device nor its role, so a permission-only edge would be speculative.'
  prior_id: aws-greengrass-createcomponentversion-createdeployment-tes-role
