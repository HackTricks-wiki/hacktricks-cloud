# IAM-role registration needs a session-bound user identity and resource name.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-quicksight-privesc/README.md#quicksightregisteruser--map-a-controlled-iam-identity-to-an-admin
  source_revision: 171e422299
  technique: Register a controlled IAM role session as a QuickSight administrator
  reason: RegisterUser accepts an IAM role only with a SessionName, and its QuickSight username and authorization ARN must match that chosen session identity. A role policy alone does not record the active session name or prove the source controls the registered session. Model this separately from IAM-user self-registration once the session-to-QuickSight-user join is established.
