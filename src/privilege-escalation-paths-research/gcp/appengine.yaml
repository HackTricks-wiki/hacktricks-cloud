    selector:
      gcp_challenge_fact: gcp-appengine-memcache-session
    scope: any
    outcome: scope_control
    aggregate_as: Verified targets for Recover cached session token from Memcache
  conditions:
  - id: exact_verified_prerequisites
    description: Exact source, resource, target, scope and gain must be verified; missing fact is UNKNOWN. Known
      cache key and type; list/getKey may be needed to discover it; token must be present and usable.
  confidence: conditional
  severity: high
  mitigation: Limit appengine.memcache.get to trusted operators and monitor the target-specific use.
