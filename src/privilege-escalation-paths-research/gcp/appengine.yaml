- id: gcp-appengine-log-credential
  provider: gcp
  service: appengine
  title: Recover credentials printed in App Engine logs
  source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-app-engine-post-exploitation.md#read-application-logs-with-logginglogentrieslist
  source_revision: 0b36331
  summary: Identity authenticated by a valid token or password printed in logs; emit only for the exact verified
    source, resource and target.
  requires:
    all_of:
    - action: logging.logEntries.list
      resource: '*'
  source_kind:
  - gcp_user
  - gcp_service_account
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-appengine-log-credential
    scope: any
    outcome: scope_control
    aggregate_as: Verified targets for Recover credentials printed in App Engine logs
  conditions:
  - id: exact_verified_prerequisites
    description: Exact source, resource, target, scope and gain must be verified; missing fact is UNKNOWN. Log entry
      actually contains credential; optional logging.privateLogEntries.list for private entries or logging.views.access
      for a specific view. No edge from permission alone.
  confidence: conditional
  severity: high
  mitigation: Limit logging.logEntries.list to trusted operators and monitor the target-specific use.
  references:
  - src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-app-engine-post-exploitation.md#read-application-logs-with-logginglogentrieslist
