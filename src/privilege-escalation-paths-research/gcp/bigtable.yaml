
- id: gcp-audit-s01-35-widen-a-view-caller-can-alre
  provider: gcp
  service: bigtable
  title: Widen a view caller can already read or mutate
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-bigtable-privesc.md#bigtableauthorizedviewsupdate--widen-a-view-that-you-can-already-use
  summary: The source can gain widen a view caller can already read or mutate. Updating a view expands rows or columns
    only if the caller can already use that view and the new subset is broader.
  requires:
    any_of:
    - - action: bigtable.authorizedViews.update
        resource: '*'
      - action: bigtable.authorizedViews.readRows
        resource: '*'
    - - action: bigtable.authorizedViews.update
        resource: '*'
      - action: bigtable.authorizedViews.mutateRows
        resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-audit-s01-35-widen-a-view-caller-can-alre
    scope: any
    aggregate_as: additional base-table rows/columns
  conditions:
  - id: exact_target_evidence
    description: Exclusion treats it as ordinary data widening, but page describes new read or mutation privilege
      beyond view definition; readRows/mutateRows are alternatives. Missing target evidence evaluates UNKNOWN.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and review target trust/consumer configuration.
  source_revision: 0b36331
  references:
  - https://cloud.hacktricks.wiki/en/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-bigtable-privesc/#bigtableauthorizedviewsupdate--widen-a-view-that-you-can-already-use
- id: gcp-bigtable-row-credential
  provider: gcp
  service: bigtable
  title: Read Bigtable base-table rows
  source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-bigtable-post-exploitation.md#read-base-table-rows
  source_revision: 0b36331
  summary: Usable token or credential in Bigtable cell; emit only for the exact verified source, resource and target.
  requires:
    all_of:
    - action: bigtable.tables.readRows
      resource: '*'
  source_kind:
  - gcp_user
  - gcp_service_account
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-bigtable-row-credential
    scope: any
    outcome: scope_control
    aggregate_as: Verified targets for Read Bigtable base-table rows
  conditions:
  - id: exact_verified_prerequisites
    description: Exact source, resource, target, scope and gain must be verified; missing fact is UNKNOWN. Known
      table and row permission; returned cells contain a valid reusable credential mapped to a principal. GoogleSQL
      alternative additionally needs bigtable.instances.executeQuery.
  confidence: conditional
  severity: high
  mitigation: Limit bigtable.tables.readRows to trusted operators and monitor the target-specific use.
  references:
  - src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-bigtable-post-exploitation.md#read-base-table-rows
