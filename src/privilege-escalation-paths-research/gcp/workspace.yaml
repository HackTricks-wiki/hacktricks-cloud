# GCP to Google Workspace pivots and Application Integration / Agent Identity identity edges.
# Source: hacktricks-cloud gcp-to-workspace-pivoting/*.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml. New attached_to_service values (Workspace facts,
# not collected; see SCHEMA_EXTENSIONS.md ## GCP): workspace_dwd_delegation, workspace_super_admin_of_zone_domain,
# workspace_addon_user, agentidentity_authorized_user. pivot_resource_type values: gcp_dwd_service_account (SA whose client ID
# has a Workspace DWD grant), dns_managed_zone, agentidentity_auth_provider.

- provider: gcp
  source_revision: 171e422
  id: gcp-workspace-dwd-keyless-signjwt
  service: iam
  title: Sign a delegation JWT with a domain-wide-delegated service account's Google-managed key
  source: src/pentesting-cloud/gcp-security/gcp-to-workspace-pivoting/README.md#keyless-dwd-abuse-with-signjwt-or-signblob
  summary: The source can obtain the privileges of the Workspace users that a domain-wide-delegated service account it can sign for is authorized
    to impersonate.
  pivot_resource_type: gcp_dwd_service_account
  requires:
    any_of:
    - - action: iam.serviceAccounts.signJwt
        resource: '{pivot}'
    - - action: iam.serviceAccounts.signBlob
        resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: workspace_dwd_delegation
    scope: any
    aggregate_as: Workspace users impersonable through domain-wide delegation of {pivot}
  conditions:
  - id: dwd_grant
    description: The pivot SA's OAuth client ID must be authorized for domain-wide delegation in the Workspace tenant (Admin console facts, not
      GCP IAM).
  - id: scopes
    description: Only the scopes authorized in the delegation are usable, and a valid Workspace user email must be known.
  blockers: &id001
  - gcp_deny_policy
  confidence: conditional
  severity: critical
  mitigation: Keep DWD grants minimal and scoped, and restrict signJwt/signBlob/getAccessToken/keys on DWD service accounts to their workloads.

- provider: gcp
  source_revision: 171e422
  id: gcp-workspace-dwd-key-create
  service: iam
  title: Create a key for a domain-wide-delegated service account
  source: src/pentesting-cloud/gcp-security/gcp-to-workspace-pivoting/README.md#compromise-existing-delegation
  summary: The source can obtain the privileges of the Workspace users that a domain-wide-delegated service account it can create keys for is
    authorized to impersonate.
  pivot_resource_type: gcp_dwd_service_account
  requires:
    all_of:
    - action: iam.serviceAccountKeys.create
      resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: workspace_dwd_delegation
    scope: any
    aggregate_as: Workspace users impersonable through domain-wide delegation of {pivot}
  conditions:
  - id: dwd_grant
    description: The pivot SA's client ID must be authorized for domain-wide delegation; only the delegated scopes apply.
  blockers:
  - gcp_deny_policy
  - id: org_policy_constraint
    constraint: iam.disableServiceAccountKeyCreation+iam.disableServiceAccountKeyUpload
  confidence: conditional
  severity: critical
  mitigation: Enforce iam.disableServiceAccountKeyCreation and restrict key creation on DWD service accounts.

- provider: gcp
  source_revision: 171e422
  id: gcp-workspace-cloud-dns-admin-recovery
  service: dns
  title: Publish the administrator-recovery DNS challenge for the Workspace primary domain
  source: src/pentesting-cloud/gcp-security/gcp-to-workspace-pivoting/README.md#cloud-dns-to-workspace-administrator-recovery
  summary: The source can obtain the privileges of a Workspace super administrator of tenants whose primary domain is served by a Cloud DNS public
    zone it can modify.
  pivot_resource_type: dns_managed_zone
  requires:
    all_of:
    - action: dns.changes.create
      resource: '{pivot}'
    any_of:
    - - action: dns.resourceRecordSets.create
        resource: '{pivot}'
    - - action: dns.resourceRecordSets.update
        resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: workspace_super_admin_of_zone_domain
    scope: any
    aggregate_as: Workspace super administrators of domains served by {pivot}
  conditions:
  - id: public_delegation
    description: The zone must be the publicly delegated authoritative zone of the Workspace primary domain; private or undelegated zones are
      not exploitable.
  - id: recovery_process
    description: Depends on Google's administrator-recovery process accepting the domain-verification challenge for the tenant.
  blockers: *id001
  confidence: conditional
  severity: critical
  mitigation: Restrict DNS change permissions on zones of Workspace domains and monitor admin-recovery events.

- provider: gcp
  source_revision: 171e422
  id: gcp-workspace-addons-deployment-update
  service: gsuiteaddons
  title: Repoint an existing HTTP Workspace add-on deployment to a source-controlled endpoint
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-workspace-addons-privesc.md#gsuiteaddonsdeploymentsupdate
  summary: The source can obtain the privileges of Workspace users who invoke HTTP add-on deployments it can update, limited to the scopes they
    already granted.
  requires:
    all_of:
    - action: gsuiteaddons.deployments.update
      resource: '{target.host_resource}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: workspace_addon_user
    scope: any
    aggregate_as: Workspace users of updatable HTTP add-on deployments
  conditions:
  - id: later_invocation
    description: An installed and authorized user must invoke the add-on after the change; only that user's already-granted scopes are exposed.
  - id: http_runtime
    description: Only HTTP add-on deployments; Apps Script deployments differ.
  blockers: *id001
  confidence: conditional
  severity: medium
  mitigation: Restrict gsuiteaddons.deployments.update and alert on deployment endpoint or scope changes.

- provider: gcp
  source_revision: 4393380a88845b42bd208d3adbb6d61ad89f02fb
  id: gcp-agentidentity-retrieve-credentials
  service: agentidentity
  title: Retrieve a stored OAuth token from an Agent Identity auth provider
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-agent-identity-auth-manager-privesc.md#agentidentityauthprovidersretrievecredentials
  summary: The source can obtain the privileges of users whose OAuth tokens are stored in Agent Identity auth providers on which it holds retrieveCredentials,
    limited to their consented scopes.
  pivot_resource_type: agentidentity_auth_provider
  requires:
    all_of:
    - action: agentidentity.authProviders.retrieveCredentials
      resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: agentidentity_authorized_user
    scope: any
    aggregate_as: Users with tokens stored in {pivot}
  conditions:
  - id: google_provider
    description: Workspace impact needs a provider configured with Google's OAuth endpoints and a user who already consented to Workspace scopes.
  - id: known_user
    description: The per-user credential must exist for a known user ID.
  blockers: *id001
  confidence: conditional
  severity: high
  mitigation: Treat roles/agentidentity.user and custom roles with retrieveCredentials as credential-vault access.

- provider: gcp
  source_revision: 4393380a88845b42bd208d3adbb6d61ad89f02fb
  id: gcp-agentidentity-update-token-url
  service: agentidentity
  title: Change an Agent Identity auth provider's token endpoint to intercept future refreshes
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-agent-identity-auth-manager-privesc.md#agentidentityauthprovidersupdate-token-endpoint-interception
  summary: The source can obtain the privileges of users whose OAuth flows run through Agent Identity auth providers it can update, limited to
    their consented scopes.
  pivot_resource_type: agentidentity_auth_provider
  requires:
    all_of:
    - action: agentidentity.authProviders.update
      resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: agentidentity_authorized_user
    scope: any
    aggregate_as: Users with tokens stored in {pivot}
  conditions:
  - id: later_refresh
    description: Takes effect only on a later token exchange or refresh through the provider.
  blockers: *id001
  confidence: conditional
  severity: medium
  mitigation: Restrict authProviders.update (roles/agentidentity.editor) and alert on authorization/token URL changes.

- provider: gcp
  source_revision: 6fb9ac51fd
  id: gcp-appintegration-runas-sa-actas
  service: integrations
  title: Publish an Application Integration version with a chosen run-as service account
  source: src/pentesting-cloud/gcp-security/gcp-to-workspace-pivoting/gcp-application-integration-privesc.md#runasserviceaccount--author--publish-an-integration-that-runs-as-an-arbitrary-sa
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs,
    by authoring, publishing and running an integration version configured to run as that account.
  requires:
    all_of:
    - action: integrations.integrationVersions.create
      resource: '*'
    - any_of:
      - - action: integrations.integrationVersions.deploy
          resource: '*'
      - - action: integrations.integrations.deploy
          resource: '*'
    - action: iam.serviceAccounts.actAs
      resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Service accounts usable as Application Integration run-as SA in {project}
  conditions:
  - id: task_level
    description: The SA token is used by Connector, REST caller and Cloud Function tasks of the integration (request
      level). A trigger-level run-as account also lets scheduled or event triggers run the integration without the
      invoke permission.
  - id: legacy_behavior
    description: Before Google's authorization change, publish did not enforce actAs and unset run-as fell back
      to the integrations service agent.
  - id: execution_trigger
    description: Without caller invoke permission, require a deployed scheduled/event trigger or a verified different
      principal that invokes the published version; otherwise the path remains UNKNOWN.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on dedicated integration SAs; roles/editor and roles/owner contain both halves.
- id: gcp-workspace-super-admin-org-admin
  provider: gcp
  service: resourcemanager
  title: Workspace or Cloud Identity super administrator takes over the associated Google Cloud organization
  source: src/pentesting-cloud/gcp-security/gcp-to-workspace-pivoting/README.md#workspace-super-administrator-to-gcp-organization-administrator
  source_revision: 171e422
  summary: A super administrator of the Workspace/Cloud Identity account linked to the organization can always grant itself or a controlled principal Organization Administrator, which gives it IAM control of the whole organization.
  source_kind: gcp_user
  source_selector:
    gcp_workspace_admin_role: super_admin
  requires:
    all_of: []
  target:
    kind: gcp_scope_owner
    selector:
      any_principal_in_scope: true
    scope: org
    aggregate_as: "IAM control of organization {target.scope}"
  conditions:
    - id: org_linked_to_customer
      description: The organization resource must belong to the source's Workspace/Cloud Identity customer.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Keep super administrators few, dedicated, phishing-resistant and unused for daily work. Grant Organization Administrator to a separate group, and alert on organization IAM policy changes made by super administrators.
  references:
    - https://docs.cloud.google.com/resource-manager/docs/super-admin-best-practices
  notes: Google documents that super administrators hold irrevocable Organization Administrator capability that does not appear in the organization IAM policy, so IAM-only analysis cannot see it.

- provider: gcp
  source_revision: 171e422
  id: gcp-appintegration-authconfigs-get-decrypted
  service: integrations
  title: Read a decrypted Application Integration authentication profile
  source: src/pentesting-cloud/gcp-security/gcp-to-workspace-pivoting/gcp-application-integration-privesc.md#integrationsauthconfigsget--retrieve-decrypted-credentials
  summary: The source can obtain a Google Workspace user OAuth credential from a known auth config only when its
    type and scopes establish that user; external credentials and SA names require separate target modeling.
  pivot_resource_type: appintegration_auth_config
  requires:
    all_of:
    - action: integrations.authConfigs.get
      resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: appintegration_authconfig_identity
    scope: any
    aggregate_as: Identities whose credentials are stored in {pivot}
  conditions:
  - id: credential_type
    description: Only OAuth authorization-code profiles (access and refresh token plus client secret) carry a Google
      user's identity; token, password and JWT profiles reach the external system they authenticate to, and service-account
      profiles hold only the SA name and scopes, not a key.
  - id: google_scopes
    description: Workspace impact needs a Google OAuth profile whose user consented to Workspace scopes; the token
      does not expand scopes or impersonate other users.
  - id: known_name
    description: The auth config name (UUID) must be known; authConfigs.get does not imply list.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: high
  mitigation: Treat integrations.authConfigs.get (included in roles/integrations.integrationViewer) as credential-vault
    access and prefer run-as service accounts over stored OAuth tokens.
  references:
  - https://docs.cloud.google.com/application-integration/docs/reference/rest/v1/projects.locations.authConfigs/get
  - https://docs.cloud.google.com/application-integration/docs/configure-authentication-profiles
  notes: Modelled like gcp-agentidentity-retrieve-credentials; the GET method returns the decrypted credential.
    Previously excluded as a plain secret read.

- id: gcp-dns-managedzones-setiampolicy-workspace-admin-recovery
  provider: gcp
  service: dns
  title: Self-grant DNS record-write permission on a Workspace domain zone and complete administrator recovery
  source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-cloud-dns-post-exploitation.md#scope-boundaries
  source_revision: 0b36331
  summary: The source can grant itself record-write authority on a public Cloud DNS zone and use the administrator-recovery
    challenge to reach a Workspace super administrator of that domain.
  pivot_resource_type: dns_managed_zone
  requires:
    all_of:
    - action: dns.managedZones.setIamPolicy
      resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: workspace_super_admin_of_zone_domain
    scope: any
    aggregate_as: Workspace super administrators of domains served by {pivot}
    outcome: identity
  conditions:
  - id: zone_self_grant
    description: The source can add itself to a zone-scoped DNS role granting dns.changes.create plus dns.resourceRecordSets.create
      or update and then write the challenge record.
  - id: public_delegation
    description: The zone is the publicly delegated authoritative zone for the Workspace primary domain.
  - id: recovery_process
    description: A live recovery challenge is available and Google accepts its DNS proof and any additional verification.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: critical
  mitigation: Restrict dns.managedZones.setIamPolicy on zones serving Workspace primary domains and monitor zone IAM
    changes, DNS challenges, and Workspace recovery.
  references:
  - https://docs.cloud.google.com/dns/docs/zones/iam-per-resource-zones
  - https://docs.cloud.google.com/dns/docs/access-control
  - https://knowledge.workspace.google.com/admin/users/recovering-administrator-access-to-your-account
  notes: Distinct from gcp-workspace-cloud-dns-admin-recovery, which requires record-write permissions initially; this
    path obtains those permissions through a zone IAM self-grant.
- id: gcp-workspace-cloud-dns-zone-policy-recovery
  provider: gcp
  service: dns
  title: Self-grant zone DNS write and publish a Workspace recovery challenge
  source: src/pentesting-cloud/gcp-security/gcp-services/gcp-dns-enum.md#gcp---cloud-dns
  summary: Managed-zone policy write can grant record-write permissions used in Workspace administrator recovery.
  pivot_resource_type: dns_managed_zone
  requires:
    all_of:
    - action: dns.managedZones.setIamPolicy
      resource: '{pivot}'
  target:
    kind: gcp_workspace_user
    selector:
      attached_to_service: workspace_super_admin_of_zone_domain
    scope: any
    outcome: impersonation
    aggregate_as: Workspace super administrators of domains served by {pivot}
  conditions:
  - id: recovery_process
    description: Google administrator recovery must accept the DNS challenge for the tenant; this is an external
      process, not a guaranteed result.
  confidence: conditional
  severity: critical
  mitigation: Restrict managed-zone policy writes on Workspace domains.
  source_revision: 0b36331
  blockers:
  - gcp_deny_policy
  references:
  - https://docs.cloud.google.com/dns/docs/access-control
  - https://docs.cloud.google.com/dns/docs/reference/rest/v1/managedZones/setIamPolicy
  notes: Only zone-scoped roles/dns.admin on the authoritative managed zone is assumed; this grants the record-write
    actions needed by gcp-workspace-cloud-dns-admin-recovery. No project-wide DNS grant is inferred.
