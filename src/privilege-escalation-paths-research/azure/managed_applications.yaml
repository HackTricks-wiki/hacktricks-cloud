- id: azure-managedapp-list-tokens
  provider: azure
  service: managed_applications
  title: Export access tokens of a managed application's managed identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-managed-applications-privesc.md#listtokens--cross-tenant-managed-identity-token-export-marquee
  source_revision: 171e422
  summary: The source can obtain bearer tokens for the managed application's managed identity and act with its privileges.
  requires:
    all_of:
      - action: Microsoft.Solutions/applications/listTokens/action
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Solutions/applications
    scope: inherited_scope
    aggregate_as: "Managed identities of managed application {target.host_resource}"
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict applications/listTokens/action, review publisher authorizations on managed applications, and keep managed application identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-resource-manager/managed-applications/publish-managed-identity
  notes: listTokens returns a token for an arbitrary audience (ARM, Graph, Key Vault, Storage). Publisher-tenant principals holding the action through managed-app authorizations are outside the customer snapshot; customer-tenant holders (for example Contributor on the application) are modelled.
- id: azure-peaso-deploy-as-identity-inside-a-managed-app
  provider: azure
  service: managed_applications
  title: Deploy an authorized managed-app template that grants a new identity privileged RBAC
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-managed-applications-privesc.md#deploy-as-identity-inside-a-managed-app
  source_revision: 0b36331
  summary: A deployment template creates a managed identity and grants it a role the source lacks.
  requires:
    all_of:
    - action: Microsoft.Solutions/applicationDefinitions/write
      scope: '{pivot}'
    - action: Microsoft.Solutions/applications/write
      scope: '{pivot}'
  target:
    kind: azure_managed_identity
    selector:
      azure_challenge_fact: azure-peaso-deploy-as-identity-inside-a-managed-app
    scope: inherited_scope
  conditions:
  - id: authorized_template
    description: The selected definition and application deployment must allow the embedded role assignment at the
      target scope.
  - id: collector_fact_required
    description: Exact source, target, scope and requested collector facts must be verified; missing facts remain
      UNKNOWN.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict the cited permission and remove unnecessary credential or identity bindings.
  references:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/managed-applications/publish-service-catalog-app
  notes: 'Collector fact required: azure_managed_app_deployment_authorizations.'
