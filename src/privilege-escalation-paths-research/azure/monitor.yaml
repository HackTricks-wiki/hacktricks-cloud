- id: azure-peaso-microsoftinsightswebtestsread
  provider: azure
  service: monitor
  title: Read a reusable credential stored in an availability test
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-monitor-privesc.md#microsoftinsightswebtestsread
  source_revision: 0b36331
  summary: The web test request contains an unexpired bearer, basic or signed-URL credential.
  requires:
    any_of:
    - - action: Microsoft.Insights/webtests/read
        scope: '{pivot}'
  target:
    kind: azure_service_principal
    selector:
      azure_challenge_fact: azure-peaso-microsoftinsightswebtestsread
    scope: inherited_scope
    outcome: credentials
  conditions:
  - id: credential_match
    description: A stored request credential must map to a target principal and be usable.
  - id: collector_fact_required
    description: Exact source, target, scope and requested collector facts must be verified; missing facts remain
      UNKNOWN.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict the cited permission and remove unnecessary credential or identity bindings.
  references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/app/availability-overview
  notes: 'Collector fact required: azure_webtest_request_credentials.'
