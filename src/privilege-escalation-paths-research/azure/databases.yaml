- id: azure-mysql-flexible-admin-password-reset
  provider: azure
  service: databases
  title: Reset the MySQL Flexible Server administrator password
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-mysql-privesc.md#microsoftdbformysqlflexibleserversread--microsoftdbformysqlflexibleserverswrite--microsoftdbformysqlflexibleserversdelete
  source_revision: 171e422
  summary: The source can obtain the MySQL server administrator account.
  requires:
    all_of:
      - action: Microsoft.DBforMySQL/flexibleServers/write
        scope: "{target.scope}"
  target:
    kind: azure_dataplane_admin
    selector:
      any_principal_in_scope: true
    scope: inherited_scope
    aggregate_as: "MySQL server admin of {target.scope}"
  conditions:
    - id: password_auth_enabled
      description: MySQL password authentication must be enabled and the server reachable (firewall rule / private endpoint).
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Use Entra-only authentication and restrict flexibleServers/write.
  references:
    - https://learn.microsoft.com/en-us/azure/mysql/flexible-server/how-to-manage-server-cli
  notes: Reset is disruptive to existing clients.
- id: azure-mysql-flexible-entra-admin-write
