- id: azure-sqlmi-entra-admin-write
  provider: azure
  service: databases
  title: Set the Azure SQL Managed Instance Entra administrator
  source: src/pentesting-cloud/azure-security/az-persistence/az-sql-persistence.md#sql-managed-instance-parity-and-clr-based-persistence
  source_revision: 171e422
  summary: The source can obtain Entra administrator on the SQL Managed Instance, the instance analogue of the logical-server Entra admin grant.
