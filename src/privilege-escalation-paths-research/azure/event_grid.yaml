# Azure Event Grid techniques (declarative only).
# Source: hacktricks-cloud az-event-grid-privesc.md (re-reviewed at rev a66f094ede).
# Second-order escalation through privileged event handlers, like consumer_poisoning.yaml. Event
# subscriptions are not collected yet, so every candidate handler identity is reported unknown.

- id: azure-eventgrid-event-injection-consumer
  provider: azure
  service: event_grid
  title: Inject Event Grid events into a privileged handler
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-event-grid-privesc.md#shared-access-key-disclosure-and-event-injection
  source_revision: a66f094ede
  summary: Publishing forged events with a disclosed or rotated access key, the events/send data action or MQTT publish lets existing subscriptions deliver attacker input to Functions, Logic Apps, automation or webhooks running with their own managed identity.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.EventGrid/topics/listKeys/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/topics/regenerateKey/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/domains/listKeys/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/domains/regenerateKey/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/namespaces/listKeys/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/namespaces/regenerateKey/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/namespaces/topics/listKeys/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/namespaces/topics/regenerateKey/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/partnerNamespaces/listKeys/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/partnerNamespaces/regenerateKey/action
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/events/send/action
          data_action: true
          scope: "{pivot}"
      - - action: Microsoft.EventGrid/topicSpaces/publish/action
          data_action: true
          scope: "{pivot}"
  pivot_resource_type: Microsoft.EventGrid/topics|Microsoft.EventGrid/domains|Microsoft.EventGrid/namespaces|Microsoft.EventGrid/partnerNamespaces
  target:
    kind: azure_managed_identity
    selector:
      azure_consumer_of_pivot: event_subscription
    scope: any
    aggregate_as: "Event handler identities subscribed to Event Grid resource {pivot}"
    outcome: workload_execution
  conditions:
    - id: handler_trusts_event
      description: The subscribed handler must act on event fields as commands, targets or configuration; publishing alone does not guarantee code execution.
    - id: local_auth_enabled
      description: The listKeys / regenerateKey alternatives require access-key authentication to be enabled on the topic, domain or namespace.
    - id: mqtt_routing
      description: The topicSpaces/publish alternative only reaches handlers when the namespace routes MQTT messages to a namespace topic with subscriptions.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: medium
  mitigation: Disable local auth on topics and namespaces, separate publishers from privileged handlers, and validate event content and source in handlers.
  references:
    - https://learn.microsoft.com/en-us/azure/event-grid/authenticate-with-access-keys-shared-access-signatures
    - https://learn.microsoft.com/en-us/azure/event-grid/authenticate-with-microsoft-entra-id
  notes: Subscription hijack, delivery-attribute and endpoint-URL disclosure, and pull-subscription reads are data access or audience-bound handler secrets and stay excluded.
