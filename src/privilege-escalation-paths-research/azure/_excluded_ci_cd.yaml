# Travis source exclusions; reviewed in pa-k8s-other-s08.yaml.
- source: src/pentesting-ci-cd/travisci-security/README.md#triggers
  technique: Repository writer runs attacker-controlled CI code in the build identity
  reason: A push or accepted PR starts a job, but privilege gain depends on runtime execution of attacker code
    and which secret-bearing variables the branch or fork receives; the page names no independent build identity.
- source: src/pentesting-ci-cd/travisci-security/README.md#third-party-pr
  technique: Fork PR receives protected CI environment variables
  reason: A fork PR can receive secrets only when the project shares encrypted variables with forks and the
    PR job executes attacker code; credential value and represented principal require runtime secret content.
- source: src/pentesting-ci-cd/travisci-security/README.md#dumping-secrets
  technique: Read configured environment and secure values through a job
  reason: Reading job environment values requires attacker code to run in an eligible build; whether any value
    is a usable credential and which identity it represents require secret content.
- source: src/pentesting-ci-cd/travisci-security/README.md#dumping-secrets
  technique: Read encrypted-file plaintext or key and IV from a job
  reason: Decrypting an .enc file requires an eligible job, injected key and IV, and the file payload; whether
    its plaintext contains a credential requires file content.
- source: src/pentesting-ci-cd/travisci-security/basic-travisci-information.md#environment-variables
  technique: Project environment secrets become readable inside a permitted build
  reason: The basic page describes secret injection into an eligible job, but identifying an escalation requires
    the actual variable value, its credential type, and the job branch/fork exposure.
- source: src/pentesting-ci-cd/travisci-security/basic-travisci-information.md#custom-encrypted-secrets
  technique: RSA-encrypted secure values in .travis.yml are decrypted in a permitted build
  reason: The RSA public key alone does not decrypt secure values; an eligible running job and the decrypted
    value are needed to identify a gained credential.
- source: src/pentesting-ci-cd/travisci-security/basic-travisci-information.md#custom-encrypted-files
  technique: Encrypted file can be decrypted with build-injected key and IV
  reason: The .enc file and injected key/IV are necessary, but only the decrypted file contents can establish
    a credential and target identity.

# Vercel source exclusions; reviewed in pa-k8s-other-s08.yaml.
- source: src/pentesting-ci-cd/vercel-security.md#domains
  technique: Map a production domain to a different environment that exposes secrets or functions
  reason: Changing a domain environment alone does not grant credentials; the served application content, protected
    function authorization, and actual secret disclosure must be inspected.
- source: src/pentesting-ci-cd/vercel-security.md#environments
  technique: Share production secrets with lower-trust development or preview environment
  reason: Variable sharing is a configuration fact, but the lower-trust environment must execute code or expose
    the value and the value must contain a usable credential; those runtime and content facts are needed.
- source: src/pentesting-ci-cd/vercel-security.md#environment-variables
  technique: NEXT_PUBLIC_ team variable exposes credential to every linked project client
  reason: NEXT_PUBLIC_ can put a value in client code, but the deployed bundle must actually contain that value
    and it must be a usable credential; require bundle and secret-content inspection.
- source: src/pentesting-ci-cd/vercel-security.md#environment-variables
  technique: Non-sensitive team variable is readable to members with sufficient environment access
  reason: A non-sensitive variable may be readable under team access, but a principal edge requires the variable
    value to be a usable credential and its represented identity to be identified.
- source: src/pentesting-ci-cd/vercel-security.md#deployment-protection
  technique: Bypass deployment protection through public bypass secret, share link, weak password, exception,
    or broad allowlist
  reason: A bypassed deployment gives application access; privilege gain requires a protected endpoint or response
    that yields credentials or a stronger application identity, which needs application runtime/content inspection.
- source: src/pentesting-ci-cd/vercel-security.md#security
  technique: Public build logs or source paths can reveal secrets if logs/source contain them
  reason: Public build logs or source paths only yield a principal edge if the exposed artifact contains a
    usable credential; the particular log/source content and represented identity are needed.
- source: src/pentesting-ci-cd/vercel-security.md#advanced
  technique: Directory listing exposes files that could contain credentials
  reason: Directory listing exposes files only if enabled and the directory is reachable; a principal edge
    further requires a listed file containing a usable credential and identification of its target identity.
- source: src/pentesting-ci-cd/vercel-security.md#source
  technique: Read complete deployment source to find embedded credentials
  reason: Source readability alone is not privilege escalation; the deployment source must contain a usable
    credential and its target principal must be identified.
- source: src/pentesting-ci-cd/vercel-security.md#log-drains
  technique: Configure external Log Drain to receive logs containing secrets
  reason: A Log Drain receives logs, but a credential edge requires a log record containing a usable credential
    and its represented principal; inspect runtime log content.
- source: src/pentesting-ci-cd/vercel-security.md#security--privacy
  technique: Sensitive environment variable policy disabled permits readable team variables
  reason: Disabling sensitive-variable enforcement does not itself expose credentials; a specific non-sensitive
    variable, readable to the source, must contain a usable credential.
- source: src/pentesting-ci-cd/vercel-security.md#environment-variables-1
  technique: Team NEXT_PUBLIC_ variables leak application credentials to public clients
  reason: The team-level NEXT_PUBLIC_ case is the same exposure mechanism as the project section, but a deployed
    bundle and credential-bearing value are needed for a principal edge.
- source: src/pentesting-ci-cd/vercel-security.md#environment-variables-1
  technique: Non-sensitive team variable values can be read by members
  reason: Reading a non-sensitive team variable is only an escalation if its value is a usable credential of
    a stronger principal; the value and target identity are needed.
