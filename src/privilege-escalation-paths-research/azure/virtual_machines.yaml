  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachinesloginaction
  source_revision: 171e422
  summary: An interactive Entra-authenticated SSH/RDP session on the VM can request tokens for the VM's managed identities from IMDS.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Compute/virtualMachines/login/action
          data_action: true
          scope: "{target.host_resource}"
      - - action: Microsoft.Compute/virtualMachines/loginAsAdmin/action
          data_action: true
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
    scope: inherited_scope
    aggregate_as: "Managed identities of VM {target.host_resource}"
  conditions:
    - id: entra_login_extension_enabled
      description: The AADSSHLoginForLinux / AADLoginForWindows extension must be installed.
    - id: network_reachability
      description: The source must reach SSH/RDP (directly, via Bastion or az ssh/Arc proxy).
    - id: imds_restricted_for_non_admin
      description: Guest hardening (e.g. host firewall rules limiting IMDS to specific users) can block non-admin logins; loginAsAdmin is not affected.
    - id: conditional_access
      description: Conditional Access policies targeting the Azure Linux/Windows VM Sign-In applications (MFA, compliant device) apply to the source's login.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict Virtual Machine User/Administrator Login roles and limit network access to management ports.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/devices/howto-vm-sign-in-azure-ad-linux
    - https://learn.microsoft.com/en-us/azure/virtual-machines/instance-metadata-service
  notes: IMDS is reachable by any local process by default, so even non-admin login exposes the identities.
- id: azure-vm-create-with-user-assigned-identity
  provider: azure
  service: virtual_machines
