- id: azure-vm-serial-console-connect
  provider: azure
  service: virtual_machines
  title: Use Serial Console and an ARM restart for guest recovery
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftserialconsoleserialportsconnectaction
  source_revision: 0b36331
  summary: Interactive Serial Console access combined with an ARM VM restart can reach a guest recovery shell or
    reset a local password, exposing the VM managed identities when recovery succeeds.
  requires:
    all_of:
    - action: Microsoft.SerialConsole/serialPorts/connect/action
      scope: '{target.host_resource}'
    - action: Microsoft.Compute/virtualMachines/restart/action
      scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
    scope: inherited_scope
    aggregate_as: Managed identities of VM {target.host_resource}
  conditions:
  - id: boot_diagnostics_enabled
    description: Boot diagnostics must be enabled on the VM (enabling it needs virtualMachines/write). With a custom
      boot-diagnostics storage account, the source also needs access to that account and it must allow Shared Key
      access.
  - id: serial_console_not_disabled
    description: Serial Console must not be disabled for the subscription or inside the guest.
  - id: guest_recovery_path
    description: The guest must allow console recovery after restart, such as an unprotected boot loader or single-user
      mode, or an enabled SAC/CMD channel on Windows.
  - id: interactive_session
    description: The console is interactive (portal or CLI extension), so the source's sign-in, including Conditional
      Access, applies.
  blockers:
  - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Disable Serial Console where it is not needed, protect boot loaders, restrict serialPorts/connect/action
    and VM restart rights, and keep VM identities least-privileged.
  references:
  - https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/linux/serial-console-linux
  - https://learn.microsoft.com/en-us/troubleshoot/azure/virtual-machines/windows/serial-console-windows
  notes: This entry covers the ARM-initiated restart and guest-recovery route. Direct login with an already known
    local guest password does not require virtualMachines/restart/action, but the credential is not present in the
    permission snapshot. The same feature exists for scale-set instances, which this entry does not model.
- id: azure-vm-os-disk-swap
  provider: azure
  service: virtual_machines
  title: Swap a VM's OS disk for an attacker-prepared disk
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachineswrite-os-disk-swap
  source_revision: 171e422
  summary: Replacing the OS disk of a deallocated VM with a disk the source prepared boots attacker-controlled code with the VM's managed identities attached.
  requires:
    all_of:
      - action: Microsoft.Compute/virtualMachines/write
        scope: "{target.host_resource}"
      - action: Microsoft.Compute/virtualMachines/deallocate/action
        scope: "{target.host_resource}"
      - action: Microsoft.Compute/virtualMachines/start/action
        scope: "{target.host_resource}"
      - action: Microsoft.Compute/disks/read
        scope: "{pivot}"
      - action: Microsoft.Compute/disks/write
        scope: "{pivot}"
  pivot_resource_type: Microsoft.Compute/disks
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
    scope: inherited_scope
    aggregate_as: "Managed identities of VM {target.host_resource}"
  conditions:
    - id: attacker_disk_available
      description: The source needs a managed disk whose content it controls (uploaded image or a modified copy of a snapshot), in the same region with a compatible OS, generation and security type.
    - id: downtime_tolerated
      description: The VM is deallocated during the swap, which causes visible downtime.
    - id: encryption_compatible
      description: Disk encryption sets, confidential or Trusted Launch settings can prevent attaching a foreign disk.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict virtualMachines/write and disk writes, alert on OS disk changes, and use resource locks on critical VMs.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/windows/os-disk-swap
  notes: The pivot disk can be newly created where the source holds disks/write. Attaching an existing disk as a data disk (data access only) is excluded separately.
- id: azure-vmss-model-write
  provider: azure
  service: virtual_machines
  title: Tamper with a scale-set model (extensions, custom data) to run code on instances
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachinescalesetswrite-scale-set-model-tampering
  source_revision: 171e422
  summary: Adding an extension to a scale-set model, once applied to instances, runs code as root/SYSTEM and exposes the scale set's managed identities.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Compute/virtualMachineScaleSets/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Compute/virtualMachineScaleSets/extensions/write
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachineScaleSets
    scope: inherited_scope
    aggregate_as: "Managed identities of scale set {target.host_resource}"
  conditions:
    - id: model_rollout
      description: The changed model reaches instances only through an automatic or rolling upgrade policy, a manual instance upgrade or reimage (separate actions), or new instances created by a scale-out (which virtualMachineScaleSets/write can trigger).
    - id: aks_node_pools
      description: For AKS node pools the node resource group is normally protected by a deny assignment.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict virtualMachineScaleSets/write and extensions/write, allow-list extensions with Azure Policy, and alert on scale-set model changes.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-policy
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/compute
  notes: Microsoft.Compute/virtualMachineScaleSets/virtualMachines/manualUpgrade/action is the documented per-instance upgrade action but is not in the local permission catalog, so it is described as a condition instead of a requirement.
- id: azure-vm-customdata-reimage
  provider: azure
  service: virtual_machines
  title: Re-execute poisoned customData by reimaging or redeploying a VM
  source: src/pentesting-cloud/azure-security/az-persistence/az-vms-persistence.md#reimage--redeploy-to-re-execute-poisoned-customdata
  source_revision: 171e422
  summary: Setting customData and forcing re-provisioning makes cloud-init run attacker code in the guest, exposing the VM's managed identities.
  requires:
    all_of:
      - action: Microsoft.Compute/virtualMachines/write
        scope: "{target.host_resource}"
    any_of:
      - - action: Microsoft.Compute/virtualMachines/reimage/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Compute/virtualMachines/redeploy/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
    scope: inherited_scope
    aggregate_as: "Managed identities of VM {target.host_resource}"
  conditions:
    - id: cloud_init_reprocesses_customdata
      description: The image must run cloud-init (or an equivalent agent) on re-provisioning and the platform must accept the customData change for that VM; redeploy does not always re-run provisioning.
    - id: destructive
      description: Reimage resets the OS disk, which is disruptive to the workload.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict virtualMachines/write, reimage/action and redeploy/action (Virtual Machine Contributor, Contributor) and alert on osProfile changes and reimage operations.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/custom-data
