# Azure Container Instances, Container Apps and Container Apps Jobs techniques (declarative only).
# Source: hacktricks-cloud az-container-instances-apps-jobs-privesc.md (rev 171e422, re-verified).

- id: azure-aci-container-exec
  provider: azure
  service: containers
  title: Execute commands in a running Container Instances container
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftcontainerinstancecontainergroupsread-microsoftcontainerinstancecontainergroupscontainersexecaction
  source_revision: 171e422
  summary: The source can obtain the privileges of the container group's managed identities.
  requires:
    all_of:
      - action: Microsoft.ContainerInstance/containerGroups/containers/exec/action
        scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.ContainerInstance/containerGroups
    scope: inherited_scope
    aggregate_as: Identities of container group {target.host_resource}
  conditions:
    - id: group_running
      description: The container group must be running.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict containers/exec/action and keep container group identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-exec
  notes: containerGroups/read is normally used by clients to locate the container.

- id: azure-aci-containergroup-write-existing
  provider: azure
  service: containers
  title: Redeploy an existing container group with changed command, image or environment
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftcontainerinstancecontainergroupswrite-environment-update
  source_revision: 171e422
  summary: The source can obtain the privileges of the container group's managed identities.
  requires:
    all_of:
      - action: Microsoft.ContainerInstance/containerGroups/write
        scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.ContainerInstance/containerGroups
    scope: inherited_scope
    aggregate_as: Identities of container group {target.host_resource}
  conditions:
    - id: uami_linked_access_check
      description: Container groups are updated by a full PUT that re-submits the identity block; for groups carrying user-assigned identities ARM may also require userAssignedIdentities/assign/action on each of them (system-assigned identities are unaffected).
    - id: interpreter_startup_hook
      description: The environment-only variant needs a container whose entrypoint honours an attacker-set startup variable; changing image/command removes this dependency.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict containerGroups/write.
  references:
    - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-update
  notes: ''

- id: azure-aci-assign-user-assigned-identity
  provider: azure
  service: containers
  title: Create or update a container group with a user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftresourcessubscriptionsresourcegroupsread-microsoftcontainerinstancecontainergroupswrite-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: 171e422
  summary: The source can obtain the privileges of user-assigned identities assignable in scope.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
      - action: Microsoft.ContainerInstance/containerGroups/write
        scope: '{pivot}'
  pivot_resource_type: Microsoft.Resources/resourceGroups|Microsoft.ContainerInstance/containerGroups
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: User-assigned identities assignable in {scope}
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and containerGroups/write.
  references:
    - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-managed-identity
  notes: Covers both the existing-group and new-group sections of the page.

- id: azure-containerapp-exec
  provider: azure
  service: containers
  title: Open a console in a running Container App
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappcontainerappsread-microsoftappmanagedenvironmentsread-microsoftappcontainerappsrevisionsreplicasread-microsoftappcontainerappsrevisionsread-microsoftappcontainerappsgetauthtokenaction-microsoftappcontainerappsexecaction-microsoftappcontainerappsdebugaction
  source_revision: 171e422
  summary: The source can obtain the privileges of the Container App's managed identities.
  requires:
    all_of:
      - action: Microsoft.App/containerApps/getAuthToken/action
        scope: '{target.host_resource}'
    any_of:
      - - action: Microsoft.App/containerApps/exec/action
          scope: '{target.host_resource}'
      - - action: Microsoft.App/containerApps/debug/action
          scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.App/containerApps
    scope: inherited_scope
    aggregate_as: Identities of Container App {target.host_resource}
  conditions:
    - id: replica_running
      description: A running replica is required.
    - id: client_reads
      description: CLI clients also use containerApps/read, revisions/read, revisions/replicas/read and managedEnvironments/read.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict exec/debug/getAuthToken actions on Container Apps.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/container-console
  notes: ''

