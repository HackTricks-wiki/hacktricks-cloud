- id: azure-containerapp-sourcecontrols-write
  provider: azure
  service: containers
  title: Repoint a Container App's GitHub Actions deployment to an attacker repository
  source: src/pentesting-cloud/azure-security/az-persistence/az-container-apps-persistence.md#microsoftappcontainerappssourcecontrolswrite--repoint-github-actions-deployment
  source_revision: 171e422
  summary: Rebinding the app's continuous-deployment source makes the next build deploy attacker code that runs with the app's managed identities.
  requires:
    all_of:
      - action: Microsoft.App/containerApps/sourcecontrols/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.App/containerApps
    scope: inherited_scope
    aggregate_as: "Managed identities of Container App {target.host_resource}"
  conditions:
    - id: build_triggered
      description: Changing the binding does not execute code; a commit or deployment on the configured branch must trigger the GitHub Actions build, and the build must succeed.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict Microsoft.App/containerApps/sourcecontrols/write (Container Apps Contributor, Contributor) and alert on source-control binding changes.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/github-actions
  notes: Same pattern as azure-appservice-sourcecontrols-write.
