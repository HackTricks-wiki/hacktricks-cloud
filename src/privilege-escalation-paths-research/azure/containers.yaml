  notes: jobs/read is used by clients to locate the job but is not the gating permission. jobs/start/action can also consume Job secrets through an execution template override (azure-containerapp-job-start-template-override).

- id: azure-containerapp-dapr-component-list-secrets
  provider: azure
  service: containers
  title: Read the inline secrets of a Container Apps Dapr component
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappmanagedenvironmentsdaprcomponentslistsecretsaction
  source_revision: a66f094ede
  summary: The source can obtain the privileges of service principals whose client secrets are stored inline in a Dapr component.
  requires:
    all_of:
      - action: Microsoft.App/managedEnvironments/daprComponents/listSecrets/action
        scope: '{pivot}'
  pivot_resource_type: Microsoft.App/managedEnvironments|Microsoft.App/managedEnvironments/daprComponents
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: '{pivot}'
    scope: any
    aggregate_as: Service principals with credentials stored in {pivot}
  conditions:
    - id: credential_is_sp_secret
      description: Only components that authenticate with a service-principal client secret (for example Azure state stores or bindings configured with azureClientSecret) yield an identity; connection strings and keys are data access only.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Configure Dapr components with managed identities or secret-store references and restrict daprComponents/listSecrets/action.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/dapr-components
  notes: Component-scope assignments are enough; environment scope exposes every component.

- id: azure-containerapp-sandbox-secret-peek
  provider: azure
  service: containers
  title: Read the cleartext values of an ACA Sandbox secret
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappsandboxgroupssecretspeekaction
  source_revision: a66f094ede
  summary: The source can obtain the privileges of service principals whose credentials are stored in a sandbox group secret.
  requires:
    all_of:
      - action: Microsoft.App/sandboxGroups/secrets/peek/action
        data_action: true
        scope: '{pivot}'
  pivot_resource_type: Microsoft.App/sandboxGroups
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: '{pivot}'
    scope: any
    aggregate_as: Service principals with credentials stored in {pivot}
