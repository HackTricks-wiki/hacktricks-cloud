    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict managedEnvironments/join/action and userAssignedIdentities/assign/action.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
  notes: ''

- id: azure-containerapp-sessionpool-mcp-credentials
  provider: azure
  service: containers
  title: Fetch a session pool MCP API key and execute code in sessions
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappsessionpoolsfetchmcpservercredentialsaction
  source_revision: 171e422
  summary: The source can obtain the privileges of the session pool's managed identity.
  requires:
    all_of:
      - action: Microsoft.App/sessionPools/fetchMCPServerCredentials/action
        scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.App/sessionPools
    scope: inherited_scope
    aggregate_as: Identity of session pool {target.host_resource}
  conditions:
    - id: mcp_enabled
      description: The platform-managed MCP server must be enabled on a Shell/Python pool.
    - id: identity_exposed_to_sessions
      description: The pool must deliberately enable managed-identity access during the session main lifecycle.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Disable the MCP server where unused and do not expose pool identities to sessions.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/sessions
  notes: Preview feature.

