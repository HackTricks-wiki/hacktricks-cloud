# Azure API Center techniques (declarative only).
# Source: hacktricks-cloud az-api-center-privesc.md (rev 171e422).

- id: azure-apicenter-security-requirement-get-credentials
  provider: azure
  service: api_center
  title: Read credentials stored in an API Center security requirement
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-api-center-privesc.md#stored-credential-disclosure-getcredentials
  source_revision: a66f094ede
  summary: getCredentials returns the secrets stored for an API version's security requirement, which can include an Entra application client secret.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.ApiCenter/services/workspaces/apis/versions/securityRequirements/getCredentials/action
          data_action: true
          scope: "{pivot}"
      - - action: Microsoft.ApiCenter/services/apis/versions/securityRequirements/getCredentials/action
          data_action: true
          scope: "{pivot}"
  pivot_resource_type: Microsoft.ApiCenter/services
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: "{pivot}"
    scope: inherited_scope
    aggregate_as: "Application credentials stored in API Center {pivot}"
  conditions:
    - id: entra_client_secret_stored
      description: Only when a security requirement stores an OAuth client secret of an Entra application; API keys for third-party APIs yield no Azure identity.
  blockers: []
  confidence: conditional
  severity: medium
  mitigation: Store references to Key Vault rather than raw secrets and restrict getCredentials/action.
  references:
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/integration#microsoftapicenter
  notes: getCredentials is a data action invoked on the API Center data-plane endpoint (HackTricks).
