# Microsoft Fabric techniques (declarative only). Source: hacktricks-cloud az-fabric-privesc.md (rev 171e422).
# Fabric authorization lives in the Fabric plane (workspace roles, tenant settings), not ARM RBAC.
# Facts needed (not collected yet -> unknown): fabric_workspace_role_assignment {principal.id|principalId,
# role, workspaceId, id} and fabric_workspace {id, workspaceIdentity.servicePrincipalId}.
# Connection / gateway credential use stays excluded (no identity is gained).

- id: azure-fabric-notebook-workspace-identity
  provider: azure
  service: fabric
  title: Run a Fabric notebook or Spark job definition as the workspace identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-fabric-privesc.md#notebook--spark-job-rce-as-the-submitting-identity--token--key-vault-theft
  source_revision: 171e422
  summary: A Fabric workspace Contributor can create and schedule notebooks or Spark job definitions; per HackTricks, scheduled and API-triggered runs execute as the workspace identity, whose Entra tokens are reachable from the code.
  requires:
    all_of:
      - fabric_workspace_role: Contributor
        fabric_workspace: '{target.host_resource}'
  target:
    kind: azure_service_principal
    selector:
      fabric_workspace_identity: true
    scope: any
    aggregate_as: Fabric workspace identities
    outcome: workload_execution
  conditions:
    - id: fabric_sp_api_enabled_if_source_is_sp
      description: A service principal source needs the "Service principals can use Fabric APIs" tenant setting enabled; not evaluated.
    - id: run_identity_depends_on_trigger
      description: Interactive runs execute as the submitting user (no escalation); only runs that execute as the workspace identity reach it. Which triggers run as the workspace identity is taken from HackTricks and is not verified against collected configuration.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Keep workspace Contributor and above to trusted principals, grant workspace identities only the data access they need, and review scheduled notebook / Spark job definitions.
  references:
    - https://learn.microsoft.com/en-us/fabric/security/workspace-identity
    - https://learn.microsoft.com/en-us/fabric/fundamentals/roles-workspaces
  notes: The requirement is rank-compared (Admin, Member and Contributor satisfy it) and includes Entra group memberships. Running as the submitting identity gives no new privilege and is not an edge.

- id: azure-fabric-administrator-workspace-identity
  provider: azure
  service: fabric
  title: Fabric Administrator takes over a workspace and runs code as its workspace identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-fabric-privesc.md#fabric-administrator-entra--tenant-takeover--org-wide-scanner-recon
  source_revision: 171e422
  summary: The Fabric Administrator (or Power Platform Administrator) Entra role can grant itself a role on any workspace and then use the notebook path as that workspace's identity.
  requires:
    all_of: []
    any_of:
      - - entra_role: Fabric Administrator
      - - entra_role: Power Platform Administrator
  target:
    kind: azure_service_principal
    selector:
      fabric_workspace_identity: true
    scope: any
    aggregate_as: Fabric workspace identities
    outcome: workload_execution
  conditions:
    - id: grants_itself_workspace_role
      description: The administrator must first add itself to the workspace (logged as a Fabric admin activity) and then use azure-fabric-notebook-workspace-identity.
    - id: run_identity_depends_on_trigger
      description: Only runs that execute as the workspace identity reach it (see azure-fabric-notebook-workspace-identity).
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Treat Fabric Administrator and Power Platform Administrator as privileged roles (PIM, approval), and least-privilege workspace identities.
  references:
    - https://learn.microsoft.com/en-us/fabric/admin/roles
  notes: Tenant-setting changes and the admin scanner API are recon / control weakening and are not edges.
