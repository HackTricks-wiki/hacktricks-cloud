# Verified exclusion proposals from pa-az-post-persist-s07.yaml.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-blob-public-unauth.md#static-website-web-exposure--leaked-secrets
  source_revision: 0b36331
  technique: Public static website $web exposes embedded secrets
  reason: A public static-site setting and $web publicAccess:null do not identify any secret or owner. The exact served file
    bytes, anonymous HTTP response, credential issuer and present validity are needed; a storage configuration snapshot cannot
    establish that join.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-blob-public-unauth.md#anonymous-blob-listing-and-downloads
  source_revision: 0b36331
  technique: Anonymous blob listing/download leads to stored credential discovery
  reason: Container publicAccess permits anonymous read or listing, but whether a blob contains a usable credential and who
    owns it depends on blob bytes and current issuer state. Blob-level access also requires the exact blob name.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-cognitive-services-openai-unauth.md#service-api-keys
  source_revision: 0b36331
  technique: Exposed Cognitive Services/OpenAI API key
  reason: The regex only finds candidate text in external repositories, logs or client assets. The exact key bytes, exposed
    location, Cognitive Services account, enabled local authentication and current key validity are needed to establish service
    authority.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-cognitive-services-openai-unauth.md#azure-ai-search-keys
  source_revision: 0b36331
  technique: Exposed Azure AI Search query/admin key
  reason: An AI Search key grants query or admin data-plane access only after the exposed bytes are matched to an account
    and current key type. External artifact content and live validity are absent from the configuration snapshot.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-cognitive-services-openai-unauth.md#prompt-injection-against-a-public-ai-chatbot-unauth-via-the-app
  source_revision: 0b36331
  technique: Public RAG prompt injection or unmapped permitted-groups returns protected content
  reason: The page describes protected-content disclosure through application and RAG behavior. An actual public response,
    prompt/tool behavior, connected content, Search permitted-groups mapping and app identity authorization are needed; mere
    public chatbot configuration does not prove disclosure.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-container-registry-unauth.md#anonymous-pull-and-known-repository-enumeration-oci-registry-v2-api
  source_revision: 0b36331
  technique: Anonymous pull of image with embedded credentials
  reason: Anonymous pull is only image read. The exact public repository/tag, fetched layer bytes, embedded credential owner
    and present validity must be verified before inferring another identity.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-container-registry-unauth.md#registry-usernamepassword-or-tokens
  source_revision: 0b36331
  technique: Leaked ACR admin/repository/identity credential
  reason: An ACR hostname or credential-shaped string does not grant access. The exposed artifact, accepted admin/repository/identity
    credential and its current registry scope must be verified outside the IAM snapshot.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-container-registry-unauth.md#docker-registry-auth-configuration
  source_revision: 0b36331
  technique: Leaked Docker auth or identitytoken configuration
  reason: Docker auth is base64 encoding and identitytoken is bearer material. Artifact accessibility, decoded value, registry
    match, token scope and present validity are runtime/content facts.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-device-code-authentication-phishing.md#basic-information
  source_revision: 0b36331
  technique: Device-code phishing yields victim access/refresh tokens
  reason: Obtaining a victim token requires the victim to enter the attacker code and approve sign-in, plus policy and consent
    success. Victim interaction and issued token are not configuration-granted permissions of a source principal.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-device-code-authentication-phishing.md#authorization-code-handoff-phishing
  source_revision: 0b36331
  technique: Victim returns first-party authorization redirect code
  reason: The victim must return a live redirect code. Client, redirect URI, PKCE or client-secret context, expiration, device
    policy and token redemption all depend on a particular OAuth transaction and victim behavior.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-device-code-authentication-phishing.md#oauth-authorization-response-codes
  source_revision: 0b36331
  technique: Code-bearing callback URL leaked in accessible artifact
  reason: An artifact may contain a code-shaped callback URL, but a live authorization transaction, matching client/redirect
    and PKCE or confidential-client proof are required. Callback log bytes and redemption state are not inventory facts.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-devops-unauth.md#secrets-in-public-repos-pipeline-yaml-logs--artifacts
  source_revision: 0b36331
  technique: Public DevOps project repository/build artifacts expose live secret
  reason: A public DevOps project exposes source or build data, not automatically a credential. Exact repository/log/artifact
    bytes, anonymous availability, issuer ownership, scope and current validity must be checked.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-devops-unauth.md#azure-devops-pats
  source_revision: 0b36331
  technique: Leaked Azure DevOps PAT
  reason: PAT syntax does not show that an anonymously accessible artifact contains a live token. Token owner, organization,
    scopes, expiry and policy state require the actual value and validation.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-devops-unauth.md#legacycontextual-pat-assignments
  source_revision: 0b36331
  technique: Leaked legacy or contextual DevOps PAT
  reason: The contextual/legacy regex is only another way to find a PAT candidate. The exact exposed value, owner, organization,
    scopes and current validity are required, as for the modern PAT record.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-event-grid-messaging-unauth.md#service-api-keys
  source_revision: 0b36331
  technique: Exposed messaging service API key
  reason: A candidate API-key string does not prove a messaging credential. Artifact bytes, matching service endpoint/rule,
    enabled key authentication and current validity are required.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-event-grid-messaging-unauth.md#shared-key-connection-strings
  source_revision: 0b36331
  technique: Exposed Event Grid/Event Hubs shared-key connection string
  reason: An Event Grid or Event Hubs endpoint is public metadata. The accessible connection-string bytes, matching authorization
    rule, current key and rule rights are needed to prove service authority.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-event-grid-messaging-unauth.md#azure-sas-urlstokens
  source_revision: 0b36331
  technique: Exposed messaging SAS URL/token
  reason: A SAS-looking URL or token is only a candidate. Signature, resource, permission flags, expiry and service-specific
    validation must be checked on the exact exposed value.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-iot-hub-dps-unauth.md#shared-key-connection-strings
  source_revision: 0b36331
  technique: Leaked IoT Hub or DPS shared key
  reason: A HostName or ID Scope does not authenticate to IoT Hub or DPS. Exposed key bytes, policy/device scope and present
    acceptance must be verified for a particular artifact.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-iot-hub-dps-unauth.md#enrollment-group-keys-and-device-certificates
  source_revision: 0b36331
  technique: Leaked DPS enrollment group key or trusted device certificate/private key
  reason: An enrollment-group or device identity requires accepted symmetric key material or a trusted X.509 chain with private
    key. The exact material, enrollment configuration and live acceptance are content/runtime facts.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-keyvault-unauth.md#entra-application-secrets-or-identity-tokens
  source_revision: 0b36331
  technique: Leaked Entra client secret usable against Key Vault
  reason: The page requires an actual valid application secret or private key, mapping to a service principal, vault data-plane
    authorization and permitted network path. A regex hit or vault name supplies none of those.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-keyvault-unauth.md#bearer-identity-tokens
  source_revision: 0b36331
  technique: Leaked bearer token usable against Key Vault
  reason: JWT shape does not establish signature, audience, expiry or bearer possession. The exact token bytes and vault authorization
    at redemption time are required to identify a gained subject.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-monitor-alert-phishing.md#azure-monitor-alert-rule
  source_revision: 0b36331
  technique: Microsoft-authenticated Monitor alert email used as phishing lure
  reason: The attacker creates an alert in their own subscription; victim-tenant privileges arise only if a recipient follows
    the phishing payload and completes a separate authentication flow. Email delivery and victim behavior are runtime facts.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-oauth-apps-phishing.md#trusted-first-party-authorization-code-phishing
  source_revision: 0b36331
  technique: First-party authorization-code handoff and optional DRS device registration
  reason: This first-party code handoff is the same victim-mediated OAuth mechanism as the device-code page, with optional
    DRS registration. A returned redeemable code, matching client/redirect/PKCE and device policy are transaction-specific
    facts.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-oauth-apps-phishing.md#oauth-authorization-response-codes
  source_revision: 0b36331
  technique: Leaked code-bearing callback URL
  reason: 'This repeats the leaked callback-code scenario on the device-code page. A code-shaped URL is not enough: transaction
    lifetime, matching client/redirect and PKCE or client-secret proof determine token redemption.'
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-password-spraying.md#password-spray
  source_revision: 0b36331
  technique: Guess weak Entra/M365 user password
  reason: A successful password spray depends on a guessed current password, account state, MFA and Conditional Access at
    authentication time. None is a permission or trust grant held by the attacker in a read-only snapshot.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-power-pages-unauth.md#read-dataverse-records-anonymously-via-the-portal-web-api
  source_revision: 0b36331
  technique: Anonymous Dataverse read may disclose stored credentials
  reason: Anonymous Dataverse GET can expose records, but the alleged credential pivot requires the actual returned row or
    attachment bytes, credential owner and present validity. Portal table permission alone proves no credential.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-power-pages-unauth.md#escalate-anonymous--authenticated-via-open-registration
  source_revision: 0b36331
  technique: Open registration grants default Authenticated Users web role
  reason: Open registration can grant the portal-local Authenticated Users web role, but the gained table rights require the
    site setting, successful signup and current web-role/table-permission associations. The catalog snapshot has no portal-account
    or role mapping.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-servicebus-unauth.md#shared-key-connection-strings
  source_revision: 0b36331
  technique: Leaked Service Bus SharedAccessKey connection string
  reason: A Service Bus connection string is usable only if an externally accessible artifact contains the exact current key
    for an enabled authorization rule. Namespace configuration alone does not show that leak.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-servicebus-unauth.md#azure-sas-urlstokens
  source_revision: 0b36331
  technique: Leaked Service Bus SAS URL/token
  reason: A Service Bus SAS requires the exact token, signature, entity URI, rights and unexpired lifetime; a regex or endpoint
    cannot prove accepted delegated authority.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-sql-unauth.md#sql-connection-credentials
  source_revision: 0b36331
  technique: Leaked SQL password
  reason: The exact SQL password, database principal, firewall route and current database grants are required. The page explicitly
    says Allow Azure services does not remove SQL authentication.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-storage-unauth.md#anonymous-blob-reads-and-listings
  source_revision: 0b36331
  technique: Public container blob read/list exposes credential-containing blob
  reason: The storage page describes the same public blob-read mechanism as the public-blob page. Account/container flags
    prove only read availability; actual blob bytes and credential validity are required for escalation.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-storage-unauth.md#azure-sas-urlstokens
  source_revision: 0b36331
  technique: Leaked Storage SAS
  reason: A Storage SAS grants only its signed data-plane rights when the exact exposed token is valid and unexpired. The
    configuration snapshot does not contain exposed token bytes or proof of acceptance.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-storage-unauth.md#storage-account-keys
  source_revision: 0b36331
  technique: Leaked Storage AccountKey
  reason: A public storage account name is not a key. The exact leaked AccountKey, allowSharedKeyAccess state, artifact accessibility
    and current key validity are required.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-subdomain-takeover-unauth.md#the-dangling-cname-lifecycle
  source_revision: 0b36331
  technique: Reclaim dangling Azure hostname through attacker subscription
  reason: A dangling CNAME can lead to domain content control only after a particular Azure name is actually reclaimable.
    Live DNS, reservation/verification locks, region and successful registration are external state not proven by victim configuration.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-subdomain-takeover-unauth.md#impact
  source_revision: 0b36331
  technique: Takeover of registered OAuth redirect subdomain captures authorization response
  reason: A domain claim does not itself grant an OAuth token. The exact registered redirect URI, live victim authorization
    response, client/redirect/PKCE or secret constraints and successful redemption must be observed.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-subdomain-takeover-unauth.md#impact
  source_revision: 0b36331
  technique: Taken-over sibling subdomain receives domain-scoped session cookies
  reason: Session authority requires a successfully claimed sibling host, a cookie Domain covering it, victim browser traffic
    and an unexpired reusable session cookie. Those host/browser/runtime facts are not in the Azure snapshot.
