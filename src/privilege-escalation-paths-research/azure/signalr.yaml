# Azure SignalR Service and Web PubSub techniques (declarative only).
# Source: hacktricks-cloud az-signalr-web-pubsub-privesc.md (re-reviewed at rev a66f094ede).
# Upstream / event-handler managed-identity auth sends the service identity's Entra token to the configured
# endpoint. The token audience is the upstream ManagedIdentity.Resource setting, so the gain is limited to
# what that audience accepts; entries are conditional and the evaluator should not treat them as a full
# ARM takeover of the identity.

- id: azure-signalr-upstream-managed-identity-token
  provider: azure
  service: signalr
  title: Repoint a SignalR upstream or Web PubSub event handler to capture its managed-identity token
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-signalr-web-pubsub-privesc.md#microsoftsignalrservicesignalrwrite---upstream-repoint-event-exfil--mi-token-ssrf
  source_revision: a66f094ede
  summary: Rewriting the upstream (SignalR) or hub event-handler (Web PubSub) settings that use managed-identity auth makes the service send that identity's Entra token to an endpoint the source chooses.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.SignalRService/SignalR/write
          scope: "{target.host_resource}"
      - - action: Microsoft.SignalRService/WebPubSub/hubs/write
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service:
        - Microsoft.SignalRService/SignalR
        - Microsoft.SignalRService/WebPubSub
    scope: inherited_scope
    aggregate_as: "Managed identities of SignalR / Web PubSub resource {target.host_resource}"
    outcome: credentials
  conditions:
    - id: token_audience
      description: The captured token is issued for the upstream ManagedIdentity.Resource audience; it is usable only against services that accept that audience.
    - id: client_event_needed
      description: A token is sent only when a client event (connect, invocation, disconnect) triggers the upstream call.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: medium
  mitigation: Restrict SignalR/write and WebPubSub/hubs/write, pin upstream URLs to owned endpoints, and give service identities only the audience-specific roles they need.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-signalr/howto-use-managed-identity
    - https://learn.microsoft.com/en-us/azure/azure-web-pubsub/howto-use-managed-identity
  notes: Partial identity gain bounded by the token audience; evaluator should not propagate the identity's unrelated role assignments.

- id: azure-signalr-assign-user-assigned-identity
  provider: azure
  service: signalr
  title: Attach a user-assigned identity to SignalR or Web PubSub and capture its upstream token
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-signalr-web-pubsub-privesc.md#managed-identity-attach-via-signalrwrite-or-webpubsubwrite
  source_revision: a66f094ede
  summary: Attaching an assignable user-assigned identity to a SignalR or Web PubSub resource and selecting it for upstream or event-handler auth makes the service send that identity's token to an endpoint the source chooses.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: "{target.id}"
    any_of:
      - - action: Microsoft.SignalRService/SignalR/write
          scope: "{pivot}"
      - - action: Microsoft.SignalRService/WebPubSub/write
          scope: "{pivot}"
        - action: Microsoft.SignalRService/WebPubSub/hubs/write
          scope: "{pivot}"
  pivot_resource_type: Microsoft.SignalRService/SignalR|Microsoft.SignalRService/WebPubSub
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: "User-assigned identities assignable in {scope}"
    outcome: credentials
  conditions:
    - id: token_audience
      description: The captured token is issued for the upstream ManagedIdentity.Resource audience; it is usable only against services that accept that audience.
    - id: client_event_needed
      description: A token is sent only when a client event triggers the upstream call.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: medium
  mitigation: Restrict userAssignedIdentities/assign/action and SignalR / Web PubSub write roles.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-signalr/howto-use-managed-identity
  notes: Partial identity gain bounded by the token audience; evaluator should not propagate the identity's unrelated role assignments.
