- source: src/pentesting-ci-cd/circleci-security.md#persistence
  technique: Change a secret to inject a command in a trusting CircleCI job
  reason: Requires a particular secret to be interpolated unsafely by a later job; secret edit alone proves no execution.
  source_revision: 0b36331

