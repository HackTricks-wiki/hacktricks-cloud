# GCP Workflows privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-workflows-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# Workflow connector/OAuth steps act as the attached SA (no raw token extraction). actAs is checked at deploy/create/update,
# not at execute. Workflows has no resource-level IAM.
- id: gcp-workflows-create-actas-execute
  provider: gcp
  service: workflows
  title: Deploy and execute a workflow running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-workflows-privesc.md#workflowsworkflowscreate--iamserviceaccountsactas--workflowsexecutionscreate--deploy-code-under-a-service-account
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: workflows.workflows.create
        resource: "*"
      - action: workflows.executions.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: "Service accounts usable as workflow identity in {project}"
  conditions:
    - id: api_level
      description: The SA is usable only through connector and OAuth steps to Google APIs (no metadata token); that covers all of its IAM permissions.
    - id: cross_project_sa
      description: Cross-project SAs only when iam.disableCrossProjectServiceAccountUsage is not enforced and the Workflows service agent holds roles/iam.serviceAccountTokenCreator on the SA; not modelled.
    - id: default_sa
      description: Omitting serviceAccount attaches the project's Compute Engine default SA, which still requires actAs on that SA (no bypass).
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Grant actAs only on specific SAs; roles/workflows.admin/editor do not include actAs.
  references:
    - https://cloud.google.com/workflows/docs/authentication

- id: gcp-workflows-update-actas
  provider: gcp
  service: workflows
  title: Update an existing workflow's definition and service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-workflows-privesc.md#workflowsworkflowsupdate--replace-code-while-retaining-the-attached-identity
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs, by updating an existing workflow.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: workflows.workflows.update
        resource: "*"
      - action: workflows.executions.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: "Service accounts attachable to existing workflows in {project}"
  conditions:
    - id: existing_workflow
      description: Needs an existing workflow; explicitly changing the stored serviceAccount is a new attachment and requires actAs on the replacement SA.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Restrict workflows.workflows.update and actAs grants.

- id: gcp-workflows-update-source-retain-sa
  provider: gcp
  service: workflows
  title: Replace a workflow's source while keeping its attached service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-workflows-privesc.md#workflowsworkflowsupdate--replace-code-while-retaining-the-attached-identity
  source_revision: 171e422
  summary: The source can obtain the privileges of the service account attached to every workflow on which it holds workflows.workflows.update and workflows.executions.create.
  requires:
    all_of:
      - action: workflows.workflows.update
        resource: "{target.host_resource}"
      - action: workflows.executions.create
        resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: workflows_workflow
    scope: any
    aggregate_as: "SAs attached to workflows whose source the source can replace"
  conditions:
    - id: source_only_update
      description: Only a source-only update keeps the identity; changing or restating the SA requires actAs.
  blockers:
    - gcp_deny_policy
  confidence: derived
  severity: critical
  mitigation: Treat workflows.workflows.update on a workflow as equivalent to use of its SA; restrict roles/workflows.editor/admin.
  notes: The retained SA can belong to another project when the workflow was configured for cross-project execution (scope any).

- id: gcp-workflows-update-source-await-execution
  provider: gcp
  service: workflows
  title: Replace a workflow's source and let an existing trigger execute it as its service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-workflows-privesc.md#workflowsworkflowsupdate--replace-code-while-retaining-the-attached-identity
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the service account attached to every workflow on which it holds workflows.workflows.update, when another principal or trigger starts the replaced revision.
  requires:
    all_of:
      - action: workflows.workflows.update
        resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: workflows_workflow
    scope: any
    aggregate_as: "SAs attached to triggered workflows whose source the source can replace"
  conditions:
    - id: external_execution
      description: A Scheduler job, Eventarc trigger, application or other principal must start a new execution after the update (already-running executions keep the old revision); with workflows.executions.create the source can start it itself (gcp-workflows-update-source-retain-sa).
    - id: source_only_update
      description: Only a source-only update keeps the identity; changing or restating the SA requires actAs.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Treat workflows.workflows.update as equivalent to use of the workflow SA; restrict roles/workflows.editor/admin.
  notes: HackTricks states that if another principal starts the new revision the attacker needs only the update permission.
