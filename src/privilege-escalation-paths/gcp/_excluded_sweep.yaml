# Reviewed privilege-escalation sweep exclusions.
- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-non-svc-persistence.md#authenticated-user-tokens
  technique: Steal another Google user’s locally stored gcloud access or refresh token
  reason: The source is a host-file foothold and the target comes from local secret contents; neither is inferable from cloud
    IAM configuration.
- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-non-svc-persistence.md#metadata
  technique: Fetch an attached service account’s token after gaining guest code execution
  reason: Specific IAM-to-code-execution routes are already modeled by service entries. This heading starts with arbitrary
    existing guest execution and supplies no distinct snapshot-decidable source permission.
- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-non-svc-persistence.md#service-accounts
  technique: Steal a service-account private key or access token from a host
  reason: Possession, location, validity and contents of host-resident key/token material are runtime facts, not configuration-snapshot
    permissions.
- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-apigee-post-exploitation.md#historical--unpatched-hybrid-cve-2025-13292-gatewaytoheaven
  technique: Unpatched Apigee Hybrid metadata and analytics-worker credential chain
  reason: The necessary unpatched release, metadata-header bypass, shared analytics isolation flaw, runtime artifact replacement
    and token contents are vulnerability/runtime facts, not a permission/configuration-snapshot edge.
- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-backup-and-dr-post-exploitation.md#backup-and-restore-gke-secrets-into-an-attacker-accessible-cluster
  technique: Copy source-cluster credential Secrets with Backup for GKE
  reason: The documented operation copies arbitrary Secret data, but a usable source-cluster credential and its target identity
    depend on Secret payloads, token validity and restore behavior. These values and cross-cluster read access are not derivable
    from the catalog snapshot.
- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-cloud-sql-post-exploitation.md#export-sql-server-login-password-hashes-with-sp_help_revlogin
  technique: Recover another Cloud SQL login by exporting and cracking SQL Server password hashes
  reason: The export yields password verifiers, not usable credentials. Offline password recovery and reuse depend on unknown
    secret values; database logins are also outside the catalog target kinds.
- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-kms-post-exploitation.md#usetosign-on-mac--hmac-keys--forge-hmacs
  technique: Forge an application session or API identity with a KMS MAC key
  reason: The key-to-application trust mapping, accepted message format and resulting application principal are not collected;
    useToSign alone does not mint a Google IAM identity.
- source: src/pentesting-cloud/workspace-security/gws-admin-persistence.md#domain-wide-delegation-grant-to-an-attacker-service-account
  technique: Authorize an attacker-controlled service account for Workspace domain-wide delegation
  reason: Existing DWD catalog entries start from a service account that already has a grant and can be signed for. Creating
    the Workspace-side grant is a different action. The snapshot/evaluator has no Workspace DWD write-authority requirement
    or grant-creation edge, so it cannot decide this path.
- source: src/pentesting-cloud/workspace-security/gws-admin-persistence.md#marketplace-app-domain-install--oauth-app-trusted-allow-listing
  technique: Install or trust an attacker-controlled OAuth app for Workspace users
  reason: Workspace Marketplace installations, app trust settings, per-user grants and resulting tokens are not collected
    or represented as target relationships. Merely marking an app trusted does not itself prove user token issuance.
- source: src/pentesting-cloud/workspace-security/gws-admin-persistence.md#sso--saml-sign-in-profile-tampering
  technique: Repoint Workspace SSO to an attacker-controlled identity provider
  reason: The identity gain depends on future interactive sign-ins and IdP behavior. Workspace SSO profiles and IdP control
    are not in the snapshot, so there is no deterministic principal edge.
- source: src/pentesting-cloud/workspace-security/gws-admin-privesc.md#create-a-new-super-admin
  technique: Create a second Google Workspace Super Admin
  reason: This creates a separate administrator principal, but the GCP IAM snapshot has no Workspace user inventory, Super
    Admin assignment state, or Admin SDK permission model. It cannot establish the new principal edge even though the source
    already holds Super Admin.
- source: src/pentesting-cloud/workspace-security/gws-admin-privesc.md#grant-yourselfan-account-a-privileged-admin-role
  technique: Assign another Google Workspace administrator role
  reason: The target is a separate Workspace administrator principal, but the GCP IAM snapshot does not contain Workspace
    administrator roles, role assignments, assignability constraints, or controlled Workspace users. Existing GCP IAM role-grant
    entries do not cover the Admin SDK role-assignment mechanism.
- source: src/pentesting-cloud/workspace-security/gws-google-platforms-phishing/README.md#app-password-phishing
  technique: Phish a user-created Google app password
  reason: Victim creation and disclosure of the app password are future human actions, not configuration-snapshot facts; the
    password value is not collected.
- source: src/pentesting-cloud/workspace-security/gws-google-platforms-phishing/README.md#manual-authorization-response-relay
  technique: Relay a victim authorization callback or code
  reason: Requires victim disclosure and possession of a live one-time code; neither is present in a configuration snapshot.
- source: src/pentesting-cloud/workspace-security/gws-google-platforms-phishing/README.md#oauth-apps-phishing
  technique: Obtain a victim OAuth grant through a deceptive app consent flow
  reason: The decisive victim consent and issued refresh/access tokens are runtime events, not snapshot-decidable. The section
    does not give a permission-only grant path.
- source: src/pentesting-cloud/workspace-security/gws-google-platforms-phishing/gws-app-scripts.md#abusing-shared-with-me-documents
  technique: Edit a shared Apps Script that already has an installable trigger owned by another user
  reason: Drive editor grants, Apps Script source/trigger ownership, authorized scopes and future trigger execution are not
    collected by the catalog snapshot. Script ownership alone does not bypass consent.
- source: src/pentesting-cloud/workspace-security/gws-google-platforms-phishing/gws-app-scripts.md#leak-token
  technique: Exfiltrate an Apps Script OAuth token after victim authorization
  reason: The source-to-target edge depends on a victim authorizing and running the script. Runtime token issuance and the
    effective user are not derivable from configuration alone.
- source: src/pentesting-cloud/workspace-security/gws-google-platforms-phishing/gws-app-scripts.md#shared-document-script-ownership
  technique: Modify a bound Apps Script that later runs under its owner’s authorization
  reason: Drive editor grants, script source, installable-trigger ownership, user consent and execution timing are not in
    the config snapshot; document ownership alone does not bypass OAuth authorization.
