- source: src/pentesting-cloud/workspace-security/gws-workspace-sync-attacks-gcpw-gcds-gps-directory-sync-with-ad-and-entraid/gws-admin-directory-sync.md#attacking-groups
  technique: Alter an external directory group that Directory Sync maps to an IAM-bound Google group
