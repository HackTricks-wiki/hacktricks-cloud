
- id: gcp-secretmanager-versions-access-sa-key
  provider: gcp
  service: secretmanager
  title: Stored credential theft
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-secretmanager-privesc.md#escalation-through-a-recovered-secret
  requires:
    all_of:
    - action: secretmanager.versions.access
      resource: '*'
  target:
    kind: gcp_service_account
    selector:
      gcp_challenge_fact: gcp-secretmanager-versions-access-sa-key
    scope: any
  conditions:
  - id: active_key_in_secret
    description: The accessible enabled secret version must contain an active key for a stronger service account;
      the source must not already have equivalent access. The active key ID and service-account email must match
      collector evidence.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and audit the target configuration.
  references:
  - https://docs.cloud.google.com/secret-manager/docs/access-secret-version
  summary: The source can obtain a stronger service-account credential stored in an accessible secret version when
    the credential has been verified active.
  source_revision: 0b36331
  notes: Exact source/resource/target evidence must be emitted in gcp_privesc_challenge_evidence from the requested
    collector. Missing evidence is UNKNOWN; do not infer any other service account.
- id: gcp-secretmanager-setiampolicy-sa-key
  provider: gcp
  service: secretmanager
  title: Secret IAM self-grant to credential theft
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-secretmanager-privesc.md#secretmanagersecretssetiampolicy
  requires:
    all_of:
    - action: secretmanager.secrets.setIamPolicy
      resource: '*'
  target:
    kind: gcp_service_account
    selector:
      gcp_challenge_fact: gcp-secretmanager-setiampolicy-sa-key
    scope: any
  conditions:
  - id: active_key_in_secret
    description: The writable secret must hold an enabled version with an active stronger service-account key; IAM
      Deny and policy conditions must allow the self-grant. The active key ID and service-account email must match
      collector evidence.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and audit the target configuration.
  references:
  - https://docs.cloud.google.com/secret-manager/docs/access-secret-version
  summary: The source can obtain a stronger service-account credential stored in an accessible secret version when
    the credential has been verified active.
  source_revision: 0b36331
  notes: Exact source/resource/target evidence must be emitted in gcp_privesc_challenge_evidence from the requested
    collector. Missing evidence is UNKNOWN; do not infer any other service account.
