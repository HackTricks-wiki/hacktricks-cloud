# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP App Engine privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-appengine-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# Versions run as the app-level default SA (<PROJECT_ID>@appspot.gserviceaccount.com) unless a per-version SA is set.

- id: gcp-appengine-versions-create-actas
  provider: gcp
  service: appengine
  title: Deploy an App Engine version running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-appengine-privesc.md#deploy-attacker-controlled-code-as-a-version-service-account
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs, including the App Engine default service account.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: appengine.versions.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_appengine_deploy_path: true
    scope: same_project
    aggregate_as: "Service accounts usable as App Engine runtime SA in {project}"
  conditions:
    - id: app_exists
      description: An App Engine application must already exist in the project.
    - id: deploy_prereqs
      description: The direct Admin API can deploy from staged source without the caller creating a Cloud Build; gcloud adds build and operation-polling permissions.
    - id: legacy_default_sa_actas_exception
      description: In legacy-affected organizations the auto-created appspot default SA can be deployed as without actAs until constraints/appengine.enforceServiceAccountActAsCheck is enforced; this entry conservatively still requires actAs.
    - id: version_sa_artifact_registry
      description: The version's SA itself needs artifactregistry.repositories.uploadArtifacts (and downloadArtifacts for flexible) or the deployment never reaches execution.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on specific SAs, remove roles/editor from the App Engine default SA and restrict roles/appengine.deployer.
  references:
    - https://cloud.google.com/appengine/docs/standard/configure-service-accounts
  notes: An existing App Engine application, write access to its staging bucket, and a Docker repository the chosen runtime SA can upload to establish the standard-environment path. Other possible source or image paths remain unresolved. The selected SA must be in the application's project.

- id: gcp-appengine-versions-create-legacy-default-sa-no-actas
  provider: gcp
  service: appengine
  title: Deploy an App Engine version as the legacy default service account without actAs
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-appengine-privesc.md#deploy-attacker-controlled-code-as-a-version-service-account
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the auto-created App Engine default service account of projects where it can deploy versions, in legacy-affected organizations that do not enforce the App Engine actAs check.
  requires:
    all_of:
      - action: appengine.versions.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      target_id_glob: ["*@appspot.gserviceaccount.com"]
      gcp_sa_in_scope_of_permission: true
      gcp_appengine_deploy_path: true
      gcp_appengine_legacy_actas_unenforced: true
    scope: same_project
    aggregate_as: "App Engine default SA deployable without actAs in {project}"
  conditions:
    - id: legacy_affected_org
      description: Only legacy-affected organizations have the exemption; where constraints/appengine.enforceServiceAccountActAsCheck is not visible the check is already enforced and this edge does not exist.
    - id: app_exists
      description: An App Engine application must already exist and the version must run as the auto-created appspot service account.
    - id: version_sa_artifact_registry
      description: The default SA itself needs artifactregistry.repositories.uploadArtifacts (and downloadArtifacts for flexible) or the deployment never reaches execution.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Enforce constraints/appengine.enforceServiceAccountActAsCheck and remove roles/editor from the App Engine default SA.
  references:
    - https://docs.cloud.google.com/iam/docs/service-accounts-actas
  notes: Complements gcp-appengine-versions-create-actas (which requires actAs) for the documented legacy exception. The project must expose the legacy constraint and its effective policy must leave the actAs check unenforced; missing policy evidence remains unresolved.
- id: gcp-appengine-instances-enabledebug
  provider: gcp
  service: appengine
  title: SSH into an App Engine flexible instance and use its service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-appengine-privesc.md#ssh-into-a-flexible-environment-instance-through-debug-mode-or-os-login
  source_revision: 171e422
  summary: The source can obtain the privileges of the service account of App Engine flexible versions on which it holds appengine.instances.enableDebug, or OS Login plus actAs on that service account.
  requires:
    any_of:
    - - action: appengine.instances.enableDebug
        resource: '{target.host_resource}'
    - - action: compute.instances.osLogin
        resource: '*'
      - action: iam.serviceAccounts.actAs
        resource: '{target.email}'
    - - action: compute.instances.osAdminLogin
        resource: '*'
      - action: iam.serviceAccounts.actAs
        resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: appengine_version
      gcp_appengine_instance_ssh_path: true
    scope: same_project
    aggregate_as: SAs of App Engine flexible versions the source can debug
  conditions:
  - id: flexible_only
    description: Only App Engine flexible instances support SSH debug; standard environment versions are not reachable.
  - id: ssh_reachability
    description: The instance VM must be reachable over SSH from the source (external IP, or IAP TCP forwarding which adds iap.tunnelInstances.accessViaIAP and a firewall path).
  - id: os_login_scope
    description: The OS Login branch needs the role at project level for the CLI (or compute.projects.get); external-organization principals also need compute.osLoginExternalUser.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict roles/appengine.appAdmin and avoid privileged SAs on flexible versions.
  references:
  - https://docs.cloud.google.com/appengine/docs/flexible/debugging-an-instance
  - https://docs.cloud.google.com/compute/docs/oslogin/set-up-oslogin
  notes: The debug branch does not require actAs or Compute setMetadata (the debug request carries the SSH key). The OS Login branch requires actAs because the VM has an attached SA. Both branches join the exact flexible instance, backing VM and runtime service account; a public IP or authorized IAP route remains conditional on SSH firewall access.
