- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-cloud-scheduler-persistence.md#pubsub-and-app-engine-jobs---identity-free-dormant-triggers
  source_revision: 0b36331
  technique: Scheduler trigger for existing privileged App Engine handler or backdoored function
  reason: A Pub/Sub/App Engine job only sends a chosen request; privileged behavior depends on an existing handler and
    task payload, not job creation alone.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-cloud-shell-persistence.md#backdoor-bashrc
  technique: Victim Cloud Shell .bashrc callback and active user credential use
  reason: Code executes as the victim only if the attacker has already written that specific user's private Cloud Shell
    home and the victim later opens an interactive shell; project IAM configuration has no cross-user home mapping or
    write grant to evaluate.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-cloud-shell-persistence.md#backdoor-customize_environment
  technique: Root Cloud Shell boot callback and active-user credential use
  reason: Root code execution in the ephemeral Cloud Shell VM requires a prior write to that victim's private home and
    a later VM boot; whether the victim has authorized Google API access is a separate session fact, absent from project
    configuration.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-cloud-shell-persistence.md#authorization-and-tokens
  technique: Read active gcloud/ADC access tokens after Cloud Shell code execution
  reason: The active gcloud or ADC token is readable only after victim-session code execution and, when required, browser
    authorization; token-cache state and consent are runtime per-user facts outside the project snapshot.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-cloud-sql-persistence.md#sql-server-contained-database-authentication--hidden-portable-db-user
  technique: Enable contained authentication and create portable SQL Server DB user
  reason: The flag does not create a login. A SQL Server principal with CREATE USER rights must issue an in-database
    statement; the resulting contained database identity is outside the catalog's Google IAM target kinds and is not
    visible in Cloud SQL users.list.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-dataflow-persistence.md#invisible-persistence-in-built-container
  technique: Build-time environment-variable injection executes as Flex Template builder
  reason: The build-time callback depends on attacker control of a particular build invocation's --env values and on
    the selected base/tool actually executing the hook. Neither the source of those values nor that runtime tool behavior
    is established by a configuration snapshot; a caller who can submit arbitrary Cloud Build steps is already covered
    by gcp-cloudbuild-builds-create.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-compute-persistence.md#poison-a-consumed-custom-image-family
  technique: Create poisoned latest image in consumed family
  reason: The source disk, image, or snapshot must be controlled by the caller and usable via its exact useReadOnly permission,
    then a later VM must boot the new family image. The current rule cannot bind source-resource permission and filesystem
    control to the family-consumer target; keep this path out of reachability until those facts are represented.

- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-compute-privesc/README.md#computeinstancegroupmanagersupdate--templatevm-permissions--hijack-an-existing-managed-instance-group
  technique: Create template and repoint existing MIG
  reason: A selected existing MIG must accept a new template whose get/useReadOnly and every referenced image, disk,
    network, subnet and metadata permission is satisfied, and its Google APIs Service Agent must be able to use the attached
    SA. The current rule cannot bind all template references and permissions to that MIG; suppress the edge until these
    joins are machine checked.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-config-controller-persistence.md#durable-instance-iam-binding-krmapihostingkrmapihostssetiampolicy
  technique: Instance IAM binding to re-enter KCC
  reason: An instance-level roles/krmapihosting.admin binding is a persistent re-entry grant. It reaches the KCC identity
    only if that granted principal can also create or update KCC custom resources on the same instance (through container.thirdPartyObjects
    or in-cluster RBAC), with a verified instance-to-cluster identity join. That additional grant is not checked by the
    current entry.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-api-gateway-enum.md#enumeration
  technique: Read a FULL API config and recover an embedded credential
  reason: apigateway.apiconfigs.get exposes the spec, but a credential edge needs the decoded OpenAPI content
    to contain a live, usable key or password with authority the reader lacks. Backend URLs and JWT audiences
    alone are reconnaissance. The snapshot does not inventory or validate embedded credential content or its
    downstream authority.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-apigee-enum.md#enumerate-secrets-credentials-and-tls-material
  technique: Read an Apigee KVM value or developer-app consumer credential
  reason: A KVM value may be arbitrary data; a developer-app key may be revoked or limited to products the
    source can already use. A credential edge requires the actual entry/key value, active status, product authorization,
    and proof that its authority exceeds the reader's. These content and authorization facts are not collected.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-apigee-enum.md#enumerate-trace-masks-and-resource-iam
  technique: Recover a live credential from an Apigee debug trace
  reason: apigee.tracesessions.get only permits reading a trace. An edge requires a captured request actually
    containing an unmasked, still-valid credential with privileges the reader lacks. Trace bytes, masking results,
    and credential validity are runtime/content facts absent from the configuration snapshot.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-apigee-enum.md#basic-information
  technique: Deploy proxy or shared-flow logic to capture request credentials without an SA
  reason: Proxy or flow-hook authoring can intercept traffic, but gaining a credential requires a victim request
    to traverse the deployed revision with a reusable secret that the proxy logic can observe and the source
    cannot already use. Traffic, request content, secret validity, and destination authorization are runtime
    facts; deployment writes alone cannot establish a credential edge. SA-bound Google identity paths are already
    modeled by gcp-apigee-proxy-deploy-with-sa-actas and gcp-apigee-sharedflow-flowhook-with-sa-actas.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-app-engine-enum.md#enumeration
  technique: Read a credential in App Engine version variables or source files
  reason: appengine.versions.get reveals envVariables and source object pointers, but source bytes also require
    storage.objects.get. Neither permission proves a live secret is present or grants its authority. An edge
    needs the actual value or source contents, credential validity, and a downstream principal or resource
    mapping; these content facts are not in the configuration snapshot.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-cloudscheduler-privesc.md#cloudschedulerjobscreate-or-update--iamserviceaccountsactas--authenticated-http-dispatch-as-a-service-account
  technique: cloudscheduler.jobs.create + iam.serviceAccounts.actAs — one configured OAuth request as a service
    account
  reason: Creating or updating an HTTP job dispatches configured requests with the selected same-project service
    account, but returns neither its OAuth access token nor the downstream response body. The caller obtains
    only the effects of requests accepted by a reachable endpoint and authorized by the service account. A
    read-only account or an account lacking a useful state-changing operation does not yield an identity or
    principal-to-principal edge. Exact privilege gain depends on the chosen method, URI, body, scope, delivery-service-agent
    health, downstream IAM and network controls; the current selector cannot prove a self-grant or credential-exfiltration
    chain.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-cloud-sql-enum.md#password
  technique: Unset Cloud SQL MySQL root database password
  reason: Root@% can confer database administrator access if it exists, has no password, and the endpoint is
    reachable. The catalog models cloud/Kubernetes identity edges, and neither a usable blank database password
    nor network login success is established by the read-only configuration snapshot; these require a database
    authentication check.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-cloud-workstations-enum.md#enumeration
  technique: Other-user credentials on a Cloud Workstations persistent disk
  reason: A user with workstation use can read another principal’s credentials only if that workstation’s mounted
    persistent home actually contains usable credential content. Workstation IAM and persistentDirectories
    metadata do not reveal file contents or credential owner; the configured VM service account is already
    covered by gcp-workstations-use-existing-workstation.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-compute-instances-enum/gcp-compute-instance.md#metadata
  technique: VM metadata service-account token theft through workload SSRF
  reason: 'The token is obtainable only if an application has an exploitable SSRF that reaches metadata.google.internal,
    supplies Metadata-Flavor: Google, and exposes the response. VM configuration and caller IAM grants do not
    establish that runtime application vulnerability or exfiltration path.'
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-containers-gke-and-composer-enum.md#credentials-outside-workload-identity
  technique: Non-workload-identity credentials in GKE pod environments and volumes
  reason: An env variable, Secret, CSI volume or container file yields another identity only when its runtime
    content is a usable credential and its owner is known. Pod/Secret metadata cannot establish that fact.
    Static Google SA keys in Secrets are conditionally covered by k8s-cloud-pivot-secret-static-gcp-sa-key;
    KSA token reads have separate entries.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-containers-gke-and-composer-enum.md#external-user-authentication-and-standard-node-access
  technique: External OIDC issuer or ClientConfig control for GKE user authentication
  reason: Issuer trust and RBAC bindings alone do not show attacker control of the issuer, signing key, or
    mutable ClientConfig, nor the exact accepted claims. Those external trust/control facts and effective user/group
    mapping are required before another Kubernetes principal’s RBAC rights can be inferred.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-data-fusion-enum.md#access-model-notes
  technique: Set Data Fusion namespace design-time service account as pipeline runtime identity
  reason: datafusion.namespaces.setServiceAccount selects the design-time identity for Preview/Wrangler/validation
    on RBAC-enabled 6.10.0+ instances. Pipeline execution uses the service account from the effective compute
    profile, so this permission plus actAs does not give runtime execution as the chosen namespace account;
    gcp-datafusion-pipelines-create-execute covers the compute-profile VM SA path.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-dataform-enum.md#enumeration
  technique: Read credentials that an author hardcoded in Dataform workspace files
  reason: Workspace file reads can disclose a stronger identity only if a file contains a live credential.
    The credential content, owner, and validity are not control-plane facts; queryDirectoryContents by itself
    merely lists files, and readFile is needed for content.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-dataplex-enum.md#enumeration
  technique: Read data-profile topNValues that could include a credential
  reason: topNValues are sampled table cells. A privilege edge requires an actual live credential in a sampled
    value and its owner/scope; scan metadata and dataplex.datascans.getData alone cannot establish either.
- source: src/pentesting-cloud/gcp-security/gcp-services/gcp-filestore-enum.md#enumeration
  technique: Mount a reachable NFS share and recover a credential stored in files
  reason: NFS access depends on the compromised host network, export rule, and POSIX permissions. A stronger
    identity is gained only if readable file content contains a live credential; Filestore instance metadata
    does not identify one.
