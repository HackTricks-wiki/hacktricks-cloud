# GCP privesc catalog: techniques / page sections from the assigned HackTricks pages that are
# deliberately NOT modelled as identity edges (pure data reads, DoS, guardrail/config tamper,
# persistence-only, network pivots without an identity, OIDC-only token minting, replay of
# existing workloads, recon/intro/reference sections, or anchors already covered by an entry).
# Pages: hacktricks-cloud @ a53b46392c, re-verified against 171e422 (see ledgers/privesc-gcp.md)
- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-workload-identity-federation-persistence.md#iamgoogleapiscomworkloadidentitypoolscreate--workloadidentitypoolproviderscreate--external-backdoor
  technique: New workload identity pool and provider backdoor
  reason: The path also requires iam.serviceAccounts.setIamPolicy on the target SA; that permission alone can grant the caller Token Creator or Workload Identity User and is modeled by gcp-iam-serviceaccounts-setiampolicy. Pool/provider creation is a durable alternate credential mechanism, not an additional target.
- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-certificate-manager-post-exploitation.md#public-ca-publiccagoogleapiscom
  technique: Public CA section introduction
  reason: The heading names the Public CA endpoint and introduces the ACME account section; creating an ACME account is reviewed under its own heading and does not grant a GCP IAM identity.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-integration-connectors-privesc.md#connectorsconnectionssetiampolicy--resource-level-self-grant-to-use-a-connection
  technique: Connection IAM self-grant for stored backend credentials
  reason: The grant permits connector operations with a stored external backend credential; the page does not identify an attached GCP service account or grant its IAM permissions. The former GCP-SA attachment bypass is documented as fixed.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-dataproc-privesc.md#--scopescloud-platform-at-cluster-create--oauth-scope-amplification-of-a-stolen-node-token
  technique: Dataproc cloud-platform scopes at cluster creation
  reason: The same dataproc.clusters.create plus iam.serviceAccounts.actAs combination and chosen service-account target are modeled by gcp-dataproc-clusters-batches-create-actas; its access_scopes condition covers the create-time cloud-platform flag.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-dataproc-privesc.md#--metadata-startup-script--ssh-keys-at-cluster-create--root-node-takeover-without-an-init-action
  technique: Dataproc startup metadata at cluster creation
  reason: The same dataproc.clusters.create plus iam.serviceAccounts.actAs combination and chosen service-account target are modeled by gcp-dataproc-clusters-batches-create-actas; its cluster_code_path condition explicitly covers startup-script and ssh-keys metadata.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-config-delivery-privesc.md#config-delivery-configdeliverygoogleapiscom
  technique: Config Delivery page introduction
  reason: This heading names the service endpoint and introduces the feature; the manifest-publishing permission combination is modeled at its dedicated technique anchor by gcp-configdelivery-fleetpackage-publish.
- source: src/pentesting-cloud/gcp-security/gcp-cross-project-attacks/iam-and-service-account-impersonation-attacks.md#actas-and-cross-project-attachment
  technique: Cross-project service-account attachment overview
  reason: The section describes iam.serviceAccounts.actAs plus a workload-create permission; the matching Compute, Cloud Run, Functions and other deployment entries model those combinations, with the cross-project org-policy constraint recorded as a blocker.
- source: src/pentesting-cloud/gcp-security/gcp-cross-project-attacks/iam-and-service-account-impersonation-attacks.md#setiampolicy-backdoors-and-public--cross-domain-bindings
  technique: Cross-domain IAM policy self-grant overview
  reason: The section's project, folder, organization and service-account setIamPolicy self-grants are modeled by the resourcemanager and IAM setIamPolicy entries; choosing an external member does not change the prerequisite permission or reached identity.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#public-exposure-without-an-allusers-binding----no-invoker-iam-check-drs-bypass
  technique: Public exposure via invoker IAM check disable
  reason: Exposes the service's existing functionality to the internet; no new identity for the source.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runjobsrun-alone-on-a-pre-existing-job--run-as-its-pinned-sa
  technique: run.jobs.run alone on an existing job
  reason: Executes only the job's existing image/args; the source cannot run its own code as the SA, so it does not obtain the SA's privileges (confused-deputy only).
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-compute-privesc/README.md#computemachineimagessetiampolicy
  technique: Machine image setIamPolicy
  reason: Self-granted resource access can expose offline filesystem data only after machine image useReadOnly plus destination reconstruction permissions and CMEK access. Credential escalation additionally needs a live reusable credential or private key in the reconstructed bytes and a principal whose access it grants; policy write alone does not prove either.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-compute-privesc/README.md#computesnapshotssetiampolicy
  technique: Snapshot setIamPolicy
  reason: Self-granted resource access can expose offline filesystem data only after snapshot useReadOnly plus destination disk/image creation and CMEK access. Credential escalation additionally needs a live reusable credential or private key in the reconstructed bytes and a principal whose access it grants; policy write alone does not prove either.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-compute-privesc/README.md#computediskssetiampolicy
  technique: Disk setIamPolicy
  reason: Self-granted resource access can expose offline filesystem data only after disk snapshot/attachment or export permissions, destination access and CMEK access. Credential escalation additionally needs a live reusable credential or private key in the reconstructed bytes and a principal whose access it grants; policy write alone does not prove either.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-compute-privesc/README.md#local-privilege-escalation-in-gcp-compute-instance
  technique: Local privesc inside a VM
  reason: Requires prior code execution on the VM (host-level), covered by gcp-local-privilege-escalation-ssh-pivoting.md.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-cloudtasks-privesc.md#cloudtasksqueuescreate--cloudtasksqueuesupdate--queue-level-urioverride-silent-traffic-hijack--token-attach
  technique: Queue-level uriOverride hijack
  reason: Queue update plus actAs can redirect later legitimate deliveries without caller tasks.create; this is not covered by gcp-cloudtasks-tasks-create-actas. Credential capture requires an existing/future successfully enqueued task (enqueuer also passes actAs), dispatch to an attacker-controlled HTTPS endpoint, and a relying service accepting the token audience. Those later runtime and audience facts are not established by queue IAM configuration.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-cloudtasks-privesc.md#cloudtaskstaskscreate-app-engine-target--actas-free-app-engine-app-invocation
  technique: App Engine tasks without actAs
  reason: Reaches the app's handlers as a trusted request; no identity is obtained.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-cloudtasks-privesc.md#cloudtaskstasksrun-cloudtaskstaskslist
  technique: Run existing tasks
  reason: Replays only existing tasks' predefined requests; the source cannot choose the request.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#containerclustersget
  technique: clusters.get / getCredentials
  reason: Only obtains cluster access with the caller's own RBAC; no new identity.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#containerpodsgetlogs
  technique: Read pod logs
  reason: Reading pod logs can expose bearer tokens or bootstrap secrets only if the known Pod actually logged a live reusable credential; the log bytes, credential principal and validity are runtime content facts not determined by container.pods.getLogs.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#containerpodsattach
  technique: Attach to running containers
  reason: Attach reaches a pod identity only when a known running process accepts stdin and permits commands or token reads. Pod configuration does not prove that process behavior; see the proposed attach-usable-process collector.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#containerpodsportforward
  technique: Port-forward to pods
  reason: A tunnel can reach privileged functionality only if a known Pod-side endpoint is listening and exposes
    a usable admin action or live credential; endpoint behavior, authentication and credential scope are runtime
    facts absent from the snapshot.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#containerpodsproxy--containerservicesproxy
  technique: Proxy to pods/services
  reason: Proxy access can recover a secret only when a known internal HTTP endpoint returns a live reusable credential
    or performs a privileged action; route, response content, authentication and target principal are runtime facts
    absent from the snapshot.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#containerclustersupdate--access-control--security-config-tamper
  technique: clusters.update security tamper
  reason: Authorized-network and Binary Authorization changes alone weaken guardrails. Node-pool metadata-mode change is separately modeled by gcp-container-updatenodepool-expose-node-sa and requires a usable pod plus node-SA scopes.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#gkehubgatewaygeneratecredentials--kubectl-via-connect-gateway-no-network-path
  technique: Connect Gateway credentials
  reason: Network reach only; in-cluster power is the caller's own RBAC.
- source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-container-privesc.md#gkehubmembershipssetiampolicy--self-grant-connect-gateway-access
  technique: memberships.setIamPolicy self-grant gateway
  reason: Grants gateway reach only (RBAC still caps power); the cluster-admin path is gcp-gkehub-rbacrolebindings-gateway.
