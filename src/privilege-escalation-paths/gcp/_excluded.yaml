- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-cloud-run-post-exploitation.md#access-the-images
  technique: Access the images
  reason: Registry pull access yields image bytes. An identity pivot requires a reusable credential actually embedded
    in image layers and still valid; the image digest and repository permissions do not establish that fact or identify
    the target.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-cloud-shell-post-exploitation.md#recover-the-authorized-users-session-access-token
  technique: Recover the authorized user's session access token
  reason: Recovering the user token requires code or shell execution as that Unix user in a running Cloud Shell session
    after the user authorized tools. Session state and the locally supplied short-lived token are runtime host facts
    absent from the cloud IAM snapshot.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-composer-post-exploitation.md#export-dags-data-and-plugins
  technique: Export DAGs, data, and plugins
  reason: Exporting Composer bucket objects yields DAG, plugin, or data bytes. A privilege pivot requires an unexpired
    credential embedded in those files and its principal mapping; bucket permissions do not establish either fact.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-compute-post-exploitation.md#read-literal-configuration-from-compute-metadata
  technique: Read literal configuration from Compute metadata
  reason: Compute get/list can expose literal metadata. A privilege pivot requires a valid password, key, or token in
    an actual metadata value and a mapped target identity; free-form metadata may contain none.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-compute-post-exploitation.md#export--inspect-images-locally
  technique: Export & Inspect Images locally
  reason: Image export yields filesystem bytes. Identity gain requires a live credential actually stored on the exported
    image and a principal to which it belongs; export IAM and image metadata do not prove that content fact.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-compute-post-exploitation.md#export--inspect-snapshots--disks-locally
  technique: Export & Inspect Snapshots & Disks locally
  reason: Snapshot/disk conversion and export yield filesystem bytes. Credential gain requires a live credential on the
    source volume and a mapped owner; resource permissions and snapshot inventory cannot prove either.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-compute-post-exploitation.md#recover-deleted-standard-snapshots-before-expiry
  technique: Recover deleted standard snapshots before expiry
  reason: Recovering a standard snapshot yields retained disk data. An identity edge requires an unexpired credential
    in the deleted filesystem and a known owner; retention and recoverability alone cannot establish this.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-compute-post-exploitation.md#inspect-an-image-creating-a-vm
  technique: Inspect an Image creating a VM
  reason: Booting an image for inspection exposes guest filesystem data only if the source can access the inspection
    VM. A credential pivot needs a live secret in the image bytes; the attached-SA code-execution route is already gcp-compute-instances-create-actas.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-compute-post-exploitation.md#inspect-a-snapshotdisk-attaching-it-to-a-vm
  technique: Inspect a Snapshot/Disk attaching it to a VM
  reason: Attaching a compatible disk to an inspection VM exposes filesystem bytes. A privilege pivot requires an unexpired
    credential on that disk and its principal mapping, neither inferable from attach/use permissions.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-config-controller-post-exploitation.md#kubernetes-secret-read--recover-credentials-supplied-to-or-generated-by-config-connector-and-config-sync
  technique: Kubernetes Secret read — recover credentials supplied to or generated by Config Connector and Config Sync
  reason: A Config Connector or Config Sync Secret may contain an SA private key, DB password, or Git token, but its
    actual bytes, credential type, target principal, and current validity are needed. KSA token Secrets are separately
    modeled by gcp-container-secrets-read-ksa-token-secret and K8s RBAC entries.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-contact-center-insights-post-exploitation.md#read-stored-transcripts-and-analysis-results
  technique: Read stored transcripts and analysis results
  reason: Conversation and analysis reads return stored content. A privilege pivot requires an unredacted reusable credential
    in an actual transcript or result plus its still-valid target identity; list/get permission does not prove those
    facts.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-ids-post-exploitation.md#route-selected-vpc-flows-through-an-attacker-controlled-intercept-service
  technique: Route selected VPC flows through an attacker-controlled intercept service
  reason: Interception can reveal a second principal only if a live selected flow carries a usable credential in plaintext
    or in traffic the appliance can decrypt; firewall and endpoint configuration cannot identify that runtime payload
    or credential owner.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-ids-post-exploitation.md#mirror-selected-vpc-traffic-to-an-attacker-controlled-collector-through-nsi
  technique: Mirror selected VPC traffic to an attacker-controlled collector through NSI
  reason: Mirroring can reveal a second principal only if a selected live flow carries a usable credential visible to
    the collector; configuration cannot prove the payload, decryption, or credential owner.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-parameter-manager-post-exploitation.md#parameter-poisoning--inject-configsecret-refs-consumed-by-workloads
  technique: Parameter poisoning — inject config/secret-refs consumed by workloads
  reason: The config-poisoning branch depends on a runtime workload consuming the modified version and on how that application
    interprets the value. The __REF__/render branch returns arbitrary Secret Manager content; only inspection of the
    secret bytes can establish whether they are a usable credential for a named second principal.

- source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-workflows-post-exploitation.md#read-execution-arguments-results-and-detailed-step-variables
  source_revision: 0b36331
  technique: Read credential from execution records or detailed history; List FULL executions to recover recorded credentials
  reason: Execution arguments, results and DETAILED step values may contain a usable credential, but retained content,
    redaction and credential validity are runtime facts. FULL execution listing can reveal a credential only if retained
    argument/result content contains an unredacted usable secret.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-artifact-registry-persistence.md#upstream-credential-tamper--disclosure---remote-username----remote-password-secret-version
  source_revision: 0b36331
  technique: Locate upstream secret and read backing credential
  reason: Repository metadata reveals only a Secret Manager version path; the password value, usability and distinct
    authority require reading secret content.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-beyondcorp-persistence.md#retain-service-level-access-with-gateway-and-application-iam-bindings
  source_revision: 0b36331
  technique: Grant controlled principal BeyondCorp gateway/application access; Create and grant new BeyondCorp application
  reason: Gateway and application bindings permit browser routing, but upstream application authentication, Chrome licensing
    and a reachable gateway are not proved by IAM configuration. A newly created BeyondCorp application does not bypass
    upstream authentication; usable app privileges depend on gateway route, licensed client and backend access.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-cloud-functions-persistence.md#expose-an-http-backdoor
  source_revision: 0b36331
  technique: Expose attacker-controlled function for unauthenticated privileged execution
  reason: An allUsers invoker binding grants only invocation; SA privilege gain requires a backdoored handler whose behavior
    cannot be established from service IAM.

- source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-cloud-run-persistence.md#publicly-accessible-service
  source_revision: 0b36331
  technique: Grant allUsers invocation of backdoored Cloud Run service
  reason: An allUsers invoker binding grants only invocation; SA privilege gain requires a backdoored handler whose behavior
