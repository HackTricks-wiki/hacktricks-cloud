
- id: gcp-audit-s01-02-loosen-access-level-for-atta
  provider: gcp
  service: access-context-manager
  title: Loosen access level for attacker IP, device, region or principal
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc.md#accesscontextmanageraccesslevelsupdate--loosen-context-aware-access
  summary: The source can gain loosen access level for attacker IP, device, region or principal. Changing an access
    level can activate an IAM-authorized path only for a concrete caller, context and protected consumer; the policy
    write alone is insufficient.
  requires:
    all_of:
    - action: accesscontextmanager.accessLevels.update
      resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-audit-s01-02-loosen-access-level-for-atta
    scope: any
    aggregate_as: IAP or IAM-Condition protected resource
  conditions:
  - id: exact_target_evidence
    description: Existing exclusion calls this guardrail tamper, but page explicitly says the caller gains passage
      through a context gate that formerly excluded it. Missing target evidence evaluates UNKNOWN.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and review target trust/consumer configuration.
  source_revision: 0b36331
  references:
  - https://cloud.hacktricks.wiki/en/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc/#accesscontextmanageraccesslevelsupdate--loosen-context-aware-access
- id: gcp-audit-s01-03-create-a-bridge-perimeter-jo
  provider: gcp
  service: access-context-manager
  title: Create a bridge perimeter joining attacker and victim projects
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc.md#accesscontextmanagerserviceperimetersupdate--defeat-vpc-sc-data-exfil-protection
  summary: The source can gain create a bridge perimeter joining attacker and victim projects. Create uses servicePerimeters.create,
    absent from the update entry, but a bridge matters only for a concrete previously blocked API path and two eligible
    projects.
  requires:
    all_of:
    - action: accesscontextmanager.servicePerimeters.create
      resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-audit-s01-03-create-a-bridge-perimeter-jo
    scope: any
    aggregate_as: cross-perimeter data channel
  conditions:
  - id: exact_target_evidence
    description: Distinct create permission; update-only entry cannot flag this principal. Needs a victim and attacker
      project in bridged perimeters. Missing target evidence evaluates UNKNOWN.
  - id: existing_iam
    description: The concrete protected request must already be IAM-authorized and blocked only by the gate being
      changed.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and review target trust/consumer configuration.
  source_revision: 0b36331
  references:
  - https://cloud.hacktricks.wiki/en/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc/#accesscontextmanagerserviceperimetersupdate--defeat-vpc-sc-data-exfil-protection
- id: gcp-audit-s01-04-delete-a-perimeter-or-access
  provider: gcp
  service: access-context-manager
  title: Delete a perimeter or access level to remove protection
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc.md#accesscontextmanagerserviceperimetersupdate--defeat-vpc-sc-data-exfil-protection
  summary: The source can gain delete a perimeter or access level to remove protection. Delete permissions are distinct
    from update; a path exists only if the deleted gate blocked a specific IAM-authorized request.
  requires:
    any_of:
    - - action: accesscontextmanager.servicePerimeters.delete
        resource: '*'
    - - action: accesscontextmanager.accessLevels.delete
        resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-audit-s01-04-delete-a-perimeter-or-access
    scope: any
    aggregate_as: VPC-SC or context-aware gate
  conditions:
  - id: exact_target_evidence
    description: Alternative destructive permissions are documented; update-only entry cannot flag them. Missing
      target evidence evaluates UNKNOWN.
  - id: existing_iam
    description: The concrete protected request must already be IAM-authorized and blocked only by the gate being
      changed.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and review target trust/consumer configuration.
  source_revision: 0b36331
  references:
  - https://cloud.hacktricks.wiki/en/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc/#accesscontextmanagerserviceperimetersupdate--defeat-vpc-sc-data-exfil-protection
- id: gcp-audit-s01-06-delete-or-weaken-a-group-con
  provider: gcp
  service: access-context-manager
  title: Delete or weaken a group context-aware access binding
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc.md#gcpuseraccessbindings-cloud-bindings--context-removal-or-extended-workforce-sessions
  summary: The source can gain delete or weaken a group context-aware access binding. A binding deletion or weakening
    can unlock access for group members, but a snapshot must join group membership, gate consumer and underlying
    permission.
  requires:
    any_of:
    - - action: accesscontextmanager.gcpUserAccessBindings.delete
        resource: '*'
    - - action: accesscontextmanager.gcpUserAccessBindings.update
        resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-audit-s01-06-delete-or-weaken-a-group-con
    scope: any
    aggregate_as: group formerly blocked by context gate
  conditions:
  - id: exact_target_evidence
    description: Exclusion says no IAM identity, but the page documents new access for group members to Console/API
      behind a gate. Missing target evidence evaluates UNKNOWN.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and review target trust/consumer configuration.
  source_revision: 0b36331
  references:
  - https://cloud.hacktricks.wiki/en/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-access-context-manager-privesc/#gcpuseraccessbindings-cloud-bindings--context-removal-or-extended-workforce-sessions
