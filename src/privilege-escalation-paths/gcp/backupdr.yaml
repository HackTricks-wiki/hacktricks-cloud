# GCP backupdr privilege escalation techniques.
# Added by the 6fb9ac51fd completeness audit.

- id: gcp-backupdr-restore-compute-vm-as-chosen-sa
  provider: gcp
  service: backupdr
  title: Restore a vaulted Compute Engine backup as a new VM running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-backup-and-dr-post-exploitation.md#restore-a-vaulted-compute-engine-backup-into-a-controlled-project
  source_revision: 6fb9ac51fd
  summary: >-
    Backup and DR RestoreBackup creates a new Compute Engine VM whose target project, service account, access scopes and
    instance metadata (including startup scripts) are chosen by the caller, and the VM is created by the Backup and DR
    service agent. A principal with restore authority over a backup and restore permission on the target project can
    therefore obtain a VM running as a service account of that project with caller-controlled boot-time code.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: backupdr.bvbackups.restore
        resource: "*"
      - action: backupdr.compute.restoreFromBackupVault
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: "Service accounts attachable to VMs restored from Backup and DR vaults in {project}"
  conditions:
    - id: existing_backup
      description: A completed Compute Engine backup must exist in a backup vault whose access restriction allows restoring into the target project.
    - id: service_agent_role
      description: The vault's Backup and DR service agent must hold roles/backupdr.computeEngineOperator (which can attach service accounts) in the target project.
    - id: actas_enforcement
      description: Google's restore documentation lists no Service Account User requirement for the caller; if the service does not check actAs on the caller, every service account the service agent can attach is reachable without it (wider than modelled).
    - id: cross_project_vault
      description: A backup held in a vault of another project is modelled only when the restore permissions also hold in the target SA's project.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: >-
    Grant roles/backupdr.restoreUser and roles/backupdr.backupvaultAdmin only to backup operators, restrict vault access to
    the source project, keep privileged service accounts out of restore-target projects, and alert on RestoreBackup calls
    that set a service account, scopes or startup-script metadata.
  references:
    - https://docs.cloud.google.com/backup-disaster-recovery/docs/cloud-console/compute/compute-instance-restore
    - https://docs.cloud.google.com/sdk/gcloud/reference/backup-dr/backups/restore/compute
  notes: >-
    The page frames this as data export; the identity gain comes from the documented service-account and metadata
    inputs of RestoreBackup (alternative VM-creation path to gcp-compute-instances-create-actas that needs no
    compute.instances.create on the caller).
- id: gcp-backupdr-autoprotection-disk-credential
  provider: gcp
  service: backupdr
  title: Capture future VM disk credentials with Backup and DR auto-protection
  source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-backup-and-dr-post-exploitation.md#continuously-capture-labelled-compute-resources-with-auto-protection
  source_revision: 0b36331
  summary: Credential stored in a matching future disk backup; emit only for the exact verified source, resource
    and target.
  requires:
    all_of:
    - action: backupdr.autoProtectionPolicies.create
      resource: '*'
    - action: backupdr.backupPlans.useForComputeDisk
      resource: '*'
    - action: backupdr.autoProtectionBindings.create
      resource: '*'
    - action: backupdr.appliedAutoProtectionPolicies.authorize
      resource: '*'
    - action: backupdr.bvbackups.restore
      resource: '*'
    - action: backupdr.compute.restoreFromBackupVault
      resource: '*'
  source_kind:
  - gcp_user
  - gcp_service_account
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-backupdr-autoprotection-disk-credential
    scope: any
    outcome: scope_control
    aggregate_as: Verified targets for Capture future VM disk credentials with Backup and DR auto-protection
  conditions:
  - id: exact_verified_prerequisites
    description: Exact source, resource, target, scope and gain must be verified; missing fact is UNKNOWN. Compatible
      vault/plan and label; reciprocal service-agent roles; backup completes; restore target allowed and readable;
      credential exists in disk and remains usable. VM variant uses useForComputeInstance.
  confidence: conditional
  severity: high
  mitigation: Limit backupdr.autoProtectionPolicies.create to trusted operators and monitor the target-specific
    use.
  references:
  - src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-backup-and-dr-post-exploitation.md#continuously-capture-labelled-compute-resources-with-auto-protection
