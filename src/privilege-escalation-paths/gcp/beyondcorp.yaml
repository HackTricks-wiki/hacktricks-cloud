
- id: gcp-audit-s01-21-repoint-accessible-gateway-a
  provider: gcp
  service: beyondcorp
  title: Repoint accessible gateway app to new internal HTTP(S) host
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-beyondcorp-privesc.md#repoint-an-application-the-caller-can-already-use-to-another-web-target-behind-its-existing-upstream
  summary: The source can gain repoint accessible gateway app to new internal HTTP(S) host. A new private host is
    reachable only when the caller already has app use, the existing upstream can route to it, and upstream authentication
    permits access.
  requires:
    all_of:
    - action: beyondcorp.sgApplications.update
      resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-audit-s01-21-repoint-accessible-gateway-a
    scope: any
    aggregate_as: private web target
  conditions:
  - id: exact_target_evidence
    description: Exclusion calls this a network pivot; page documents new authority to reach a protected target
      with existing upstream. Requires existing app user/discovery, reachable web host and upstream authentication.
      Missing target evidence evaluates UNKNOWN.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions and review target trust/consumer configuration.
  source_revision: 0b36331
  references:
  - https://cloud.hacktricks.wiki/en/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-beyondcorp-privesc/#repoint-an-application-the-caller-can-already-use-to-another-web-target-behind-its-existing-upstream
