- id: gcp-vertex-customjob-env-sa-credential
  provider: gcp
  service: aiplatform
  title: Read inline credentials in custom-job environment of a GCP service account
  source: src/pentesting-cloud/gcp-security/gcp-services/gcp-vertex-ai-enum.md#custom-job-information
  source_revision: 0b36331
  summary: A readable vertex custom job env contains a verified reusable credential belonging to another GCP service
    account.
  requires:
    all_of:
    - action: aiplatform.customJobs.get
      resource: '*'
  target:
    kind: gcp_service_account
    selector:
      gcp_challenge_fact: gcp-vertex-customjob-env-sa-credential
    scope: any
    outcome: credentials
  conditions:
  - id: verified_content
    description: Emit only for exact source, resource, target and scope evidence after verifying credential validity;
      absent or incomplete content is UNKNOWN, and metadata or secret names alone do not qualify.
  confidence: conditional
  severity: high
  mitigation: Restrict aiplatform.customJobs.get on sensitive resources; rotate exposed service-account credentials.
  references:
  - https://cloud.google.com/vertex-ai/docs/reference/rest/v1/projects.locations.customJobs/get
