# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP Dataflow privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-dataflow-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# Dataflow has no resource-level IAM; worker VMs run as the job's worker SA.

- id: gcp-dataflow-jobs-create-actas
  provider: gcp
  service: dataflow
  title: Launch a Dataflow job with a chosen worker service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-dataflow-privesc.md#dataflowjobscreate--iamserviceaccountsactas--execute-code-as-a-selected-worker-service-account
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs and that the Dataflow service agent can use.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: dataflow.jobs.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_dataflow_flex_launch_path: true
    scope: same_project
    aggregate_as: "Service accounts usable as Dataflow worker SA in {project}"
  conditions:
    - id: launch_permissions
      description: A regional Flex Template launch also needs project read and staging bucket access; the public YAML Flex Template can carry caller-supplied pipeline code.
    - id: service_agent_access
      description: Workers only start if the Dataflow and Compute Engine service agents can use the chosen SA and the Dataflow service agent can create workers.
    - id: worker_role
      description: The worker SA needs Dataflow Worker and read/write access to a staging bucket.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on specific SAs; roles/editor and roles/owner bundle both dataflow.jobs.create and actAs.
  references:
    - https://cloud.google.com/dataflow/docs/concepts/security-and-permissions

- id: gcp-dataflow-datapipelines-create-actas
  provider: gcp
  service: datapipelines
  title: Create a scheduled Data Pipeline that relaunches Dataflow as a chosen worker service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-dataflow-privesc.md#datapipelinespipelinescreate--recurring-dataflow-run-as-sa-via-a-scheduled-data-pipeline-cron-persistence
  source_revision: 4e9b5eaaa6
  summary: The source can obtain the privileges of service accounts in the project on which it holds iam.serviceAccounts.actAs, by creating a Data Pipeline whose Dataflow launch spec runs attacker-influenced pipeline code as that worker service account.
  requires:
    all_of:
      - action: datapipelines.pipelines.create
        resource: "*"
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_datapipelines_scheduled_template_path: true
    scope: same_project
    aggregate_as: "Service accounts usable as Data Pipelines worker SA in {project}"
  conditions:
    - id: trigger
      description: A batch pipeline needs a schedule in a supported region. The caller must be able to act as the chosen Scheduler SA as well as the worker SA; setting both to one SA covers only the caller's actAs check. The Scheduler SA also needs its own Service Account User grant for the launch. A pipeline without a schedule needs a separate pipelines.run caller and is outside this entry.
    - id: payload
      description: A Flex launch can use Google's public regional Yaml_Template with caller-supplied Beam YAML in the yaml_pipeline parameter, or another template that reads attacker-controlled code. Inline YAML is a parameter of the Flex Template, not a separate Data Pipelines workload type.
    - id: service_agent_access
      description: The Data Pipelines service agent must be able to create Scheduler and Dataflow jobs, and the Dataflow service agent must be able to use the worker SA (see gcp-dataflow-jobs-create-actas).
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: high
  mitigation: Restrict roles/datapipelines.admin and grant actAs only on specific Dataflow worker SAs.
  references:
    - https://cloud.google.com/dataflow/docs/guides/data-pipelines
  notes: Same actAs gate as dataflow.jobs.create; Data Pipelines adds a recurring trigger that survives revocation of the source.
- id: gcp-dataflow-udf-template-bucket-write
  provider: gcp
  service: dataflow
  title: Overwrite a UDF or YAML job template in Cloud Storage consumed by Dataflow workers
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-dataflow-privesc.md#storageobjectscreate--storageobjectsdelete--poison-a-trusted-dataflow-artifact
  source_revision: 171e422
  summary: The source can obtain the privileges of the worker service account of Dataflow jobs whose UDF or template objects it can overwrite.
  requires:
    all_of:
    - action: storage.objects.create
      resource: '*'
    - action: storage.objects.delete
      resource: '*'
  target:
    kind: gcp_service_account
    selector:
      gcp_dataflow_artifact_overwrite_path: true
    scope: any
    aggregate_as: Worker SAs of Dataflow jobs consuming writable UDFs/templates
  conditions:
  - id: timing
    description: The modified file is only picked up when the job starts or new workers spin up (autoscaling, new run); jobs already running with loaded code are unaffected until then.
  - id: overwrite_rights
    description: Replacing the live generation of an existing object needs storage.objects.create and storage.objects.delete; storage.objects.update only changes metadata and storage.objects.get is only needed to read the original. The consumer must reference the object by name or unpinned latest generation, and retention policies or object holds block replacement. A worker package with a pinned sha256 rejects modified contents and is not a viable target without control of the expected checksum.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: high
  mitigation: Keep UDFs and templates in buckets writable only by the deployment pipeline and enable object versioning/retention.
  references:
  - https://docs.cloud.google.com/storage/docs/access-control/iam-permissions
  notes: Google describes shadow resource poisoning for mutable templates, staging dependencies and UDFs. Worker packages with a recorded sha256 are checked before use. Impact is bounded to the worker SA's permissions.
