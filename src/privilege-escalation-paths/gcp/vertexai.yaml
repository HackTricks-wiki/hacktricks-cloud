- id: gcp-vertex-batchprediction-create-actas
  provider: gcp
  service: aiplatform
  title: Create a batch prediction job running a source-controlled model as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#aiplatformbatchpredictionjobscreate--iamserviceaccountsactas
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
    - action: aiplatform.batchPredictionJobs.create
      resource: '*'
    - action: iam.serviceAccounts.actAs
      resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Service accounts usable as Vertex AI workload SA in {project}
  conditions:
  - id: model_control
    description: Needs a source-controlled model (aiplatform.models.upload) whose container or artifact executes code.
  - id: service_agent_io
    description: Vertex still uses its service agent for Cloud Storage/BigQuery I/O even with a custom SA.
  - id: service_agent_delegation
    description: The project's Vertex AI Service Agent must hold the documented prediction delegation grant (roles/iam.serviceAccountAdmin) on the custom SA.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on dedicated Vertex AI workload SAs; no aiplatform.* role contains actAs but roles/editor contains both.

- id: gcp-vertex-models-upload-endpoint-deploy-actas
  provider: gcp
  service: aiplatform
  title: Deploy a controlled model to a Vertex AI endpoint under a chosen service
    account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#deploy-an-attacker-controlled-model-to-an-endpoint-as-a-target-service-account
  source_revision: 6fb9ac51fd
  summary: The source can run a controlled custom-container model as a chosen service
    account by deploying it to an existing endpoint.
  requires:
    all_of:
    - action: aiplatform.endpoints.deploy
      resource: '*'
    - action: iam.serviceAccounts.actAs
      resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Service accounts usable as Vertex AI workload SA in {project}
  conditions:
  - id: controlled_model
    description: An attacker-controlled model must already exist. Uploading a new
      one additionally requires aiplatform.models.upload; deploy alone does not let
      the caller change an existing model container.
  - id: endpoint
    description: An existing endpoint is required. Creating one additionally requires
      aiplatform.endpoints.create.
  - id: service_agent_delegation
    description: The project's Vertex AI Service Agent must hold the documented prediction
      delegation grant (roles/iam.serviceAccountAdmin) on the custom SA.
  - id: container_contract
    description: Custom containers must pass Vertex health/prediction checks for the
      deployment to stay up.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on dedicated Vertex AI workload SAs; no aiplatform.*
    role contains actAs but roles/editor contains both.

