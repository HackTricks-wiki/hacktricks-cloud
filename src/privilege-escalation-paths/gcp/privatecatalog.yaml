
# GCP Service Catalog (formerly Private Catalog) privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-private-catalog-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.

- id: gcp-privatecatalog-product-version-poison
  provider: gcp
  service: cloudprivatecatalogproducer
  title: Replace the template of a shared Service Catalog solution version that consumers deploy
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-private-catalog-privesc.md#cloudprivatecatalogproducerproductsupdate--poison-an-existing-deployable-solution-version
  source_revision: 171e422
  summary: The source can make the Google APIs Service Agent of consumer projects that later deploy a shared solution version it can update create attacker-chosen resources.
  requires:
    all_of:
      - action: cloudprivatecatalogproducer.products.update
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: cloudservices_agent
    scope: any
    aggregate_as: "Google APIs Service Agents of projects deploying poisoned Service Catalog solutions"
  conditions:
    - id: consumer_deploys
      description: A consumer must explicitly preview, deploy or update the poisoned version in their project; nothing runs at update time.
    - id: attached_catalog
      description: The product must already be attached to a catalog associated with the consumer hierarchy, and the modified asset must pass validation.
    - id: terraform_solutions
      description: Terraform-based solutions run as the configured or default Cloud Build identity instead of the cloudservices agent.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: medium
  mitigation: Restrict cloudprivatecatalogproducer editor/admin roles and review solution versions before consumers deploy them.
  references:
    - https://docs.cloud.google.com/service-catalog/docs/create-solutions
  notes: Deployment Manager solutions run as the consumer project's Google APIs Service Agent (roles/editor by default), like gcp-deploymentmanager-deployments-create.
- id: gcp-privatecatalog-terraform-version-poison
  provider: gcp
  service: cloudprivatecatalogproducer
  title: Poison a Terraform solution deployed by a consumer
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-private-catalog-privesc.md#cloudprivatecatalogproducerproductsupdate--poison-an-existing-deployable-solution-version
  summary: Product-version update can cause a later consumer deployment to execute attacker content as its Cloud
    Build identity.
  requires:
    all_of:
    - action: cloudprivatecatalogproducer.products.update
      resource: '*'
  target:
    kind: gcp_service_account
    selector:
      gcp_challenge_fact: gcp-privatecatalog-terraform-version-poison
    scope: any
  conditions:
  - id: terraform_consumer_deploys
    description: An attached Terraform solution version must be selected for a consumer deployment; its configured
      or default Cloud Build service account must execute the modified asset and hold privileges beyond the source.
  confidence: conditional
  severity: high
  mitigation: Restrict producer updates and review version assets before consumer deployment.
  references:
  - https://docs.cloud.google.com/service-catalog/docs/overview
  source_revision: 0b36331
  notes: Exact source/resource/target evidence must be emitted in gcp_privesc_challenge_evidence from the requested
    collector. Missing evidence is UNKNOWN; do not infer any other service account.
- id: gcp-s08-16-associate-poisoned-catalog-with-additional-consumer-hie
  provider: gcp
  service: privatecatalog
  title: Associate poisoned catalog with additional consumer hierarchy
  source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-private-catalog-persistence.md#durable-poisoned-product-in-an-associated-catalog
  summary: Associate an attacker-controlled poisoned product with a new consumer hierarchy; a consumer deployment
    then executes its template.
  requires:
    all_of: []
    any_of:
    - - action: cloudprivatecatalogproducer.catalogAssociations.create
        resource: '*'
  source_kind:
  - gcp_user
  - gcp_service_account
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-s08-16-associate-poisoned-catalog-with-additional-consumer-hie
    scope: any
    aggregate_as: Consumer service agent of exact catalog deployment
  conditions:
  - id: exact_verified_prerequisites
    description: Require controlled poisoned product/version, exact association to consumer folder/org, deployment
      of that version and execution identity. Missing facts must evaluate UNKNOWN; emit no derived path.
  confidence: conditional
  severity: high
  mitigation: Restrict the named permission and review the exact resource and resulting grant.
  references:
  - https://cloud.hacktricks.wiki/pentesting-cloud/gcp-security/gcp-persistence/gcp-private-catalog-persistence.md
  notes: Draft only. The selector is a schema-valid placeholder for the feature or collector specified in this
    fragment.
