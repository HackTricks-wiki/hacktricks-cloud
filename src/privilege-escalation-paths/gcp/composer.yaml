# GCP Cloud Composer (managed Airflow) privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-composer-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# Composer environments have no resource-level IAM (project-level only). DAGs and tasks run as the environment SA.

- id: gcp-composer-environments-create-actas
  provider: gcp
  service: composer
  title: Create a Composer environment running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-composer-privesc.md#composerenvironmentscreate--iamserviceaccountsactas--bucket-write--create-an-environment-over-a-chosen-identity
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: composer.environments.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: "Service accounts usable as Composer environment SA in {project}"
  conditions:
    - id: code_delivery
      description: Running code in the new environment also needs a way to deliver a DAG (environment bucket write or environment update), which the creator normally has.
    - id: legacy_actas_exemption
      description: Until constraints/composer.enforceServiceAccountActAsCheck is enforced on a legacy organization, a creator can attach any project SA without actAs (the edge then reaches every project SA; not modelled).
    - id: environment_sa_role
      description: The environment SA must hold roles/composer.worker for the environment to come up.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Grant actAs only on specific SAs; roles/composer.admin does not include actAs but roles/editor does.
  references:
    - https://cloud.google.com/composer/docs/composer-2/access-control

- id: gcp-composer-environments-executeairflowcommand
  provider: gcp
  service: composer
  title: Execute Airflow CLI commands in a Composer environment
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-composer-privesc.md#composerenvironmentsexecuteairflowcommand--retrieve-airflow-secrets-or-run-available-dag-code
  source_revision: 171e422
  summary: The source can obtain the privileges of the service account of every Composer environment on which it holds composer.environments.executeAirflowCommand.
  requires:
    all_of:
      - action: composer.environments.executeAirflowCommand
        resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: composer_environment
    scope: same_project
    aggregate_as: "SAs of Composer environments where the source can run Airflow commands"
  conditions:
    - id: code_control
      description: Google warns the permission can execute Python code available to Airflow components as the environment SA; attacker-chosen code needs either a suitable Airflow subcommand or code already present in the environment.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict composer.environments.executeAirflowCommand (roles/composer.admin, roles/composer.environmentAndStorageObjectAdmin).
  references:
    - https://cloud.google.com/composer/docs/composer-2/access-control
  notes: No actAs needed. Also dumps Airflow connections and variables (data, not modelled).

- id: gcp-composer-environments-update
  provider: gcp
  service: composer
  title: Update a Composer environment's variables, Airflow overrides, PyPI packages or load a snapshot
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-composer-privesc.md#composerenvironmentsupdate--install-attacker-controlled-python-as-the-environment-identity
  source_revision: 171e422
  summary: The source can obtain the privileges of the service account of every Composer environment on which it holds composer.environments.update.
  requires:
    all_of:
      - action: composer.environments.update
        resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: composer_environment
    scope: same_project
    aggregate_as: "SAs of Composer environments the source can update"
  conditions:
    - id: payload_dependency
      description: The environment-variable path depends on the Composer image's interpreters and file-backed hooks need a readable payload; PyPI installation and snapshot load are documented by Google/HackTricks as code execution as the environment SA but are version-dependent.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict composer.environments.update to environment administrators and pin PyPI sources.
  notes: HackTricks @171e422 documents PyPI package installation as the supported code path (Google states composer.environments.update can execute code as the environment SA); no actAs is re-checked on update. Also covers Airflow config overrides and snapshot load, which are gated by the same permission.

- id: gcp-composer-bucket-write
  provider: gcp
  service: composer
  title: Write a DAG into a Composer environment's bucket
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-composer-privesc.md#storageobjectscreate--inject-a-dag-into-an-existing-environment-bucket
  source_revision: 171e422
  summary: The source can obtain the privileges of the service account of every Composer environment whose DAG bucket it can write to.
  requires:
    all_of:
      - action: storage.objects.create
        resource: "{target.host_resource.content_storage}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: composer_environment
    scope: any
    aggregate_as: "SAs of Composer environments whose DAG bucket the source can write"
  conditions:
    - id: dag_sync
      description: New DAG files are synchronized and parsed by the scheduler as the environment SA; no Composer permission is needed.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Restrict write access to Composer environment buckets (roles/storage.objectAdmin/objectCreator on the bucket, roles/composer.environmentAndStorageObjectAdmin).
  notes: Pure confused deputy through bucket write; the Import DAGs path of the SDK uses the same bucket write. Overwriting an existing DAG may also need storage.objects.delete.
