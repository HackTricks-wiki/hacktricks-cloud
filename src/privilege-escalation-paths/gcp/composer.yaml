# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP Cloud Composer (managed Airflow) privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-composer-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# Composer environments have no resource-level IAM (project-level only). DAGs and tasks run as the environment SA.

- id: gcp-composer-environments-create-actas
  provider: gcp
  service: composer
  title: Create a Composer environment running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-composer-privesc.md#composerenvironmentscreate--iamserviceaccountsactas--bucket-write--create-an-environment-over-a-chosen-identity
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs, by creating a Composer environment that runs as that service account and delivering a DAG to it.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: composer.environments.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_composer_create_with_dag_path: true
    scope: same_project
    aggregate_as: "Service accounts usable as Composer environment SA in {project}"
  conditions:
    - id: supported_location
      description: The bucket region must return a Composer image version that supports custom buckets and can be used for new environments.
    - id: code_delivery
      description: The selector requires a new DAG object under dags/ in an eligible same-project regional custom bucket before environment creation; later writes to a new default bucket and package updates remain unresolved.
    - id: legacy_actas_exemption
      description: Until constraints/composer.enforceServiceAccountActAsCheck is enforced on a legacy organization, a creator can attach any project SA without actAs (the edge then reaches every project SA; not modelled).
    - id: environment_sa_role
      description: The selector requires an unconditional project-level Composer Worker role and derived read and list access to the selected bucket for the environment service account.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on specific SAs; roles/composer.admin does not include actAs but roles/editor does.
  references:
    - https://cloud.google.com/composer/docs/composer-2/access-control
- id: gcp-composer-environments-update
  provider: gcp
  service: composer
  title: Update a Composer environment's variables, Airflow overrides, PyPI packages or load a snapshot
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-composer-privesc.md#composerenvironmentsupdate--install-attacker-controlled-python-as-the-environment-identity
  source_revision: 171e422
  summary: The source can introduce a Python package into a running Composer environment that uses the target service account.
  requires:
    all_of: []
  source_kind:
    - gcp_user
    - gcp_service_account
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: composer_environment
      gcp_composer_pypi_update_path: true
    scope: any
    aggregate_as: SAs of Composer environments the source can update
  conditions:
  - id: package_delivery
    description: The selector requires a running environment, enabled Composer API, exact service-account attachment, and derived update permission. Package resolution, build success, and later Airflow import depend on repository and runtime configuration.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict composer.environments.update to environment administrators and pin PyPI sources.
  notes: Google documents PyPI installation as code execution on behalf of the environment service account; no actAs is re-checked on update. Build and later Airflow import can use different identities, so the runtime service-account edge remains conditional. Other environment-variable and snapshot paths are not asserted by this selector.
- id: gcp-composer-bucket-write
  provider: gcp
  service: composer
  title: Write a DAG into a Composer environment's bucket
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-composer-privesc.md#storageobjectscreate--inject-a-dag-into-an-existing-environment-bucket
  source_revision: 171e422
  summary: The source can obtain the privileges of the service account of every Composer environment whose DAG bucket it can write to.
  requires:
    all_of: []
  source_kind:
    - gcp_user
    - gcp_service_account
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: composer_environment
      gcp_composer_dag_upload_path: true
    scope: any
    aggregate_as: SAs of Composer environments whose DAG bucket the source can write
  conditions:
  - id: dag_sync
    description: The selector requires a running or updating environment and derived storage.objects.create permission for a new Python file under its observed DAG prefix; the scheduler then synchronizes and parses it as the environment SA.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Restrict write access to Composer environment buckets (roles/storage.objectAdmin/objectCreator on the bucket, roles/composer.environmentAndStorageObjectAdmin).
  notes: Pure confused deputy through bucket write; the Import DAGs path of the SDK uses the same bucket write. Overwriting an existing DAG may also need storage.objects.delete.
