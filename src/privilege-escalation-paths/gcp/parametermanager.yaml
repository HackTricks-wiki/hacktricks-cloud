- id: gcp-parametermanager-version-render-credential
  provider: gcp
  service: parametermanager
  title: Render a parameter version to recover a stronger credential
  source: src/pentesting-cloud/gcp-security/gcp-services/gcp-parameter-manager-enum.md#relevant-permissions
  summary: Render resolves a Secret Manager reference as the parameter identity and returns a credential the caller
    cannot access directly.
  requires:
    all_of:
    - action: parametermanager.parameterVersions.render
      resource: '*'
  target:
    kind: gcp_service_account
    outcome: credentials
    scope: any
    selector:
      gcp_challenge_fact: gcp-parametermanager-version-render-credential
  conditions:
  - A version embeds a __REF__ to a Secret Manager version holding a stronger credential.
  - The parameter/template service identity can access that secret; the caller can render the version.
  - The returned payload must actually contain a usable credential.
  confidence: conditional
  severity: high
  mitigation: Restrict render grants; scope the parameter identity’s Secret Manager access.
  references:
  - https://cloud.google.com/secret-manager/parameter-manager/docs/reference-secrets
  notes: Exact verified source/resource/target fact is mandatory. Missing evidence evaluates UNKNOWN. Only a validated
    stronger service-account credential qualifies; arbitrary content is data.
  source_revision: 0b36331
