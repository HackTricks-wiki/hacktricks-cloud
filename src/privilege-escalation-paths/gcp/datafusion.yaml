
# GCP Cloud Data Fusion privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-data-fusion-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# attached_to_service: datafusion_instance -> the pipeline VM service account(s) of the compute profiles of the Data
# Fusion instance {target.host_resource} (default: the Compute Engine default SA).

- id: gcp-datafusion-pipelines-create-execute
  provider: gcp
  service: datafusion
  title: Deploy and run a code-capable Data Fusion pipeline as the pipeline VM service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-data-fusion-privesc.md#create-and-execute-a-pipeline-as-its-configured-vm-service-account
  source_revision: 171e422
  summary: The source can obtain the privileges of the pipeline VM service account of Data Fusion instances where
    it can create and execute pipelines (PySpark / Scala Spark plugins run arbitrary code on the Dataproc cluster).
  requires:
    all_of:
    - action: datafusion.instances.get
      resource: '{target.host_resource}'
    - action: datafusion.namespaces.get
      resource: '{target.host_resource}'
    - action: datafusion.pipelines.create
      resource: '{target.host_resource}'
    - action: datafusion.pipelines.execute
      resource: '{target.host_resource}'
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: datafusion_instance
    scope: same_project
    aggregate_as: Pipeline VM SAs of Data Fusion instances where the source can run pipelines
  conditions:
  - id: plugin_installed
    description: A code-capable plugin (PySpark Program, Scala Spark) must be installed; uploading one needs datafusion.artifacts.create/update.
  - id: valid_compute_profile
    description: The Data Fusion service agent must already be able to act as the profile's SA; no caller actAs
      is needed.
  - id: namespace_scope
    description: Pipeline permissions may be granted per namespace on RBAC-enabled instances.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict roles/datafusion.developer and higher; use a low-privilege pipeline SA per compute profile
    instead of the Compute Engine default SA.
  references:
  - https://docs.cloud.google.com/data-fusion/docs/concepts/rbac
  - https://docs.cloud.google.com/data-fusion/docs/concepts/service-accounts
- id: gcp-datafusion-setiampolicy-self-grant
  provider: gcp
  service: datafusion
  title: Self-grant a Data Fusion instance or namespace role, then run pipelines
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-data-fusion-privesc.md#self-grant-a-data-fusion-instance-or-namespace-role
  source_revision: 171e422
  summary: The source can obtain the privileges of the pipeline VM service account of Data Fusion instances whose instance or namespace IAM policy it can write.
  requires:
    any_of:
      - - action: datafusion.instances.setIamPolicy
          resource: "{target.host_resource}"
      - - action: datafusion.namespaces.setIamPolicy
          resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: datafusion_instance
    scope: same_project
    aggregate_as: "Pipeline VM SAs of Data Fusion instances whose IAM policy the source controls"
  conditions:
    - id: accessor_gate
      description: The namespace path also needs effective datafusion.instances.get (roles/datafusion.accessor); Google's RBAC pages disagree on whether it is implicit.
    - id: plugin_installed
      description: A code-capable plugin must be installed.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Keep Data Fusion setIamPolicy permissions to administrators (Data Fusion Admin, Owner).
  references:
    - https://docs.cloud.google.com/data-fusion/docs/concepts/rbac

- id: gcp-datafusion-artifacts-create-plugin-poison
  provider: gcp
  service: datafusion
  title: Plant a trojanized CDAP plugin used by existing Data Fusion pipelines
  source: src/pentesting-cloud/gcp-security/gcp-persistence/gcp-data-fusion-persistence.md#malicious-artifact--plugin-planted-in-the-namespace-datafusionartifactscreate
  source_revision: 171e422
  summary: The source can obtain the privileges of the pipeline VM service account of Data Fusion instances where it can upload artifacts, when legitimate pipelines load the planted plugin.
  requires:
    all_of:
      - action: datafusion.instances.get
        resource: "{target.host_resource}"
      - action: datafusion.artifacts.create
        resource: "{target.host_resource}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: datafusion_instance
    scope: same_project
    aggregate_as: "Pipeline VM SAs of Data Fusion instances where the source can upload plugins"
  conditions:
    - id: victim_pipeline_uses_plugin
      description: A deployed pipeline must resolve and run the planted plugin (same name with a newer/selected version, or a widget that runs on load) after the upload.
    - id: namespace_scope
      description: Artifact permissions may be granted per namespace on RBAC-enabled instances.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict datafusion.artifacts.create/update, pin plugin versions in pipelines and use a low-privilege pipeline SA.
  references:
    - https://docs.cloud.google.com/data-fusion/docs/concepts/rbac
