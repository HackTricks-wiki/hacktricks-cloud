  source_revision: a1de13ac34
  summary: The source can add its own IAM binding to an exact disk it can administer and gain compute.disks.useReadOnly when it lacks that permission.
  requires:
    all_of:
    - action: compute.disks.setIamPolicy
      resource: '{target.policy_resource}'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
    - compute.disks.useReadOnly
    aggregate_as: Disk read-only use the source could grant itself
  conditions:
  - id: exact_reviewed_self_grant
    description: The exact zonal or regional disk is inventoried with a readable IAM policy; the source can set that policy but lacks compute.disks.useReadOnly on the disk. An independently reviewed accepted mutation remains a second supported proof route.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict compute.disks.setIamPolicy on protected disk resources and review self-directed IAM policy changes.
  notes: The source can add roles/compute.storageAdmin to its own disk policy to gain compute.disks.useReadOnly. This grants a new permission on that disk, but copying, imaging or attaching its bytes requires separate permissions and may face disk or CMEK constraints.
