# GCP resource IAM self-grants. Each entry requires a concrete policy-write action and typed reviewed evidence of a new effective permission to the same source principal on an exact resource governed by the policy. A policy write alone, or a mere data read, never creates a path.
# Canonical policy: peaso/privesc/catalog_policy.yaml
- id: gcp-connectors-connections-setiampolicy-connection-self-grant
  provider: gcp
  service: connectors
  title: Self-grant connectors.connections.executeSqlQuery on a connection
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-integration-connectors-privesc.md#connectorsconnectionssetiampolicy--resource-level-self-grant-to-use-a-connection
  source_revision: a1de13ac34
  summary: A principal with connectors.connections.setIamPolicy on an exact active connection can grant itself
    the Connector Invoker role and gain a connection-use permission it did not already have.
  requires:
    all_of:
    - action: connectors.connections.setIamPolicy
      resource: '{target.policy_resource}'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
    - connectors.connections.executeSqlQuery
    aggregate_as: Verified connection self-grant to the source
  conditions:
  - id: exact_reviewed_self_grant
    description: Requires either complete source-bound evidence of an accepted self-grant or a unique active connection
      with collected IAM policy, role, prior-access, and policy-write facts. The inferred path remains conditional.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict connectors.connections.setIamPolicy on protected connection resources and review self-directed IAM
    policy changes.
  notes: The policy write alone does not create a path. The gcp_resource_self_grant_evidence record must prove this exact
    permission gain for the acting principal on GrantedResource.
- id: gcp-compute-machineimages-setiampolicy-machine-image-self-grant
  provider: gcp
  source_kind:
  - gcp_user
  - gcp_service_account
  service: compute
  title: Self-grant compute.machineImages.useReadOnly on a machine image
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-compute-privesc/README.md#computemachineimagessetiampolicy
  source_revision: a1de13ac34
  summary: The source may grant itself compute.machineImages.useReadOnly on an exact ready machine image when it can safely update that image's IAM policy and did not already have the permission.
  requires:
    all_of:
    - action: compute.machineImages.setIamPolicy
      resource: '{target.policy_resource}'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
    - compute.machineImages.useReadOnly
    aggregate_as: Machine image read-only use the source could grant itself
  conditions:
  - id: exact_machine_image_policy
    description: The exact ready machine image and its IAM policy are collected, the source can get and set that policy, and roles/compute.admin can add a new useReadOnly permission. A reviewed accepted mutation remains another proof route.
  - id: reconstruction
    description: Reconstructing data from the machine image needs separate VM or disk creation, any required CMEK access, and a usable service-account choice.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict compute.machineImages.setIamPolicy on protected machine image resources and review self-directed IAM
    policy changes.
  notes: Google documents roles/compute.admin as grantable on an individual machine image. The modeled edge is the new machineImages.useReadOnly permission, not direct access to its disk bytes. Missing policy, prior access, role, or effective constraints leave the prospective path unresolved; reviewed accepted self-grant evidence remains supported.
- id: gcp-compute-snapshots-setiampolicy-snapshot-self-grant
  provider: gcp
  service: compute
  title: Grant yourself read-only use of a snapshot
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-compute-privesc/README.md#computesnapshotssetiampolicy
  source_revision: a1de13ac34
  summary: A policy writer on a ready global or regional snapshot may grant itself useReadOnly on that exact snapshot.
  requires:
    all_of:
    - action: compute.snapshots.setIamPolicy
      resource: '{target.policy_resource}'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
    - compute.snapshots.useReadOnly
    aggregate_as: Snapshot self-grant to the source
  conditions:
  - id: exact_snapshot_policy
    description: Requires a unique ready global or regional snapshot, its readable IAM policy, derived policy-write permission, an applicable grantable role, no prior useReadOnly access, and complete deny and organization-policy evidence.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict compute.snapshots.setIamPolicy on protected snapshot resources and review self-directed IAM policy
    changes.
  notes: A prospective path is conditional because the policy change is not attempted. roles/compute.storageAdmin includes useReadOnly and is grantable on a snapshot. A reviewed accepted mutation can also prove the exact gain. This permission does not by itself expose disk bytes; later use needs separate creation permissions and any CMEK access.
