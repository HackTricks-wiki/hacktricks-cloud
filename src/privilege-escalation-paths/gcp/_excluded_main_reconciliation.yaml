  technique: Reconfigure a virtual repository's upstreams to enable dependency confusion
  reason: The target uses uncollected artifact_consumer attachment inventory; repository update permission
    alone cannot establish package resolution, a publishable upstream, and a later consumer install. The
    prior reviewed source exclusion marks dependency confusion manual-only.
  disposition: manual-only
