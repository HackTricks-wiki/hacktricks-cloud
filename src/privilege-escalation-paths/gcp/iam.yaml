    outcome: impersonation
    aggregate_as: Pub/Sub push OIDC token to attacker endpoint
    grants:
    - OIDC ID token accepted only by the verified audience
  conditions:
  - id: exact_verified_prerequisites
    description: The exact source, target and exploit-enabling facts must be verified; missing facts evaluate UNKNOWN.
  confidence: conditional
  severity: high
  mitigation: Restrict the stated permission and remove the exploitable trust or configuration.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/gcp-security/gcp-cross-project-attacks/resource-sharing-and-confused-deputy-attacks.md#notable-subtleties
