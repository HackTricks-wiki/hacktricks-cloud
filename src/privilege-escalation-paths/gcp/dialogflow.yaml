# GCP Dialogflow credential routes. The required collector fact is not yet available.
- id: gcp-pa-s03-4-dialogflow
  provider: gcp
  service: dialogflow
  title: Redirect a routed webhook retaining an external credential
  source: src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-dialogflow-post-exploitation.md#dialogflowwebhooksupdate--redirect-retained-external-authentication-material
  source_revision: 0b36331
  summary: Changing a routed webhook endpoint may disclose its retained external authentication material.
  requires:
    all_of:
    - action: dialogflow.webhooks.update
      resource: '*'
  target:
    kind: gcp_verified_authority
    selector:
      gcp_challenge_fact: gcp-pa-s03-4-dialogflow
    scope: any
    aggregate_as: Exact externally verified target for Redirect a routed webhook retaining an external credential
  conditions:
  - id: exact_verified_prerequisites
    description: A routed invocation reaches an allowed attacker endpoint while a valid reusable external credential
      remains attached.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict dialogflow.webhooks.update to trusted operators and remove or narrow the underlying delegated
    credential or operation.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-dialogflow-post-exploitation.md
  notes: Schema-valid provisional draft only. Needs external credential target kind as well as collector facts; future
    invocation is conditional. Missing joined facts must evaluate UNKNOWN; do not emit an edge from permission alone.
