    - https://docs.cloud.google.com/service-usage/docs/reference/rest/v1/services/list
  notes: The selector joins create and run in one collected host project with an enabled Cloud Run API, then checks the target project's policy and the host service agent's token access.

- id: gcp-run-instances-create-update-cross-project-actas
  provider: gcp
  service: run
  title: Deploy or update a Cloud Run instance with a cross-project service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runservicesupdate--iamserviceaccountsactas
  source_revision: 6fb9ac51fd
  summary: The source may run an instance under a service account from another project when the host action, cross-project attachment policy, and Cloud Run service-agent token grant all allow it.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_cross_project_run_instance: true
    scope: any
    aggregate_as: "Service accounts usable by Cloud Run instances in another project"
  conditions:
    - id: preview_feature
      description: Cloud Run instances are a preview resource and must be available in the host project and region.
    - id: cross_project_service_agent
      description: The host project's Cloud Run service agent must have Service Account Token Creator on the target service account.
    - id: cross_project_org_policy
      description: The service-account project's effective iam.disableCrossProjectServiceAccountUsage policy must be unenforced.
    - id: update_requires_existing
      description: The update path needs an exact undeleted instance that is ready or can be started by the source.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Limit instance create or update rights, service-account actAs, cross-project attachment, and service-agent token grants to intended resources.
  references:
    - https://docs.cloud.google.com/run/docs/configuring/instances/service-identity
  notes: The create path checks project permission. The update path checks the exact existing instance and its state. The target service account belongs to another project.
