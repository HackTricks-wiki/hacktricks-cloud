# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP Cloud Run (services, jobs, worker pools) privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-run-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# actAs is enforced at create/update on the runtime SA (the Compute default SA when none is set); it is NOT re-checked at
# execution, so execution-time levers on an existing resource reach its pinned SA without actAs.

- id: gcp-run-services-create-actas
  provider: gcp
  service: run
  title: Deploy a Cloud Run service running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runservicescreate--iamserviceaccountsactas-runroutesinvoke
  source_revision: 171e422
  summary: The source may run new code under a same-project service account when it can attach that account, create a Cloud Run service in that project, and the Cloud Run API is enabled.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_run_service_create_path: true
    scope: same_project
    aggregate_as: "Service accounts usable as Cloud Run service identity in {project}"
  conditions:
    - id: service_create_project
      description: The selector checks service creation on the target account's project and keeps undecidable future-resource conditions unresolved.
    - id: cloud_run_api
      description: The Cloud Run API must be enabled in that project.
    - id: invoke_path
      description: run.routes.invoke (or a public service) is needed only to trigger request-time code; container startup code runs without invocation.
    - id: cross_project_sa
      description: Cross-project service-account attachment has separate policy and service-agent requirements, modelled by gcp-run-services-create-cross-project-actas.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Grant actAs (roles/iam.serviceAccountUser) only on specific SAs; restrict roles/run.developer and roles/run.admin.
  references:
    - https://cloud.google.com/run/docs/securing/service-identity
    - https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services/create
    - https://docs.cloud.google.com/service-usage/docs/reference/rest/v1/services/list
  notes: New code can run during container startup; request-time code additionally needs an invoker or a public service.

- id: gcp-run-services-update-actas
  provider: gcp
  service: run
  title: Redeploy an existing Cloud Run service with new code, environment or identity
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runservicesupdate--iamserviceaccountsactas
  source_revision: 171e422
  summary: The source may deploy new code under a same-project service account when it can update one exact ready Cloud Run service in that project and attach the account with actAs.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_run_service_update_path: true
    scope: same_project
    aggregate_as: "Service accounts attachable to existing Cloud Run services in {project}"
  conditions:
    - id: existing_service
      description: The selector checks run.services.update on one undeleted, ready service in the target account's project. Failed or reconciling services remain unresolved.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Restrict run.services.update and grant actAs only on specific SAs.
  references:
    - https://docs.cloud.google.com/run/docs/configuring/services/service-identity
    - https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services/patch
    - https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.services
  notes: Updating the image can introduce new code. The service must later receive traffic or maintain warm instances for that code to start.

- id: gcp-run-services-setiampolicy-actas
  provider: gcp
  service: run
  title: Self-grant update rights on a Cloud Run service through its IAM policy
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runservicessetiampolicy
  source_revision: 171e422
  summary: The source may run new code as a service's pinned account when it can change that exact service's IAM policy, grant itself missing update rights, and use actAs on the account.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: run_service
      gcp_actas_granted_on_target: true
      gcp_run_service_policy_update_path: true
    scope: any
    aggregate_as: "SAs of Cloud Run services whose IAM policy the source controls"
  conditions:
    - id: followup_update
      description: The selector requires setIamPolicy on the same ready service, a collected policy, a grantable Cloud Run Developer role that adds update, and clear known policy restrictions. actAs on the pinned identity is also required.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict run.services.setIamPolicy (roles/run.admin, roles/owner).
  references:
    - https://docs.cloud.google.com/run/docs/reference/iam/roles
    - https://docs.cloud.google.com/run/docs/configuring/services/service-identity
  notes: The update can replace the image, while actual code startup depends on the service receiving traffic or maintaining warm instances.

- id: gcp-run-jobs-create-run-actas
  provider: gcp
  service: run
  title: Create and execute a Cloud Run job running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runjobscreate-runjobsrun-iamserviceaccountsactasrunjobsget
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_run_job_create_execute_path: true
    scope: same_project
    aggregate_as: "Service accounts usable as Cloud Run job identity in {project}"
  conditions:
    - id: same_project_execution
      description: The selector requires create and run on the same target project, so a new job can inherit both grants.
    - id: cloud_run_api
      description: The host project's Cloud Run API must be enabled before a new job can be created.
    - id: cross_project_sa
      description: Cross-project service-account attachment is covered by gcp-run-jobs-create-run-cross-project-actas.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on specific SAs; roles/editor bundles both actAs and job create/run.
  references:
    - https://docs.cloud.google.com/run/docs/configuring/jobs/service-identity
    - https://docs.cloud.google.com/run/docs/execute/jobs
  notes: Omitting the SA does not bypass actAs; it is enforced on the Compute default SA. A job created in the project inherits project-level run permission. No ingress is needed.

