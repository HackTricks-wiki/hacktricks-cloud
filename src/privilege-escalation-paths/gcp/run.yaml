- id: gcp-run-services-create-cross-project-actas
  provider: gcp
  service: run
  title: Deploy a Cloud Run service with a cross-project service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runservicescreate--iamserviceaccountsactas-runroutesinvoke
  source_revision: 171e422
  summary: The source may run a new Cloud Run service under a service account from another project when the target project allows cross-project attachment and the Cloud Run service agent can mint its tokens.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_cross_project_run_service: true
    scope: any
    aggregate_as: "Service accounts attachable to new Cloud Run services in another project"
  conditions:
    - id: host_service_create
      description: The host project must grant service creation and have the Cloud Run API enabled.
    - id: cross_project_service_agent
      description: The project creating the service must grant its Cloud Run service agent Service Account Token Creator on the target service account.
    - id: cross_project_org_policy
      description: The effective iam.disableCrossProjectServiceAccountUsage policy on the target service account's project must be unenforced.
