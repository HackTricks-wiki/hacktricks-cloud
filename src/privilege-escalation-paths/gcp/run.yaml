- id: gcp-run-ssh-into-running-instance
  provider: gcp
  service: run
  title: SSH into a Cloud Run service container and use its service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#cloud-run-instance-ssh--runsshread--runsshroot-exec-inside-a-running-container-as-its-sa-no-actas
  source_revision: 171e422
  summary: The source may reach the service identity through root SSH on an enabled second-generation Cloud Run service when it can also act as that identity; IAP and OS Login access remain conditional.
  requires:
    all_of:
      - action: run.services.sshRoot
        resource: "{target.host_resource}"
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: run_service
      gcp_run_service_ssh_path: true
    scope: any
    aggregate_as: "SAs of Cloud Run services the source can SSH into"
  conditions:
    - id: early_access
      description: The interactive SSH step is early-access/allowlisted; the IAM permissions exist but the exec path may be unavailable to the project.
    - id: service_ready
      description: The selector checks that SSH is enabled on a ready second-generation service; Cloud Run can start an instance for the session when none is running.
    - id: iap_and_os_login
      description: The session also needs an allowed IAP tunnel and OS Login access; those grants are not in the Cloud Run service inventory.
    - id: root_ssh
      description: The documented connection path requires root SSH and actAs on the service identity; sshRead alone does not establish this path.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict root SSH and actAs grants on services with privileged identities.
  references:
    - https://docs.cloud.google.com/iap/docs/ssh-cloud-run
  notes: The exact ready second-generation service and root SSH grant are joined to its service account; IAP and OS Login controls can still prevent a session.

- id: gcp-run-instances-create-update-actas
  provider: gcp
  service: run
  title: Deploy or update a standalone Cloud Run instance running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runservicesupdate--iamserviceaccountsactas
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs, by attaching it to a Cloud Run instance whose container it controls.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_run_instance_create_or_update_path: true
    scope: same_project
    aggregate_as: "Service accounts usable as Cloud Run instance identity in {project}"
  conditions:
    - id: preview_feature
      description: Cloud Run instances are a preview resource; the API must be available to the project.
    - id: update_requires_existing
      description: The update path needs an existing instance that is ready, or separate start permission when its running state is unresolved.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on specific SAs and restrict run.instances create/update (roles/run.editor, roles/run.admin).
  notes: The create path checks project permission. The update path checks permission on an exact, undeleted instance and its readiness or start permission. This same-project path is conditional because instance availability and code execution still depend on Cloud Run.
- id: gcp-run-jobs-setiampolicy
  provider: gcp
  service: run
  title: Self-grant execute-with-overrides on an existing Cloud Run job through its IAM policy
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runjobssetiampolicy
  source_revision: 171e422
  summary: The source may run code as the service account pinned to an existing ready Cloud Run job when its policy write can add the missing job permissions and the exact job supports an executable path.
  requires:
    all_of: []
  source_kind:
  - gcp_user
  - gcp_service_account
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: run_job
      gcp_run_job_policy_override_path: true
    scope: any
    aggregate_as: SAs pinned to Cloud Run jobs whose IAM policy the source controls
  conditions:
  - id: exact_job_policy
    description: The selector checks setIamPolicy and a collected IAM policy on the same ready, undeleted job that uses the target service account. The new grant must add a missing permission and pass known deny and member constraints.
  - id: override_injectable
    description: The Jobs Executor With Overrides role can add run and runWithOverrides on that job. Without actAs, the recorded command must be an interpreter that accepts code through overridden arguments.
  - id: actas_alternative
    description: With derived actAs on the pinned service account, the Cloud Run Developer role can add job update and run rights on that job so the source may replace its image and execute it.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict run.jobs.setIamPolicy (roles/run.admin, roles/owner) and avoid pinning privileged SAs to jobs.
  references:
    - https://docs.cloud.google.com/run/docs/reference/iam/roles
    - https://docs.cloud.google.com/run/docs/configuring/jobs/service-identity
    - https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.jobs/run
  notes: The selector keeps missing policy, role, boundary, and image-entrypoint evidence unresolved. It does not report a new path when the source already holds the needed job actions.
- id: gcp-run-jobs-runwithoverrides
  provider: gcp
  service: run
  title: Execute an existing Cloud Run job with overridden args or environment
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#runjobsrun-runjobsrunwithoverrides-runjobsget
  source_revision: 171e422
  summary: The source may run attacker-supplied code as a job's pinned service account when it can execute that exact ready job with argument overrides and the recorded command is an interpreter that accepts code through arguments.
  requires:
    all_of: []
  source_kind:
  - gcp_user
  - gcp_service_account
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: run_job
      gcp_run_job_override_path: true
    scope: any
    aggregate_as: SAs pinned to Cloud Run jobs the source can run with overrides
  conditions:
  - id: exact_job_run
    description: The selector checks run and runWithOverrides on the same collected job that uses the target service account.
  - id: override_injectable
    description: Overrides cannot change image or command. The selector reports a path only when a recorded interpreter command can execute overridden arguments; other images remain unresolved.
  - id: ready_job
    description: The exact job must not be deleted and must have a succeeded terminal condition with reconciliation complete.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Do not grant roles/run.jobsExecutorWithOverrides on jobs pinned to privileged SAs.
  references:
    - https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.jobs/run
    - https://docs.cloud.google.com/run/docs/reference/rest/v2/projects.locations.jobs
  notes: No actAs is needed because the run-as identity is fixed at create/update. Jobs with unknown entrypoints remain unresolved instead of being reported as usable code execution.
- id: gcp-run-instances-ssh
  provider: gcp
  service: run
  title: SSH into a running standalone Cloud Run instance and use its service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-run-privesc.md#cloud-run-instance-ssh--runsshread--runsshroot-exec-inside-a-running-container-as-its-sa-no-actas
  source_revision: 6fb9ac51fd
  summary: Root SSH access to a ready or startable Cloud Run instance may let the source use its attached service account. Read-only SSH access is kept unresolved because it does not prove command execution or token use.
  requires:
    any_of:
    - - action: run.instances.sshRoot
        resource: '{target.host_resource}'
      - action: iam.serviceAccounts.actAs
        resource: '{target.email}'
    - - action: run.instances.sshRead
        resource: '{target.host_resource}'
      - action: iam.serviceAccounts.actAs
        resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: run_instance
      gcp_actas_granted_on_target: true
      gcp_run_instance_ssh_path: true
    scope: any
    aggregate_as: SAs of running Cloud Run instances the source can SSH into
  conditions:
  - id: early_access
    description: The interactive SSH step is early-access/allowlisted; the IAM permissions exist but the exec path may be unavailable to the project.
  - id: iap_and_os_login
    description: The session also needs an allowed IAP tunnel and OS Login access; those grants are not in this Cloud Run instance inventory.
  - id: service_account_user
    description: Google documents Service Account User on the attached service account as a connection requirement; the exact actAs grant is checked.
  - id: sshread_capability
    description: sshRead permits reading data, but does not establish command execution or service-account token access; read-only paths stay unresolved.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict roles/run.sshRoot, roles/run.sshReader and roles/run.editor on instances with privileged SAs.
  references:
    - https://docs.cloud.google.com/iap/docs/ssh-cloud-run
    - https://docs.cloud.google.com/iam/docs/roles-permissions/run
  notes: The selector joins an exact undeleted instance, attached service account, root SSH permission, exact actAs grant, SSH setting, readiness or start permission. IAP and OS Login access still affect whether a session can be established.
