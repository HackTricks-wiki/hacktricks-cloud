# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# Amazon EventBridge Scheduler privilege escalation techniques.
# Source: hacktricks-cloud eventbridgescheduler-privesc/README.md (rev 171e422299).

- id: aws-scheduler-passrole-createschedule-or-updateschedule
  provider: aws
  service: scheduler
  title: Create a schedule that adds an IAM permission to its creator
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/eventbridgescheduler-privesc/README.md#iampassrole-schedulercreateschedule--schedulerupdateschedule
  source_revision: 171e422299
  summary: The source can schedule a role-authorized IAM inline-policy write to itself and gain a new IAM permission.
  source_kind: [aws_user, aws_role]
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.role_arn}"
        request_context:
          iam:PassedToService: scheduler.amazonaws.com
      - action: scheduler:CreateSchedule
        resource: "{target.resource_arn}"
  target:
    kind: aws_verified_authority
    selector:
      aws_scheduler_iam_self_grant: true
    scope: same_account
    aggregate_as: "Scheduler IAM inline-policy self-grants in {account}"
    outcome: permission_grant
    grants: ["iam:CreateUser after a scheduled inline-policy write to the exact source principal"]
  conditions:
    - id: scheduled_iam_policy_write
      description: The new schedule must run and its configured IAM inline-policy call must succeed before the source gains the permission.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Restrict schedule creation and iam:PassRole to approved execution roles, and prevent those roles from changing their creators' IAM policies.
  references:
    - https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-universal.html
    - https://docs.aws.amazon.com/scheduler/latest/UserGuide/setting-up.html
  notes: The exact new schedule is in the default group. The passed role must trust Scheduler for that schedule and have effective iam:PutUserPolicy or iam:PutRolePolicy on the source IAM principal. The source must lack effective iam:CreateUser beforehand, and its boundary, organization and explicit-deny controls must permit that action after the inline policy is added. The scheduled call and later use remain conditional. The former generic passed-role edge and the UpdateSchedule branch remain unresolved without a selected target operation and an existing schedule.
