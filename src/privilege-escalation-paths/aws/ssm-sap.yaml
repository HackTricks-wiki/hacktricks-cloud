- id: aws-s05-recover-configured-sap-hana-administrator-credentials
  provider: aws
  service: ssm-sap
  title: Recover configured SAP HANA administrator credentials
  source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-systems-manager-for-sap-post-exploitation/README.md#recover-configured-sap-hana-administrator-credentials
  source_revision: 0b36331
  summary: The source may obtain SAP HANA ADMIN database identity when the exact documented prerequisite is verified.
  requires:
    all_of:
    - action: ssm-sap:GetDatabase
      resource: '*'
    - action: secretsmanager:GetSecretValue
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-s05-recover-configured-sap-hana-administrator-credentials
    scope: same_account
    aggregate_as: Verified SAP HANA ADMIN database identity in {account}
    grants:
    - SAP HANA ADMIN database identity
  conditions:
  - id: exact_verified_prerequisites
    description: Registered HANA database exposes the ADMIN SecretId; caller can read that exact secret, use kms:Decrypt if needed, and reach/authenticate to HANA. Missing or unverified evidence is UNKNOWN and must not emit a definite edge.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed action on the exact resource and remove unnecessary access.
  references:
  - https://docs.aws.amazon.com/ssmsap/latest/APIReference/API_GetDatabase.html
  - https://docs.aws.amazon.com/ssm-sap/latest/userguide/register-database.html
  notes: Requires an exact source/target evidence record; absent facts remain UNKNOWN.
