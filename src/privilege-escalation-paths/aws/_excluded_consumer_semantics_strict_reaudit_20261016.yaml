  technique: Overwrite a Parameter Store value consumed as a CodeBuild environment variable
  reason: The writable parameter is joined to a build, but no reviewed buildspec/consumer behavior
    proves its value executes code or yields role credentials; the effect can be configuration
    poisoning only.
