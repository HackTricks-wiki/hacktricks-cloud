  source_revision: 6fb9ac51fd
  technique: Overwrite a Secrets Manager value consumed as a CodeBuild environment variable
  reason: The writable secret is joined to a build, but no reviewed buildspec/consumer behavior
    proves its value executes code or yields role credentials; the effect can be configuration
    poisoning only.
  prior_id: aws-codebuild-env-secretsmanager-poisoning
