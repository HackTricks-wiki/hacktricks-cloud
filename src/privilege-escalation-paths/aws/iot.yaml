# AWS IoT Core privilege escalation techniques.
# Source: hacktricks-cloud aws-iot-privesc/README.md and aws-iot-core-privesc/README.md (rev 171e422299).

- id: aws-iot-passrole-rolealias-certificate
  provider: aws
  service: iot
  title: Point an IoT role alias at a passed role and assume it with a device certificate
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iot-privesc/README.md#iotcreaterolealias--updaterolealias--iampassrole--assume-an-arbitrary-role-via-a-device-certificate
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any passable role trusting credentials.iot.amazonaws.com through the
    IoT credential provider.
  requires:
    all_of:
    - action: iam:PassRole
      resource: "{target.arn}"
    - action: iot:AttachPolicy
      resource: "*"
    - any_of:
      - action: iot:CreateRoleAlias
        resource: "*"
      - action: iot:UpdateRoleAlias
        resource: "*"
    - any_of:
      - action: iot:CreateKeysAndCertificate
        resource: "*"
      - action: iot:RegisterCertificateWithoutCA
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: credentials.iot.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting credentials.iot.amazonaws.com passable in {account}"
    outcome: credentials
  conditions:
  - id: iot_policy_allows_assume
    description: The certificate needs an IoT policy allowing iot:AssumeRoleWithCertificate on the role alias (an
      existing permissive policy, or iot:CreatePolicy).
  - id: passrole_condition_key
    description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on IoT credential-provider roles and iot:CreateRoleAlias / UpdateRoleAlias /
    AttachPolicy / certificate creation and registration to IoT administrators.
  references:
  - https://docs.aws.amazon.com/iot/latest/developerguide/authorizing-direct-aws.html
  - https://docs.aws.amazon.com/iot/latest/apireference/API_CreateRoleAlias.html
  - https://docs.aws.amazon.com/iot/latest/apireference/API_RegisterCertificateWithoutCA.html
  notes: The certificate can be AWS-generated (CreateKeysAndCertificate) or an offline self-signed one registered as
    ACTIVE (RegisterCertificateWithoutCA, documented under its own heading on the same page). A source already holding
    an active certificate's private key does not need either; that path is not modelled (false negative only). The
    aws-iot-core-privesc page documents the same technique.
- id: aws-iot-provisioning-claim-existing-rolealias
  provider: aws
  service: iot
  title: Mint a provisioning certificate for an existing privileged role alias
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iot-privesc/README.md#iotcreateprovisioningtemplate--iampassrole--iotcreateprovisioningclaim--self-replenishing-fleet-of-attacker-certificates
  summary: A claim-derived device certificate can use an IoT policy permitting credential exchange through an existing
    role alias.
  requires:
    all_of:
    - action: iot:CreateProvisioningTemplate
      resource: '*'
    - action: iot:CreateProvisioningClaim
      resource: '*'
    - action: iam:PassRole
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-iot-provisioning-claim-existing-rolealias
    scope: same_account
  severity: high
  mitigation: Restrict provisioning-template creation, claim minting, passable registration roles, and role-alias
    policies.
  references:
  - https://docs.aws.amazon.com/iot/latest/developerguide/provisioning-templates.html
  - https://docs.aws.amazon.com/iot/latest/developerguide/authorizing-direct-aws.html
  confidence: conditional
  conditions:
  - id: existing_alias_chain
    description: Template binds an active certificate to an IoT policy allowing AssumeRoleWithCertificate on an existing
      role alias that points to the target role; claim must be used over MQTT.
  - id: verified_collector_fact
    description: The requested collector fact must bind the source, exact resource, newly reachable authority and all
      runtime prerequisites; without it the result is UNKNOWN.
  notes: Required collector evidence is absent from current snapshots; missing evidence remains UNKNOWN/unresolved.
- id: aws-iot-byo-certificate-existing-rolealias
  provider: aws
  service: iot
  title: Use a BYO certificate with an existing privileged role alias
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iot-privesc/README.md#iotregistercertificatewithoutca--register-an-attacker-generated-byo-certificate-as-a-device-identity
  summary: The source can register an attacker-held certificate and attach a policy that permits credential exchange
    through an existing role alias.
  requires:
    all_of:
    - action: iot:RegisterCertificateWithoutCA
      resource: '*'
    - action: iot:AttachPolicy
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-iot-byo-certificate-existing-rolealias
    scope: same_account
  severity: high
  mitigation: Restrict certificate registration and policy attachment, and scope role-alias policies tightly.
  references:
  - https://docs.aws.amazon.com/iot/latest/developerguide/authorizing-direct-aws.html
  - https://docs.aws.amazon.com/iot/latest/apireference/API_RegisterCertificateWithoutCA.html
  confidence: conditional
  conditions:
  - id: active_certificate_existing_alias
    description: Certificate is registered ACTIVE; an attachable policy allows AssumeRoleWithCertificate on an existing
      alias pointing to the target role; if policy must be created, iot:CreatePolicy is additionally required.
  - id: verified_collector_fact
    description: The requested collector fact must bind the source, exact resource, newly reachable authority and all
      runtime prerequisites; without it the result is UNKNOWN.
  notes: Required collector evidence is absent from current snapshots; missing evidence remains UNKNOWN/unresolved.
