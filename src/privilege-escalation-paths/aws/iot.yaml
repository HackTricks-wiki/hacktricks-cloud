# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS IoT Core privilege escalation techniques.
# Source: hacktricks-cloud aws-iot-privesc/README.md and aws-iot-core-privesc/README.md (rev 171e422299).

- id: aws-iot-passrole-rolealias-certificate
  provider: aws
  service: iot
  title: Point an IoT role alias at a passed role and assume it with a device certificate
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iot-privesc/README.md#iotcreaterolealias--updaterolealias--iampassrole--assume-an-arbitrary-role-via-a-device-certificate
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any passable role trusting credentials.iot.amazonaws.com through the IoT credential provider.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: iot:AttachPolicy
        resource: "*"
      - any_of:
          - action: iot:CreateRoleAlias
            resource: "*"
          - action: iot:UpdateRoleAlias
            resource: "*"
      - any_of:
          - action: iot:CreateKeysAndCertificate
            resource: "*"
          - action: iot:RegisterCertificateWithoutCA
            resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: credentials.iot.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting credentials.iot.amazonaws.com passable in {account}"
    outcome: credentials
  conditions:
    - id: iot_policy_allows_assume
      description: The certificate needs an IoT policy allowing iot:AssumeRoleWithCertificate on the role alias (an existing permissive policy, or iot:CreatePolicy).
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on IoT credential-provider roles and iot:CreateRoleAlias / UpdateRoleAlias / AttachPolicy / certificate creation and registration to IoT administrators.
  references:
    - https://docs.aws.amazon.com/iot/latest/developerguide/authorizing-direct-aws.html
    - https://docs.aws.amazon.com/iot/latest/apireference/API_CreateRoleAlias.html
    - https://docs.aws.amazon.com/iot/latest/apireference/API_RegisterCertificateWithoutCA.html
  notes: The certificate can be AWS-generated (CreateKeysAndCertificate) or an offline self-signed one registered as ACTIVE (RegisterCertificateWithoutCA, documented under its own heading on the same page). A source already holding an active certificate's private key does not need either; that path is not modelled (false negative only). The aws-iot-core-privesc page documents the same technique.
