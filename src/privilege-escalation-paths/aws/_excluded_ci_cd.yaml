# Reviewed source techniques without a supported principal escalation edge.
- source: src/pentesting-ci-cd/serverless.com-security.md#tutorial
  source_revision: 0b36331
  technique: Serverless Dashboard collaborator deploys through SFRole AdministratorAccess
  reason: Requires Serverless Dashboard collaborator deployment authority and an SFRole trust/external-id binding
    to the AWS account. Dashboard membership and deploy rights are not in the AWS snapshot.
- source: src/pentesting-ci-cd/serverless.com-security.md#access-keys-and-license-keys-security
  source_revision: 0b36331
  technique: Leaked SERVERLESS_ACCESS_KEY grants dashboard deployment authority
  reason: Requires the actual live SERVERLESS_ACCESS_KEY value and its Dashboard scope; cloud configuration
    does not establish key theft or validity.
- source: src/pentesting-ci-cd/terraform-security.md#terraform-plan
  source_revision: 0b36331
  technique: Poison HCL with external data source for plan-time execution
  reason: Requires attacker HCL to be consumed by terraform plan with external provider execution and runner
    credentials. SCM-to-runner mapping and Terraform config are uncollected.
- source: src/pentesting-ci-cd/terraform-security.md#malicious-terraform-provider-in-a-project
  source_revision: 0b36331
  technique: Pin attacker provider/lock hash for init+plan execution
  reason: Requires attacker provider and lockfile to be accepted by terraform init/plan on a credential-bearing
    runner. Provider installation and runner mapping are uncollected.
- source: src/pentesting-ci-cd/terraform-security.md#terraform-apply
  source_revision: 0b36331
  technique: Inject local-exec provisioner for apply-time credentials
  reason: Requires malicious local-exec configuration to reach terraform apply after approval on a runner with
    target credentials. Plan alone does not execute it.
- source: src/pentesting-ci-cd/terraform-security.md#secrets-dumps
  source_revision: 0b36331
  technique: Add nonsensitive output to print secret variable
  reason: Requires a usable secret variable and permission to write the output plus read applied output; variable
    content and future apply are uncollected.
- source: src/pentesting-ci-cd/terraform-security.md#terraform-cloud-speculative-plan-rce-and-credential-exfiltration
  source_revision: 0b36331
  technique: Terraform Cloud plan token executes external data source and steals injected AWS/GCP credentials
  reason: Requires Terraform Cloud speculative-plan permission on the workspace, accepted external data source,
    and injected AWS/GCP credentials. Workspace ACL, run settings, and cloud identity join are absent.
- source: src/pentesting-ci-cd/terraform-security.md#compromising-terraform-cloud
  source_revision: 0b36331
  technique: Steal plaintext Terraform CLI token from credentials.tfrc.json
  reason: Requires read of the actual credentials.tfrc.json token, token validity, and target workspace scope.
    Local file content and token possession are runtime facts.
