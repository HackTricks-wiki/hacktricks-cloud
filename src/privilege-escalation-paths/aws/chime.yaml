# AWS chime privilege escalation techniques.
# Added by the HackTricks privesc completeness audit (rev 6fb9ac51fd).

- id: aws-chime-passrole-mediainsightspipelineconfiguration
  provider: aws
  service: chime
  title: Use a passed media-pipelines role through a media insights pipeline configuration
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-chime-privesc/README.md#chimecreatemediainsightspipelineconfiguration--iampassrole
  source_revision: 6fb9ac51fd
  summary: The source can exercise the media read and sink privileges (Kinesis Video, Lambda, Kinesis Data Streams, S3, SQS, SNS) of a passable role trusting mediapipelines.chime.amazonaws.com by storing it in a media insights pipeline configuration and starting a pipeline.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: chime:CreateMediaInsightsPipeline
        resource: "*"
    any_of:
      - - action: chime:CreateMediaInsightsPipelineConfiguration
          resource: "*"
      - - action: chime:UpdateMediaInsightsPipelineConfiguration
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: mediapipelines.chime.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting mediapipelines.chime.amazonaws.com passable in {account}"
    outcome: impersonation
  conditions:
    - id: bounded_pipeline_elements
      description: The role is used only for the configured source, processors and sinks; no credentials are returned and impact is bounded by the pipeline elements and runtime source/sink validation.
    - id: supported_source
      description: Starting a pipeline needs a supported Kinesis Video source and valid sink resources.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict iam:PassRole on media-pipelines roles with iam:PassedToService=mediapipelines.chime.amazonaws.com and exact role ARNs, and scope those roles to their own streams and sinks.
  references:
    - https://docs.aws.amazon.com/chime-sdk/latest/APIReference/API_media-pipelines-chime_CreateMediaInsightsPipelineConfiguration.html
  notes: Bounded impact - privilege proxy over media and sink resources the role can access, not a role session (DataSync bounded PassRole precedent).
