- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#s3putobject-on-a-configured-bootstrap-or-step-script
  source_revision: 171e422299
  technique: Overwrite an S3 bootstrap action or step script used by EMR
  reason: 'The caller must be able to replace the exact current S3 object referenced by a
    configured EMR bootstrap action or step. That script must still be downloaded and run by
    a later cluster creation or step on an EMR cluster with an identified EC2 instance profile;
    the separate EMR service role is not the target. The current evaluator neither joins the
    object to that consuming bootstrap action or step and instance profile nor proves a later
    execution trigger. A bare s3:PutObject grant cannot establish a principal-to-principal path.'
  prior_id: aws-emr-s3-putobject-bootstrap-or-step-script
