# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS Cognito privilege escalation techniques.
# Source: hacktricks-cloud aws-cognito-privesc/README.md.

- id: aws-cognito-getopenidtokenfordeveloperidentity
  provider: aws
  service: cognito-identity
  title: Obtain a developer identity pool's authenticated role credentials
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identitygetopenidtokenfordeveloperidentity--mint-credentials-for-the-pools-authenticated-role-with-no-account-at-all
  source_revision: fd9bf8863b
  summary: The source can mint a developer-authenticated identity token for an exact pool and exchange it for that pool's authenticated IAM role credentials.
  requires:
    all_of:
      - action: cognito-identity:GetOpenIdTokenForDeveloperIdentity
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      cognito_developer_authenticated_role: true
    scope: same_account
    aggregate_as: "Authenticated roles of developer identity pools reachable in {account}"
    outcome: credentials
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Grant GetOpenIdTokenForDeveloperIdentity only to the backend roles that verify users for each developer identity pool.
  references:
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_GetOpenIdTokenForDeveloperIdentity.html
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_GetCredentialsForIdentity.html
  notes: The selector requires a collected developer provider, the pool's authenticated role, and role trust that admits the pool audience and authenticated Cognito method. Guest and rule-mapped roles are excluded.
