# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS Cognito privilege escalation techniques.
# Source: hacktricks-cloud aws-cognito-privesc/README.md.

- id: aws-cognito-getopenidtokenfordeveloperidentity
  provider: aws
  service: cognito-identity
  title: Obtain a developer identity pool's authenticated role credentials
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identitygetopenidtokenfordeveloperidentity--mint-credentials-for-the-pools-authenticated-role-with-no-account-at-all
  source_revision: ad04436fdb
  summary: The source can mint a developer-authenticated identity token for an exact pool and exchange it for that pool's authenticated IAM role credentials.
  requires:
    all_of:
      - action: cognito-identity:GetOpenIdTokenForDeveloperIdentity
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      cognito_developer_authenticated_role: true
    scope: same_account
    aggregate_as: "Authenticated roles of developer identity pools reachable in {account}"
    outcome: credentials
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Grant GetOpenIdTokenForDeveloperIdentity only to the backend roles that verify users for each developer identity pool.
  references:
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_GetOpenIdTokenForDeveloperIdentity.html
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_GetCredentialsForIdentity.html
  notes: The selector requires a collected developer provider, the pool's authenticated role, and role trust that admits the pool audience and authenticated Cognito method. Guest and rule-mapped roles are excluded.

- id: aws-cognito-getopenidtokenfordeveloperidentity-classic
  provider: aws
  service: cognito-identity
  title: Use a developer identity token with a trusted IAM role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identitygetopenidtokenfordeveloperidentity--mint-credentials-for-the-pools-authenticated-role-with-no-account-at-all
  source_revision: ad04436fdb
  summary: A source that can mint a developer identity token for a pool with Basic authentication enabled can exchange it through STS for an IAM role that trusts that pool and authenticated method.
  requires:
    all_of:
      - action: cognito-identity:GetOpenIdTokenForDeveloperIdentity
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      cognito_developer_classic_role: true
    scope: any
    aggregate_as: "Roles trusting classic developer identity pools reachable in {account}"
    outcome: credentials
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict developer-token issuance to trusted backend identities and keep Basic authentication disabled unless the application needs it.
  references:
    - https://docs.aws.amazon.com/cognito/latest/developerguide/developer-authenticated-identities.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
  notes: The pool must have AllowClassicFlow enabled. The selector verifies token-mint permission on that same pool and the target role's matching Cognito web-identity trust. Cross-account roles require explicit aud and amr trust conditions.

- id: aws-cognito-setidentitypoolroles-developer-token
  provider: aws
  service: cognito-identity
  title: Set an identity pool role and obtain its credentials
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identitysetidentitypoolroles-iampassrole
  source_revision: ad04436fdb
  summary: A source that can set an identity pool's authenticated role, pass the target role and mint a developer token for that same pool can obtain the target role's credentials.
  requires:
    all_of:
      - action: cognito-identity:SetIdentityPoolRoles
        resource: "*"
      - action: iam:PassRole
        resource: "{target.arn}"
        request_context:
          iam:PassedToService: cognito-identity.amazonaws.com
      - action: cognito-identity:GetOpenIdTokenForDeveloperIdentity
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      cognito_developer_settable_authenticated_role: true
    scope: same_account
    aggregate_as: "Roles assignable to developer identity pools in {account}"
    outcome: credentials
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict SetIdentityPoolRoles and iam:PassRole to approved pool roles, and limit developer-token issuance to trusted backend identities.
  references:
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_SetIdentityPoolRoles.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/developer-authenticated-identities.html
  notes: SetIdentityPoolRoles has no resource-level IAM scope. The selector still requires the source to own a collected developer pool, have token-mint permission on that exact pool, and choose a same-account role whose web-identity trust admits its authenticated developer token. Other token sources need separate proof.

- id: aws-cognito-updateidentitypool-enable-classic-developer-token
  provider: aws
  service: cognito-identity
  title: Enable Basic authentication and use a developer token
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identityupdateidentitypool
  source_revision: ad04436fdb
  summary: A source that can enable Basic authentication on a developer identity pool and mint its token can exchange that token through STS for a role that trusts the pool.
  requires:
    all_of:
      - action: cognito-identity:UpdateIdentityPool
        resource: "{target.attached_resource_arn}"
      - action: cognito-identity:GetOpenIdTokenForDeveloperIdentity
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      cognito_developer_enable_classic_role: true
    scope: any
    aggregate_as: "Roles reachable after enabling Basic authentication in {account}"
    outcome: credentials
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict identity-pool updates and developer-token issuance to approved backend roles, and keep Basic authentication disabled where it is unnecessary.
  references:
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_UpdateIdentityPool.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/developer-authenticated-identities.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
  notes: The collected pool must have a developer provider and enough configuration to preserve required UpdateIdentityPool fields. The selector verifies both permissions on the same pool and matching target trust. Cross-account roles need explicit aud and amr trust conditions.

- id: aws-cognito-updateidentitypool-enable-guest-classic-role
  provider: aws
  service: cognito-identity
  title: Enable guest Basic flow and assume a role trusting the pool
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identityupdateidentitypool
  source_revision: c111ee5412
  summary: A source that can update an identity pool can enable guest and Basic authentication, obtain a guest token, and assume an IAM role that trusts the pool's unauthenticated web identity.
  requires:
    all_of:
      - action: cognito-identity:UpdateIdentityPool
        resource: "{target.attached_resource_arn}"
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      cognito_guest_update_classic_role: true
    scope: any
    aggregate_as: "Roles reachable after enabling guest Basic flow in {account}"
    outcome: credentials
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict identity-pool updates to approved administrators, and allow guest Basic flow only where the trusted roles have deliberately limited permissions.
  references:
    - https://docs.aws.amazon.com/cognitoidentity/latest/APIReference/API_UpdateIdentityPool.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/authentication-flow.html
    - https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
  notes: The collected pool needs a usable name, no role mappings and at least one of guest access or Basic flow currently disabled. The source must be able to update that exact pool; no token-mint IAM permission is needed for a guest. The target role must trust the pool audience and unauthenticated method. Cross-account roles require both conditions explicitly.
