# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# Amazon Braket privilege escalation techniques.
# Source: hacktricks-cloud aws-braket-privesc/README.md (rev 171e422299).

- id: aws-braket-passrole-createjob
  provider: aws
  service: braket
  title: Create a Braket hybrid job with a passed role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-braket-privesc/README.md#braketcreatejob--iampassrole
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any passable role trusting braket.amazonaws.com by running job
    code it controls.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
      request_context:
        iam:PassedToService: braket.amazonaws.com
    - action: braket:CreateJob
      resource: '*'
  target:
    kind: aws_role
    selector:
      trust_allows_service: braket.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: Roles trusting braket.amazonaws.com passable in {account}
    outcome: workload_execution
  preconditions:
  - braket_createjob_device_authorized
  conditions:
  - id: controlled_job_code
    description: The job algorithm script or container image must be one the source controls (S3 object or ECR image
      it can write or read).
  - id: passrole_condition_key
    description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Braket job roles with iam:PassedToService and limit braket:CreateJob.
  references:
  - https://docs.aws.amazon.com/braket/latest/APIReference/API_CreateJob.html
  notes: Reach is roles trusting braket.amazonaws.com in PassRole scope.
