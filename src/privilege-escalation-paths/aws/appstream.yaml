- id: aws-appstream-updateapplication-elastic-fleet
  provider: aws
  service: appstream
  title: Change the launch definition of an application used by an Elastic fleet
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamupdateapplication--poison-an-elastic-fleet-application-launch
  source_revision: 6fb9ac51fd
  summary: The source can obtain (when a user next launches the application) the privileges of the IAM role of fleets
    that run an application it can update.
  requires:
    all_of:
    - action: appstream:UpdateApplication
      resource: '{target.consumer_input_arn}'
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      consumer_input_writable_via: appstream:UpdateApplication
    scope: same_account
    aggregate_as: IAM roles of AppStream fleets running updatable applications in {account}
    outcome: workload_execution
  conditions:
  - id: application_launched
    description: A user (or the source, through a streaming URL) must launch the application on a fleet that has
      an IAM role.
  - id: launch_target_controlled
    description: The new launch path or parameters must run content the source controls (for example from an app
      block it can write).
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict appstream:UpdateApplication and app block sources to packaging administrators and attach
    least-privilege roles to Elastic fleets.
  references:
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_UpdateApplication.html
  notes: '{target.consumer_input_arn} is the AppStream application ARN; the application-to-fleet mapping is not
    collected.'


- id: aws-appstream-updatefleet-image-swap
  provider: aws
  service: appstream
  title: Replace an existing AppStream fleet image or session-script archive while retaining its role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamupdatefleet--replace-an-existing-fleet-image-while-retaining-its-role
  source_revision: 6fb9ac51fd
  summary: The source can obtain the IAM role privileges of an existing fleet by supplying a controlled image or
    session-script archive that runs on later fleet instances.
  requires:
    all_of:
    - action: appstream:UpdateFleet
      resource: '{target.resource_arn}'
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      via_resource_type: appstream_fleet
    scope: same_account
    aggregate_as: IAM roles of AppStream fleets in {account}
    outcome: workload_execution
  conditions:
  - id: controlled_image_or_script
    description: The source must provide an image it controls, or an S3 session-script ZIP readable by AppStream
      in the fleet account and Region.
  - id: session_trigger
    description: The fleet must launch an instance or user session so the controlled image or session script runs.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict appstream:UpdateFleet on fleets with IAM roles, validate images and session-script S3 objects,
    and monitor changes to fleet image and session-script settings.
  references:
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_UpdateFleet.html
  notes: The same UpdateFleet permission and fleet-role target cover both image substitution and an Elastic fleet
    session-script location change. The session-script variant is documented at aws-persistence/aws-appstream-persistence/README.md#appstreamupdatefleet--s3--recurring-system-session-scripts-on-an-existing-elastic-fleet.
    A role swap instead requires iam:PassRole.


- id: aws-appstream-passrole-createimagebuilder-createfleet
  provider: aws
  service: appstream
  title: Create an image builder or fleet with a passed role and stream into it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamcreateimagebuilder--createfleet--iampassrole--session-with-the-passed-roles-credentials
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any passable role trusting appstream.amazonaws.com.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
    any_of:
    - - action: appstream:CreateImageBuilder
        resource: '*'
      - action: appstream:CreateImageBuilderStreamingURL
        resource: '*'
    - - action: appstream:CreateFleet
        resource: '*'
      - action: appstream:CreateStack
        resource: '*'
      - action: appstream:AssociateFleet
        resource: '*'
      - action: appstream:CreateStreamingURL
        resource: '*'
    - - action: appstream:CreateAppBlockBuilder
        resource: '*'
      - action: appstream:CreateAppBlockBuilderStreamingURL
        resource: '*'
    - - action: appstream:UpdateFleet
        resource: '*'
      - action: appstream:CreateStreamingURL
        resource: '*'
    - - action: appstream:UpdateAppBlockBuilder
        resource: '*'
      - action: appstream:CreateAppBlockBuilderStreamingURL
        resource: '*'
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: Roles trusting appstream.amazonaws.com passable in {account}
    outcome: workload_execution
  conditions:
  - id: passrole_condition_key
    description: iam:PassedToService conditions may restrict which roles can be passed.
  - id: image_and_network
    description: An available image and VPC subnet/security group the source may use are required; the fleet path
      can reuse an existing stack instead of CreateStack/AssociateFleet.
  - id: update_existing
    description: The UpdateFleet and UpdateAppBlockBuilder alternatives need an existing fleet (associated with
      a stack the source can stream from) or app block builder in scope, and set its role to the passed one.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on AppStream roles with iam:PassedToService and specific role ARNs; limit image
    builder and fleet creation to AppStream administrators.
  references:
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_CreateImageBuilder.html
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_CreateFleet.html
  notes: 'Reach is roles trusting appstream.amazonaws.com in PassRole scope. Alternatives: new image builder, new
    fleet with stack, new app block builder, or an existing fleet / app block builder repointed to the passed role.'
