# Amazon AppStream 2.0 (WorkSpaces Applications) privilege escalation techniques.
# Source: hacktricks-cloud aws-appstream-privesc/README.md (rev 171e422299).
# Existing-resource techniques use via_resource_type appstream_* (roles trusting appstream.amazonaws.com; the
# fleet / image-builder / app-block-builder inventory is not collected, so attachment resolves as unknown).

- id: aws-appstream-createstreamingurl-existing-fleet
  provider: aws
  service: appstream
  title: Open a streaming session on an existing fleet that has an IAM role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamcreatestreamingurl--enter-an-existing-fleet-under-its-machine-role
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the IAM role of existing AppStream fleets associated with a stack
    it can create streaming URLs for.
  requires:
    all_of:
    - action: appstream:CreateStreamingURL
      resource: '*'
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      via_resource_type: appstream_fleet
    scope: same_account
    aggregate_as: IAM roles of AppStream fleets in {account}
    outcome: workload_execution
  conditions:
  - id: stack_fleet_association
    description: The fleet must be running and associated with a stack; CreateStreamingURL authorizes the stack
      ARN (the edge is computed only for grants covering "*").
  - id: session_can_reach_credentials
    description: The streamed application or desktop must let the user run code or reach the instance's role credential
      profile; locked-down application-only stacks with restricted file system and clipboard settings may prevent
      it.
  - id: application_allowed
    description: Fleets using Elastic or application-mode streaming need an application the user is allowed to launch.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict appstream:CreateStreamingURL to the identity broker, attach least-privilege roles to fleets
    and prefer SAML or user-pool access with entitlements over API-minted streaming URLs.
  references:
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_CreateStreamingURL.html
  - https://docs.aws.amazon.com/appstream2/latest/developerguide/using-iam-roles-to-grant-permissions-to-applications-scripts-streaming-instances.html
  notes: Fleet instances expose the fleet IamRoleArn through the appstream_machine_role credential profile. Fleet-to-stack
    association is not collected, so every role trusting appstream.amazonaws.com is reported with unknown attachment.


- id: aws-appstream-createimagebuilderstreamingurl
  provider: aws
  service: appstream
  title: Connect to an existing image builder that has an IAM role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamcreateimagebuilderstreamingurl--administratorroot-access-to-an-existing-builder
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the IAM role of existing AppStream image builders in Resource
    scope (image-builder sessions run with administrator access).
  requires:
    all_of:
    - action: appstream:CreateImageBuilderStreamingURL
      resource: '{target.resource_arn}'
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      via_resource_type: appstream_image_builder
    scope: same_account
    aggregate_as: IAM roles of AppStream image builders in {account}
    outcome: workload_execution
  conditions:
  - id: builder_running
    description: The image builder must be running (or startable by the source with appstream:StartImageBuilder)
      and have an IAM role.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict appstream:CreateImageBuilderStreamingURL to image administrators and do not attach privileged
    roles to image builders.
  references:
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_CreateImageBuilderStreamingURL.html
  notes: Image builder inventory is not collected; attachment resolves as unknown.


