- id: aws-appstream-passrole-updatefleet
  provider: aws
  service: appstream
  title: Set a passable role on a streamable fleet
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamcreateimagebuilder--createfleet--iampassrole--session-with-the-passed-roles-credentials
  source_revision: 6fb9ac51fd
  summary: The source can set a passable role on an existing fleet and stream into that fleet.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
  target:
    kind: aws_role
    selector:
      source_kind: [aws_user, aws_role]
      trust_allows_service: appstream.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: Roles trusting appstream.amazonaws.com passable in {account}
    outcome: workload_execution
  preconditions:
  - appstream_existing_fleet_role_swap
  conditions:
  - id: fleet_readiness
    description: The fleet must be associated with a usable stack and able to run streaming sessions after its role changes.
  - id: streaming_url_scope
    description: CreateStreamingURL permission must cover both the chosen fleet and its associated stack.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole and UpdateFleet on fleets that can run sessions with privileged roles.
  references:
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_UpdateFleet.html
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_ListAssociatedStacks.html
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_CreateStreamingURL.html

