- id: aws-appstream-updateapplication-elastic-fleet
  provider: aws
  service: appstream
  title: Change the launch definition of an application used by an Elastic fleet
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamupdateapplication--poison-an-elastic-fleet-application-launch
  source_revision: 171e422299
  summary: The source can obtain (when a user next launches the application) the privileges of the IAM role of fleets that run an application it can update.
  requires:
    all_of:
      - action: appstream:UpdateApplication
        resource: "{target.consumer_input_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      consumer_input_writable_via: appstream:UpdateApplication
    scope: same_account
    aggregate_as: "IAM roles of AppStream fleets running updatable applications in {account}"
  conditions:
    - id: application_launched
      description: A user (or the source, through a streaming URL) must launch the application on a fleet that has an IAM role.
    - id: launch_target_controlled
      description: The new launch path or parameters must run content the source controls (for example from an app block it can write).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict appstream:UpdateApplication and app block sources to packaging administrators and attach least-privilege roles to Elastic fleets.
  references:
    - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_UpdateApplication.html
  notes: "{target.consumer_input_arn} is the AppStream application ARN; the application-to-fleet mapping is not collected."

- id: aws-appstream-updatefleet-image-swap
  provider: aws
  service: appstream
  title: Replace the image of an existing fleet that keeps its IAM role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamupdatefleet--replace-an-existing-fleet-image-while-retaining-its-role
  source_revision: 171e422299
  summary: The source can obtain the privileges of the IAM role of existing fleets in Resource scope by pointing them at an image it controls.
  requires:
    all_of:
      - action: appstream:UpdateFleet
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      via_resource_type: appstream_fleet
    scope: same_account
    aggregate_as: "IAM roles of AppStream fleets in {account}"
  conditions:
    - id: controlled_image
      description: The source needs an image it controls (built through an image builder or shared to the account).
    - id: code_runs_on_instance
      description: The image must run the source's code on fleet instances (startup scripts, session scripts or a streaming session).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict appstream:UpdateFleet to fleet administrators, restrict image sharing into the account and monitor image changes on fleets with roles.
  references:
    - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_UpdateFleet.html
  notes: Changing IamRoleArn in the same call would also need iam:PassRole (covered by the PassRole entry).

- id: aws-appstream-passrole-createimagebuilder-createfleet
  provider: aws
  service: appstream
  title: Create an image builder or fleet with a passed role and stream into it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md#appstreamcreateimagebuilder--createfleet--iampassrole--session-with-the-passed-roles-credentials
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting appstream.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
    any_of:
      - - action: appstream:CreateImageBuilder
          resource: "*"
        - action: appstream:CreateImageBuilderStreamingURL
          resource: "*"
      - - action: appstream:CreateFleet
          resource: "*"
        - action: appstream:CreateStack
          resource: "*"
        - action: appstream:AssociateFleet
          resource: "*"
        - action: appstream:CreateStreamingURL
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: appstream.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting appstream.amazonaws.com passable in {account}"
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
    - id: image_and_network
      description: An available image and VPC subnet/security group the source may use are required; the fleet path can reuse an existing stack instead of CreateStack/AssociateFleet.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on AppStream roles with iam:PassedToService and specific role ARNs; limit image builder and fleet creation to AppStream administrators.
  references:
    - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_CreateImageBuilder.html
    - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_CreateFleet.html
  notes: Reach is roles trusting appstream.amazonaws.com in PassRole scope.
