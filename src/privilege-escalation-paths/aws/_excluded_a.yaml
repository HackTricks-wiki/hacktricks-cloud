# AWS part A: HackTricks privesc sections intentionally NOT modelled as privesc edges.
# Each item: {source, technique, reason}. Revision a53b46392c.

# --- IAM ---
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateaccesskey
  technique: iam:UpdateAccessKey
  reason: Only re-activates an existing key; using it requires already knowing the target's secret access key, so the
    permission alone does not yield a new identity.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamresyncmfadevice
  technique: iam:ResyncMFADevice
  reason: Requires possession of the target's MFA device and password; no new identity from the permission alone.
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateopenidconnectproviderthumbprint-iamlistopenidconnectproviders-iamgetopenidconnectprovider
  technique: iam:UpdateOpenIDConnectProviderThumbprint
  reason: AWS validates tokens of most major IdPs against its own trusted CA library and ignores thumbprints;
    exploitation also requires man-in-the-middle of the IdP JWKS endpoint. Not reliably derivable from a snapshot.
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iampassrole--a-compute-service
  technique: iam:PassRole + a compute service (generic)
  reason: Generic overview; each service-specific PassRole technique is modelled per service with the correct trusted
    service principal.

# --- STS / federation ---
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#stsassumerolewithsaml
  technique: sts:AssumeRoleWithSAML
  reason: Requires a valid SAML assertion from the trusted IdP (possession of IdP credentials); no IAM permission grants
    it. Provider takeover is modelled as aws-iam-updatesamlprovider.
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#stsassumerolewithwebidentity
  technique: sts:AssumeRoleWithWebIdentity
  reason: Requires a token from the trusted OIDC IdP (external identity possession); trust-policy misconfigurations on
    OIDC providers are an Exposure finding, not a principal-to-principal edge.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#stsgetfederationtoken
  technique: sts:GetFederationToken
  reason: Federation tokens are the intersection of the caller's own permissions and the session policy; never more
    privileged than the source. Persistence only.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#federation-abuse
  technique: Federation abuse (generic)
  reason: Overview pointing to federation pages; requires external IdP control.
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#iam-roles-anywhere-privesc
  technique: IAM Roles Anywhere misconfigured trust policy
  reason: Requires possession of a certificate issued by a trusted CA (external credential); the overly broad trust is
    an Exposure finding. CA replacement is modelled as aws-rolesanywhere-updatetrustanchor.

# --- SSO ---
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sso-and-identitystore-privesc/README.md#ssogetrolecredentials
  technique: sso:GetRoleCredentials
  reason: Requires an Identity Center access token of a user already assigned the permission set; no new identity beyond
    what the user already has.

