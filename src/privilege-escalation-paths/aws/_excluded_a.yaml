- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadmininitiateauth-cognito-idpadminrespondtoauthchallenge
  technique: cognito-idp:AdminInitiateAuth + AdminRespondToAuthChallenge
  reason: Requires the user's password/secret (or a custom-auth flow weakness specific to the app); not derivable from
    permissions alone.
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadduserpoolclientsecret--inject-an-m2m-application-credential
  technique: cognito-idp:AddUserPoolClientSecret
  reason: Client-credentials (M2M) tokens grant OAuth scopes to resource servers, not identity-pool AWS roles (identity
    pools accept user tokens). Application-level impact only.
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpcreateuserpoolclient--cognito-idpupdateuserpoolclient
  technique: cognito-idp:CreateUserPoolClient / UpdateUserPoolClient
  reason: Relaxes client settings (flows, scopes); still needs user credentials to obtain tokens. Application-level.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-sync-analysis
  technique: Cognito Sync analysis
  reason: Data access / tooling notes, no identity gain.

