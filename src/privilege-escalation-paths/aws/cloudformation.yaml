# AWS CloudFormation privilege escalation techniques.
# Source: hacktricks-cloud aws-cloudformation-privesc/ (README.md and sub-page).

- id: aws-cloudformation-passrole-createstack
  provider: aws
  service: cloudformation
  title: Create a stack with a passed CloudFormation service role
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#iampassrole-cloudformationcreatestack
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting cloudformation.amazonaws.com by deploying a
    template it controls with that service role.
  requires:
    all_of:
    - action: iam:PassRole
      resource: "{target.arn}"
    - action: cloudformation:CreateStack
      resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: cloudformation.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting cloudformation.amazonaws.com in {account}"
  conditions:
  - id: passrole_condition_key
    description: iam:PassedToService / cloudformation:RoleArn conditions may restrict this.
  - id: template_location
    description: The template must be supplied from S3 (HTTPS URL) or inline; an S3 location readable by CloudFormation
      is needed.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on CloudFormation service roles and use the cloudformation:RoleArn condition key.
  references:
  - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-iam-servicerole.html
  notes: The sub-page iam-passrole-cloudformation-createstack-and-cloudformation-describestacks.md describes the same
    edge (DescribeStacks only helps read outputs). Severity critical because CloudFormation service roles are frequently
    admin-equivalent.

- id: aws-cloudformation-passrole-updatestack
  provider: aws
  service: cloudformation
  title: Update a stack with a passed CloudFormation service role
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#iampassrole-cloudformationupdatestack-and-where-needed-cloudformationsetstackpolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting cloudformation.amazonaws.com by updating an
    existing stack with a template it controls and that role.
  requires:
    all_of:
    - action: iam:PassRole
      resource: "{target.arn}"
    - action: cloudformation:UpdateStack
      resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: cloudformation.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting cloudformation.amazonaws.com in {account}"
  conditions:
  - id: stack_policy
    description: A stack policy denying updates may require cloudformation:SetStackPolicy (or a temporary override
      policy on the update).
  - id: passrole_condition_key
    description: iam:PassedToService / cloudformation:RoleArn conditions may restrict this.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on CloudFormation service roles and use the cloudformation:RoleArn condition key.
  references: []
  notes: Needs at least one existing stack covered by cloudformation:UpdateStack.

- id: aws-cloudformation-updatestack-attached-role
  provider: aws
  service: cloudformation
  title: Update a stack that already has a service role
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#cloudformationupdatestack-and-where-needed-cloudformationsetstackpolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of the service role stored on an existing stack by updating that stack
    with a template it controls.
  requires:
    all_of:
    - action: cloudformation:UpdateStack
      resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: cloudformation
      attached_resource_covered_by: cloudformation:UpdateStack
    scope: same_account
    aggregate_as: "Service roles of stacks covered by cloudformation:UpdateStack in {account}"
  conditions:
  - id: stack_policy
    description: A stack policy denying updates may require cloudformation:SetStackPolicy.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict cloudformation:UpdateStack to deployment pipelines; use stack policies and cloudformation:RoleArn
    conditions.
  references: []
  notes: Stacks without a stored service role run with the caller's own permissions and are not targets.

- id: aws-cloudformation-passrole-changeset
  provider: aws
  service: cloudformation
  title: Create and execute a change set with a passed service role
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#iampassrole-cloudformationcreatechangeset-cloudformationexecutechangeset-and-where-needed-cloudformationsetstackpolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting cloudformation.amazonaws.com by creating and
    executing a change set with that role.
  requires:
    all_of:
    - action: iam:PassRole
      resource: "{target.arn}"
    - action: cloudformation:CreateChangeSet
      resource: "*"
    - action: cloudformation:ExecuteChangeSet
      resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: cloudformation.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting cloudformation.amazonaws.com in {account}"
  conditions:
  - id: stack_policy
    description: Updating an existing stack with a deny stack policy may require cloudformation:SetStackPolicy.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on CloudFormation service roles and use the cloudformation:RoleArn condition key.
  references: []
  notes: A CREATE-type change set can create a new stack, so no existing stack is required.

- id: aws-cloudformation-changeset-attached-role
