- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identitysetidentitypoolroles-iampassrole
  source_revision: 171e422299
  technique: Set the roles of an identity pool the source can obtain credentials from
  reason: SetIdentityPoolRoles and PassRole do not prove the source can obtain any
    identity-pool login/token; role aud/amr and chosen pool are not joined.
  prior_id: aws-cognito-setidentitypoolroles-passrole
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identityupdateidentitypool
  source_revision: 171e422299
  technique: Add a provider the source controls to an identity pool
  reason: The action may enable unauthenticated identities, but the target set includes
    authenticated and rule-mapped roles without a verified source token or role slot.
  prior_id: aws-cognito-updateidentitypool
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadminaddusertogroup
  source_revision: 171e422299
  technique: Add a user-pool user the source controls to a group with an IAM role
  reason: No source-controlled user credential or token-based group role mapping is
    proved; group administration alone gives the source no role.
  prior_id: aws-cognito-adminaddusertogroup
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpcreategroup--cognito-idpupdategroup-iampassrole
  source_revision: 171e422299
  technique: Create or update a user-pool group with a passed role
  reason: Creating/updating a group does not prove the source controls a member or
    that this user pool/pool role mapping issues the passed role.
  prior_id: aws-cognito-creategroup-passrole
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadminconfirmsignup
  source_revision: 171e422299
  technique: Confirm a self-registered user-pool user
  reason: Self-signup and ownership of the confirmed user are unverified; the target
    selector includes rule-mapped roles without token claims.
  prior_id: aws-cognito-adminconfirmsignup
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadmincreateuser
  source_revision: 171e422299
  technique: Create a user in a user pool
  reason: The source may create a user, but the selector includes rule-mapped roles
    without verified app-client sign-in, token claims or the exact role slot.
  prior_id: aws-cognito-admincreateuser
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadminsetuserpassword
  source_revision: 171e422299
  technique: Set the password of an existing user-pool user
  reason: Usable sign-in of a particular user (including MFA) and that user’s exact
    mapped IAM role are unverified; the selector includes every rule role.
  prior_id: aws-cognito-adminsetuserpassword
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpcreateuserimportjob--cognito-idpstartuserimportjob
  source_revision: 171e422299
  technique: Import users with known passwords via a user import job
  reason: Imported users enter RESET_REQUIRED and no usable reset/token is proved;
    the selector includes unrelated rule-mapped roles.
  prior_id: aws-cognito-userimportjob-passrole
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpcreateidentityprovider--cognito-idpupdateidentityprovider
  source_revision: 171e422299
  technique: Add or change a federated identity provider of a user pool
  reason: The app client accepting the new provider, controlled IdP login, and exact
    token-to-role mapping are not proved.
  prior_id: aws-cognito-create-update-identityprovider
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identitygetopenidtokenfordeveloperidentity--mint-credentials-for-the-pools-authenticated-role-with-no-account-at-all
  source_revision: 171e422299
  technique: Mint a developer-authenticated identity token for an identity pool
  reason: The target set includes the unauthenticated role and other mapped roles
    even though the API yields a developer-authenticated token; exact slot missing.
  prior_id: aws-cognito-getopenidtokenfordeveloperidentity
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identitysetprincipaltagattributemap--forge-the-session-tags-that-iam-conditions-trust
  source_revision: 171e422299
  technique: Remap identity-pool principal tags to attributes the source controls
  reason: No source-controlled token claim or ABAC permission differential is proved;
    targeting the whole role overclaims tag-conditioned authority.
  prior_id: aws-cognito-setprincipaltagattributemap
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadminlinkproviderforuser--graft-an-attacker-identity-onto-an-existing-privileged-user
  source_revision: 171e422299
  technique: Link a federated identity the source controls to an existing user-pool
    user
  reason: The source-controlled federated subject, app-client acceptance and resulting
    victim token/role mapping are unverified.
  prior_id: aws-cognito-adminlinkproviderforuser
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-idpadminupdateuserattributes
  source_revision: 6fb9ac51fd
  technique: Change a user-pool user's attributes to match an identity-pool role-mapping
    rule
  reason: No controlled user sign-in or exact attribute-rule match is proved; the
    target set includes roles unrelated to the edited user.
  prior_id: aws-cognito-adminupdateuserattributes-rule-mapping
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#cognito-identityupdateidentitypool
  source_revision: 6fb9ac51fd
  technique: Enable the basic (classic) authentication flow on an identity pool
  reason: Enabling classic flow does not prove a source-usable identity token or exact
    authenticated/unauthenticated role slot.
  prior_id: aws-cognito-updateidentitypool-classic-flow
