- source: src/pentesting-cloud/aws-security/aws-persistence/aws-elastic-beanstalk-persistence/README.md#backdoor-an-instance
  technique: Steal instance-profile credentials after host compromise
  reason: The instance-profile credentials are reachable only after host compromise and successful IMDS access. A configuration snapshot does not establish that host foothold, IMDS reachability or the attacker’s control of a process on the instance.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-elastic-beanstalk-persistence/README.md#backdoor-in-version
  technique: Alter S3 source bundle before later deployment
  reason: S3 bundle write alone reaches the instance-profile role only if an independent deployment later selects that exact version and executes the tampered code. The future deployment and bundle contents are runtime/content facts unavailable from a configuration snapshot.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-eventbridge-persistence/README.md#archive-as-a-passive-event-recorder
  technique: Create archive retaining bus events for later disclosure
  reason: CreateArchive only stores bus events. Gaining a target role would require later StartReplay access plus a rule/target whose handling of replayed event content executes attacker-controlled code or reveals credentials; these runtime automation and event-content facts are not established by the snapshot or this section.
  source_revision: 0b36331
