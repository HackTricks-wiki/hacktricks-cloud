# AWS Organizations privilege escalation techniques.
# Source: hacktricks-cloud aws-organizations-prinvesc/README.md.

- id: aws-organizations-management-to-member-accounts
  provider: aws
  service: organizations
  title: Assume the organization access role in member accounts from the management account
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-organizations-prinvesc/README.md#from-management-account-to-children-accounts
  source_revision: 171e422299
  summary: A management-account principal can obtain the privileges of the cross-account admin role (OrganizationAccountAccessRole by default) in member accounts that trust the management account.
  requires:
    all_of:
      - action: sts:AssumeRole
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_principal_of_source: true
    scope: org
    aggregate_as: "Organization access roles in member accounts"
  conditions:
    - id: role_exists
      description: OrganizationAccountAccessRole is created automatically only for accounts created through Organizations; invited accounts have it only if added manually.
    - id: source_in_management_account
      description: The source must live in the management account that the member-account role trusts.
  preconditions:
    - target_in_other_account
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Keep the management account free of workloads, limit who can assume roles from it, and replace the default role with narrowly trusted roles.
  references:
    - https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_accounts_access-cross-account-role.html
  notes: SCPs never apply to the management account but do apply to the assumed role in member accounts. Overlaps with aws-sts-assumerole-trusted; kept so the org edge is labelled distinctly.

- id: aws-organizations-registerdelegatedadministrator
  provider: aws
  service: organizations
  title: Register an account the source controls as delegated administrator of an org-wide service
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-organizations-prinvesc/README.md#organizationsregisterdelegatedadministrator--hand-a-services-org-wide-control-to-an-account-you-own
  source_revision: 171e422299
  summary: A management-account principal can make a member account it controls the delegated administrator of a service (CloudFormation StackSets, IAM root access, IAM Identity Center, ...) and then administer the other member accounts through that service.
  requires:
    all_of:
      - action: organizations:RegisterDelegatedAdministrator
        resource: "arn:aws:organizations::*:account/*"
      - action: organizations:EnableAWSServiceAccess
        resource: "*"
  target:
    kind: aws_account_admin
    selector:
      any_principal_in_scope: true
      org_member_account: true
    scope: org
    aggregate_as: "Member accounts administrable through a delegated-administrator service"
  conditions:
    - id: source_in_management_account
      description: Only the management account can register delegated administrators.
    - id: source_controls_delegate_account
      description: The source must already control a principal in the member account it registers.
    - id: service_reaches_accounts
      description: The delegated service must grant control over member accounts (service-managed StackSets execution roles, sts:AssumeRoot, Identity Center assignments); delegated administrators can never target the management account.
    - id: trusted_access_enabled
      description: Trusted access for the service must be enabled (organizations:EnableAWSServiceAccess or the service's own enablement call).
  preconditions:
    - target_in_other_account
    - source_in_org_management_account
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Limit organizations:RegisterDelegatedAdministrator and EnableAWSServiceAccess to break-glass roles and alert on delegated-administrator changes.
  references:
    - https://docs.aws.amazon.com/organizations/latest/APIReference/API_RegisterDelegatedAdministrator.html
    - https://docs.aws.amazon.com/organizations/latest/userguide/orgs_integrate_services_list.html
    - https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-delegated-admin.html
  notes: The management account usually already holds equivalent power through OrganizationAccountAccessRole; this edge matters when that role is absent or restricted and labels the delegation path.

- id: aws-organizations-createaccount-principalorgid-trust
  provider: aws
  service: organizations
  title: Create a member account to satisfy role trusts keyed on aws:PrincipalOrgID
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-organizations-prinvesc/README.md#organizationscreateaccount--spawn-an-account-you-fully-own-inside-the-victim-org
  source_revision: 171e422299
  summary: A management-account principal can create a new member account, which it fully controls through OrganizationAccountAccessRole, and from it assume roles whose trust allows any principal of the organization (Principal "*" with aws:PrincipalOrgID / aws:PrincipalOrgPaths).
  requires:
    all_of:
      - action: organizations:CreateAccount
        resource: "*"
      - action: sts:AssumeRole
        resource: "arn:aws:iam::*:role/*"
  target:
    kind: aws_role
    selector:
      trust_allows_principal_org: true
    scope: any
    aggregate_as: "Roles trusting any principal of the organization"
  conditions:
    - id: org_paths_root
      description: CreateAccount places the new account in the organization root; trusts restricted with aws:PrincipalOrgPaths to a specific OU additionally need organizations:MoveAccount.
    - id: target_trust_other_conditions
      description: Additional trust conditions (source IP, VPC, tags) must be satisfiable from the new account.
    - id: account_quota
      description: The organization must have account quota left and CreateAccount is asynchronous and visible in CloudTrail.
    - id: access_role_name
      description: The admin role created in the new account is OrganizationAccountAccessRole by default but its name is chosen by the caller, so sts:AssumeRole must cover the chosen role name.
  preconditions:
    - source_in_org_management_account
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict organizations:CreateAccount to break-glass roles, avoid Principal "*" trusts that rely only on aws:PrincipalOrgID, and pin trusted accounts or role paths instead.
  references:
    - https://docs.aws.amazon.com/organizations/latest/APIReference/API_CreateAccount.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html#condition-keys-principalorgid
  notes: The trust is evaluated with aws:PrincipalOrgID set to the collected organization id and aws:PrincipalOrgPaths to the root path; without the organization inventory the targets are unresolved placeholders.
