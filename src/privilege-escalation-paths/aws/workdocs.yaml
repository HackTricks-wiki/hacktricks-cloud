- id: aws-audit-promote-controlled-workdocs-user-to-administrator
  provider: aws
  service: workdocs
  title: Promote controlled WorkDocs user to administrator
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-workdocs-privesc/README.md#workdocsupdateuser
  source_revision: 0b36331
  summary: The source can gain WorkDocs administrator control panel only when the exact target and prerequisites
    are verified.
  requires:
    all_of:
    - action: workdocs:UpdateUser
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-audit-promote-controlled-workdocs-user-to-administrator
    scope: same_account
    aggregate_as: Verified Gain WorkDocs administrator control panel in {account}
    grants:
    - Gain WorkDocs administrator control panel
    outcome: application_admin
  conditions:
  - id: exact_verified_prerequisites
    description: 'Evidence must bind the source, exact target, and these prerequisites: Existing active user controlled
      by source; UpdateUser sets Type=ADMIN on that user; site supports WorkDocs admin.'
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions to approved operators and review the exact target configuration.
  notes: Evidence must bind actor, exact resource, target and all prerequisites; absent evidence is UNKNOWN, with
    no definite privilege edge.
  references:
  - https://cloud.hacktricks.wiki/pentesting-cloud/aws-security/aws-privilege-escalation/aws-workdocs-privesc/
