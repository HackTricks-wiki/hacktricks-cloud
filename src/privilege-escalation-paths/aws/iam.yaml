- id: aws-iam-modify-assumable-role-policy
  provider: aws
  service: iam
  title: Grant permissions to a role the source can already assume
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 171e422299
  summary: The source can obtain administrator privileges through a role it can assume and whose policies it can change.
  requires:
    any_of:
    - - action: iam:AttachRolePolicy
        resource: "{source.assumable_role_arn}"
    - - action: iam:PutRolePolicy
        resource: "{source.assumable_role_arn}"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_covered_by: iam:AttachRolePolicy
    scope: same_account
    aggregate_as: "Administrator of {account} (via an assumable role)"
  conditions:
  - id: same_assumable_role
    description: The role whose policies the source can change must be one it can assume; {source.assumable_role_arn}
      already restricts the requirement to such roles.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Separate who can edit a role's permissions from who can assume it; apply permissions boundaries on
    delegated role administration.
  references: []
  notes: "{source.assumable_role_arn} is a role the source can already assume (the trust admits it, and its identity policy
    allows sts:AssumeRole on the role unless the trust names its ARN in the same account), so no separate sts:AssumeRole requirement
    is listed. via_assumable_role_covered_by applies to whichever any_of action matched (AttachRolePolicy or PutRolePolicy)."

- id: aws-iam-createrole-attach-assume
  provider: aws
  service: iam
  title: Create a new role trusting the source, grant it admin, and assume it
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 171e422299
  summary: The source can obtain administrator privileges through a new role it creates, grants permissions to and
    assumes.
  requires:
    all_of:
    - action: iam:CreateRole
      resource: "*"
    any_of:
    - - action: iam:AttachRolePolicy
        resource: "*"
    - - action: iam:PutRolePolicy
        resource: "*"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
    scope: same_account
    aggregate_as: "Administrator of {account} (via a newly created role)"
  conditions:
  - id: permissions_boundary_condition
    description: An iam:PermissionsBoundary condition on CreateRole forces new roles to carry a boundary and removes the
      escalation.
  - id: resource_path_restriction
    description: If CreateRole/AttachRolePolicy/PutRolePolicy are restricted to a role path or name pattern, the actions
      must all cover the same role ARN.
  - id: same_account_trust_no_assumerole_needed
    description: The source writes the new role's trust policy naming its own ARN; in the same account that trust alone
      authorizes sts:AssumeRole, so no identity grant is required (an explicit identity-policy or SCP deny on
      sts:AssumeRole still blocks it).
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Require iam:PermissionsBoundary on iam:CreateRole for delegated administrators and restrict role
    attach/put to boundary-carrying roles.
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: "Resource \"*\" means the actions must cover a common (newly creatable) role ARN; the evaluator should intersect
    their Resources."

- id: aws-iam-addusertogroup
  provider: aws
  service: iam
  title: Add the source user to an IAM group
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamaddusertogroup
  source_revision: 171e422299
  summary: The source IAM user can obtain the privileges of IAM groups it can add itself to.
  requires:
    all_of:
    - action: iam:AddUserToGroup
      resource: "{target.arn}"
  target:
    kind: aws_group
    selector:
      resource_permission_covers_target: iam:AddUserToGroup
      source_kind: aws_user
    scope: same_account
    aggregate_as: "IAM groups covered by iam:AddUserToGroup in {account}"
  conditions: []
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:AddUserToGroup to administrators or to specific low-privilege groups.
  references: []
  notes: The Resource of iam:AddUserToGroup is the group ARN. Only IAM users can be group members; role sources cannot
    use this (they could add some other user they control, covered by user-credential techniques).

- id: aws-iam-updateassumerolepolicy
  provider: aws
  service: iam
  title: Rewrite a role's trust policy to allow the source
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateassumerolepolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust policy it can rewrite.
  requires:
    all_of:
    - action: iam:UpdateAssumeRolePolicy
      resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      resource_permission_covers_target: iam:UpdateAssumeRolePolicy
    scope: same_account
    aggregate_as: "IAM roles covered by iam:UpdateAssumeRolePolicy in {account}"
  conditions:
  - id: assumerole_grant
    description: If the rewritten trust names the source principal ARN (same account) no identity-policy sts:AssumeRole
      is needed; if it names only the account root, sts:AssumeRole on the role is also required.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateAssumeRolePolicy to administrators; monitor trust-policy changes.
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
  notes: Service-linked roles cannot have their trust policy edited and must be excluded from the target set.

- id: aws-iam-updatesamlprovider
  provider: aws
  service: iam
  title: Replace the metadata of a SAML provider trusted by roles
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdatesamlprovider-iamlistsamlproviders-iamgetsamlprovider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting a SAML provider whose metadata it can replace.
  requires:
    all_of:
    - action: iam:UpdateSAMLProvider
      resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_saml_provider_covered_by: iam:UpdateSAMLProvider
    scope: same_account
    aggregate_as: "Roles trusting a SAML provider covered by iam:UpdateSAMLProvider in {account}"
  conditions:
  - id: trust_conditions_on_saml_attributes
    description: Trust conditions on SAML attributes (e.g. saml:aud, saml:sub) must be satisfiable; a forged assertion
      normally can satisfy them.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateSAMLProvider/CreateSAMLProvider to administrators; alert on SAML provider changes.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateSAMLProvider.html
  notes: "Requires a new placeholder {target.saml_provider_arn}: the SAML provider ARN named in the target role's trust policy.
    sts:AssumeRoleWithSAML needs no identity permissions."

- id: aws-iam-putuserpermissionsboundary-self
  provider: aws
  service: iam
  title: Replace or remove the permissions boundary of the source user
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputuserpermissionsboundary
  source_revision: 171e422299
  summary: The source IAM user can obtain the full privileges of its identity policies by replacing or removing its own
    permissions boundary.
  requires:
    all_of: []
    any_of:
    - - action: iam:PutUserPermissionsBoundary
        resource: "{source.arn}"
    - - action: iam:DeleteUserPermissionsBoundary
        resource: "{source.arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
  - id: unbounded_identity_policy_is_admin
    description: Only an escalation if the source currently has a boundary and its identity policies are broader than
      the boundary; reaching admin requires the identity policies to be admin-equivalent.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Explicitly deny iam:Put/DeleteUserPermissionsBoundary on self inside every permissions boundary.
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: DeleteUserPermissionsBoundary is added as an equivalent alternative (official API); HackTricks documents the
    Put variant.

- id: aws-iam-putrolepermissionsboundary-self
  provider: aws
  service: iam
  title: Replace or remove the permissions boundary of the source role
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 171e422299
  summary: The source role can obtain the full privileges of its identity policies by replacing or removing its own
    permissions boundary.
  requires:
    all_of: []
    any_of:
    - - action: iam:PutRolePermissionsBoundary
        resource: "{source.arn}"
    - - action: iam:DeleteRolePermissionsBoundary
        resource: "{source.arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_role
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
  - id: unbounded_identity_policy_is_admin
    description: Only an escalation if the source currently has a boundary and its identity policies are broader than
      the boundary; reaching admin requires the identity policies to be admin-equivalent.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Explicitly deny iam:Put/DeleteRolePermissionsBoundary on self inside every permissions boundary.
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: Changing a boundary of another role the source can assume is the same edge via an assumable role; not modelled
    separately.

- id: aws-iam-recreate-samlprovider
  provider: aws
  service: iam
  title: Replace a trusted SAML provider with an attacker-controlled one of the same name
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting a SAML provider by deleting it and registering a
    provider with the same name and its own signing metadata.
  requires:
    all_of:
    - action: iam:DeleteSAMLProvider
      resource: "{target.saml_provider_arn}"
    - action: iam:CreateSAMLProvider
      resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_saml_provider_covered_by: iam:DeleteSAMLProvider
    scope: same_account
    aggregate_as: "Roles trusting a SAML provider the source can recreate in {account}"
  conditions:
  - id: trust_conditions_on_saml_attributes
    description: Trust conditions on SAML attributes (saml:aud, saml:sub, saml:iss) must be satisfiable by an assertion
      the source signs; normally they are.
  - id: disruption
    description: Deleting the provider breaks legitimate federation until it is recreated, which is noisy.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:CreateSAMLProvider / DeleteSAMLProvider / UpdateSAMLProvider to administrators and alert on
    identity-provider changes.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateSAMLProvider.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_saml.html
  notes: Registering a brand-new provider only escalates combined with a role that trusts it, which iam:CreateRole /
    iam:UpdateAssumeRolePolicy already grant directly (aws-iam-createrole-attach-assume,
    aws-iam-updateassumerolepolicy). The OIDC audience variant is aws-iam-oidcprovider-add-client-id and planting a
    provider that a trust names but that no longer exists is aws-iam-createsamlprovider-orphaned-trust /
    aws-iam-createoidcprovider-orphaned-trust.

- id: aws-iam-oidcprovider-add-client-id
  provider: aws
  service: iam
  title: Register an attacker-chosen audience on an OIDC provider that roles trust
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamaddclientidtoopenidconnectprovider--widen-an-existing-federation-trust
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting an IAM OIDC provider by registering an audience it can
    mint tokens for (AddClientIDToOpenIDConnectProvider, or deleting and recreating the provider with its own client-ID
    list), when the role's sub/other claim conditions are satisfiable by tokens of that issuer.
  requires:
    any_of:
    - - action: iam:AddClientIDToOpenIDConnectProvider
        resource: "{target.oidc_provider_arn}"
    - - action: iam:DeleteOpenIDConnectProvider
        resource: "{target.oidc_provider_arn}"
      - action: iam:CreateOpenIDConnectProvider
        resource: "{target.oidc_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_oidc_provider_covered_by: iam:AddClientIDToOpenIDConnectProvider
    scope: same_account
    aggregate_as: "Roles trusting an OIDC provider whose audiences the source can change in {account}"
  conditions:
  - id: issuer_tokens_obtainable
    description: The source must obtain tokens signed by the provider's issuer (the provider URL and its JWKS cannot be
      changed without changing the provider ARN), for example from a public CI issuer such as GitHub Actions or from a
      workload of an EKS cluster.
  - id: trust_claim_conditions
    description: Trust conditions on sub, repository, namespace or other claims must be satisfiable by those tokens; a
      trust pinning only the audience is satisfiable after the audience is registered.
  - id: disruption
    description: Deleting and recreating the provider breaks federation until it is recreated;
      AddClientIDToOpenIDConnectProvider is additive and silent.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:AddClientIDToOpenIDConnectProvider / CreateOpenIDConnectProvider /
    DeleteOpenIDConnectProvider to administrators, pin sub (and repository / namespace) claims in every OIDC trust, and
    alert on provider changes.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_AddClientIDToOpenIDConnectProvider.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
  notes: The trust policy's own <provider>:aud condition still has to accept the new audience (or be absent). The
    role-to-provider join is the Federated oidc-provider ARN of the role's trust policy ({target.oidc_provider_arn}).

- id: aws-iam-createsamlprovider-orphaned-trust
  provider: aws
  service: iam
  title: Register a SAML provider that a role trusts but that no longer exists
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust names a SAML provider ARN of the account that does
    not exist, by creating that provider with its own signing metadata.
  requires:
    all_of:
    - action: iam:CreateSAMLProvider
      resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_federated_provider_missing: saml
    scope: same_account
    aggregate_as: "Roles trusting a missing SAML provider in {account}"
  conditions:
  - id: trust_conditions_on_saml_attributes
    description: Trust conditions on SAML attributes (saml:aud, saml:sub, saml:iss) must be satisfiable by an assertion
      the source signs; normally they are.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Remove trust statements naming deleted identity providers and restrict iam:CreateSAMLProvider to
    administrators.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateSAMLProvider.html
  notes: Needs the account's SAML provider inventory (iam:ListSAMLProviders); without it the targets are unresolved
    placeholders.

- id: aws-iam-createoidcprovider-orphaned-trust
  provider: aws
  service: iam
  title: Register an OIDC provider that a role trusts but that no longer exists
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust names an OIDC provider ARN of the account that does
    not exist, by creating that provider (for the issuer URL in the ARN) with an audience it can obtain tokens for.
  requires:
    all_of:
    - action: iam:CreateOpenIDConnectProvider
      resource: "{target.oidc_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_federated_provider_missing: oidc
    scope: same_account
    aggregate_as: "Roles trusting a missing OIDC provider in {account}"
  conditions:
  - id: issuer_tokens_obtainable
    description: The provider ARN fixes the issuer URL, so the source must obtain tokens of that issuer (public CI
      issuers such as GitHub Actions issue tokens to anyone's workflows) whose claims satisfy the trust conditions.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Remove trust statements naming deleted identity providers, pin sub claims, and restrict
    iam:CreateOpenIDConnectProvider to administrators.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateOpenIDConnectProvider.html
  notes: Needs the account's OIDC provider inventory (iam:ListOpenIDConnectProviders); without it the targets are
    unresolved placeholders.

- id: aws-iam-enable-attacker-mfa-device-other-user
  provider: aws
  service: iam
  title: Enrol an attacker-controlled virtual MFA device on another user and mint its credentials
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreatevirtualmfadevice-iamenablemfadevice-and-the-target-users-access-keys
  source_revision: 6fb9ac51fd
  summary: The source can obtain MFA-authenticated sessions of IAM users on which it can enable a virtual MFA device it
    created and create access keys or a console password, including users whose permissions are gated on MFA or whose
    console sign-in is protected by MFA.
  requires:
    all_of:
    - action: iam:CreateVirtualMFADevice
      resource: "arn:aws:iam::{target.account}:mfa/*"
    - action: iam:EnableMFADevice
      resource: "{target.arn}"
    any_of:
    - - action: iam:CreateAccessKey
        resource: "{target.arn}"
    - - action: iam:CreateLoginProfile
        resource: "{target.arn}"
    - - action: iam:UpdateLoginProfile
        resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:EnableMFADevice
    scope: same_account
    aggregate_as: IAM users on which the source can enrol its own MFA device and mint credentials in {account}
    outcome: credentials
  conditions:
  - id: mfa_device_limit
    description: An IAM user can hold at most eight MFA devices; a user already at the limit also needs
      iam:DeactivateMFADevice on the target.
  - id: credential_state
    description: CreateAccessKey needs fewer than two existing keys (or iam:DeleteAccessKey); CreateLoginProfile needs
      the user to have no console password; UpdateLoginProfile needs an existing one.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:EnableMFADevice and iam:CreateVirtualMFADevice to self-service on the caller's own user
    (aws:username), and alert on a second MFA enrolment for a user that already has one.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_EnableMFADevice.html
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateVirtualMFADevice.html
  - https://docs.aws.amazon.com/STS/latest/APIReference/API_GetSessionToken.html
  notes: Complements aws-iam-createaccesskey-other-user / aws-iam-createloginprofile-other-user /
    aws-iam-updateloginprofile-other-user by removing their MFA caveats (aws:MultiFactorAuthPresent-gated policies and
    MFA-protected console sign-in). GetSessionToken needs no IAM permission. The page notes the technique needs the
    target's access keys; the any_of supplies the credential-creation half that makes it reachable from configuration
    alone.

- id: aws-iam-deactivate-mfa-loginprofile-other-user
  provider: aws
  service: iam
  title: Remove another user's MFA device and set its console password
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamuploadsshpublickey--iamdeactivatemfadevice
  source_revision: 6fb9ac51fd
  summary: The source can obtain console access as MFA-protected IAM users by deactivating their MFA device and creating
    or resetting their console password.
  requires:
    all_of:
    - action: iam:DeactivateMFADevice
      resource: "{target.arn}"
    any_of:
    - - action: iam:CreateLoginProfile
        resource: "{target.arn}"
    - - action: iam:UpdateLoginProfile
        resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:DeactivateMFADevice
    scope: same_account
    aggregate_as: IAM users whose MFA the source can remove and whose password it can set in {account}
    outcome: credentials
  conditions:
  - id: all_devices_removed
    description: Every MFA device of the target must be deactivated (one DeactivateMFADevice per device serial) before
      password-only sign-in works.
  - id: login_profile_state
    description: CreateLoginProfile needs the user to have no console password; UpdateLoginProfile needs an existing
      one.
  - id: mfa_gated_permissions_lost
    description: Permissions conditioned on aws:MultiFactorAuthPresent are not usable from the resulting password-only
      session.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:DeactivateMFADevice and login-profile management on other users to break-glass administrators
    and alert on DeactivateMFADevice.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeactivateMFADevice.html
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateLoginProfile.html
  notes: Lifts the target_mfa condition of aws-iam-createloginprofile-other-user /
    aws-iam-updateloginprofile-other-user. DeactivateMFADevice alone (password unknown) stays out of scope.

- id: aws-iam-updateuser-path-move-self-policy
  provider: aws
  service: iam
  title: Move the source user into an IAM path where it can edit user policies
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 6fb9ac51fd
  summary: The source IAM user can obtain administrator privileges by changing its own path into one where it holds
    path-scoped iam:AttachUserPolicy or iam:PutUserPolicy and then granting itself a policy.
  requires:
    all_of:
    - action: iam:UpdateUser
      resource: "{source.arn}"
    any_of:
    - - action: iam:AttachUserPolicy
        resource: "arn:aws:iam::{source.account}:user/*"
    - - action: iam:PutUserPolicy
        resource: "arn:aws:iam::{source.account}:user/*"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
    scope: same_account
    aggregate_as: Administrator of {account} (self-escalation via path move)
    outcome: permission_grant
  conditions:
  - id: new_path_covered
    description: iam:UpdateUser is authorized on both the current and the new user ARN, and the policy-edit permission
      must cover the source at its new path; the evaluator only checks that some user path is covered.
  - id: policyarn_condition
    description: An iam:PolicyARN condition limiting attachable policies removes or limits the AttachUserPolicy variant.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Treat iam:UpdateUser as a privileged permission; do not scope IAM policy-edit permissions by path when
    principals can change their own path.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateUser.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  notes: Policy-edit counterpart of aws-iam-updateuser-path-move (which models credential creation on a moved victim).
    If the source already holds the policy permission on its current ARN, aws-iam-attachuserpolicy-self /
    putuserpolicy-self apply directly.

- id: aws-iam-updategroup-path-move-self-policy
  provider: aws
  service: iam
  title: Move one of the source's groups into an IAM path where it can edit group policies
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 6fb9ac51fd
  summary: The source IAM user can obtain administrator privileges by moving one of its groups into a path where it
    holds path-scoped iam:AttachGroupPolicy or iam:PutGroupPolicy and then granting the group a policy.
  requires:
    all_of:
    - action: iam:UpdateGroup
      resource: "{source.group_arn}"
    any_of:
    - - action: iam:AttachGroupPolicy
        resource: "arn:aws:iam::{source.account}:group/*"
    - - action: iam:PutGroupPolicy
        resource: "arn:aws:iam::{source.account}:group/*"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
      source_group_covered_by: iam:UpdateGroup
    scope: same_account
    aggregate_as: Administrator of {account} (self-escalation via group path move)
    outcome: permission_grant
  conditions:
  - id: new_path_covered
    description: iam:UpdateGroup is authorized on both the current and the new group ARN, and the policy-edit permission
      must cover the group at its new path; the evaluator only checks that some group path is covered.
  - id: policyarn_condition
    description: An iam:PolicyARN condition limiting attachable policies removes or limits the AttachGroupPolicy
      variant.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Treat iam:UpdateGroup as a privileged permission and avoid path-scoped group policy-edit grants.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateGroup.html
  notes: '{source.group_arn} is one of the source user''s groups. Policy-edit counterpart of aws-iam-updategroup-path-move
    (which models joining a moved group).'

- id: aws-iam-rolepermissionsboundary-assumable-role
  provider: aws
  service: iam
  title: Replace or remove the permissions boundary of a role the source can assume
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 6fb9ac51fd
  summary: The source can obtain the full identity-policy privileges of a boundary-capped role it can assume by
    replacing or removing that role's permissions boundary.
  requires:
    any_of:
    - - action: iam:PutRolePermissionsBoundary
        resource: "{source.assumable_role_arn}"
    - - action: iam:DeleteRolePermissionsBoundary
        resource: "{source.assumable_role_arn}"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_covered_by: iam:PutRolePermissionsBoundary
    scope: same_account
    aggregate_as: Administrator of {account} (via an assumable role's boundary)
    outcome: scope_control
  conditions:
  - id: unbounded_identity_policy_is_admin
    description: Only an escalation if the assumable role currently has a boundary and its identity policies are broader
      than it; reaching admin requires those identity policies to be admin-equivalent.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Explicitly deny iam:Put/DeleteRolePermissionsBoundary for delegated administrators on roles they can
    assume, and require boundaries via iam:PermissionsBoundary conditions.
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: Assumable-role counterpart of aws-iam-putrolepermissionsboundary-self (whose notes say this edge was not
    modelled). via_assumable_role_covered_by applies to whichever any_of action matched.

- id: aws-iam-createrole-satisfy-cross-account-trust
  provider: aws
  service: iam
  title: Create a role in a trusted account to satisfy another account's role trust
  source:
    src/pentesting-cloud/aws-security/aws-cross-account-attacks/iam-trust-and-federation-attacks.md#path-name-and-arn-conditions
  source_revision: 6fb9ac51fd
  summary: A principal that can create and grant permissions to a role in its own account can obtain the privileges of
    roles in other accounts whose trust delegates to that account (account root, or Principal "*" filtered by
    aws:PrincipalArn path/name patterns), even without holding sts:AssumeRole itself.
  requires:
    all_of:
    - action: iam:CreateRole
      resource: "arn:aws:iam::{source.account}:role/*"
      bind: new_role
      request_context:
        iam:PermissionsBoundary: {absent: true}
    any_of:
    - - action: iam:PutRolePolicy
        resource: "arn:aws:iam::{source.account}:role/*"
        bind: new_role
    - - action: iam:AttachRolePolicy
        resource: "arn:aws:iam::{source.account}:role/*"
        bind: new_role
  target:
    kind: aws_role
    selector:
      trust_allows_principal_of_source: true
    scope: any
    aggregate_as: "Roles in other accounts trusting {account} that a newly created role can satisfy"
    outcome: credentials
  conditions:
  - id: principal_arn_pattern_matchable
    description: Trusts filtered with aws:PrincipalArn (ArnLike path or name patterns, or a deleted-and-recreatable role
      name) are satisfied only when CreateRole/PutRolePolicy cover a role path and name matching the pattern.
  - id: trust_names_specific_principal
    description: Trusts that name a specific existing principal ARN in Principal (stored as its unique id) cannot be
      satisfied by a new role; those targets are false positives of this entry.
  - id: other_trust_conditions
    description: ExternalId, MFA, aws:PrincipalOrgID, source IP/VPC or tag conditions on the trust must also be
      satisfiable by the new role session.
  - id: new_role_identity_policy
    description: The source writes the new role's identity policy allowing sts:AssumeRole on the target; a permissions
      boundary forced on CreateRole or an SCP deny on sts:AssumeRole blocks it.
  preconditions:
  - target_in_other_account
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Trust specific role ARNs in Principal instead of account roots or "*" with aws:PrincipalArn patterns,
    require iam:PermissionsBoundary on iam:CreateRole in trusted accounts, and pin cross-account trusts to
    aws:PrincipalOrgID plus exact role ARNs.
  references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
  notes: Complements aws-sts-assumerole-trusted (which needs sts:AssumeRole on the target in the source's own policy)
    and aws-iam-createrole-attach-assume (same-account admin). Same-account targets are left to
    aws-iam-createrole-attach-assume through target_in_other_account. A role trusting the source's account root, or "*"
    with an aws:PrincipalArn condition, is satisfiable by any new role in that account; trust conditions keep the edge
    conditional.

- id: aws-iam-createpolicyversion-assumable-role
  provider: aws
  service: iam
  title: Rewrite a managed policy attached to an assumable role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreatepolicyversion
  source_revision: 8d6a341c8a
  summary: A new default version of a customer-managed policy can grant administration to a role the source can assume.
  requires:
    all_of:
    - action: iam:CreatePolicyVersion
      resource: "{source.assumable_role_attached_policy_arn}"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_attached_policy_covered_by: iam:CreatePolicyVersion
    scope: same_account
    outcome: scope_control
  conditions:
  - id: policy_version_capacity
    description: A policy with five versions requires permission to delete a nondefault version before creation.
  blockers: [scp_or_boundary_deny]
  confidence: conditional
  severity: critical
  mitigation: Separate policy-version editing from role assumption and constrain the role with a boundary.
