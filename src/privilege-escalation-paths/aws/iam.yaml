- id: aws-iam-modify-assumable-role-policy
  provider: aws
  service: iam
  title: Grant permissions to a role the source can already assume
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 171e422299
  summary: The source can obtain administrator privileges through a role it can assume and whose policies it can change.
  requires:
    any_of:
      - - action: iam:AttachRolePolicy
          resource: "{source.assumable_role_arn}"
      - - action: iam:PutRolePolicy
          resource: "{source.assumable_role_arn}"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_covered_by: iam:AttachRolePolicy
    scope: same_account
    aggregate_as: "Administrator of {account} (via an assumable role)"
  conditions:
    - id: same_assumable_role
      description: The role whose policies the source can change must be one it can assume; {source.assumable_role_arn} already restricts the requirement to such roles.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Separate who can edit a role's permissions from who can assume it; apply permissions boundaries on delegated role administration.
  references: []
  notes: "{source.assumable_role_arn} is a role the source can already assume (the trust admits it, and its identity policy allows sts:AssumeRole on the role unless the trust names its ARN in the same account), so no separate sts:AssumeRole requirement is listed. via_assumable_role_covered_by applies to whichever any_of action matched (AttachRolePolicy or PutRolePolicy)."

- id: aws-iam-createrole-attach-assume
  provider: aws
  service: iam
  title: Create a new role trusting the source, grant it admin, and assume it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 171e422299
  summary: The source can obtain administrator privileges through a new role it creates, grants permissions to and assumes.
  requires:
    all_of:
      - action: iam:CreateRole
        resource: "*"
    any_of:
      - - action: iam:AttachRolePolicy
          resource: "*"
      - - action: iam:PutRolePolicy
          resource: "*"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
    scope: same_account
    aggregate_as: "Administrator of {account} (via a newly created role)"
  conditions:
    - id: permissions_boundary_condition
      description: An iam:PermissionsBoundary condition on CreateRole forces new roles to carry a boundary and removes the escalation.
    - id: resource_path_restriction
      description: If CreateRole/AttachRolePolicy/PutRolePolicy are restricted to a role path or name pattern, the actions must all cover the same role ARN.
    - id: same_account_trust_no_assumerole_needed
      description: The source writes the new role's trust policy naming its own ARN; in the same account that trust alone authorizes sts:AssumeRole, so no identity grant is required (an explicit identity-policy or SCP deny on sts:AssumeRole still blocks it).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Require iam:PermissionsBoundary on iam:CreateRole for delegated administrators and restrict role attach/put to boundary-carrying roles.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: "Resource \"*\" means the actions must cover a common (newly creatable) role ARN; the evaluator should intersect their Resources."

- id: aws-iam-addusertogroup
  provider: aws
  service: iam
  title: Add the source user to an IAM group
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamaddusertogroup
  source_revision: 171e422299
  summary: The source IAM user can obtain the privileges of IAM groups it can add itself to.
  requires:
    all_of:
      - action: iam:AddUserToGroup
        resource: "{target.arn}"
  target:
    kind: aws_group
    selector:
      resource_permission_covers_target: iam:AddUserToGroup
      source_kind: aws_user
    scope: same_account
    aggregate_as: "IAM groups covered by iam:AddUserToGroup in {account}"
  conditions: []
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:AddUserToGroup to administrators or to specific low-privilege groups.
  references: []
  notes: The Resource of iam:AddUserToGroup is the group ARN. Only IAM users can be group members; role sources cannot use this (they could add some other user they control, covered by user-credential techniques).

- id: aws-iam-updateassumerolepolicy
  provider: aws
  service: iam
  title: Rewrite a role's trust policy to allow the source
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateassumerolepolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust policy it can rewrite.
  requires:
    all_of:
      - action: iam:UpdateAssumeRolePolicy
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      resource_permission_covers_target: iam:UpdateAssumeRolePolicy
    scope: same_account
    aggregate_as: "IAM roles covered by iam:UpdateAssumeRolePolicy in {account}"
  conditions:
    - id: assumerole_grant
      description: If the rewritten trust names the source principal ARN (same account) no identity-policy sts:AssumeRole is needed; if it names only the account root, sts:AssumeRole on the role is also required.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateAssumeRolePolicy to administrators; monitor trust-policy changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
  notes: Service-linked roles cannot have their trust policy edited and must be excluded from the target set.

- id: aws-iam-updatesamlprovider
  provider: aws
  service: iam
  title: Replace the metadata of a SAML provider trusted by roles
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdatesamlprovider-iamlistsamlproviders-iamgetsamlprovider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting a SAML provider whose metadata it can replace.
  requires:
    all_of:
      - action: iam:UpdateSAMLProvider
        resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_saml_provider_covered_by: iam:UpdateSAMLProvider
    scope: same_account
    aggregate_as: "Roles trusting a SAML provider covered by iam:UpdateSAMLProvider in {account}"
  conditions:
    - id: trust_conditions_on_saml_attributes
      description: Trust conditions on SAML attributes (e.g. saml:aud, saml:sub) must be satisfiable; a forged assertion normally can satisfy them.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateSAMLProvider/CreateSAMLProvider to administrators; alert on SAML provider changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateSAMLProvider.html
  notes: "Requires a new placeholder {target.saml_provider_arn}: the SAML provider ARN named in the target role's trust policy. sts:AssumeRoleWithSAML needs no identity permissions."

- id: aws-iam-putuserpermissionsboundary-self
  provider: aws
  service: iam
  title: Replace or remove the permissions boundary of the source user
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputuserpermissionsboundary
  source_revision: 171e422299
  summary: The source IAM user can obtain the full privileges of its identity policies by replacing or removing its own permissions boundary.
  requires:
    all_of: []
    any_of:
      - - action: iam:PutUserPermissionsBoundary
          resource: "{source.arn}"
      - - action: iam:DeleteUserPermissionsBoundary
          resource: "{source.arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
    - id: unbounded_identity_policy_is_admin
      description: Only an escalation if the source currently has a boundary and its identity policies are broader than the boundary; reaching admin requires the identity policies to be admin-equivalent.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Explicitly deny iam:Put/DeleteUserPermissionsBoundary on self inside every permissions boundary.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: DeleteUserPermissionsBoundary is added as an equivalent alternative (official API); HackTricks documents the Put variant.

- id: aws-iam-putrolepermissionsboundary-self
  provider: aws
  service: iam
  title: Replace or remove the permissions boundary of the source role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 171e422299
  summary: The source role can obtain the full privileges of its identity policies by replacing or removing its own permissions boundary.
  requires:
    all_of: []
    any_of:
      - - action: iam:PutRolePermissionsBoundary
          resource: "{source.arn}"
      - - action: iam:DeleteRolePermissionsBoundary
          resource: "{source.arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_role
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
    - id: unbounded_identity_policy_is_admin
      description: Only an escalation if the source currently has a boundary and its identity policies are broader than the boundary; reaching admin requires the identity policies to be admin-equivalent.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Explicitly deny iam:Put/DeleteRolePermissionsBoundary on self inside every permissions boundary.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: Changing a boundary of another role the source can assume is the same edge via an assumable role; not modelled separately.

- id: aws-iam-updateuser-path-move
  provider: aws
  service: iam
  title: Move another user into an IAM path where the source's credential permissions already apply
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 171e422299
  summary: The source can obtain the privileges of a user it can rename by changing the user's path into one where it already holds credential-creation permissions.
  requires:
    all_of:
      - action: iam:UpdateUser
        resource: "{target.arn}"
    any_of:
      - - action: iam:CreateAccessKey
          resource: "arn:aws:iam::{target.account}:user/*"
      - - action: iam:CreateLoginProfile
          resource: "arn:aws:iam::{target.account}:user/*"
      - - action: iam:UpdateLoginProfile
          resource: "arn:aws:iam::{target.account}:user/*"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:UpdateUser
    scope: same_account
    aggregate_as: "Users the source can move into a path it controls in {account}"
  conditions:
    - id: new_path_covered
      description: iam:UpdateUser is authorized on both the current and the new user ARN, and the credential permission must cover the user at its new path; the evaluator only checks that some user path is covered.
    - id: login_profile_state
      description: CreateLoginProfile needs the user to have no password yet; UpdateLoginProfile needs an existing one; CreateAccessKey needs fewer than two keys.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Treat iam:UpdateUser as a credential-management permission; do not scope IAM write permissions by path when principals can change paths.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateUser.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
  notes: Path-scoped policy and boundary attachment variants (AttachUserPolicy / PutUserPolicy on a path) are covered by the same reasoning but drawn only through credential creation here.

- id: aws-iam-updategroup-path-move
  provider: aws
  service: iam
  title: Move a group into an IAM path where the source can add members
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 171e422299
  summary: The source user can obtain the privileges of a group it can rename by moving it into a path where it holds iam:AddUserToGroup and joining it.
  requires:
    all_of:
      - action: iam:UpdateGroup
        resource: "{target.arn}"
      - action: iam:AddUserToGroup
        resource: "arn:aws:iam::{target.account}:group/*"
  target:
    kind: aws_group
    selector:
      resource_permission_covers_target: iam:UpdateGroup
      source_kind: aws_user
    scope: same_account
    aggregate_as: "Groups the source can move into a path it controls in {account}"
  conditions:
    - id: new_path_covered
      description: iam:UpdateGroup is authorized on both the current and the new group ARN, and iam:AddUserToGroup must cover the group at its new path; the evaluator only checks that some group path is covered.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Treat iam:UpdateGroup as a membership-management permission and avoid path-scoped iam:AddUserToGroup grants.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateGroup.html
  notes: Only IAM users can be group members, hence source_kind aws_user.

- id: aws-iam-recreate-samlprovider
  provider: aws
  service: iam
  title: Replace a trusted SAML provider with an attacker-controlled one of the same name
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting a SAML provider by deleting it and registering a provider with the same name and its own signing metadata.
  requires:
    all_of:
      - action: iam:DeleteSAMLProvider
        resource: "{target.saml_provider_arn}"
      - action: iam:CreateSAMLProvider
        resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_saml_provider_covered_by: iam:DeleteSAMLProvider
    scope: same_account
    aggregate_as: "Roles trusting a SAML provider the source can recreate in {account}"
  conditions:
    - id: trust_conditions_on_saml_attributes
      description: Trust conditions on SAML attributes (saml:aud, saml:sub, saml:iss) must be satisfiable by an assertion the source signs; normally they are.
    - id: disruption
      description: Deleting the provider breaks legitimate federation until it is recreated, which is noisy.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:CreateSAMLProvider / DeleteSAMLProvider / UpdateSAMLProvider to administrators and alert on identity-provider changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateSAMLProvider.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_saml.html
  notes: Registering a brand-new provider only escalates combined with a role that trusts it, which iam:CreateRole / iam:UpdateAssumeRolePolicy already grant directly (aws-iam-createrole-attach-assume, aws-iam-updateassumerolepolicy). The OIDC audience variant is aws-iam-oidcprovider-add-client-id and planting a provider that a trust names but that no longer exists is aws-iam-createsamlprovider-orphaned-trust / aws-iam-createoidcprovider-orphaned-trust.

- id: aws-iam-oidcprovider-add-client-id
  provider: aws
  service: iam
  title: Register an attacker-chosen audience on an OIDC provider that roles trust
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamaddclientidtoopenidconnectprovider--widen-an-existing-federation-trust
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting an IAM OIDC provider by registering an audience it can mint tokens for (AddClientIDToOpenIDConnectProvider, or deleting and recreating the provider with its own client-ID list), when the role's sub/other claim conditions are satisfiable by tokens of that issuer.
  requires:
    any_of:
      - - action: iam:AddClientIDToOpenIDConnectProvider
          resource: "{target.oidc_provider_arn}"
      - - action: iam:DeleteOpenIDConnectProvider
          resource: "{target.oidc_provider_arn}"
        - action: iam:CreateOpenIDConnectProvider
          resource: "{target.oidc_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_oidc_provider_covered_by: iam:AddClientIDToOpenIDConnectProvider
    scope: same_account
    aggregate_as: "Roles trusting an OIDC provider whose audiences the source can change in {account}"
  conditions:
    - id: issuer_tokens_obtainable
      description: The source must obtain tokens signed by the provider's issuer (the provider URL and its JWKS cannot be changed without changing the provider ARN), for example from a public CI issuer such as GitHub Actions or from a workload of an EKS cluster.
    - id: trust_claim_conditions
      description: Trust conditions on sub, repository, namespace or other claims must be satisfiable by those tokens; a trust pinning only the audience is satisfiable after the audience is registered.
    - id: disruption
      description: Deleting and recreating the provider breaks federation until it is recreated; AddClientIDToOpenIDConnectProvider is additive and silent.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:AddClientIDToOpenIDConnectProvider / CreateOpenIDConnectProvider / DeleteOpenIDConnectProvider to administrators, pin sub (and repository / namespace) claims in every OIDC trust, and alert on provider changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_AddClientIDToOpenIDConnectProvider.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
  notes: The trust policy's own <provider>:aud condition still has to accept the new audience (or be absent). The role-to-provider join is the Federated oidc-provider ARN of the role's trust policy ({target.oidc_provider_arn}).

- id: aws-iam-createsamlprovider-orphaned-trust
  provider: aws
  service: iam
  title: Register a SAML provider that a role trusts but that no longer exists
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust names a SAML provider ARN of the account that does not exist, by creating that provider with its own signing metadata.
  requires:
    all_of:
      - action: iam:CreateSAMLProvider
        resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_federated_provider_missing: saml
    scope: same_account
    aggregate_as: "Roles trusting a missing SAML provider in {account}"
  conditions:
    - id: trust_conditions_on_saml_attributes
      description: Trust conditions on SAML attributes (saml:aud, saml:sub, saml:iss) must be satisfiable by an assertion the source signs; normally they are.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Remove trust statements naming deleted identity providers and restrict iam:CreateSAMLProvider to administrators.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateSAMLProvider.html
  notes: Needs the account's SAML provider inventory (iam:ListSAMLProviders); without it the targets are unresolved placeholders.

- id: aws-iam-createoidcprovider-orphaned-trust
  provider: aws
  service: iam
  title: Register an OIDC provider that a role trusts but that no longer exists
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust names an OIDC provider ARN of the account that does not exist, by creating that provider (for the issuer URL in the ARN) with an audience it can obtain tokens for.
  requires:
    all_of:
      - action: iam:CreateOpenIDConnectProvider
        resource: "{target.oidc_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_federated_provider_missing: oidc
    scope: same_account
    aggregate_as: "Roles trusting a missing OIDC provider in {account}"
  conditions:
    - id: issuer_tokens_obtainable
      description: The provider ARN fixes the issuer URL, so the source must obtain tokens of that issuer (public CI issuers such as GitHub Actions issue tokens to anyone's workflows) whose claims satisfy the trust conditions.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Remove trust statements naming deleted identity providers, pin sub claims, and restrict iam:CreateOpenIDConnectProvider to administrators.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateOpenIDConnectProvider.html
  notes: Needs the account's OIDC provider inventory (iam:ListOpenIDConnectProviders); without it the targets are unresolved placeholders.
