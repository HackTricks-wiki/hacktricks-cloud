- id: aws-iam-attachgrouppolicy-self
  provider: aws
  service: iam
  title: Attach a managed policy to a group the source user belongs to
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachuserpolicy--iamattachgrouppolicy
  source_revision: 171e422299
  summary: The source IAM user can obtain administrator privileges by attaching a managed policy to one of its groups.
  requires:
    all_of:
    - action: iam:AttachGroupPolicy
      resource: "{source.group_arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
      source_group_covered_by: iam:AttachGroupPolicy
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
  - id: policyarn_condition
    description: An iam:PolicyARN condition limiting attachable policies removes or limits the escalation.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Do not let users modify policies of groups they belong to.
  references: []
  notes: "{source.group_arn} is the ARN of one of the source's groups (the target is the account-admin entity, which has no
    ARN)."

