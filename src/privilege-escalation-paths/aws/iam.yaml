# AWS IAM privilege escalation techniques.
# Source: hacktricks-cloud aws-iam-privesc/README.md.

- id: aws-iam-createpolicyversion-self
  provider: aws
  service: iam
  title: Create a new default version of a customer-managed policy attached to the source
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreatepolicyversion
  source_revision: 171e422299
  summary: The source can obtain administrator privileges by rewriting a customer-managed policy attached to itself
    (directly, via a group, or to its role).
  requires:
    all_of:
    - action: iam:CreatePolicyVersion
      resource: "{source.attached_policy_arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_attached_policy_covered_by: iam:CreatePolicyVersion
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
  - id: policy_version_limit
    description: A managed policy holds at most 5 versions; when full, iam:DeletePolicyVersion on that policy is also
      needed. iam:SetDefaultPolicyVersion is NOT required (the set-as-default flag is part of CreatePolicyVersion).
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Do not grant iam:CreatePolicyVersion on policies attached to the same principal; scope it to specific
    policy ARNs owned by administrators and enforce permissions boundaries / SCPs that deny policy edits outside an
    admin path.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreatePolicyVersion.html
  notes: Also lets the source edit any other covered policy; when the covered policy is attached to other principals
    those principals become admin too, but the edge drawn here is self-escalation of the source. AWS-managed policies
    cannot be versioned by customers.

- id: aws-iam-createaccesskey-other-user
  provider: aws
  service: iam
  title: Create access keys for another IAM user
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateaccesskey-iamdeleteaccesskey
  source_revision: 171e422299
  summary: The source can obtain the privileges of IAM users on which it can create access keys.
  requires:
    all_of:
    - action: iam:CreateAccessKey
      resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:CreateAccessKey
    scope: same_account
    aggregate_as: "IAM users covered by iam:CreateAccessKey in {account}"
  conditions:
  - id: access_key_limit
    description: A user can hold at most two access keys; if the target already has two, iam:DeleteAccessKey on the
      target is also required.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Scope iam:CreateAccessKey to "arn:aws:iam::*:user/${aws:username}" (self-service only) and alert on
    CreateAccessKey for other users.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateAccessKey.html
  notes: Target users whose identity policies require MFA (aws:MultiFactorAuthPresent) will not get those permissions
    with plain access keys.

- id: aws-iam-createloginprofile-other-user
  provider: aws
  service: iam
  title: Create a console password for another IAM user
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateloginprofile--iamupdateloginprofile
  source_revision: 171e422299
  summary: The source can obtain the privileges of IAM users without a console password on which it can create one.
  requires:
    all_of:
    - action: iam:CreateLoginProfile
      resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:CreateLoginProfile
      has_login_profile: false
    scope: same_account
    aggregate_as: "IAM users without a console password covered by iam:CreateLoginProfile in {account}"
  conditions:
  - id: target_mfa
    description: If the target has an MFA device enrolled, console sign-in requires it and the technique is blocked.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:CreateLoginProfile to self or administrators and require MFA for all console users.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateLoginProfile.html
  notes: ""

- id: aws-iam-updateloginprofile-other-user
  provider: aws
  service: iam
  title: Reset the console password of another IAM user
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateloginprofile--iamupdateloginprofile
  source_revision: 171e422299
  summary: The source can obtain the privileges of IAM users whose console password it can change.
  requires:
    all_of:
    - action: iam:UpdateLoginProfile
      resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:UpdateLoginProfile
      has_login_profile: true
    scope: same_account
    aggregate_as: "IAM users with a console password covered by iam:UpdateLoginProfile in {account}"
  conditions:
  - id: target_mfa
    description: If the target has an MFA device enrolled, console sign-in requires it and the technique is blocked.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:UpdateLoginProfile to self (with old password) or administrators and require MFA for all
    console users.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateLoginProfile.html
  notes: The legitimate user is locked out, so this is noisy.

- id: aws-iam-createservicespecificcredential-other-user
  provider: aws
  service: iam
  title: Create or reset service-specific credentials for another IAM user
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateservicespecificcredential--iamresetservicespecificcredential
  source_revision: 171e422299
  summary: The source can obtain the service-scoped privileges (CodeCommit, Keyspaces, Bedrock) of IAM users for which
    it can create or reset service-specific credentials.
  requires:
    all_of: []
    any_of:
    - - action: iam:CreateServiceSpecificCredential
        resource: "{target.arn}"
    - - action: iam:ResetServiceSpecificCredential
        resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:CreateServiceSpecificCredential
    scope: same_account
    aggregate_as: "IAM users covered by service-specific credential management in {account}"
  conditions:
  - id: service_scoped_credential
    description: The credential only works against the specific service (CodeCommit, Keyspaces, Bedrock), so only the
      target's permissions on that service are gained.
  - id: reset_requires_existing_credential
    description: The Reset variant only applies when the target already has a service-specific credential.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict service-specific credential management to self (${aws:username}) and administrators.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateServiceSpecificCredential.html
  notes: The selector key resource_permission_covers_target uses whichever of the any_of actions matched. Partial
    privilege gain only.

- id: aws-iam-uploadsshpublickey-other-user
  provider: aws
  service: iam
  title: Upload an SSH public key for another IAM user (CodeCommit)
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamuploadsshpublickey--iamdeactivatemfadevice
  source_revision: 171e422299
  summary: The source can obtain the CodeCommit privileges of IAM users for which it can upload an SSH public key.
  requires:
    all_of:
    - action: iam:UploadSSHPublicKey
      resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:UploadSSHPublicKey
    scope: same_account
    aggregate_as: "IAM users covered by iam:UploadSSHPublicKey in {account}"
  conditions:
  - id: service_scoped_credential
    description: IAM SSH keys are only accepted by CodeCommit; only the target's CodeCommit permissions are gained
      (CodeCommit is closed to new customers since 2024).
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: low
  mitigation: Restrict iam:UploadSSHPublicKey to self (${aws:username}).
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UploadSSHPublicKey.html
  notes: The DeactivateMFADevice half of the same HackTricks section is excluded (it needs the target's password
    already).

- id: aws-iam-attachuserpolicy-self
  provider: aws
  service: iam
  title: Attach a managed policy to the source IAM user
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachuserpolicy--iamattachgrouppolicy
  source_revision: 171e422299
  summary: The source IAM user can obtain administrator privileges by attaching a managed policy to itself.
  requires:
    all_of:
    - action: iam:AttachUserPolicy
      resource: "{source.arn}"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  conditions:
  - id: policyarn_condition
    description: An iam:PolicyARN condition limiting which managed policies may be attached removes or limits the
      escalation.
  blockers:
  - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Never grant iam:AttachUserPolicy on the principal itself; constrain with iam:PolicyARN and permissions
    boundaries.
  references: []
  notes: Granting it on other users is an edge to those users only if the source can also act as them; that is covered
    by credential techniques, not here.

