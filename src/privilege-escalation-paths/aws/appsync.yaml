# AWS AppSync privilege escalation techniques.
# Source: hacktricks-cloud aws-appsync-privesc/README.md (rev 171e422299).

- id: aws-appsync-passrole-datasource-sigv4
  provider: aws
  service: appsync
  title: Attach a passed role to an IAM-signed HTTP data source and call it through a resolver
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appsync-privesc/README.md#appsynccreatedatasource-iampassrole--drive-an-arbitrary-role-through-a-graphql-field
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting appsync.amazonaws.com, since AppSync SigV4-signs caller-shaped requests to service endpoints with that role.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
    any_of:
      - - action: appsync:CreateDataSource
          resource: "*"
        - action: appsync:CreateResolver
          resource: "*"
      - - action: appsync:CreateDataSource
          resource: "*"
        - action: appsync:UpdateResolver
          resource: "*"
      - - action: appsync:UpdateDataSource
          resource: "*"
        - action: appsync:UpdateResolver
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: appsync.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting appsync.amazonaws.com passable in {account}"
  conditions:
    - id: callable_field
      description: The source needs a GraphQL API it controls or an existing one with a field it can call under an authorization mode it can satisfy (appsync:GraphQL for IAM auth, an API key, or user-pool/OIDC tokens); building a throwaway API also needs appsync:CreateGraphqlApi.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on AppSync roles with iam:PassedToService=appsync.amazonaws.com, restrict data source and resolver changes to API owners, and scope data source roles to their backend resources.
  references:
    - https://docs.aws.amazon.com/appsync/latest/devguide/resolver-reference-http-js.html
    - https://docs.aws.amazon.com/appsync/latest/APIReference/API_CreateDataSource.html
  notes: The section for appsync:UpdateDataSource + appsync:UpdateResolver + iam:PassRole is the same primitive on an existing data source (third any_of group). Responses are returned through the resolver, so the role is usable for reads and writes; raw STS credentials are not returned.

- id: aws-appsync-updateresolver-existing-datasource-role
  provider: aws
  service: appsync
  title: Rewrite a resolver or function to drive an existing data source's service role
  source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-appsync-post-exploitation/README.md#hijack-resolver-function-or-data-source-behavior
  source_revision: 6fb9ac51fd
  summary: The source can act with the service role stored on an existing AppSync data source, without iam:PassRole, by replacing the request logic of a resolver or pipeline function bound to that data source.
  requires:
    any_of:
      - - action: appsync:UpdateResolver
          resource: "*"
      - - action: appsync:UpdateFunction
          resource: "*"
  target:
    kind: aws_role
    selector:
      attached_to_service: appsync
      via_resource_type: appsync_datasource
    scope: same_account
    aggregate_as: "Service roles of AppSync data sources in {account}"
    outcome: workload_execution
  conditions:
    - id: callable_field
      description: The source needs a separate way to invoke the modified field (appsync:GraphQL for IAM auth, an API key, Cognito/OIDC tokens or a Lambda authorizer it satisfies) and the API, type, field and data-source names.
    - id: backend_bounded
      description: The role is exercised only through the data source's backend - arbitrary SigV4-signed calls for an HTTP data source with IAM authorization to an AWS endpoint, otherwise the operations of that DynamoDB, OpenSearch, RDS, EventBridge, Lambda or Bedrock backend that the role allows. Raw STS credentials are not returned.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict appsync:UpdateResolver and UpdateFunction (not resource-scopable) to API owners, scope every data source role to the exact backend resources and operations the resolvers need, and alert on resolver changes.
  references:
    - https://docs.aws.amazon.com/appsync/latest/APIReference/API_UpdateResolver.html
    - https://docs.aws.amazon.com/appsync/latest/devguide/resolver-reference-http-js.html
  notes: No-PassRole variant of aws-appsync-passrole-datasource-sigv4 (which reaches passable roles); this one reaches only roles already stored on data sources. AppSync data sources are not collected, so roles trusting appsync.amazonaws.com are the fallback target set (unknown).
- id: aws-audit2-appsync-2
  provider: aws
  service: appsync
  title: Read environment secrets and export the schema
  source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-appsync-post-exploitation/README.md#read-environment-secrets-and-export-the-schema
  source_revision: 0b36331
  summary: Under exact prerequisites, the source obtains plaintext credential or token value.
  requires:
    all_of:
    - action: appsync:GetGraphqlApiEnvironmentVariables
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-audit2-appsync-2
    scope: same_account
    aggregate_as: Verified appsync authority in {account}
    grants:
    - plaintext credential or token value
  conditions:
  - id: exact_verified_prerequisites
    description: Resource *. Actual environment value must contain usable secret. GetIntrospectionSchema and ListDataSources
      are recon. Evidence must bind exact source, target and resource; missing evidence is unknown.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed actions and verify exact resource and downstream authority.
  references:
  - https://attacker.example
  notes: 'Provisional: exact verified source, target and authority evidence required; missing evidence evaluates
    UNKNOWN.'
