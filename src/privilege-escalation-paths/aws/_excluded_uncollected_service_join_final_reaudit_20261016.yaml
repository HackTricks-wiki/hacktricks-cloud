- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ecs-privesc/README.md#hijack-ecs-scheduling-via-malicious-capacity-provider-ec2-asg-takeover
  source_revision: 171e422299
  technique: Move a service onto a capacity provider backed by instances the source controls
  reason: The collector records ECS tasks and their roles, but not a complete source-controlled
    host, capacity-provider, Auto Scaling group and future task-placement chain. A service strategy
    change does not guarantee a target-role task lands on a host the source can access, so this
    conditional route is excluded from the automatic principal graph.
  prior_id: aws-ecs-capacity-provider-hijack
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mwaa-privesc/README.md#classic-mwaa-airflowcreateweblogintoken--airflowcreateclitoken--code-execution-as-the-environment-execution-role
  historical_source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mwaa-post-exploitation/README.md#classic-mwaa-airflowcreateweblogintoken--airflowcreateclitoken--code-execution-as-the-environment-execution-role
  source_revision: b587e6bd26
  technique: Mint an Airflow CLI token for an MWAA environment and run code as its execution role
  reason: CreateCliToken grants a CLI session for one MWAA environment, but that session does not
    by itself grant the execution role. A principal edge needs the exact environment and role,
    reachable web server, Airflow permission to trigger a DAG, and an existing DAG whose executable
    code or code-bearing input the source controls. Those Airflow and DAG facts are not collected.
  prior_id: aws-mwaa-createclitoken-execution-role
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mwaa-privesc/README.md#classic-mwaa-airflowcreateweblogintoken--airflowcreateclitoken--code-execution-as-the-environment-execution-role
  historical_source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mwaa-post-exploitation/README.md#classic-mwaa-airflowcreateweblogintoken--airflowcreateclitoken--code-execution-as-the-environment-execution-role
  source_revision: b587e6bd26
  technique: Mint an Airflow web-login token for an MWAA environment and run code as its execution
    role
  reason: CreateWebLoginToken grants a session with a named Airflow RBAC role, not automatic Admin
    access or control of the MWAA execution role. A principal edge needs the exact environment and
    execution role, reachable web server, sufficient Airflow RBAC rights, and a DAG whose executable
    code or code-bearing input the source controls. Those Airflow and DAG facts are not collected.
  prior_id: aws-mwaa-createweblogintoken-execution-role
