- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ecs-privesc/README.md#ecsexecutecommand-ecsdescribetasks-and-optionally-a-task-launching-action
  source_revision: 171e422299
  technique: Execute commands in a running ECS task with ECS Exec
  reason: The old unjoined route is replaced by active aws-ecs-executecommand, which requires a running task, exact task role, ready per-container Exec agent, cluster and task authorization, and task-role SSM channel permissions.
