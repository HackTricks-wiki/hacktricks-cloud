# Reviewed privilege-escalation sweep exclusions.
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-acm-persistence/README.md#register-an-attacker-controlled-acme-certificate-account
  technique: Register an ACME account with a binding to issue certificates through its IAM role
  reason: ACME endpoints, bindings, registered accounts, validation state, and their role linkage are absent from the AWS
    configuration snapshot. The service-scoped authority cannot be represented as full possession of the IAM role.
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-appintegrations-persistence/README.md#appintegrations
  technique: Replace a trusted Connect workspace application with attacker-controlled content
  reason: The snapshot does not contain Connect agent browser sessions, application associations and security-profile grants
    needed to know which agent identity will load and authorize the content.
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-workspaces-web-persistence/README.md#persist-a-hostile-extension-in-every-secure-browser-session
  technique: Force-install a hostile extension in WorkSpaces Web sessions
  reason: The gain depends on future user activity, extension manifest capabilities and browser/runtime state, none of which
    is in the AWS configuration snapshot.
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-workspaces-web-persistence/README.md#persist-an-attacker-controlled-portal-identity-provider
  technique: Add or replace a WorkSpaces Web portal SAML/OIDC identity provider
  reason: The snapshot lacks WorkSpaces Web portal/provider configuration, user-to-portal authorization and relying application
    sessions; it cannot resolve an IAM or application principal edge from the IAM action alone.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-audit-manager-post-exploitation/README.md#delegate-a-control-set-to-another-role
  technique: Delegate Audit Manager control-set authority to an attacker-controlled role
  reason: The role gains only Audit Manager application-plane authority, and the catalog has no assessment/control-set target
    or delegation inventory to determine a principal-to-principal edge.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-bedrock-post-exploitation/README.md#1-runtime-ssrf---mmds-credentials
  technique: AgentCore Runtime SSRF to its execution-role credentials
  reason: The exploitable SSRF and MMDSv1 behavior of a live runtime are not configuration-snapshot facts; the Code Interpreter
    permission-based path is already aws-bedrock-agentcore-codeinterpreter-existing.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-cognito-directory-secret-disclosure-post-exploitation/README.md#iam-reads-that-expose-directory-data-and-idp-client-secrets
  technique: Use a Cognito IdP client secret as the OAuth application client
  reason: The resulting token is application-plane authority, not an IAM/Identity Center principal, and the external resource-server
    scopes are not represented by catalog targets.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-device-farm-post-exploitation/README.md#take-over-a-running-remote-access-device
  technique: Redeem a Device Farm session endpoint and control a logged-in test account
  reason: The session endpoint, current login state and user identity are transient runtime data, so a config snapshot cannot
    identify a gained principal.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ecs-post-exploitation/README.md#steal-co-located-task-credentials-after-compromising-the-container-instance
  technique: Use host or container-runtime control to steal credentials of neighboring ECS tasks
  reason: Root/socket control and current task co-location are runtime foothold facts; the catalogued ecs:Poll agent impersonation
    and RunTask host-control paths do not describe this independent local theft.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ecs-post-exploitation/README.md#steal-the-container-instance-role-from-an-ecs-on-ec2-task
  technique: Read EC2 instance-profile credentials from IMDS inside an ECS task
  reason: A compromised task process and effective IMDS reachability are runtime facts; a task role grant alone does not establish
    either.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-gamelift-streams-post-exploitation/README.md#reconnect-to-an-active-or-disconnected-session
  technique: Reconnect to another user’s live GameLift Streams application session
  reason: The session state, login and in-memory credentials are transient data; the grant alone does not determine whose
    identity is obtained.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-invoicing-and-billing-post-exploitation/README.md#steal-or-sabotage-a-procurement-portal-connection
  technique: Recover or redirect procurement-portal authentication material
  reason: A live external credential and acceptance by the procurement portal cannot be determined from the AWS snapshot;
    no supported target kind represents the portal account.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#cross-service-pivot-publish-into-an-existing-iot-rule-and-lambda
  technique: Publish to an IoT rule whose Lambda action misuses attacker-controlled fields
  reason: The rule configuration can be inventoried, but privilege gain depends on application handler behavior, not on the
    publish grant or role attachment alone.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-sitewise-post-exploitation/README.md#grant-yourself-access-to-a-legacy-sitewise-monitor-portal
  technique: Grant a controlled identity SiteWise Monitor administrator access
  reason: The catalog has no SiteWise Monitor service-plane target or portal-to-access-policy inventory/selector; the IAM
    principal is not given a new IAM policy or role.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#recover-wireless-device-onboarding-and-session-secrets
  technique: Clone a wireless device with recovered LoRaWAN or Sidewalk keys
  reason: The target is a radio/device protocol identity outside the supported cloud principal kinds; key presence, validity
    and network acceptance are not snapshot-decidable.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-chat-room-token-post-exploitation/README.md#mint-a-room-token-and-join-the-data-plane
  technique: Mint an IVS Chat token using another application user ID
  reason: IVS Chat user IDs and room capabilities are application-plane identities, with no supported catalog target kind
    or IAM role edge.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-video-streams-post-exploitation/README.md#recover-turn-credentials-and-impersonate-webrtc-peers
  technique: Join Kinesis Video signaling as a master or viewer peer
  reason: A WebRTC peer is not a supported AWS/K8s principal target, and media/session authorization depends on live signaling
    and application authentication.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-post-exploitation/README.md#exfiltrate-lambda-credentials
  technique: Read Lambda execution-role credentials from runtime environment variables
  reason: The process compromise and environment-variable contents are runtime facts. Permission-based UpdateFunctionCode/UpdateFunctionConfiguration
    routes are already catalogued.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-post-exploitation/README.md#lambda-durable-callback-result-injection
  technique: Inject a Lambda durable callback result that triggers a privileged workflow branch
  reason: The live callback ID and the function result-to-sensitive-action behavior are runtime/application facts absent from
    the configuration snapshot.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-post-exploitation/aws-lambda-privileged-event-consumer-injection.md#preconditions-and-discovery-without-list-permissions
  technique: Drive a privileged Lambda consumer through a writable event source
  reason: The event-to-handler path and, crucially, the handler input-to-sensitive-operation behavior cannot be proven from
    IAM/configuration alone; mere invocation is not role credential or arbitrary-code access.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#abuse-an-existing-code-hook-through-runtime-access
  technique: Trigger privileged business actions through a Lex fulfillment hook
  reason: Runtime input and the hook code must be analyzed to establish a privileged operation; the configuration snapshot
    only proves the hook is invoked.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-managed-blockchain-post-exploitation/README.md#recover-an-accessor-bearer-token
  technique: Reuse an Amazon Managed Blockchain accessor billing token
  reason: The accessor permits billed JSON-RPC service use, not an AWS IAM principal; the catalog has no accessor target or
    application-plane privilege scope.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-migration-hub-strategy-recommendations-post-exploitation/README.md#harvest-credentials-from-a-compromised-collector-host
  technique: Harvest the Strategy Recommendations collector AWS keys from local configuration
  reason: The collector host compromise, local files and live key values are absent from the configuration snapshot.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#statesstartexecution---input-injection-into-dangerous-sinks
  technique: Redirect a credentialed Step Functions HTTP Task to capture its connection credential
  reason: The evaluator has no collected HTTP-Task input mapping or connection-secret-to-external-principal join; a policy
    snapshot cannot decide the credential destination or external account reach.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-supply-chain-post-exploitation/README.md#redirect-an-erp-connection-to-expose-credentials-used-by-the-instance-role
  technique: Redirect a Supply Chain ERP connector to capture a delegated ERP credential
  reason: The credential and connector handshake are runtime/external state, and the gained ERP/database account is not an
    AWS catalog target.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#aws-waf-log-credential-harvesting-and-request-replay
  technique: Replay a victim application session recovered from WAF records
  reason: Which headers and session secrets were captured, whether they remain valid, and whether replay succeeds are runtime
    log/application facts absent from the snapshot.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-web-post-exploitation/README.md#add-or-replace-an-attacker-controlled-identity-provider
  technique: Attach an attacker IdP to a WorkSpaces Secure Browser portal
  reason: Portal federation/application users are not a supported AWS target kind or service plane, and the external IdP assertion
    contents are not in the snapshot.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#as2-partner-certificate-substitution--impersonate-a-trading-partner
  technique: Substitute an AS2 partner signing certificate
  reason: The target is an external AS2 partner identity. The catalog has no AS2 partner principal or Transfer agreement trust
    relation, and actual impersonation also depends on endpoint reachability and agreement matching that are not in the cloud
    configuration snapshot.
- source: src/pentesting-cloud/aws-security/aws-services/aws-devops-agent-enum.md#inventory-private-connectivity
  technique: Use a compromised DevOps Agent integration endpoint as a credential relay or malicious tool-response channel
  reason: The page gives a conditional runtime warning, not a deterministic permission path. Endpoint compromise, the agent's
    future call, request contents and actual credential relay are external/runtime facts that a configuration snapshot cannot
    decide.
- source: src/pentesting-cloud/aws-security/aws-services/aws-ec2-ebs-elb-ssm-vpc-and-vpn-enum/README.md#local-enumeration
  technique: Read AWS VPN Client temporary credentials from another user's local profile
  reason: The temporary credential file is an endpoint runtime artifact. Its presence, validity, and the attacker's access
    to the user's home directory are not configuration-snapshot facts; the page does not establish a reusable AWS API permission
    path to that file.
- source: src/pentesting-cloud/aws-security/aws-services/aws-iam-enum.md#local-enumeration
  technique: Steal a different user's cached IAM Identity Center access token and exchange it for assigned role credentials
  reason: The local token's presence, ownership, expiry, and theft are runtime host facts, absent from an AWS configuration
    snapshot. The catalog's reviewed sso:GetRoleCredentials exclusion concerns use of one's own already assigned token, not
    this cross-user cache theft.
- source: src/pentesting-cloud/aws-security/aws-services/aws-iam-enum.md#local-enumeration
  technique: Reuse another user's cached STS role credentials or static IAM user keys from local AWS CLI files
  reason: The page describes local credential files, not a cloud configuration grant. File contents, host access, key ownership
    and STS expiry cannot be determined from the AWS configuration snapshot.
- source: src/pentesting-cloud/aws-security/aws-services/aws-resource-groups-tagging-api-enum.md#bulk-tagging-and-tag-sync-boundaries
  technique: Change an authorization tag to satisfy a tag-conditioned policy and gain higher permissions
  reason: 'This is a generic conditional pattern, not one specified edge: the page names no target principal, privileged action,
    tag key/value, or native service action. A concrete instantiation may be snapshot-decidable, but this statement cannot
    yield a sound catalog entry under the fixed target/requirement schema.'
- source: src/pentesting-cloud/aws-security/aws-unauthenticated-enum-access/aws-cognito-user-pool-unauthenticated-access/README.md#multi-region-replicas-split-password-lockout-counters
  technique: Use independent Cognito replica lockout counters to guess a user password
  reason: A successful password guess and MFA result are runtime secrets/events, so an AWS config snapshot cannot decide that
    another user identity is reachable.
