# AWS Amplify privilege escalation techniques.
# Source: hacktricks-cloud aws-amplify-privesc/README.md.

- id: aws-amplifybackend-createtoken-studio-admin
  provider: aws
  service: amplifybackend
  title: Mint an Amplify Studio administrator login for a Gen 1 backend
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#amplifygetapp-amplifybackendcreatetoken--mint-an-amplify-studio-login
  source_revision: 171e422299
  summary: The source can obtain an Amplify Studio application-administration session over the data model, auth and
    configuration of Gen 1 backends it can mint Studio logins for.
  requires:
    all_of:
    - action: amplify:GetApp
      resource: "{target.resource_arn}"
    - action: amplifybackend:CreateToken
      resource: "{target.amplifybackend_token_arn}"
    - action: amplifybackend:CreateToken
      resource: "{target.amplifybackend_backend_arn}"
  target:
    kind: aws_service_plane_admin
    selector:
      service_plane: amplifybackend
    scope: same_account
    aggregate_as: "Amplify Studio administrators in {account}"
    grants: [Amplify Studio administrator (aws-amplify-admin)]
  conditions:
  - id: gen1_backend_with_studio
    description: The app must have an existing Amplify Gen 1 backend with Studio (Admin UI) enabled; the backend
      environment name must be known to open the session.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict amplifybackend:CreateToken/GetToken to Studio administrators and alert on CreateToken from
    unexpected principals.
  notes: Application-plane administration only (Studio session as the fixed aws-amplify-admin Cognito user); it does not
    return IAM credentials. Targets are the collected amplify_app entries with Gen 1 backend environments
    (amplify:ListBackendEnvironments); accounts whose apps or backend environments were not collected keep one
    unresolved placeholder. amplify:GetApp is authorized on the app ARN
    (arn:aws:amplify:<Region>:<account>:apps/<AppId>, {target.resource_arn}); amplifybackend:CreateToken is authorized
    on the Amplify Admin token resource arn:aws:amplifybackend:<Region>:<account>:/backend/<AppId>/challenge/*
    ({target.amplifybackend_token_arn}). Source - the Service Authorization Reference JSON
    (servicereference.us-east-1.amazonaws.com/v1/amplifybackend), verified 2026-10-11; CreateToken/GetToken list both
    the backend resource arn:<Partition>:amplifybackend:<Region>:<account>:/backend/<AppId>/*
    ({target.amplifybackend_backend_arn}) and the token resource
    arn:<Partition>:amplifybackend:<Region>:<account>:/backend/<AppId>/challenge/* ({target.amplifybackend_token_arn}),
    so both are required.

- id: aws-amplifybackend-gettoken-studio-admin
  provider: aws
  service: amplifybackend
  title: Recover a live Amplify Studio administrator login
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#amplifygetapp-amplifybackendgettoken--recover-a-live-studio-login
  source_revision: 171e422299
  summary: The source can hijack an existing Amplify Studio application-administration session of a Gen 1 backend when
    it knows a live session id.
  requires:
    all_of:
    - action: amplify:GetApp
      resource: "{target.resource_arn}"
    - action: amplifybackend:GetToken
      resource: "{target.amplifybackend_token_arn}"
    - action: amplifybackend:GetToken
      resource: "{target.amplifybackend_backend_arn}"
  target:
    kind: aws_service_plane_admin
    selector:
      service_plane: amplifybackend
    scope: same_account
    aggregate_as: "Amplify Studio administrators in {account}"
    grants: [Amplify Studio administrator (aws-amplify-admin)]
  conditions:
  - id: live_session
    description: A live, unexpired Studio login session id must be known (CloudTrail redacts it; it leaks only through
      URLs, browser history or logs).
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict amplifybackend:GetToken, keep Studio login URLs out of logs and shared artifacts, and delete
    unused tokens.
  notes: Application-plane administration only; not IAM credentials. Targets are the collected amplify_app entries with
    Gen 1 backend environments; accounts without them collected keep an unresolved placeholder. amplify:GetApp is on the
    app ARN and amplifybackend:GetToken on the token resource
    arn:aws:amplifybackend:<Region>:<account>:/backend/<AppId>/challenge/* ({target.amplifybackend_token_arn}). Source -
    the Service Authorization Reference JSON (servicereference.us-east-1.amazonaws.com/v1/amplifybackend), verified
    2026-10-11; CreateToken/GetToken list both the backend resource
    arn:<Partition>:amplifybackend:<Region>:<account>:/backend/<AppId>/* ({target.amplifybackend_backend_arn}) and the
    token resource arn:<Partition>:amplifybackend:<Region>:<account>:/backend/<AppId>/challenge/*
    ({target.amplifybackend_token_arn}), so both are required.
- id: aws-amplify-updateapp-startjob
  provider: aws
  service: amplify
  title: Change an Amplify app build specification and start a build
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#amplifyupdateapp-amplifystartjob
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the IAM service role attached to an Amplify app whose build it can
    reconfigure and run.
  requires:
    all_of:
    - action: amplify:UpdateApp
      resource: '{target.attached_resource_arn}'
    - action: amplify:StartJob
      resource: '*'
  target:
    kind: aws_role
    selector:
      attached_to_service: amplify
      attached_resource_covered_by: amplify:UpdateApp
    scope: same_account
    aggregate_as: Service roles of Amplify apps covered by amplify:UpdateApp in {account}
    outcome: workload_execution
  conditions:
  - id: app_has_service_role
    description: The app must have an IAM service role configured (trusting amplify.amazonaws.com); otherwise builds run
      without AWS permissions.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict amplify:UpdateApp/UpdateBranch and StartJob; keep Amplify service roles least-privileged.
  references:
  - https://docs.aws.amazon.com/amplify/latest/userguide/how-to-service-role-amplify-console.html
  notes: StartJob is authorized on branch jobs/*, distinct from the app/branch ARN. Resource:* is a conservative gate
    until the evaluator can join exact app, branch and job ARNs; automatic builds or webhooks require a separate
    observed trigger fact.
- id: aws-amplify-updatebranch-startjob
  provider: aws
  service: amplify
  title: Change an Amplify branch's build environment variables and start a build
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#amplifyupdatebranch-amplifystartjob--branch-scoped-build-code-execution
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the IAM service role of an Amplify app whose branch build environment
    it can change and build.
  requires:
    all_of:
    - action: amplify:UpdateBranch
      resource: '{target.attached_resource_arn}'
    - action: amplify:StartJob
      resource: '*'
  target:
    kind: aws_role
    selector:
      attached_to_service: amplify
      attached_resource_covered_by: amplify:UpdateBranch
    scope: same_account
    aggregate_as: Service roles of Amplify apps with branches covered by amplify:UpdateBranch in {account}
    outcome: workload_execution
  conditions:
  - id: app_has_service_role
    description: The app must have an IAM service role configured (trusting amplify.amazonaws.com); otherwise builds run
      without AWS permissions.
  - id: runtime_honours_startup_variable
    description: The existing build must start an interpreter that loads a startup environment variable pointing at
      content reachable in the build workspace; a branch buildSpec override was observed not to be executed.
  - id: trigger
    description: Automatic builds or an incoming webhook can replace amplify:StartJob as the trigger.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict amplify:UpdateBranch, amplify:UpdateApp and amplify:StartJob to deployment administrators and
    keep Amplify service roles least-privileged.
  references:
  - https://docs.aws.amazon.com/amplify/latest/userguide/how-to-service-role-amplify-console.html
  notes: StartJob is authorized on branch jobs/*, distinct from the app/branch ARN. Resource:* is a conservative gate
    until the evaluator can join exact app, branch and job ARNs; automatic builds or webhooks require a separate
    observed trigger fact.
- id: aws-amplify-updateapp-passrole
  provider: aws
  service: amplify
  title: Repoint an Amplify app service role and start a build
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#amplifyupdateapp--iampassrole--repoint-the-app-onto-a-more-privileged-role
  source_revision: 171e422299
  summary: The source can execute a controlled build under a passable role assigned as the app service role.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
    - action: amplify:UpdateApp
      resource: '*'
    - action: amplify:StartJob
      resource: '*'
  target:
    kind: aws_role
    selector:
      trust_allows_service: amplify.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: Roles trusting amplify.amazonaws.com passable in {account}
    outcome: workload_execution
  conditions:
  - id: controlled_build
    description: An existing app must be updatable and run attacker-controlled build code under the passed service role.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Amplify roles with iam:PassedToService=amplify.amazonaws.com and specific role
    ARNs; restrict amplify:UpdateApp.
  references:
  - https://docs.aws.amazon.com/amplify/latest/APIReference/API_UpdateApp.html
  - https://docs.aws.amazon.com/amplify/latest/userguide/amplify-SSR-compute-role.html
  notes: StartJob Resource:* is conservative until app/branch/jobs ARN joins are supported; automatic triggers need an
    observed trigger fact. SSR compute role is a separate path and does not require StartJob.
- id: aws-amplify-updateapp-passrole-ssr
  provider: aws
  service: amplify
  title: Repoint an Amplify SSR compute role and invoke controlled SSR code
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#amplifyupdateapp--iampassrole--repoint-the-app-onto-a-more-privileged-role
  source_revision: 171e422299
  summary: The source can execute controlled SSR code as a passable compute role of an updatable app.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
    - action: amplify:UpdateApp
      resource: '*'
  target:
    kind: aws_role
    selector:
      trust_allows_service: amplify.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: Roles trusting amplify.amazonaws.com passable in {account}
    outcome: workload_execution
  conditions:
  - id: controlled_ssr
    description: The existing app must deploy attacker-controlled SSR code and an HTTP request must reach that SSR route
      under the new compute role.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Amplify roles with iam:PassedToService=amplify.amazonaws.com and specific role
    ARNs; restrict amplify:UpdateApp.
  references:
  - https://docs.aws.amazon.com/amplify/latest/APIReference/API_UpdateApp.html
  - https://docs.aws.amazon.com/amplify/latest/userguide/amplify-SSR-compute-role.html
  notes: No StartJob is needed for the SSR request; the route, deployed code and app-to-role association must be
    observed or UNKNOWN.
- id: aws-amplify-config-credential
  provider: aws
  service: amplify
  title: Read plaintext variables and build-log URLs that may contain credentials
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#amplifygetapp-amplifygetbranch-amplifylistapps-amplifylistbranches-amplifygetjob--read-deployment-variables-and-build-logs
  source_revision: 0b36331
  summary: A verified exposed AWS credential for another principal can be read by the source.
  requires:
    all_of:
    - action: amplify:GetApp
      resource: '*'
    - action: amplify:GetBranch
      resource: '*'
    - action: amplify:GetJob
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-amplify-config-credential
    scope: same_account
  conditions:
  - id: verified_evidence
    description: The exact usable credential and its newly reachable owner, or service-plane administrator grant, must
      be verified; absent evidence yields UNKNOWN.
  - id: verified_collector_fact
    description: The requested collector fact must bind the source, exact resource, newly reachable authority and all
      runtime prerequisites; without it the result is UNKNOWN.
  confidence: conditional
  severity: high
  mitigation: Restrict the listed action to approved operators and protect exposed credentials.
  notes: Required collector evidence is absent from current snapshots; missing evidence remains UNKNOWN/unresolved.
