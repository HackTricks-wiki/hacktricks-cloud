# Exact originals: docs/privesc-ledgers/aws-scope-archive-20261016/foothold-strict-re-audit.yaml.txt.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#iampassrole-iamaddroletoinstanceprofile
  source_revision: 171e422299
  technique: Add a role to an instance profile used by an instance the source controls
  reason: AddRoleToInstanceProfile and PassRole can put a role in one empty instance profile,
    or replacement additionally needs RemoveRoleFromInstanceProfile. The profile must then be
    attached to an exact instance the caller can run code on, and that instance must expose
    usable profile credentials through IMDS after propagation. Current inventory has no
    caller-to-instance code or session foothold and no profile-change-to-credential witness;
    placing the role in a profile alone does not yield its credentials.
  prior_id: aws-ec2-passrole-addroletoinstanceprofile
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ml-dataaccess-passrole-privesc/README.md#affected-actions-non-exhaustive
  source_revision: 171e422299
  technique: Create a Parallel Computing Service (PCS) compute node group with a passed instance
    profile
  reason: Node group creation starts compute capacity, but the source is not proved to submit
    a job or execute on the nodes; that separate foothold is only a prose condition.
  prior_id: aws-pcs-passrole-createcomputenodegroup
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#rolesanywhereupdateprofile--remove-the-session-policy-boundary
  source_revision: 171e422299
  technique: Remove the session-policy restriction of an IAM Roles Anywhere profile
  reason: The source is not proved to possess a usable private key and accepted certificate for
    the exact profile and role, nor that the removed session policy previously denied a permission;
    profile mutation alone grants no caller session.
  prior_id: aws-rolesanywhere-updateprofile-remove-session-policy
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#rolesanywheredeleteattributemapping--putattributemapping--exploit-missing-certificate-tags
  source_revision: 6fb9ac51fd
  technique: Remove a certificate attribute mapping that a negative role-trust condition relies
    on
  reason: The source is not proved to possess a usable private key/certificate or that the exact
    role trust has the described negative/IfExists condition; mapping mutation alone grants no
    credential.
  prior_id: aws-rolesanywhere-attributemapping-negative-trust-condition
