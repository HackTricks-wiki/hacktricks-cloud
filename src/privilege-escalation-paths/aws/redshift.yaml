# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# Amazon Redshift privilege escalation techniques.
# Source: hacktricks-cloud aws-redshift-privesc/README.md (rev a53b46392c; partially re-pointed to rev 171e422299).
# Uses {target.resource_arn} and via_resource_type (see header of lambda.yaml).
# Database access to a cluster/namespace lets SQL (COPY/UNLOAD, external functions/schemas, Spectrum) use the IAM roles
# attached to it. AWS docs: "By default, IAM roles that are available to an Amazon Redshift cluster are available to all
# users on that cluster"; access can be narrowed with ASSUMEROLE grants or an sts:ExternalId trust condition listing dbuser
# ARNs. Privileges obtained are bounded to the services those SQL integrations call (S3, Lambda, Glue/Athena catalog, EMR,
# DynamoDB, Kinesis), plus role chaining to roles that trust the attached role.

