# AWS post-exploitation catalog additions.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#trigger-an-existing-iot-device-management-command
  technique: Trigger privileged stored device command
  reason: The stored command must actually implement a privileged device operation; command payload/template, target
    firmware behavior, and dynamic parameter acceptance are not established by IAM inventory.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#read-and-manipulate-iot-jobs-through-the-device-data-plane
  technique: Read IoT Jobs document via DescribeJobExecution
  reason: A queued job document must exist for the known thing and contain a reusable bootstrap credential or private
    URL; job-document content is unavailable in configuration inventory.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#read-and-manipulate-iot-jobs-through-the-device-data-plane
  technique: Read IoT Jobs document via StartNextPendingJobExecution
  reason: A pending job must exist and its returned document must contain a usable credential; the call also mutates
    execution state, which permissions alone do not establish.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#read-and-manipulate-iot-jobs-through-the-device-data-plane
  technique: Read IoT Jobs document via UpdateJobExecution
  reason: The known execution must accept the requested update and return a document with a usable credential; its
    content and current state are runtime facts.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#receive-mqtt-telemetry-and-messages
  technique: Read credentials carried by MQTT messages
  reason: Matching live MQTT traffic must actually contain a reusable secret; topic authorization alone only grants
    message read.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#open-a-managed-tunnel-to-a-device
  technique: Open IoT tunnel to privileged device service
  reason: An active destination agent and service mapping must expose a privileged device service; the port, device
    behavior, and destination token delivery are runtime facts.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#publish-commands-or-forged-telemetry
  technique: Publish commands to privileged device/automation consumer
  reason: The subscribed device or automation must interpret attacker-published fields as a privileged instruction;
    that handler/firmware behavior is not in the snapshot.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#iotcreatetopicrule--iampassrole--durable-fleet-wide-mqtt-exfiltration
  technique: Create IoT HTTP topic rule without PassRole
  reason: An HTTP topic rule only gains credentials if the selected traffic contains reusable secrets and a reachable
    attacker sink accepts them; message content and sink behavior are runtime facts.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-core-post-exploitation/README.md#iotcreatetopicrule--iampassrole--durable-fleet-wide-mqtt-exfiltration
  technique: Create IoT Lambda topic rule for fleet tap
  reason: The Lambda rule action only gains credentials if traffic contains reusable secrets and the invoked function
    sends them to an attacker-readable sink; code and traffic content need review.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-twinmaker-post-exploitation/README.md#entity-component-and-graph-disclosure
  technique: Recover credentials embedded in TwinMaker static values
  reason: TwinMaker entity/component static values must contain an actual reusable credential; the ordinary graph
    inventory does not inspect or classify property contents.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-twinmaker-post-exploitation/README.md#entity-component-and-graph-disclosure
  technique: Recover credential through TwinMaker ExecuteQuery
  reason: ExecuteQuery results must include a usable secret rather than ordinary graph data; the exact query result
    content needs inspection.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-twinmaker-post-exploitation/README.md#stealth-property-theft-through-a-configured-connector
  technique: Read secrets through TwinMaker connector
  reason: The configured connector must expose a credential-bearing external property to the caller; connector code,
    backing data, and returned values need inspection.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#firmware-and-group-delivery-abuse
  technique: Deliver attacker firmware to gateway or device group
  reason: A compatible device must install/execute the delivered firmware and expose a stronger device identity
    or privilege; task permissions alone do not prove this host outcome.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kendra-post-exploitation/README.md#kendracreatedatasource--updatedatasource--iampassrole--poison-or-repoint-ingestion
  technique: Create Kendra source that indexes connector-reachable credentials
  reason: The connector role must reach credential-bearing repository content and indexing plus Query/Retrieve ACL
    context must disclose it; repository bytes and ACL behavior are not in the snapshot.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-keyspaces-post-exploitation/README.md#exfiltrate-future-changes-through-cdc-without-table-select
  technique: Read credentials through Keyspaces CDC
  reason: Captured CDC images must contain reusable credentials; stream permission and capture mode alone do not
    establish secret content.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#steal-retained-records-with-shared-throughput-reads
  technique: Steal credentials from retained Kinesis records
  reason: Retained Kinesis records must contain reusable credentials; read permission alone does not establish that
    content.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#abuse-enhanced-fan-out
  technique: Register and subscribe to credential-bearing stream
  reason: Future subscribed stream records must contain reusable credentials; consumer registration only grants
    authorized record delivery.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#inject-forged-records
  technique: Trigger privileged Kinesis Lambda consumer with forged record
  reason: The Lambda handler must treat forged Kinesis fields as authority for a privileged operation; mapping configuration
    alone proves invocation, not misuse.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#inject-forged-records
  technique: Trigger privileged Kinesis consumer with PutRecords
  reason: A non-Lambda consumer must treat forged PutRecords fields as authority for a privileged operation; consumer
    code and record processing require review.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-video-streams-post-exploitation/README.md#remap-webrtc-cloud-storage-without-destination-stream-permission
  technique: Redirect WebRTC recording to readable KVS stream
  reason: Future WebRTC recordings must be written to a stream the actor can read; the destination permissions,
    active peers, and recorded content are not proven by update permission.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-video-streams-post-exploitation/README.md#recover-turn-credentials-and-impersonate-webrtc-peers
  technique: Join KVS signaling as master peer
  reason: ConnectAsMaster permits a signaling connection, but another peer must accept the master identity and expose
    a privileged operation or credential; channel authorization alone does not prove escalation.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kms-post-exploitation/README.md#derive-shared-secret
  technique: Derive trusted ECDH shared secret
  reason: The ECDH output must be accepted by a protocol as an authentication or decryption secret; peer protocol
    state and traffic content are outside inventory.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kms-post-exploitation/README.md#nitro-enclaveskms-integration-attacks
  technique: Bypass enclave binding by omitting Recipient
  reason: A KMS key policy must allow a non-attested request when Recipient is omitted and a protected ciphertext
    must be available; those exact request and content facts are unproven.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kms-post-exploitation/README.md#encryptdecrypt-information
  technique: Decrypt protected credentials with KMS key
  reason: The actor needs ciphertext encrypted under the usable KMS key and that plaintext must contain a reusable
    credential; decrypt permission alone is ordinary authorized decryption.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-function-access-post-exploitation/README.md#invoke-a-lambda
  technique: Invoke unsafe privileged Lambda with crafted payload
  reason: The invoked function must have a handler branch that turns attacker-supplied payload into a privileged
    operation; InvokeFunction permission alone proves only invocation.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-function-access-post-exploitation/README.md#lambdalistfunctions-and-lambdalistversionsbyfunction--read-plaintext-environment-variables
  technique: Read Lambda version environment secret via ListVersionsByFunction
  reason: A listed Lambda version must store a reusable credential in plaintext environment variables; that content
    is not in the permission snapshot.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-post-exploitation/README.md#aws-lambda--efs-mount-injection-data-exfiltration
  technique: Mount EFS to read shared credentials
  reason: The summary documents EFS mount injection, but the function must pass VPC/mount/role gates and the mounted
