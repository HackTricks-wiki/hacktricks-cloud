  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-post-exploitation/README.md#steal-others-lambda-url-requests
  technique: Steal request credentials from compromised warm Lambda
  reason: A warm compromised runtime must later receive another user request carrying a reusable cookie or token;
