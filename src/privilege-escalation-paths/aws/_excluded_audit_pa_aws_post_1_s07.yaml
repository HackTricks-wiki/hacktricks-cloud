  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-post-exploitation/README.md#aws-lambda--event-source-mapping-target-hijack
  technique: Redirect event source mapping to controlled function
  reason: The summary documents mapping diversion, but the controlled receiver must poll the source and incoming
