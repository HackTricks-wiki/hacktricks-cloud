# These entries asserted a full IAM role or principal path without proof of that identity.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appconfig-privesc/README.md#appconfigcreateconfigurationprofile--iampassrole--deploymentread-permissions
  technique: aws-appconfig-passrole-createconfigurationprofile
  reason: AppConfig uses the passed role only to fetch specified configuration bytes; the source receives no role
    session or general role permissions.
- source: src/pentesting-cloud/aws-security/aws-services/aws-lightsail-enum.md#metadata
  technique: aws-lightsail-imds-verified-role
  reason: The source is an unmodeled local-host foothold with no principal permission or action; requires host access,
    and cannot establish an IAM-principal-to-role edge from the catalog.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-rds-privesc/README.md#rdsmodifydbinstance
  technique: aws-rds-modifydbinstance-master-password-associated-roles
  reason: A database admin password enables only engine integrations such as specific S3/Lambda operations; it does
    not yield an associated IAM role session or full role permissions.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#out-of-band-sql-via-rds-data-api-by-enabling-http-endpoint--resetting-master-password
  technique: aws-rds-modifydbcluster-master-password-associated-roles
  reason: Aurora master access enables only configured SQL integrations; the associated IAM role is not assumed
    by the source.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#read-the-rds-managed-master-password-from-secrets-manager-rdsdescribedb--secretsmanagergetsecretvalue
  technique: aws-rds-managed-master-secret-associated-roles
  reason: Reading the database master secret yields DB access, not credentials for the associated IAM role; any
    SQL integration effect is limited and must be modeled separately.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#redshift
  technique: aws-redshift-modifycluster-master-password
  reason: Redshift admin access enables only configured SQL integrations; attached IAM role credentials and unrestricted
    role permissions are not obtained.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#redshiftgetclustercredentials
  technique: aws-redshift-getclustercredentials
  reason: Vended database credentials and SQL ASSUMEROLE grants are not the attached IAM role session or its full
    IAM permissions.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#redshiftgetclustercredentialswithiam
  technique: aws-redshift-getclustercredentialswithiam
  reason: IAM-mapped database credentials grant database/SQL integration rights, not the attached IAM role session
    or full IAM permissions.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#redshift-serverlessgetcredentials
  technique: aws-redshift-serverless-getcredentials
  reason: Serverless database credentials grant database/SQL integration rights, not the namespace role session
    or full IAM permissions.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-post-exploitation/README.md#iampassrole-s3createaccessgrantslocation-s3createaccessgrant-s3getdataaccess
  historical_source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-s3-privesc/README.md#iampassrole-s3createaccessgrantslocation-s3createaccessgrant-s3getdataaccess
  source_revision: 3ad99dc7ac
  technique: aws-s3-accessgrants-passrole-location-getdataaccess
  reason: GetDataAccess vends credentials restricted by an S3 grant session policy; modeling the full passed IAM
    role as reached overstates the target permissions. AWS confines the returned session to the granted S3
    bucket, prefix or object. The separate aws-s3-accessgrants-self-grant route models a verified new READ
    permission on that bounded scope without claiming the location role's other permissions.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-snowball-post-exploitation/README.md#snowballcreatejob--iampassrole--create-a-physical-s3-export-through-a-privileged-role
  historical_source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-snowball-privesc/README.md#snowballcreatejob--iampassrole--create-a-physical-s3-export-through-a-privileged-role
  technique: aws-snowball-passrole-createjob
  reason: The passed role is used only for a physical S3 export job; the source receives data, not the role identity
    or IAM permissions.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-snowball-post-exploitation/README.md#snowballupdatejob--make-an-existing-snow-role-export-additional-s3-data-to-another-address
  historical_source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-snowball-privesc/README.md#snowballupdatejob--make-an-existing-snow-role-export-additional-s3-data-to-another-address
  technique: aws-snowball-updatejob-existing-role
  reason: Retargeting a physical export job discloses selected S3 data but does not yield the stored role identity
    or IAM permissions.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#statessendtasksuccess--inject-callback-output-into-a-privileged-next-state
  technique: aws-stepfunctions-activity-callback-output-injection
  reason: GetActivityTask can supply a live token and SendTaskSuccess can inject output,
    but a role edge needs the exact execution, state-machine definition and dataflow
    proving that the controlled output reaches a sensitive downstream AWS action
    under a named execution role. A fixed business branch alone does not grant
    that role's credentials or all its permissions.
