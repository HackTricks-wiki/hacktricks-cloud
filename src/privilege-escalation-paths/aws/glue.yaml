# AWS Glue privilege escalation techniques.
# Source: hacktricks-cloud aws-glue-privesc/README.md (rev a53b46392c; re-pointed to rev 171e422299).
# Uses {target.resource_arn}, {target.artifact_arn}, via_resource_type and via_artifact_type (see header of lambda.yaml).

- id: aws-glue-passrole-createdevendpoint
  provider: aws
  service: glue
  title: Create a Glue development endpoint with a passed role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-a-legacy-development-endpoint-with-a-privileged-role
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting glue.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: glue:CreateDevEndpoint
        resource: "*"
    any_of:
      - - action: glue:GetDevEndpoint
          resource: "*"
      - - action: glue:GetDevEndpoints
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: glue.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting glue.amazonaws.com passable in {account}"
  conditions:
    - id: dev_endpoint_availability
      description: Glue development endpoints are a legacy feature (not supported on Glue 2.0+ runtimes); creation may be unavailable in some regions/accounts.
    - id: network_reachability
      description: VPC endpoints only expose a private address; the source needs a network path to SSH.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Glue roles with iam:PassedToService=glue.amazonaws.com and deny glue:CreateDevEndpoint.
  references:
    - https://docs.aws.amazon.com/glue/latest/dg/dev-endpoints.html
  notes: Legacy feature; kept because the API still exists. Reach is roles trusting glue.amazonaws.com within PassRole scope.

- id: aws-glue-updatedevendpoint
  provider: aws
  service: glue
  title: Replace the SSH key of an existing Glue development endpoint
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#replace-the-ssh-key-on-a-legacy-development-endpoint
  source_revision: 171e422299
  summary: The source can obtain the privileges of the role of existing Glue development endpoints it can update.
  requires:
    all_of:
      - action: glue:UpdateDevEndpoint
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_resource_type: glue_dev_endpoint
    scope: same_account
    aggregate_as: "Roles of existing Glue dev endpoints in {account}"
  conditions:
    - id: network_reachability
      description: The source needs a network path to the endpoint address (private for VPC endpoints).
    - id: endpoint_address_known
      description: The source must know the endpoint address; glue:GetDevEndpoint(s) reveals it, but it may also be known from elsewhere.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Remove legacy dev endpoints and restrict glue:UpdateDevEndpoint.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_UpdateDevEndpoint.html
  notes: Only endpoints that already exist; snapshot must enumerate dev endpoints and their roles.

- id: aws-glue-startjobrun-override-script
  provider: aws
  service: glue
  title: Start an existing Glue job overriding its script or dependency arguments
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-or-modify-and-run-a-glue-job
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of existing Glue jobs it can start.
  requires:
    all_of:
      - action: glue:StartJobRun
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_resource_type: glue_job
    scope: same_account
    aggregate_as: "Execution roles of Glue jobs startable in {account}"
  conditions:
    - id: job_role_reads_attacker_object
      description: The job role must be able to read an S3 location whose content the source controls (its own public/cross-account bucket or a writable bucket the role can read).
    - id: runtime_packaging
      description: Dependency override format depends on job type/runtime.
  blockers:
    - glue_nonoverridable_arguments
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Pin --scriptLocation, --extra-py-files, --extra-jars and --additional-python-modules in NonOverridableArguments and restrict glue:StartJobRun to orchestrators.
  references:
    - https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-glue-arguments.html
  notes: glue_nonoverridable_arguments blocks only when ALL loader arguments are pinned; pinning just --scriptLocation leaves the dependency path. The HEAD page no longer has a dedicated heading for this variant; it is sourced at the job heading.

- id: aws-glue-s3-putobject-job-script
  provider: aws
  service: glue
  title: Overwrite the S3 script or dependency of an existing Glue job
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-or-modify-and-run-a-glue-job
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of Glue jobs that load an S3 script or dependency it can overwrite.
  requires:
    all_of:
      - action: s3:PutObject
        resource: "{target.artifact_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_artifact_type: s3_object
    scope: same_account
    aggregate_as: "Glue job roles loading writable S3 code in {account}"
  conditions:
    - id: job_runs_later
      description: A scheduled, triggered or operator-started run must occur after the overwrite.
    - id: object_lock_or_kms
      description: Object Lock, bucket policies, or SSE-KMS keys the source cannot use may prevent the write.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Store Glue scripts in buckets writable only by the deployment pipeline, enable versioning and integrity checks, and alert on writes to script prefixes.
  references:
    - https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-python-libraries.html
  notes: The artifact set is ScriptLocation plus --extra-py-files/--extra-jars/--additional-python-modules default arguments of each job. The HEAD page no longer has a dedicated heading for this variant; it is sourced at the job heading.

- id: aws-glue-passrole-createjob-or-updatejob-run
  provider: aws
  service: glue
  title: Create or update a Glue job with a passed role and run it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-or-modify-and-run-a-glue-job
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting glue.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
    any_of:
      - - action: glue:CreateJob
          resource: "*"
        - action: glue:StartJobRun
          resource: "*"
      - - action: glue:CreateJob
          resource: "*"
        - action: glue:CreateTrigger
          resource: "*"
      - - action: glue:UpdateJob
          resource: "*"
        - action: glue:StartJobRun
          resource: "*"
      - - action: glue:UpdateJob
          resource: "*"
        - action: glue:CreateTrigger
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: glue.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting glue.amazonaws.com passable in {account}"
  conditions:
    - id: script_location_readable
      description: The passed role must be able to read the script location the source supplies.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
    - id: updatejob_existing_job
      description: The UpdateJob variants need an existing job within the UpdateJob Resource.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on Glue roles with iam:PassedToService, and restrict job creation/update and trigger creation to the deployment pipeline.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_CreateJob.html
  notes: Reach is roles trusting glue.amazonaws.com in PassRole scope.

- id: aws-glue-runstatement-interactive-session
  provider: aws
  service: glue
  title: Execute code in an existing Glue interactive session
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#execute-code-in-an-existing-interactive-session
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of existing Glue interactive sessions.
  requires:
    all_of:
      - action: glue:RunStatement
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_resource_type: glue_session
    scope: same_account
    aggregate_as: "Roles of Glue interactive sessions in {account}"
  conditions:
    - id: session_ready
      description: A session must be in READY state at the time of abuse; sessions are ephemeral (idle timeout).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Scope glue:RunStatement to session ARNs owned by the caller (e.g. via tags/aws:userid naming) and keep session roles least-privileged.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_RunStatement.html
  notes: Snapshot-time evaluation only sees sessions alive at collection time.

- id: aws-glue-updatejob-existing-role
  provider: aws
  service: glue
  title: Replace an existing Glue job definition that keeps its attached role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-or-modify-and-run-a-glue-job
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of existing Glue jobs it can update.
  requires:
    all_of:
      - action: glue:UpdateJob
        resource: "{target.resource_arn}"
      - action: iam:PassRole
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_resource_type: glue_job
    scope: same_account
    aggregate_as: "Execution roles of Glue jobs updatable in {account}"
  conditions:
    - id: job_runs_later
      description: An existing trigger/schedule/workflow or an operator must run the job after the update (or the source holds glue:StartJobRun).
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict glue:UpdateJob to the deployment pipeline on specific job ARNs.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_UpdateJob.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_JobUpdate.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsglue.html
  notes: HackTricks states UpdateJob alone suffices, but JobUpdate marks Role as required and states the previous job definition is completely overwritten, and the Service Authorization Reference lists iam:PassRole as a dependent action of glue:UpdateJob, so PassRole on the job's role is required. Distinct from aws-glue-passrole-createjob-or-updatejob-run because the run comes from an existing trigger, schedule or operator rather than the source.

- id: aws-glue-passrole-createsession
  provider: aws
  service: glue
  title: Create a Glue interactive session with a passed role and run statements in it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-an-interactive-session-with-a-privileged-role
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting glue.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: glue:CreateSession
        resource: "*"
      - action: glue:RunStatement
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: glue.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting glue.amazonaws.com passable in {account}"
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
    - id: statement_output
      description: Reading statement output needs glue:GetStatement; code still runs without it.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on Glue roles with iam:PassedToService=glue.amazonaws.com, scope glue:CreateSession and glue:RunStatement to owner-tagged sessions, and keep session roles least-privileged.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_CreateSession.html
    - https://docs.aws.amazon.com/glue/latest/dg/glue-is-security.html
  notes: Distinct from aws-glue-runstatement-interactive-session (existing session, no PassRole). Reach is roles trusting glue.amazonaws.com in PassRole scope.
