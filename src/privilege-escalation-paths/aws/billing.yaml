- id: aws-billing-enable-dormant-iam-console-access
  provider: aws
  service: billing
  title: Enable dormant Billing console grants
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-invoicing-and-billing-privesc/README.md#enable-previously-granted-legacy-billing-permissions
  summary: The source can enable account Billing console IAM access, activating previously masked permissions for itself
    or another identity.
  requires:
    all_of:
    - action: billing:UpdateIAMAccessPreference
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-billing-enable-dormant-iam-console-access
    scope: same_account
  severity: high
  mitigation: Restrict billing:UpdateIAMAccessPreference and review masked Billing console grants.
  references:
  - https://docs.aws.amazon.com/service-authorization/latest/reference/list_billing.html
  - https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/control-access-billing.html
  confidence: conditional
  conditions:
  - id: dormant_grant
    description: Allow IAM Access is disabled and the exact source has an applicable Billing console policy grant that
      becomes effective when enabled.
  - id: verified_collector_fact
    description: The requested collector fact must bind the source, exact resource, newly reachable authority and all
      runtime prerequisites; without it the result is UNKNOWN.
  notes: Required collector evidence is absent from current snapshots; missing evidence remains UNKNOWN/unresolved.
