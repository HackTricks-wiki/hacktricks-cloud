# Amazon Connect application-plane privilege escalation techniques (aws_service_plane_admin targets).
# Source: hacktricks-cloud aws-connect-privesc/README.md (rev 171e422299).
# Connect instances, users and security profiles are not collected: every edge is one unresolved placeholder per account.

- id: aws-connect-updateuseridentityinfo-takeover
  provider: aws
  service: connect
  title: Take over a Connect-managed user by changing its email
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-connect-privesc/README.md#take-over-a-connect-managed-user-through-updateuseridentityinfo
  source_revision: 171e422299
  summary: The source can take over CONNECT_MANAGED Amazon Connect users (including administrators) by redirecting their
    email and resetting the password.
  requires:
    all_of:
    - action: connect:UpdateUserIdentityInfo
      resource: "{target.resource_arn}/agent/*"
  target:
    kind: aws_service_plane_admin
    selector:
      service_plane: connect
      resource_permission_covers_target: connect:UpdateUserIdentityInfo
    scope: same_account
    aggregate_as: "Amazon Connect administrators in {account}"
    grants: [Connect user security profiles (Admin when the victim is an administrator)]
  conditions:
  - id: connect_managed_identity
    description: Only CONNECT_MANAGED identity; SAML rejects an email change and EXISTING_DIRECTORY identities are
      managed by the directory.
  - id: admin_victim
    description: Administration is reached only when the targeted user holds an administrative security profile.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict connect:UpdateUserIdentityInfo to identity administrators and alert on email changes of
    administrators followed by password resets.
  notes: Contact-center administration only; does not grant the victim's IAM identity.

- id: aws-connect-security-profile-admin
  provider: aws
  service: connect
  title: Grant Connect Admin through security-profile assignment or mutation
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-connect-privesc/README.md#grant-admin-through-security-profile-mutation
  source_revision: 171e422299
  summary: The source can give a Connect user it controls the Admin security profile, or widen a profile already
    assigned to it, gaining Amazon Connect application administration.
  requires:
    any_of:
    - - action: connect:UpdateUserSecurityProfiles
        resource: "{target.resource_arn}/agent/*"
      - action: connect:UpdateUserSecurityProfiles
        resource: "{target.resource_arn}/security-profile/*"
    - - action: connect:UpdateSecurityProfile
        resource: "{target.resource_arn}/security-profile/*"
  target:
    kind: aws_service_plane_admin
    selector:
      service_plane: connect
    scope: same_account
    aggregate_as: "Amazon Connect administrators in {account}"
    grants: [Connect Admin security profile]
  conditions:
  - id: controlled_connect_user
    description: The source must control a Connect user (to assign the profile to, or whose assigned profile it widens).
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict connect:UpdateUserSecurityProfiles and connect:UpdateSecurityProfile (connect:InstanceId /
    resource tags) and alert on Admin-profile assignment.
  notes: UpdateUserSecurityProfiles must allow both the user ARN and every supplied security-profile ARN. Service-level
    escalation only, not IAM administrator access.
- id: aws-connect-saml-session-name-impersonation
  provider: aws
  service: connect
  title: Impersonate a SAML Connect user by choosing the role-session name
  source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-connect-privesc/README.md#impersonate-a-saml-connect-user-with-a-controllable-role-session-name
  source_revision: 171e422299
  summary: The source can obtain the Amazon Connect application privileges (for example the Admin security profile) of
    any SAML Connect user whose username it can use as its role-session name.
  requires:
    all_of:
    - action: connect:GetFederationToken
      resource: '*'
  target:
    kind: aws_service_plane_admin
    selector:
      service_plane: connect
    scope: same_account
    aggregate_as: Amazon Connect administrators in {account}
    grants:
    - Connect Admin security profile
  conditions:
  - id: saml_identity_and_session_name
    description: The instance uses SAML identity management and the source can assume the federation role with an
      arbitrary RoleSessionName matching the victim's case-sensitive Connect username.
  - id: broad_federation_grant
    description: The federation role's connect:GetFederationToken grant is not restricted to the intended per-user
      identity pattern.
  - id: resource_pattern
    description: A caller-specific /user/${aws:userid} grant can also work when its policy expansion matches the assumed
      role session; ordinary instance and /agent ARNs do not authorize GetFederationToken.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Prevent arbitrary RoleSessionName selection on Connect federation roles (sts:RoleSessionName conditions)
    and restrict connect:GetFederationToken to the caller's own user.
  notes: Contact-center administration only; the Connect token is not AWS credentials. The requirement is evaluated on
    the source; when the source reaches it only through the federation role, that role's edge carries the chain.
