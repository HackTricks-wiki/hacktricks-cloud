# AWS Mainframe Modernization (M2) privilege escalation techniques.
# Source: hacktricks-cloud aws-mainframe-modernization-privesc/README.md.

- id: aws-m2-passrole-createapplication-deploy
  provider: aws
  service: m2
  title: Create, deploy and start an M2 application with a passed application role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mainframe-modernization-privesc/README.md#m2createapplication--iampassrole---execute-a-workload-with-an-application-role
  source_revision: 171e422299
  summary: The source can use the privileges of a passable role trusting m2.amazonaws.com by deploying attacker-controlled application artifacts that run with that role as the application role.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: m2:CreateApplication
        resource: "*"
      - action: m2:CreateDeployment
        resource: "*"
      - action: m2:StartApplication
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: m2.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Mainframe Modernization application roles in {account}"
  conditions:
    - id: runtime_environment_exists
      description: An existing managed runtime environment must be available for the deployment (m2:CreateDeployment covers both the new application and that environment).
    - id: valid_artifacts
      description: The source must read an S3 application definition and artifacts valid for the chosen engine (s3:GetObject and s3:ListBucket, plus KMS permissions for a customer key).
    - id: role_use_bounded
      description: The application role is used by the managed runtime for the resources the workload accesses; the page does not show the role's credentials being exposed to workload code, so the reachable authority is what the workload can drive through the runtime.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict this.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict iam:PassRole on M2 application roles to deployment pipelines with iam:PassedToService and exact role ARNs, and keep application roles least-privileged.
  references:
    - https://docs.aws.amazon.com/m2/latest/userguide/security-iam.html
  notes: Creating an application record alone does not use the role; deployment and start are required.

- id: aws-m2-startbatchjob-adhoc-s3
  provider: aws
  service: m2
  title: Run an attacker-selected ad-hoc S3 batch job in an existing M2 application
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mainframe-modernization-privesc/README.md#m2startbatchjob---run-an-attacker-selected-ad-hoc-s3-job-in-an-application
  source_revision: 171e422299
  summary: The source can act with the runtime authority of an existing M2 application by starting an ad-hoc batch job whose definition it supplies from S3.
  requires:
    all_of:
      - action: m2:StartBatchJob
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: m2.amazonaws.com
      attached_resource_covered_by: m2:StartBatchJob
    scope: same_account
    aggregate_as: "Mainframe Modernization application roles reachable by m2:StartBatchJob in {account}"
  conditions:
    - id: running_application
      description: The application must be deployed and running on a managed runtime, and the batch definition must be readable by the application from S3.
    - id: engine_capability
      description: Code execution needs a job or program that can invoke an attacker-controlled executable or OS command; otherwise the impact is limited to the installed batch programs.
    - id: application_auth
      description: When application-operation authorization is enabled a valid authSecretsManagerArn may also be required.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Scope m2:StartBatchJob to operators of the exact application and keep application roles least-privileged.
  references:
    - https://docs.aws.amazon.com/m2/latest/APIReference/API_StartBatchJob.html
  notes: No iam:PassRole is checked at StartBatchJob; the application role was authorized when the application was created.
