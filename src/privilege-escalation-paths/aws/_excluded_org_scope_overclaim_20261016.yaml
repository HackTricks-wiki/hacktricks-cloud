# Organization/account-admin paths missing exact scope or authentication prerequisites.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-account-management-privesc/README.md#accountputcontactinformation--startprimaryemailupdate--account-recovery-and-root-email-takeover
  technique: aws-account-startprimaryemailupdate-member-root
  reason: Changing the root email and resetting the password does not bypass an enrolled root MFA device. The entry
    lacks exact evidence that the target account has no MFA barrier or a usable recovery path, so root/account-admin
    access is not established.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-organizations-prinvesc/README.md#organizationsregisterdelegatedadministrator--delegate-a-service-to-a-member-account
  historical_source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-organizations-prinvesc/README.md#organizationsregisterdelegatedadministrator--hand-a-services-org-wide-control-to-an-account-you-own
  technique: aws-organizations-registerdelegatedadministrator
  reason: RegisterDelegatedAdministrator alone grants only service-specific delegation to a separate controlled
    member-account identity. The catalog does not bind that identity, service-specific administrative actions, or
    member targets, so aws_account_admin for all members is overbroad.
