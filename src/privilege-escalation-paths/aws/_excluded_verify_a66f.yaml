  technique: Authenticate directly with `memorydb:Connect`
  reason: memorydb:Connect directly authorizes IAM authentication as a named IAM-enabled MemoryDB ACL user, with
    authorization required on both the cluster and user ARN. It does not by itself yield another AWS principal or
    a reusable secret; effective data-plane access also needs the user attached to the cluster ACL, an allowed network
    route and commands permitted by the access string. Any downstream credential gain depends on exact key contents
    and credential validity, which the snapshot cannot establish.
