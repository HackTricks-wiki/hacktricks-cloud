  reason: CopySnapshot can export the MemoryDB dataset to S3 without a cluster route or ACL password. Exported keys
    may contain session tokens or application credentials, but no target identity follows from CopySnapshot permission
    alone. The exact RDB contents, a usable credential and downstream acceptance are needed; snapshot existence
    or CreateSnapshot permission and an export-compatible bucket are separate prerequisites.
  source_revision: a66f094ede
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-memorydb-post-exploitation/README.md#memorydbupdatecluster---remove-authentication-andor-replace-the-network-perimeter
  technique: '`memorydb:UpdateCluster` - remove authentication and/or replace the network perimeter'
  reason: Changing a MemoryDB cluster to the open-access ACL can remove its data-plane authentication boundary,
    but UpdateCluster permission alone does not prove a reachable cluster or a newly gained identity. The service-linked
    role must exist, the ACL change must be accepted, and the attacker needs a VPC route and admitted security group.
    Security-group-only replacement does not bypass the ACL. Any downstream credential gain also depends on cluster
    data contents and validity; these reachability and content facts are absent from the snapshot.
  source_revision: a66f094ede
