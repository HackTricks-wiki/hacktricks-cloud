    contents nor session validity follows from IAM permissions.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-device-farm-enum.md#enumerate-testgrid-sessions-and-artifacts
  technique: Device Farm TestGrid artifact credential disclosure
  reason: ListTestGridSessionArtifacts returns short-lived URLs to logs or videos. A target identity requires a
    readable recording containing an active credential or cookie and verification of its account; artifact bytes
    and validity are runtime facts.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-dynamodb-enum.md#dax-inherit-the-cluster-roles-dynamodb-access
  technique: DAX data-plane access through the cluster service role
  reason: DAX data actions can read or modify tables permitted to the cluster role without matching direct DynamoDB
    permission, but yield scoped table-data access, not the role session or a principal identity. Actual use also
    needs a reachable cluster endpoint and matching cluster-role table permissions.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-ec2-ebs-elb-ssm-vpc-and-vpn-enum/README.md#ebs
  technique: Read API keys from EBS snapshots or restored disks
  reason: Snapshot and disk reads expose storage bytes, not a principal by themselves. Identity gain requires that
    the selected snapshot contains a still-valid credential, that the attacker can obtain its bytes (including any
    KMS or restore prerequisites), and that the issuer is verified; snapshot metadata cannot prove these facts.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-ecs-enum.md#on-host-enumeration-via-the-ecs-agent-state-db-agentdb
  technique: Read credentials from ECS agent.db plaintext environment values
  reason: agent.db is local host state and can contain plaintext task environment values, but a principal edge needs
    host or mounted-file access, an actual usable credential in those values, and verification of its issuer. ECS
    IAM configuration alone cannot prove file reachability, content, or validity.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-elastic-beanstalk-enum.md#exposure
  technique: Read source bundle from the regional Elastic Beanstalk S3 bucket and recover accidentally embedded
    credentials
  reason: A source bundle can contain a credential, but the page says only that developers may have stored one.
    A configuration snapshot cannot establish the bundle bytes, credential validity, or the identity and authority
    obtained. Requires S3 object content inspection and credential-to-principal verification; s3:GetObject alone
    is insufficient.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-elastic-beanstalk-enum.md#exposure
  technique: Overwrite the deployed source bundle and wait for a deployment to run code as its instance profile
  reason: s3:PutObject can poison a source bundle, but the page explicitly says the write does not change a running
    environment. Escalation depends on a later deployment consuming that exact object and running code with a particular
    instance profile; the future deployment and code execution are not configuration facts. The immediate rebuild
    path is already aws-elasticbeanstalk-rebuildenvironment-s3-code and needs RebuildEnvironment.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-entity-resolution-enum.md#enumerate-id-mapping
  technique: Put or add a workflow/namespace resource-policy statement to grant a chosen other account its supported
    workflow rights
  reason: PutPolicy or AddPolicyStatement can delegate supported workflow rights to another account, but an attack
    edge requires an attacker-controlled external grantee, a matching allow in that account, and an exact supported
    action/resource pairing. The local account snapshot cannot establish external identity policy or control of
    the grantee; PutPolicy permission alone is insufficient.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-gamelift-streams-enum.md#enumerate-sessions-account-wide
  technique: Read plaintext session environment variables or launch arguments containing another identity’s credential
  reason: GetStreamSession returns plaintext environment variables and launch arguments, which could contain a credential,
    but the page does not assert that any specific session does. The exact response content, credential validity,
    and distinct target identity require runtime content inspection; the IAM permission alone cannot determine an
    escalation.
  source_revision: 0b36331

- source: src/pentesting-cloud/aws-security/aws-services/aws-glue-enum.md#enumerate-connections-and-connected-records
  technique: Read a Glue connection with stored username/password and assume the connected service identity
  reason: GetConnection without HidePassword can return a stored password, but some connections have no password
    or use a Secrets Manager reference. A privilege edge requires the actual returned secret, its validity and connected-service
    identity; these response/content facts are absent from the configuration snapshot. Authorization also requires
    GetConnection on both catalog and exact connection ARN.
  source_revision: 0b36331
