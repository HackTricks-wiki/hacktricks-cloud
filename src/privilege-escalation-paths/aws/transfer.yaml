- id: aws-audit-redirect-connector-to-steal-partner-sftp-credential
  provider: aws
  service: transfer
  title: Redirect connector to steal partner SFTP credential
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#transferupdateconnector--redirect-an-sftp-connector-and-capture-its-stored-credential
  source_revision: 0b36331
  summary: The source can authenticate as partner or access partner files only when the exact target and prerequisites
    are verified.
  requires:
    all_of:
    - action: transfer:UpdateConnector
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-audit-redirect-connector-to-steal-partner-sftp-credential
    scope: same_account
    aggregate_as: Verified Authenticate as partner or access partner fil in {account}
    grants:
    - Authenticate as partner or access partner files
  conditions:
  - id: exact_verified_prerequisites
    description: Evidence must prove the connector URL update reaches an attacker endpoint accepted by host-key
      validation, a later connection occurs, and a reusable password is captured and validated for the partner identity.
      SSH public-key authentication alone does not disclose the private key.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions to approved operators and review the exact target configuration.
  notes: Evidence must bind actor, exact resource, target and all prerequisites; absent evidence is UNKNOWN, with
    no definite privilege edge.
  references:
  - https://cloud.hacktricks.wiki/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/
