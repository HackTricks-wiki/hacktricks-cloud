# AWS Transfer Family privilege escalation techniques.
# Source: hacktricks-cloud aws-transfer-family-privesc/README.md (rev a53b46392c).
# Uses {target.resource_arn} and via_resource_type (see header of lambda.yaml).

- id: aws-transfer-importsshpublickey
  provider: aws
  service: transfer
  title: Import an SSH key for an existing service-managed Transfer user
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#transferimportsshpublickey--impersonate-a-service-managed-user
  source_revision: 0b36331
  summary: Transfer file operations as the selected service-managed user within the exact server, storage, session-policy
    and home-directory limits.
  requires:
    all_of:
    - action: transfer:ImportSshPublicKey
      resource: '{target.resource_arn}'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-transfer-importsshpublickey
    scope: same_account
    aggregate_as: Verified bounded authority in {account}
    grants:
    - Transfer file operations as the selected service-managed user
  conditions:
  - id: exact_verified_prerequisites
    description: A collected fact must bind the actor, exact resource, permitted inputs, target authority and useful
      privileged effect.
  - id: transfer_scope_join
    description: Bind the exact server, authenticated user, selected role, session policy, home directory, and accessible
      S3/EFS paths; the role is never assumed by the attacker.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict transfer:ImportSshPublicKey to Transfer administrators, scope user roles and session policies
    to the user's own prefix, and alert on key imports.
  references:
  - https://docs.aws.amazon.com/transfer/latest/APIReference/API_ImportSshPublicKey.html
  notes: The stored role or service is usable only through the documented operation. Missing exact evidence is UNKNOWN.
- id: aws-transfer-passrole-createuser-access
  provider: aws
  service: transfer
  title: Attach a passed role to a Transfer Family user or access mapping the source can log in as
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#transfercreateuserupdateusercreateaccessupdateaccess--iampassrole--attach-a-chosen-role-to-an-sftp-identity
  source_revision: 0b36331
  summary: Transfer file operations through the selected passable role within the exact server, storage, session-policy
    and home-directory limits.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
    any_of:
    - - action: transfer:CreateUser
        resource: '*'
    - - action: transfer:UpdateUser
        resource: '*'
    - - action: transfer:CreateAccess
        resource: '*'
    - - action: transfer:UpdateAccess
        resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-transfer-passrole-createuser-access
    scope: same_account
    aggregate_as: Verified bounded authority in {account}
    grants:
    - Transfer file operations through the selected passable role
  conditions:
  - id: exact_verified_prerequisites
    description: A collected fact must bind the actor, exact resource, permitted inputs, target authority and useful
      privileged effect.
  - id: transfer_scope_join
    description: Bind the exact server, authenticated user, selected role, session policy, home directory, and accessible
      S3/EFS paths; the role is never assumed by the attacker.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict transfer:CreateUser/UpdateUser/CreateAccess/UpdateAccess and iam:PassRole on Transfer roles,
    and scope Transfer roles to per-user prefixes.
  references:
  - https://docs.aws.amazon.com/transfer/latest/APIReference/API_CreateUser.html
  notes: The stored role or service is usable only through the documented operation. Missing exact evidence is UNKNOWN.
- id: aws-transfer-secret-backed-idp-record
  provider: aws
  service: transfer
  title: Rewrite a Secrets Manager record used by a Transfer custom identity provider
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#secretsmanagerputsecretvalue--poison-a-secrets-manager-backed-custom-idp-user
  source_revision: 0b36331
  summary: Transfer file operations selected by the exact secret-backed IdP record within the exact server, storage,
    session-policy and home-directory limits.
  requires:
    all_of:
    - action: secretsmanager:PutSecretValue
      resource: '{target.resource_arn}'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-transfer-secret-backed-idp-record
    scope: same_account
    aggregate_as: Verified bounded authority in {account}
    grants:
    - Transfer file operations selected by the exact secret-backed IdP record
  conditions:
  - id: exact_verified_prerequisites
    description: A collected fact must bind the actor, exact resource, permitted inputs, target authority and useful
      privileged effect.
  - id: transfer_scope_join
    description: Bind the exact server, authenticated user, selected role, session policy, home directory, and accessible
      S3/EFS paths; the role is never assumed by the attacker.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Separate credential data from authorization attributes in custom IdPs, deny PutSecretValue on aws/transfer/*
    secrets except to the IdP administrators, and alert on such writes.
  references:
  - https://docs.aws.amazon.com/transfer/latest/userguide/custom-idp-intro.html
  notes: The stored role or service is usable only through the documented operation. Missing exact evidence is UNKNOWN.
- id: aws-transfer-custom-idp-takeover
  provider: aws
  service: transfer
  title: Take over a Transfer Family custom identity provider
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md#transferupdateserver-lambdaupdatefunctioncode-or-api-gateway-response-writes--take-over-a-custom-identity-provider
  source_revision: 0b36331
  summary: Transfer file operations selected by the active custom IdP response within the exact server, storage,
    session-policy and home-directory limits.
  requires:
    any_of:
    - - action: transfer:UpdateServer
        resource: '*'
    - - action: lambda:UpdateFunctionCode
        resource: '{target.resource_arn}'
    - - action: apigateway:PATCH
        resource: '{target.resource_arn}'
      - action: apigateway:POST
        resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-transfer-custom-idp-takeover
    scope: same_account
    aggregate_as: Verified bounded authority in {account}
    grants:
    - Transfer file operations selected by the active custom IdP response
  conditions:
  - id: exact_verified_prerequisites
    description: A collected fact must bind the actor, exact resource, permitted inputs, target authority and useful
      privileged effect.
  - id: transfer_scope_join
    description: Bind the exact server, authenticated user, selected role, session policy, home directory, and accessible
      S3/EFS paths; the role is never assumed by the attacker.
  blockers:
  - scp_or_boundary_deny
  - lambda_code_signing_enforced
  confidence: conditional
  severity: medium
  mitigation: Restrict transfer:UpdateServer to deployment roles, protect IdP functions with code signing and restricted
    lambda:UpdateFunctionCode, restrict API Gateway PATCH/deployment on IdP APIs, and keep Transfer roles least-privileged.
  references:
  - https://docs.aws.amazon.com/transfer/latest/userguide/custom-lambda-idp.html
  notes: The stored role or service is usable only through the documented operation. Missing exact evidence is UNKNOWN.
