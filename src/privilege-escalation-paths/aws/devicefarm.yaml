# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS Device Farm privilege escalation techniques.
# Source: hacktricks-cloud aws-device-farm-privesc/README.md (rev 171e422299).

- id: aws-devicefarm-passrole-project-schedulerun
  provider: aws
  service: devicefarm
  title: Run a custom test with a passed execution role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-device-farm-privesc/README.md#devicefarmcreateprojectupdateprojectschedulerun--iampassrole
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting devicefarm.amazonaws.com by scheduling a run with a test specification it controls.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: devicefarm:ScheduleRun
        resource: "*"
      - action: devicefarm:CreateUpload
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: devicefarm.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting devicefarm.amazonaws.com passable in {account}"
    outcome: workload_execution
  conditions:
    - id: project_available
      description: A project the source can schedule runs in (existing, or devicefarm:CreateProject) and a compatible device or device pool are required.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:PassRole on Device Farm execution roles with iam:PassedToService and specific role ARNs; limit run scheduling to CI.
  references:
    - https://docs.aws.amazon.com/devicefarm/latest/developerguide/custom-test-environment-iam-roles.html
  notes: The role can be set on the project (CreateProject / UpdateProject) or overridden per run (ScheduleRun configuration).
