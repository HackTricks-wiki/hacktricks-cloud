# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS Lambda privilege escalation techniques.
# Source: hacktricks-cloud aws-lambda-privesc/README.md (rev 171e422299).
# Conventions used across catalog/aws/*.yaml written for AWS part B (see SCHEMA EXTENSIONS in the agent report):
#   resource "{target.resource_arn}"  -> ARN of the EXISTING resource (function, instance, job, cluster, ...) that carries the
#                                        target role; every requirement using it must cover the SAME resource.
#   resource "{target.artifact_arn}"  -> ARN of an executable artifact (S3 object, ECR repository, SSM document) that the
#                                        target role's workload later consumes/executes.
#   selector via_resource_type: <t>   -> target role is the execution/instance role of an existing resource of type <t>
#                                        whose ARN is {target.resource_arn}.
#   selector via_artifact_type: <t>   -> target role is the role of a workload that consumes the artifact {target.artifact_arn}.

- id: aws-lambda-passrole-createfunction-invokefunction
  provider: aws
  service: lambda
  title: Create a Lambda function with a passed execution role and invoke it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#iampassrole-lambdacreatefunction-lambdainvokefunction
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting lambda.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
        request_context:
          iam:PassedToService: lambda.amazonaws.com
      - action: lambda:CreateFunction
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        bind: new_function
      - action: lambda:InvokeFunction
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        bind: new_function
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting lambda.amazonaws.com passable in {account}"
    outcome: workload_execution
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService / iam:AssociatedResourceArn conditions on the PassRole grant may restrict which roles can be passed to Lambda.
    - id: invoke_resource_scope
      description: lambda:InvokeFunction must cover the newly created function name; a name-restricted Resource limits which names the source can use but does not remove the edge if any covered name is free.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole to specific Lambda execution roles with iam:PassedToService=lambda.amazonaws.com, and scope lambda:CreateFunction/InvokeFunction to named functions.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
  notes: Only roles whose trust policy allows lambda.amazonaws.com can be used as an execution role.

- id: aws-lambda-passrole-createfunction-addpermission
  provider: aws
  service: lambda
  title: Create a Lambda function with a passed role and grant itself invoke via the resource policy
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#iampassrole-lambdacreatefunction-lambdaaddpermission
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting lambda.amazonaws.com without holding lambda:InvokeFunction.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
        request_context:
          iam:PassedToService: lambda.amazonaws.com
      - action: lambda:CreateFunction
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        bind: new_function
      - action: lambda:AddPermission
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        request_context:
          lambda:Principal:
            source_principal: true
        bind: new_function
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting lambda.amazonaws.com passable in {account}"
    outcome: workload_execution
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService / iam:AssociatedResourceArn conditions may restrict which roles can be passed.
    - id: source_invoke_grant
      description: The new function's resource policy must grant lambda:InvokeFunction to the source principal without a URL-only or service-source restriction.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole and lambda:AddPermission; deny lambda:AddPermission except to deployment principals.
  references: []
  notes: Same reachable set as the CreateFunction+InvokeFunction variant; distinct permission combination.

- id: aws-lambda-passrole-createfunction-createeventsourcemapping
  provider: aws
  service: lambda
  title: Create a Lambda function with a passed role and trigger it through an event source mapping
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#iampassrole-lambdacreatefunction-lambdacreateeventsourcemapping
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting lambda.amazonaws.com via an event-source-triggered function.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: lambda:CreateFunction
        resource: "*"
      - action: lambda:CreateEventSourceMapping
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting lambda.amazonaws.com passable in {account}"
    outcome: workload_execution
  conditions:
    - id: event_source_available
      description: An event source must exist or be creatable and receive a record (e.g. dynamodb:CreateTable/PutItem or an existing stream/queue with traffic); the passed role must be able to read that source for the mapping to be created.
    - id: passrole_condition_key
      description: iam:PassedToService / iam:AssociatedResourceArn conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole to specific roles with iam:PassedToService, and restrict lambda:CreateEventSourceMapping to deployment principals.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html
  notes: HackTricks uses DynamoDB as the trigger; any poll-based source the passed role can read works. The self-contained DynamoDB variant (Pacu PassExistingRoleToNewLambdaThenTriggerWithNewDynamo) is aws-lambda-passrole-createfunction-dynamodb-stream-trigger.

- id: aws-lambda-passrole-createfunction-dynamodb-stream-trigger
  provider: aws
  service: lambda
  title: Create a Lambda function with a passed role and trigger it from a new DynamoDB stream
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#iampassrole-lambdacreatefunction-lambdacreateeventsourcemapping
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting lambda.amazonaws.com by creating a DynamoDB table with a stream, mapping the stream to a function it creates with the role, and writing an item to fire it.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: lambda:CreateFunction
        resource: "*"
      - action: lambda:CreateEventSourceMapping
        resource: "*"
      - action: dynamodb:CreateTable
        resource: "arn:{source.partition}:dynamodb:*:{target.account}:table/*"
      - action: dynamodb:PutItem
        resource: "arn:{source.partition}:dynamodb:*:{target.account}:table/*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting lambda.amazonaws.com passable in {account}"
    outcome: workload_execution
  conditions:
    - id: role_reads_stream
      description: The passed role must hold dynamodb:DescribeStream / GetRecords / GetShardIterator / ListStreams on the new table's stream (for example via AWSLambdaDynamoDBExecutionRole), or the mapping creation fails.
    - id: passrole_condition_key
      description: iam:PassedToService / iam:AssociatedResourceArn conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole to specific roles with iam:PassedToService, and restrict lambda:CreateEventSourceMapping and dynamodb:CreateTable to deployment principals.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/with-ddb.html
    - https://github.com/RhinoSecurityLabs/pacu/tree/master/pacu/modules/iam__privesc_scan
  notes: Pacu PassExistingRoleToNewLambdaThenTriggerWithNewDynamo. The table is created with StreamSpecification enabled (part of dynamodb:CreateTable); the item write fires the mapping. Removes the event_source_available condition of aws-lambda-passrole-createfunction-createeventsourcemapping.

- id: aws-lambda-updatefunctioncode
  provider: aws
  service: lambda
  title: Replace the code of an existing Lambda function
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#lambdaupdatefunctioncode
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of existing Lambda functions whose code it can update.
  requires:
    all_of:
      - action: lambda:UpdateFunctionCode
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: lambda
      via_resource_type: lambda_function
    scope: same_account
    aggregate_as: "Execution roles of Lambda functions updatable in {account}"
  preconditions:
    - lambda_existing_zip_function_direct_invoke_ready
  conditions:
    - id: function_invocation
      description: The source can invoke the same function after updating its code; an uncollected trigger remains unresolved.
  blockers:
    - lambda_code_signing_enforced
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict lambda:UpdateFunctionCode to the deployment pipeline on specific function ARNs and enforce a code-signing config with UntrustedArtifactOnDeployment=Enforce.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
  notes: A reported route uses one active ZIP function with completed update status, no enforced code signing, and matching UpdateFunctionCode and InvokeFunction permissions. Image functions and unverified trigger paths stay unresolved.

- id: aws-lambda-codesigning-bypass-updatefunctioncode
  provider: aws
  service: lambda
  title: Remove or replace a function's code-signing config, then replace its code
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#lambdadeletefunctioncodesigningconfig-or-lambdaputfunctioncodesigningconfig--lambdaupdatefunctioncode--bypass-lambda-code-signing
  source_revision: a66f094ede
  summary: The source can obtain the privileges of the execution role of code-signed Lambda functions whose code-signing config it can remove or replace.
  requires:
    all_of:
      - action: lambda:UpdateFunctionCode
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: lambda
      via_resource_type: lambda_function
    scope: same_account
    aggregate_as: "Execution roles of code-signed Lambda functions in {account}"
  preconditions:
    - lambda_enforced_zip_function_signing_bypass_and_invoke
  conditions:
    - id: warn_config_available
      description: PutFunctionCodeSigningConfig must cover a real Warn configuration ARN; UpdateCodeSigningConfig on the current configuration is another possible route.
    - id: function_invocation
      description: The function must run after the change (own InvokeFunction permission or existing trigger).
    - id: lambda_codesigningconfigarns_condition
      description: A lambda:CodeSigningConfigArns condition on CreateFunction/UpdateFunctionCode policies can force a specific config and prevents the swap path.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Deny lambda:DeleteFunctionCodeSigningConfig, lambda:PutFunctionCodeSigningConfig and lambda:CreateCodeSigningConfig to non-admins, and enforce code signing via SCP with lambda:CodeSigningConfigArns.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_lambda.html
  notes: DeleteFunctionCodeSigningConfig is authorized on the function ARN. PutFunctionCodeSigningConfig and UpdateCodeSigningConfig are authorized on code-signing-config ARNs. New Warn configurations are reported only when a recorded publisher and broad Create/Put permissions support them; other creation paths remain unresolved.

- id: aws-lambda-signer-startsigningjob-updatefunctioncode
  provider: aws
  service: lambda
  title: Sign attacker code with a publisher profile already trusted by a function's code-signing config
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#signerstartsigningjob--lambdaupdatefunctioncode--sign-attacker-code-with-an-already-trusted-publisher
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of code-signed Lambda functions whose config trusts a signing profile it can use.
  requires:
    all_of:
      - action: lambda:UpdateFunctionCode
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: lambda
      via_resource_type: lambda_function
    scope: same_account
    aggregate_as: "Execution roles of code-signed Lambda functions in {account}"
  preconditions:
    - lambda_signer_trusted_profile_artifact_unverified
  conditions:
    - id: signing_profile_trusted
      description: signer:StartSigningJob must cover a signing profile whose version ARN is in the AllowedPublishers of the function's code-signing config.
    - id: versioned_source_bucket
      description: Signer requires a versioned S3 source bucket and a destination bucket the source can write and read.
    - id: function_invocation
      description: The function must run after the update.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict signer:StartSigningJob on production signing profiles to the release pipeline, and keep signing profiles per environment.
  references:
    - https://docs.aws.amazon.com/signer/latest/developerguide/signing-profiles.html
  notes: The evaluator joins the same writable ZIP function to its enforcing code-signing config and checks StartSigningJob on a trusted profile, including signer:ProfileVersion, plus GetCodeSigningConfig on the exact config ARN. A complete versioned source object and writable/readable signed destination are still needed before the role edge can be reported. The source S3 object may already exist, so PutObject is not always required.

- id: aws-lambda-passrole-updatefunctionconfiguration-role-swap
  provider: aws
  service: lambda
  title: Repoint and replace the code of an existing Lambda function
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#iampassrole-lambdaupdatefunctionconfiguration-lambdainvokefunction--repoint-an-existing-functions-execution-role
  source_revision: 171e422299
  summary: The source can run chosen code under a passable Lambda-trusting role by changing the role and code of one existing function it can invoke.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: lambda:UpdateFunctionConfiguration
        resource: "*"
      - action: lambda:UpdateFunctionCode
        resource: "*"
      - action: lambda:InvokeFunction
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting lambda.amazonaws.com passable in {account}"
    outcome: workload_execution
  preconditions:
    - lambda_existing_zip_function_role_swap_ready
  conditions:
    - id: same_function
      description: The role change, code update, and invocation must cover the same active ZIP function.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:PassRole to approved Lambda roles and restrict function configuration and code updates to deployment principals.
  references:
    - https://docs.aws.amazon.com/lambda/latest/api/API_UpdateFunctionConfiguration.html
    - https://docs.aws.amazon.com/lambda/latest/dg/lambda-intro-execution-role.html
  notes: Changing a function's role without controlling its code does not grant the caller the role's general permissions. This route requires control of both the role and executable ZIP code on one function.

- id: aws-lambda-putresourcepolicy-grant-updatefunctioncode
  provider: aws
  service: lambda
  title: Grant code updates to oneself through a Lambda function resource policy
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#lambdaputresourcepolicy--lambdaaddpermission--lambdaremovepermission--grant-code-updates-through-a-function-policy
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of existing Lambda functions whose resource policy it can replace, by granting itself lambda:UpdateFunctionCode there.
  requires:
    all_of:
      - action: lambda:PutResourcePolicy
        resource: "{target.resource_arn}"
        request_context:
          lambda:Principal:
            source_principal: true
      - action: lambda:AddPermission
        resource: "{target.resource_arn}"
        request_context:
          lambda:Principal:
            source_principal: true
      - action: lambda:RemovePermission
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: lambda
      via_resource_type: lambda_function
    scope: same_account
    aggregate_as: "Execution roles of Lambda functions whose policy is writable in {account}"
    outcome: workload_execution
  preconditions:
    - lambda_policy_rewrite_zip_code_and_invoke_ready
  conditions:
    - id: same_function
      description: The policy rewrite must grant code update and invocation on the same runnable ZIP function.
    - id: no_explicit_deny
      description: The source's identity policy, permissions boundary, and organization policy must not explicitly deny either granted action.
  blockers:
    - lambda_code_signing_enforced
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict lambda:PutResourcePolicy, lambda:AddPermission and lambda:RemovePermission to deployment principals on exact function ARNs, and enforce code signing.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html
  notes: PutResourcePolicy requires all three permissions per the Lambda documentation, and UpdateFunctionCode is among the actions a function resource policy can grant. lambda:AddPermission alone is covered by the existing AddPermission entries.

- id: aws-lambda-passrole-createfunction-functionurl
  provider: aws
  service: lambda
  title: Create a Lambda with a passed role and invoke it through a Function URL
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#iampassrole-lambdacreatefunction-lambdacreatefunctionurlconfig-lambdainvokefunctionurl
  source_revision: 171e422299
  summary: The source can run code with a passable Lambda execution role through a newly created Function URL when it can invoke that URL and its function.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
        request_context:
          iam:PassedToService: lambda.amazonaws.com
      - action: lambda:CreateFunction
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        bind: new_function
      - action: lambda:CreateFunctionUrlConfig
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        request_context:
          lambda:FunctionUrlAuthType: AWS_IAM
        bind: new_function
      - action: lambda:InvokeFunctionUrl
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        request_context:
          lambda:FunctionUrlAuthType: AWS_IAM
        bind: new_function
      - action: lambda:InvokeFunction
        resource: arn:{source.partition}:lambda:*:{source.account}:function:*
        request_context:
          lambda:InvokedViaFunctionUrl: "true"
        bind: new_function
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting lambda.amazonaws.com in {account}"
    outcome: workload_execution
  conditions:
    - id: url_auth_type
      description: The new URL must use AWS_IAM auth; a NONE URL also needs a public function resource policy, which this route does not establish.
    - id: same_new_function
      description: CreateFunction, CreateFunctionUrlConfig, InvokeFunctionUrl and InvokeFunction must all be authorized for one available function name in the same Region.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Lambda execution roles and lambda:CreateFunctionUrlConfig to deployment principals.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/urls-auth.html
  notes: New Function URLs require both invoke actions. This route remains distinct from direct invocation when InvokeFunction is permitted only with lambda:InvokedViaFunctionUrl=true.

- id: aws-lambda-microvm-passrole-runmicrovm-shell
  provider: aws
  service: lambda
  title: Launch a Lambda MicroVM with a passed execution role and open a shell into it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#lambda-microvms
  source_revision: b587e6bd26
  summary: The source can obtain the privileges of passable roles usable as Lambda MicroVM execution roles by launching a MicroVM runtime with that role and the shell-ingress connector and then opening an interactive shell in the guest, which receives the role credentials through IMDSv2.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
        request_context:
          iam:PassedToService: lambda.amazonaws.com
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles passable as Lambda MicroVM execution roles in {account}"
    outcome: workload_execution
  preconditions:
    - lambda_microvm_shell_runnable_image_and_role
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService / iam:AssociatedResourceArn conditions on the PassRole grant may restrict which roles can be attached to a MicroVM.
    - id: same_image_scope
      description: RunMicrovm and CreateMicrovmShellAuthToken must cover the same runnable customer image. AWS-managed base-image eligibility is left unresolved without runtime evidence.
    - id: shell_ingress_connector
      description: The runtime must be launched with the AWS-managed SHELL_INGRESS connector; lambda:PassNetworkConnector has no resource-level scope, so its IAM grant must apply to Resource *, and the connector cannot be added to a running MicroVM.
    - id: alternative_attacker_image
      description: A source able to build its own MicroVM image could instead run arbitrary application code with the passed role without a shell token; that variant is not modelled separately.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole for MicroVM execution roles to exact role ARNs with iam:PassedToService, scope lambda:RunMicrovm and lambda:CreateMicrovmShellAuthToken to exact image ARNs for operators only, and avoid the SHELL_INGRESS connector on images that run with privileged roles.
  references:
    - https://docs.aws.amazon.com/lambda/latest/dg/microvms-how-it-works.html
    - https://docs.aws.amazon.com/lambda/latest/dg/microvms-security.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_lambda.html
  notes: RunMicrovm attaches an optional execution role whose credentials the guest receives through IMDSv2. AWS requires the execution role to trust lambda.amazonaws.com for sts:AssumeRole and sts:TagSession. The evaluator joins one recorded runnable customer image covered by RunMicrovm and CreateMicrovmShellAuthToken with a global PassNetworkConnector grant evaluated in the image's Region; the requested connector must be SHELL_INGRESS. A possible AWS-managed base-image path stays unknown without runtime evidence.

- id: aws-lambda-passrole-createfunction-eventbridge-trigger
  provider: aws
  service: lambda
  title: Run a newly created Lambda with a passable role through EventBridge
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc/README.md#cronevent-actuator
  source_revision: b587e6bd26
  summary: The source can run chosen code under a stronger Lambda-trusting role by creating a function and a scheduled EventBridge rule that invokes it.
  requires:
    all_of:
    - action: iam:PassRole
      resource: '{target.arn}'
    - action: lambda:CreateFunction
      resource: arn:{source.partition}:lambda:*:{source.account}:function:*
      bind: new_function
    - action: events:PutRule
      resource: arn:{source.partition}:events:*:{source.account}:rule/*
      bind: scheduled_rule
    - action: events:PutTargets
      resource: arn:{source.partition}:events:*:{source.account}:rule/*
      bind: scheduled_rule
    - action: lambda:AddPermission
      resource: arn:{source.partition}:lambda:*:{source.account}:function:*
      bind: new_function
      request_context:
        lambda:Principal: events.amazonaws.com
  target:
    kind: aws_role
    selector:
      trust_allows_service: lambda.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: Passable Lambda roles reachable via EventBridge in {account}
    outcome: workload_execution
  conditions:
  - id: scheduled_rule_invokes_function
    description: The source must create an enabled scheduled rule on the default bus, add the newly created function as an allowed events:TargetArn, and grant events.amazonaws.com invoke permission; function and rule must be in one Region.
  - id: passrole_condition_key
    description: iam:PassedToService and iam:AssociatedResourceArn conditions must allow passing the role to this new Lambda function.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole, lambda:CreateFunction, events:PutRule, events:PutTargets, and lambda:AddPermission to approved deployment principals.
  references:
  - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutRule.html
  - https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-use-conditions.html
  - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_PutTargets.html
  notes: The two page examples, creating IAM user keys and granting assume-role permissions, are payload effects of this one role-execution path. A new PutRule is enabled by default and its schedule can supply the trigger without an external event source. The rule may also include an event pattern when an IAM condition requires events:source or events:detail-type.
