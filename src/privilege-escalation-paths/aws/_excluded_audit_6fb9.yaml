  technique: aidevops:CreateAccessToken or RotateAccessToken
  reason: 'The page explicitly defers execution: access tokens are disabled by default and no stable create-request shape is documented. Whether the exact agent space enables tokens, accepts an operate token request and returns a usable token is an API/runtime fact, so action permission alone cannot establish a credential.'
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-devops-agent-persistence/README.md#create-a-persistent-webhook-ingress-through-an-association
  technique: aidevops:AssociateService or UpdateAssociation webhook credential
  reason: Only a successful association for a registered webhook-capable service may return a one-time GenericWebhook webhookSecret or apiKey. The registered service type, submitted configuration, response issuance and later webhook acceptance are runtime facts; the AWS actions alone do not prove possession of a usable webhook credential.
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-directory-service-persistence/README.md#using-an-ad-user
  technique: AD user creation/change and IAM console role assignment
  reason: The paragraph describes an authorized operator, not a specific AWS API permission path. Gaining a mapped role requires AD/LDAP user-write or password rights, group-membership or console role-assignment rights, an effective user/group-to-role mapping, and a working directory sign-in; those host/directory facts are not present in the IAM snapshot. The password-reset subpath is already aws-ds-resetuserpassword.
- source: src/pentesting-cloud/aws-security/aws-persistence/aws-managed-flink-persistence/README.md#runtime-property-configuration-implant
  technique: Flink runtime-property configuration implant
  reason: The property change yields role or credential authority only if the deployed application code reads the
    exact property and routes a privileged operation or credential to the attacker. DescribeApplication exposes
    values but not the code path or runtime effect; an arbitrary property has no effect.
  source_revision: 0b36331
- source: src/pentesting-cloud/aws-security/aws-unauthenticated-enum-access/aws-api-gateway-unauthenticated-enum/README.md#api-invoke-bypass
  technique: Lambda-authorizer execution-ARN wildcard accepts routes, verbs, stages, or APIs beyond intended application
