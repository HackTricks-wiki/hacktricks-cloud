- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-gamelift/README.md#gameliftcreatefleet--iampassrole--run-code-on-fleet-ec2-as-a-passed-instance-role
  technique: gamelift:CreateGameServerGroup + iam:PassRole
  reason: The game server group RoleArn is assumed by GameLift FleetIQ only to manage the Auto Scaling group and its
    instances; it is not exposed to code on the instances, which run with the launch template's instance profile
    (modelled by the EC2 launch-template / RunInstances entries). CreateFleet and CreateContainerFleet are modelled in
    aws-gamelift-passrole-createfleet.
- source:
    src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamsetdefaultpolicyversion
  technique: iam:SetDefaultPolicyVersion on a policy attached to a role the source can assume
  reason: An existing policy version must be proven to grant administrator access; the v2 selector only covers creating
    a new default version.

