# AWS Private CA Connector for Active Directory privilege escalation techniques (cloud-to-AD).
# Source: hacktricks-cloud aws-pca-connector-ad-privesc/README.md (rev 171e422299).
# Target: aws_directory_domain_admin, an entity per account meaning "domain administrator of an Active Directory joined
# through a PCA connector in that account". Connectors are not collected (pca-connector-ad:ListConnectors), so the targets
# are per-account unresolved placeholders; the entity is not an AWS-admin kind.

- id: aws-pca-connector-ad-createtemplate-esc1
  provider: aws
  service: pca-connector-ad
  title: Publish a malicious certificate template through PCA Connector for AD and enroll as a domain admin
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-pca-connector-ad-privesc/README.md#pca-connector-adcreatetemplate--publish-a-malicious-certificate-template-esc1--esc9
  source_revision: 171e422299
  summary: The source can obtain a certificate authenticating as any domain principal (ESC1-style enrollee-supplied subject) by publishing a template on a connector and granting enrollment on it to an AD group it controls.
  requires:
    all_of:
      - action: pca-connector-ad:CreateTemplate
        resource: "arn:aws:pca-connector-ad:*:{target.account}:connector/*"
      - action: pca-connector-ad:CreateTemplateGroupAccessControlEntry
        resource: "arn:aws:pca-connector-ad:*:{target.account}:connector/*/template/*"
  target:
    kind: aws_directory_domain_admin
    selector:
      any_principal_in_scope: true
    scope: same_account
    aggregate_as: "Active Directory domains served by PCA connectors in {account}"
  conditions:
    - id: connector_exists
      description: A PCA Connector for AD must exist in the account, joined to a directory (AWS Managed Microsoft AD or AD Connector) and backed by an active private CA.
    - id: domain_context
      description: Enrollment happens from a domain-joined context with an AD identity in the group granted enrollment; the source needs such an identity.
    - id: pkinit_or_schannel
      description: Using the certificate as a domain admin needs PKINIT or Schannel authentication against the domain controllers and no strong certificate mapping enforcement that blocks enrollee-supplied subjects.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict pca-connector-ad:CreateTemplate / UpdateTemplate / CreateTemplateGroupAccessControlEntry to PKI administrators, enforce strong certificate mapping on domain controllers, and alert on connector template changes.
  references:
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_pca-connector-ad.html
    - https://docs.aws.amazon.com/privateca/latest/userguide/connector-for-ad.html
  notes: CreateTemplateGroupAccessControlEntry alone only opens enrollment on an existing template and is kept as an exclusion; here it is the enrollment half of the chain. Further impact in the cloud account needs another hop (directory console-access roles, AD-federated SAML).

- id: aws-pca-connector-ad-updatetemplate
  provider: aws
  service: pca-connector-ad
  title: Weaken an existing PCA Connector for AD certificate template in place
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-pca-connector-ad-privesc/README.md#pca-connector-adupdatetemplate--weaken-an-existing-legitimate-template-in-place
  source_revision: 171e422299
  summary: The source can obtain a certificate authenticating as any domain principal by changing an existing template it (or a group it belongs to) can already enroll in to accept an enrollee-supplied subject.
  requires:
    all_of:
      - action: pca-connector-ad:UpdateTemplate
        resource: "arn:aws:pca-connector-ad:*:{target.account}:connector/*/template/*"
  target:
    kind: aws_directory_domain_admin
    selector:
      any_principal_in_scope: true
    scope: same_account
    aggregate_as: "Active Directory domains served by PCA connectors in {account}"
  conditions:
    - id: connector_template_exists
      description: A connector with at least one template must exist in the account.
    - id: enrollment_rights
      description: The source's AD identity must already be able to enroll in the template (or the source also holds CreateTemplateGroupAccessControlEntry on it).
    - id: pkinit_or_schannel
      description: Using the certificate as a domain admin needs PKINIT or Schannel authentication and no strong certificate mapping enforcement that blocks enrollee-supplied subjects.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict pca-connector-ad:UpdateTemplate to PKI administrators, enforce strong certificate mapping, and alert on template updates.
  references:
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_pca-connector-ad.html
    - https://docs.aws.amazon.com/privateca/latest/userguide/connector-for-ad.html
  notes: Editing a legitimate template also affects its normal enrollees and is easier to miss than a new template.
