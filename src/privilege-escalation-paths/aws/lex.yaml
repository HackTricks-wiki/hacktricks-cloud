- id: aws-lex-getsession-other-application-session
  provider: aws
  service: lex
  title: Recover another user application session from Lex GetSession
  source: src/pentesting-cloud/aws-security/aws-services/aws-lex-v2-enum.md#runtime-sessions-and-stored-utterances
  source_revision: 0b36331
  summary: Recover another user application session from Lex GetSession when the exact target and prerequisites
    are verified.
  requires:
    all_of:
    - action: lex:GetSession
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-lex-getsession-other-application-session
    scope: same_account
    aggregate_as: Verified Recover another user application session from Lex GetSession targets in {account}
    grants:
    - exact victim application session
    outcome: permission_grant
  conditions:
  - id: exact_verified_prerequisites
    description: A known live sessionId, exact bot, alias and locale, and verified returned material usable as a
      distinct application identity are required.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the exact read or mutation permission and remove exposed credentials.
  references:
  - https://docs.aws.amazon.com/lexv2/latest/APIReference/API_runtime_GetSession.html
  notes: The required aws_privesc_challenge_evidence fact is not collected in current snapshots. Missing or incomplete
    evidence evaluates UNKNOWN.
