# Amazon RDS / Aurora privilege escalation techniques.
# Source: hacktricks-cloud aws-rds-privesc/README.md (rev a53b46392c).
# Uses {target.resource_arn} and via_resource_type (see header of lambda.yaml); name_prefix selector (see agent report).
# RDS-associated roles are only usable through engine integrations (S3 import/export, Lambda, ML, etc.), so the
# privileges obtained are bounded to the services those integrations call, not a full role session.

- id: aws-rds-modifydbinstance-master-password-associated-roles
  provider: aws
  service: rds
  title: Reset the master password of a DB instance that has associated IAM roles
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-rds-privesc/README.md#rdsmodifydbinstance
  source_revision: 171e422299
  summary: The source can obtain the integration-limited privileges (S3/Lambda) of IAM roles associated with a non-Aurora DB instance it can modify.
  requires:
    all_of:
      - action: rds:ModifyDBInstance
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: rds.amazonaws.com
      via_resource_type: rds_db_instance
    scope: same_account
    aggregate_as: "IAM roles associated with modifiable RDS instances in {account}"
  conditions:
    - id: network_reachability
      description: The source needs a network path to the database endpoint.
    - id: integration_configured
      description: The engine integration (e.g. aws_s3 / aws_lambda extensions, S3 load/export) must be supported and enabled for the associated role's feature.
    - id: not_aurora_or_managed_password
      description: Not applicable to Aurora instances (cluster-managed password) or instances whose master password is managed in Secrets Manager.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict rds:ModifyDBInstance to DBAs, use Secrets Manager-managed master passwords, and keep RDS-associated roles least-privileged.
  references:
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_ModifyDBInstance.html
  notes: HackTricks frames this as data access; the role edge is inferred from the page's "Abuse RDS Role IAM permissions" section. Pure data access belongs to exposure analysis, not this edge.

- id: aws-rds-addroletodbcluster-passrole
  provider: aws
  service: rds
  title: Associate a passed IAM role with an Aurora DB cluster
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-rds-privesc/README.md#rdsaddroletodbcluster-iampassrole
  source_revision: 171e422299
  summary: The source can obtain the integration-limited privileges of any passable role trusting rds.amazonaws.com through a cluster it can use.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: rds:AddRoleToDBCluster
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: rds.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting rds.amazonaws.com passable in {account}"
  conditions:
    - id: database_session
      description: The source needs a database login on the cluster with SQL privileges to invoke the integration, and network reachability.
    - id: engine_configuration
      description: Some engines (Aurora MySQL) also require the role ARN in the cluster parameter group, needing rds:ModifyDBClusterParameterGroup.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict iam:PassRole with iam:PassedToService=rds.amazonaws.com to specific roles and restrict rds:AddRoleToDBCluster.
  references:
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_AddRoleToDBCluster.html
  notes: Covers the blue/green variant on the same page (CreateBlueGreenDeployment adds nothing to the reachable set).

- id: aws-rds-addroletodbinstance-passrole
  provider: aws
  service: rds
  title: Associate a passed IAM role with an RDS DB instance
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-rds-privesc/README.md#rdsaddroletodbinstance-iampassrole
  source_revision: 171e422299
  summary: The source can obtain the integration-limited privileges of any passable role trusting rds.amazonaws.com through an instance it can use.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: rds:AddRoleToDBInstance
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: rds.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting rds.amazonaws.com passable in {account}"
  conditions:
    - id: database_session
      description: The source needs a database login with SQL privileges to invoke the integration, and network reachability.
    - id: feature_supported
      description: The engine must support the feature name (e.g. s3Import, Lambda); not applicable to RDS Custom.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: medium
  mitigation: Restrict iam:PassRole with iam:PassedToService=rds.amazonaws.com and restrict rds:AddRoleToDBInstance.
  references:
    - https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_AddRoleToDBInstance.html
  notes: ""

- id: aws-rds-custom-createdbinstance-passrole
  provider: aws
  service: rds
  title: Create an RDS Custom instance with a passed AWSRDSCustom instance profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-rds-privesc/README.md#rdscreatedbinstance-iampassrole-kms-key-use-permissions
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable EC2-trusting roles whose role and instance-profile names start with AWSRDSCustom.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: rds:CreateDBInstance
        resource: "*"
      - action: kms:CreateGrant
        resource: "*"
      - action: kms:DescribeKey
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
      name_prefix: AWSRDSCustom
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "AWSRDSCustom* instance-profile roles passable in {account}"
  conditions:
    - id: host_access
      description: Credentials are only exposed if the source can obtain code execution or administrative access on the RDS Custom host (e.g. via SSM or the EC2 key pair).
    - id: rds_custom_prerequisites
      description: RDS Custom prerequisites (custom engine version, networking, customer managed symmetric KMS key usable by the source) must be met. For RDS Custom for Oracle the creator also needs s3:CreateBucket, s3:PutBucketPolicy, s3:PutBucketObjectLockConfiguration and s3:PutBucketVersioning on do-not-delete-rds-custom-* buckets, iam:SimulatePrincipalPolicy, and cloudtrail:CreateTrail and cloudtrail:StartLogging on do-not-delete-rds-custom-* trails (not modelled as requirements because they are engine-specific).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:PassRole on AWSRDSCustom* roles and restrict RDS Custom instance creation to DBAs.
  references:
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-creating.html
    - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/custom-setup-orcl.html
  notes: The RDS Custom setup guide confirms kms:CreateGrant and kms:DescribeKey on "*" for the creating principal, and the default AWSRDSCustomInstanceRole-<region> trusts ec2.amazonaws.com. RDS Custom for Oracle reaches end of support on March 31, 2027.
