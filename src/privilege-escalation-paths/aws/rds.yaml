    - action: rds:AddRoleToDBInstance
      resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: rds.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting rds.amazonaws.com passable in {account}"
  conditions:
  - id: database_session
    description: The source needs a database login with SQL privileges to invoke the integration, and network
