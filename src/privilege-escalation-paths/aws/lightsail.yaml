- id: aws-lightsail-imds-verified-role
  provider: aws
  service: lightsail
  title: Read an actual AWS role credential from Lightsail IMDS
  source: src/pentesting-cloud/aws-security/aws-services/aws-lightsail-enum.md#metadata
  source_revision: 0b36331
  summary: Read an actual AWS role credential from Lightsail IMDS when the exact target and prerequisites are verified.
  requires: {}
  target:
    kind: aws_role
    selector:
      aws_challenge_fact: aws-lightsail-imds-verified-role
    scope: same_account
    aggregate_as: Verified Read an actual AWS role credential from Lightsail IMDS targets in {account}
    grants:
    - actual identified IMDS role
    outcome: credentials
  conditions:
  - id: exact_verified_prerequisites
    description: Host access, an enabled reachable IMDS endpoint, actually returned valid role credentials and exact
      role identity are required; an instance profile must never be assumed.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the exact read or mutation permission and remove exposed credentials.
  references:
  - https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-instance-metadata.html
  notes: The required aws_privesc_challenge_evidence fact is not collected in current snapshots. Missing or incomplete
    evidence evaluates UNKNOWN.
  source_kind: aws_challenge_foothold
  source_selector:
    source_id_glob: aws_challenge_foothold:*:local
