# Organizations policy changes require an exact source-to-member effective-authority join.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-organizations-prinvesc/README.md#organizations-scp-guardrail-change
  source_revision: b13a72b45f
  technique: Remove an SCP guardrail for a controlled member principal
  reason: DetachPolicy, UpdatePolicy, DisablePolicyType or MoveAccount can alter member-account ceilings, but the management caller does not gain its own permission from an SCP change. A definite edge requires a controlled member principal, exact account and inherited SCP path, prior blocked action, identity allow, removal of the effective block and no remaining deny or boundary. Current inventory does not join before-and-after effective permission across those principals.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-organizations-prinvesc/README.md#organizations-putresourcepolicy-delegation
  source_revision: b13a72b45f
  technique: Delegate Organizations policy actions to a controlled member principal
  reason: PutResourcePolicy can permit a member account to manage supported Organizations policies, but a usable gain requires an exact controlled member principal, accepted delegation policy and resource, matching identity permission and absence of denies. The policy writer's management-account permission is not itself a new member-principal capability. Current inventory does not join the two principals or prove a specific before-and-after authorized action.
