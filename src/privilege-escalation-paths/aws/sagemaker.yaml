- id: aws-sagemaker-updateuserprofile-passrole-createapp
  provider: aws
  service: sagemaker
  title: Swap a Studio user profile's execution role and launch an app
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakerupdateuserprofile-iampassrole-sagemakercreateapp-sagemakercreatepresigneddomainurl-sagemakerdeleteapp
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting sagemaker.amazonaws.com via a Studio user profile.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: sagemaker:UpdateUserProfile
        resource: "*"
      - action: sagemaker:CreateApp
        resource: "*"
      - action: sagemaker:CreatePresignedDomainUrl
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: sagemaker.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting sagemaker.amazonaws.com passable in {account}"
  conditions:
    - id: no_inservice_apps
      description: UpdateUserProfile fails while the profile has InService apps; sagemaker:DeleteApp is needed if any exist.
    - id: same_profile_scope
      description: UpdateUserProfile, CreateApp and CreatePresignedDomainUrl must all cover the same user profile/app ARNs.
    - id: not_unified_studio
      description: Unified Studio domains reject presigned domain URLs.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on SageMaker roles and sagemaker:UpdateUserProfile to platform admins.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateUserProfile.html
  notes: ""

- id: aws-sagemaker-updatedomain-createuserprofile-passrole
  provider: aws
  service: sagemaker
  title: Change a Studio domain's default execution role and create a profile inheriting it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakerupdatedomain-sagemakercreateuserprofile-sagemakercreateapp-iampassrole-sagemakercreatepresigneddomainurl-sagemakerdeleteapp
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting sagemaker.amazonaws.com via the Studio domain default.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: sagemaker:UpdateDomain
        resource: "*"
      - action: sagemaker:CreateUserProfile
        resource: "*"
      - action: sagemaker:CreateApp
        resource: "*"
      - action: sagemaker:CreatePresignedDomainUrl
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: sagemaker.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting sagemaker.amazonaws.com passable in {account}"
  conditions:
    - id: no_inservice_apps_in_domain
      description: UpdateDomain fails while any app in the domain is InService; sagemaker:DeleteApp on all of them is needed otherwise (disruptive).
    - id: not_unified_studio
      description: Unified Studio domains reject presigned domain URLs.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on SageMaker roles and sagemaker:UpdateDomain/CreateUserProfile to platform admins.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateDomain.html
  notes: CreateUserProfile with an explicit ExecutionRole is itself a PassRole path, modelled in aws-sagemaker-createuserprofile-passrole-createapp; this entry follows the page's inherit-default variant.

- id: aws-sagemaker-createuserprofile-passrole-createapp
  provider: aws
  service: sagemaker
  title: Create a Studio user profile with an explicit passed execution role and launch an app
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakerupdatedomain-sagemakercreateuserprofile-sagemakercreateapp-iampassrole-sagemakercreatepresigneddomainurl-sagemakerdeleteapp
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting sagemaker.amazonaws.com by setting it as the execution role of a new Studio user profile.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: sagemaker:CreateUserProfile
        resource: "*"
      - action: sagemaker:CreateApp
        resource: "*"
      - action: sagemaker:CreatePresignedDomainUrl
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: sagemaker.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting sagemaker.amazonaws.com passable in {account}"
  conditions:
    - id: existing_domain
      description: A Studio domain covered by CreateUserProfile must exist; CreateApp and CreatePresignedDomainUrl must cover the new profile and app ARNs.
    - id: not_unified_studio
      description: Unified Studio domains reject presigned domain URLs.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on SageMaker roles and sagemaker:CreateUserProfile to platform admins.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateUserProfile.html
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UserSettings.html
  notes: Not a separate HackTricks section; it is the explicit-role variant of the UpdateDomain section (UserSettings.ExecutionRole on CreateUserProfile), which avoids UpdateDomain and the no-InService-apps restriction.

- id: aws-sagemaker-updateclustersoftware-custom-ami
  provider: aws
  service: sagemaker
  title: Replace HyperPod instance-group nodes with a custom AMI that keeps the group's execution role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakerupdateclustersoftware--replace-hyperpod-nodes-with-a-custom-ami
  source_revision: 171e422299
  summary: The source can obtain the privileges of the instance-group execution roles of HyperPod clusters it can update, by booting their nodes from an image it controls.
  requires:
    all_of:
      - action: sagemaker:UpdateClusterSoftware
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_cluster
    scope: same_account
    aggregate_as: "Execution roles of HyperPod instance groups in {account}"
  conditions:
    - id: controlled_custom_ami
      description: A custom AMI with attacker-controlled startup code must already be available to the account and meet HyperPod's encryption and volume constraints; creating it needs separate EC2 permissions.
    - id: slurm_default_ami
      description: Slurm-orchestrated groups on the default HyperPod AMI cannot be switched to a custom AMI by this operation.
    - id: disruptive
      description: The update replaces node root volumes and interrupts running workloads.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict sagemaker:UpdateClusterSoftware to platform administrators on specific cluster ARNs, restrict who can create or share AMIs, and keep instance-group roles least-privileged.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateClusterSoftware.html
  notes: No role is passed, so iam:PassRole is not required. The page nests this heading under the CreatePresignedDomainUrl section, so coverage counted it as a child of that entry; it is modelled separately here.

- id: aws-sagemaker-updatenotebookinstancelifecycleconfig
  provider: aws
  service: sagemaker
  title: Rewrite a notebook-instance lifecycle configuration that runs as the notebook role
  source: src/pentesting-cloud/aws-security/aws-persistence/aws-sagemaker-persistence/README.md#sagemakerupdatenotebookinstancelifecycleconfig--stored-code-execution-as-the-notebook-role
  source_revision: 171e422299
  summary: The source can obtain (on the notebook's next start) the privileges of the execution role of notebook instances that use a lifecycle configuration it can update.
  requires:
    all_of:
      - action: sagemaker:UpdateNotebookInstanceLifecycleConfig
        resource: "{target.consumer_input_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_notebook_instance
      consumer_input_writable_via: sagemaker:UpdateNotebookInstanceLifecycleConfig
    scope: same_account
    aggregate_as: "Roles of SageMaker notebook instances with updatable lifecycle configurations in {account}"
  conditions:
    - id: notebook_restart
      description: The OnStart script runs as root with the execution role only at the next notebook start (by the source, an operator or automation); the payload's exfiltration channel must be reachable from the notebook.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict sagemaker:UpdateNotebookInstanceLifecycleConfig to administrators and monitor UpdateNotebookInstanceLifecycleConfig events.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateNotebookInstanceLifecycleConfig.html
  notes: "{target.consumer_input_arn} is the lifecycle configuration attached to the notebook instance; when the mapping is not collected the edge is unknown. Becomes derived with sagemaker:StopNotebookInstance + StartNotebookInstance on the notebook."

- id: aws-sagemaker-attach-notebook-lifecycle-config
  provider: aws
  service: sagemaker
  title: Attach a controlled lifecycle configuration to an existing notebook instance
  source: src/pentesting-cloud/aws-security/aws-persistence/aws-sagemaker-persistence/README.md#set-lifecycle-configuration-on-notebook-instances
  source_revision: 6fb9ac51fd
  summary: The source can run startup code with an existing notebook instance's execution role by attaching a controlled lifecycle configuration.
  requires:
    all_of:
      - action: sagemaker:CreateNotebookInstanceLifecycleConfig
        resource: "arn:aws:sagemaker:*:{source.account}:notebook-instance-lifecycle-config/*"
      - action: sagemaker:UpdateNotebookInstance
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_notebook_instance
    scope: same_account
    aggregate_as: Roles of notebook instances whose lifecycle configuration can be replaced in {account}
    outcome: workload_execution
  conditions:
    - id: notebook_restart
      description: The notebook must be stopped for the configuration change and started afterward so the startup hook executes.
    - id: controlled_configuration
      description: The source must create a lifecycle configuration containing code that uses the notebook role's authority.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Limit notebook lifecycle-configuration creation and attachment to trusted deployment principals, and review lifecycle script content.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateNotebookInstance.html
  notes: This differs from rewriting an already-attached lifecycle configuration, which is covered by aws-sagemaker-updatenotebookinstancelifecycleconfig.

- id: aws-sagemaker-attach-studio-lifecycle-config-user-profile
  provider: aws
  service: sagemaker
  title: Attach a controlled Studio lifecycle configuration to an existing user profile
  source: src/pentesting-cloud/aws-security/aws-persistence/aws-sagemaker-persistence/README.md#set-lifecycle-configuration-on-sagemaker-studio
  source_revision: 6fb9ac51fd
  summary: The source can run startup code with a Studio user profile's execution role by attaching a controlled lifecycle configuration.
  requires:
    all_of:
      - action: sagemaker:CreateStudioLifecycleConfig
        resource: "arn:aws:sagemaker:*:{source.account}:studio-lifecycle-config/*"
      - action: sagemaker:UpdateUserProfile
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_user_profile
    scope: same_account
    aggregate_as: Roles of Studio user profiles with updatable lifecycle settings in {account}
    outcome: workload_execution
  conditions:
    - id: studio_app_start
      description: A compatible Studio app for the profile must start after the update so the lifecycle script runs.
    - id: controlled_configuration
      description: The source must create a Studio lifecycle configuration for the application type used by the profile.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict Studio lifecycle-configuration creation and user-profile updates and review startup scripts on profiles with privileged roles.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/studio-lcc.html
  notes: Domain-level default settings and shared spaces need separate target-to-resource joins; this entry applies to an individually updatable user profile.

- id: aws-sagemaker-attach-studio-lifecycle-config-space
  provider: aws
  service: sagemaker
  title: Attach a controlled Studio lifecycle configuration to an existing space
  source: src/pentesting-cloud/aws-security/aws-persistence/aws-sagemaker-persistence/README.md#set-lifecycle-configuration-on-sagemaker-studio
  source_revision: 6fb9ac51fd
  summary: The source can run startup code with the execution role of a Studio space by attaching a controlled lifecycle configuration.
  requires:
    all_of:
      - action: sagemaker:CreateStudioLifecycleConfig
        resource: "arn:aws:sagemaker:*:{source.account}:studio-lifecycle-config/*"
      - action: sagemaker:UpdateSpace
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: sagemaker.amazonaws.com
      via_resource_type: sagemaker_space
    scope: same_account
    aggregate_as: Roles of Studio spaces with updatable lifecycle settings in {account}
    outcome: workload_execution
  conditions:
    - id: studio_app_start
      description: A compatible app in the space must start after the update so the lifecycle script runs.
    - id: controlled_configuration
      description: The source must create a Studio lifecycle configuration for the application type used by the space.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict Studio lifecycle-configuration creation and space updates and review startup scripts on spaces with privileged roles.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/studio-lcc.html
  notes: Space-to-role attachment is not collected, so the evaluator may fall back to roles trusting sagemaker.amazonaws.com.

- id: aws-sagemaker-createmodelpackage-approved-autodeploy
  provider: aws
  service: sagemaker
  title: Register an Approved model version in a Model Package Group consumed by auto-deploy automation
  source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sagemaker-post-exploitation/README.md#sagemaker-model-registry-supply-chain-injection-via-createmodelpackageapproved
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the execution roles of SageMaker endpoints or jobs that automation deploys from Approved versions of a Model Package Group it can register versions in.
  requires:
    all_of:
      - action: sagemaker:CreateModelPackage
        resource: "{target.consumer_input_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      consumer_input_writable_via: sagemaker:CreateModelPackage
    scope: same_account
    aggregate_as: "SageMaker roles deploying Approved versions of writable Model Package Groups in {account}"
    outcome: workload_execution
  conditions:
    - id: autodeploy_consumer
      description: A pipeline, EventBridge rule or operator must deploy new Approved versions of that group (endpoint, batch transform or training) after the registration.
    - id: artifact_readable
      description: The referenced container image and model artifacts must be readable by SageMaker and the deploying role (attacker-controlled image in a pullable repository, model archive in a readable S3 location).
    - id: cross_account_group_policy
      description: For a group in another account the owner must share it with a resource policy that allows the caller to create model packages.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict sagemaker:CreateModelPackage and approval status changes to the release pipeline, require a separate approver for Approved status, and pin deployments to vetted image digests and artifact locations.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/model-registry-approve.html
  notes: Consumer mapping (Model Package Group -> deploying role) is not collected, so the edge resolves as unknown. Optional sagemaker:CreateModelPackageGroup only creates a new group, which no automation consumes by default.
