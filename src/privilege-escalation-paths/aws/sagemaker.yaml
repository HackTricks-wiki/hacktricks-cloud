# Amazon SageMaker AI privilege escalation techniques.
# Source: hacktricks-cloud aws-sagemaker-privesc/README.md (rev a53b46392c).
# Uses {target.resource_arn}, {target.artifact_arn}, via_resource_type and via_artifact_type (see header of lambda.yaml).

- id: aws-sagemaker-passrole-createnotebookinstance
  provider: aws
  service: sagemaker
  title: Create a notebook instance with a passed role and open it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#iampassrole--sagemakercreatenotebookinstance-sagemakercreatepresignednotebookinstanceurl
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting sagemaker.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: sagemaker:CreateNotebookInstance
        resource: "*"
      - action: sagemaker:CreatePresignedNotebookInstanceUrl
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: sagemaker.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting sagemaker.amazonaws.com passable in {account}"
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
    - id: presigned_url_source_ip
      description: aws:SourceIp / VPC endpoint conditions on presigned URL use may restrict access to the notebook.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on SageMaker roles with iam:PassedToService and limit notebook creation to data-science admins.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateNotebookInstance.html
  notes: Reach is roles trusting sagemaker.amazonaws.com in PassRole scope.

- id: aws-sagemaker-createpresignednotebookinstanceurl
  provider: aws
  service: sagemaker
  title: Open an existing notebook instance via a presigned URL
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakercreatepresignednotebookinstanceurl
  source_revision: 171e422299
  summary: The source can obtain the privileges of the role of existing SageMaker notebook instances in Resource scope.
  requires:
    all_of:
      - action: sagemaker:CreatePresignedNotebookInstanceUrl
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_notebook_instance
    scope: same_account
    aggregate_as: "Roles of existing SageMaker notebook instances in {account}"
  conditions:
    - id: notebook_in_service
      description: The notebook must be InService (or the source can start it); root access/terminal may be disabled by lifecycle configuration but the role is still usable from the kernel.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Scope sagemaker:CreatePresignedNotebookInstanceUrl to the owner's notebooks (tags) and keep notebook roles least-privileged.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreatePresignedNotebookInstanceUrl.html
  notes: Only existing notebook instances in Resource scope.

- id: aws-sagemaker-createpresigneddomainurl
  provider: aws
  service: sagemaker
  title: Mint a Studio login URL for an existing user profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakercreatepresigneddomainurl
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of SageMaker Studio user profiles in Resource scope.
  requires:
    all_of:
      - action: sagemaker:CreatePresignedDomainUrl
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_user_profile
    scope: same_account
    aggregate_as: "Execution roles of SageMaker Studio user profiles in {account}"
  conditions:
    - id: not_unified_studio
      description: Domains created by SageMaker Unified Studio reject this flow.
    - id: network_restriction
      description: Domains in VPC-only mode or with aws:SourceIp / aws:sourceVpce conditions may block use of the URL.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Scope CreatePresignedDomainUrl to the caller's own profile (e.g. sagemaker:ResourceTag/owner = aws:username) and keep execution roles least-privileged.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreatePresignedDomainUrl.html
  notes: Role is the profile's UserSettings.ExecutionRole, or the domain DefaultUserSettings.ExecutionRole if the profile has none. Also covers the sagemaker:CreateApp + CreatePresignedDomainUrl variant on the page (superset).

- id: aws-sagemaker-s3-putobject-job-code
  provider: aws
  service: sagemaker
  title: Overwrite S3 code consumed by existing SageMaker training or processing jobs
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#s3putobject-on-configured-training-or-processing-code-job-creation-optional
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of SageMaker jobs that execute S3 code it can overwrite.
  requires:
    all_of:
      - action: s3:PutObject
        resource: "{target.artifact_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_artifact_type: s3_object
    scope: same_account
    aggregate_as: "SageMaker job roles loading writable S3 code in {account}"
  conditions:
    - id: later_job_required
      description: A pipeline, schedule, tuning job or operator must create a job referencing the exact key after the overwrite.
    - id: executable_consumer
      description: Processing inputs are an execution sink only if the container entrypoint executes the file; plain data inputs are not.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Use immutable, uniquely named code artifacts, restrict writes to a dedicated publisher, and verify digests in the launcher.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/amazon-sagemaker-toolkits.html
  notes: Artifact set = sagemaker_submit_directory bundles and executed ProcessingInputs of jobs/pipelines; requires collector support for pipeline definitions.

- id: aws-sagemaker-ecr-putimage-processing-image
  provider: aws
  service: sagemaker
  title: Replace a mutable ECR image consumed by a later SageMaker Processing job
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#ecrputimage-on-a-mutable-processing-image-later-job-required
  source_revision: a66f094ede
  summary: The source can run code with a Processing job's execution role when that job later pulls a mutable image tag it can replace.
  requires:
    all_of:
      - action: ecr:PutImage
        resource: "{target.artifact_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_artifact_type: ecr_repository
    scope: same_account
    aggregate_as: "SageMaker Processing roles consuming mutable ECR images in {account}"
    outcome: workload_execution
  conditions:
    - id: mutable_tag_and_manifest
      description: The consumer must reference a mutable tag in this repository, and the source must possess a valid image manifest and its layers; ecr:BatchGetImage is needed to retrieve an existing manifest unless known through another path, while uploading new layers needs further ECR actions.
    - id: later_processing_job
      description: A pipeline, schedule or operator must create a Processing job after the tag is replaced; PutImage alone starts no workload.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Pin Processing images by digest or immutable tags, restrict ecr:PutImage on consumed repositories and verify image provenance before job creation.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/build-your-own-processing-container.html
  notes: The repo-to-Processing-consumer binding is not collected, so this path remains unresolved until a job or pipeline definition names the mutable tag.

- id: aws-sagemaker-passrole-createprocessingjob
  provider: aws
  service: sagemaker
  title: Create a Processing job with a passed role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakercreateprocessingjob-iampassrole
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting sagemaker.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
      - action: sagemaker:CreateProcessingJob
        resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: sagemaker.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting sagemaker.amazonaws.com passable in {account}"
  conditions:
    - id: egress_or_role_side_effects
      description: Credential use from inside the job needs outbound network (no network isolation) or the payload must act with the role directly.
    - id: sagemaker_condition_keys
      description: sagemaker:NetworkIsolation / sagemaker:VpcSubnets / image condition keys may constrain the job.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:PassRole on SageMaker roles and use SageMaker condition keys (approved images, network isolation) on job creation.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_CreateProcessingJob.html
  notes: The role also needs ECR pull permissions for the chosen image; AWS-provided images are normally pullable by SageMaker roles.

