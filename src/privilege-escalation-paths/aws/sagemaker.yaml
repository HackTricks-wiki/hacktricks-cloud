    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UserSettings.html
  notes: Not a separate HackTricks section; it is the explicit-role variant of the UpdateDomain section (UserSettings.ExecutionRole on CreateUserProfile), which avoids UpdateDomain and the no-InService-apps restriction.

- id: aws-sagemaker-updateclustersoftware-custom-ami
  provider: aws
  service: sagemaker
  title: Replace HyperPod instance-group nodes with a custom AMI that keeps the group's execution role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakerupdateclustersoftware--replace-hyperpod-nodes-with-a-custom-ami
  source_revision: 171e422299
  summary: The source can obtain the privileges of the instance-group execution roles of HyperPod clusters it can update, by booting their nodes from an image it controls.
  requires:
    all_of:
      - action: sagemaker:UpdateClusterSoftware
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_cluster
    scope: same_account
    aggregate_as: "Execution roles of HyperPod instance groups in {account}"
  conditions:
    - id: controlled_custom_ami
      description: A custom AMI with attacker-controlled startup code must already be available to the account and meet HyperPod's encryption and volume constraints; creating it needs separate EC2 permissions.
    - id: slurm_default_ami
      description: Slurm-orchestrated groups on the default HyperPod AMI cannot be switched to a custom AMI by this operation.
    - id: disruptive
      description: The update replaces node root volumes and interrupts running workloads.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict sagemaker:UpdateClusterSoftware to platform administrators on specific cluster ARNs, restrict who can create or share AMIs, and keep instance-group roles least-privileged.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateClusterSoftware.html
  notes: No role is passed, so iam:PassRole is not required. The page nests this heading under the CreatePresignedDomainUrl section, so coverage counted it as a child of that entry; it is modelled separately here.

- id: aws-sagemaker-attach-notebook-lifecycle-config
  provider: aws
  service: sagemaker
  title: Attach a controlled lifecycle configuration to an existing notebook instance
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#set-lifecycle-configuration-on-notebook-instances
  source_revision: b587e6bd26
  summary: The source can run startup code with an existing notebook instance's execution role by attaching a controlled lifecycle configuration.
  requires:
    all_of:
      - action: sagemaker:CreateNotebookInstanceLifecycleConfig
        resource: "arn:{source.partition}:sagemaker:*:{source.account}:notebook-instance-lifecycle-config/*"
      - action: sagemaker:UpdateNotebookInstance
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_notebook_instance
    scope: same_account
    aggregate_as: Roles of notebook instances whose lifecycle configuration can be replaced in {account}
    outcome: workload_execution
  preconditions:
    - sagemaker_attach_new_notebook_lifecycle_config
  conditions:
    - id: notebook_restart
      description: The notebook must be stopped for the configuration change and started afterward so the startup hook executes.
    - id: controlled_configuration
      description: The source must create a lifecycle configuration containing code that uses the notebook role's authority.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Limit notebook lifecycle-configuration creation and attachment to trusted deployment principals, and review lifecycle script content.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateNotebookInstance.html
  notes: This differs from rewriting an already-attached lifecycle configuration, which is covered by aws-sagemaker-updatenotebookinstancelifecycleconfig.

- id: aws-sagemaker-updatenotebookinstancelifecycleconfig
  provider: aws
  service: sagemaker
  title: Replace the startup script of an attached notebook lifecycle configuration
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#sagemakerupdatenotebookinstancelifecycleconfig--stored-code-execution-as-the-notebook-role
  source_revision: ad7429a974
  summary: The source can replace an existing lifecycle configuration used by a notebook and run code under that notebook's execution role on its next start.
  requires:
    all_of: []
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_notebook_instance
    scope: same_account
    aggregate_as: Roles of notebooks using a lifecycle configuration the source can update in {account}
    outcome: workload_execution
  preconditions:
    - sagemaker_attached_notebook_lifecycle_update
  conditions:
    - id: future_notebook_start
      description: The edited OnStart hook executes only when the attached notebook starts again; the source may need another authorized principal to perform that start.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Limit updates to notebook lifecycle configurations used by privileged notebooks and review their scripts before restarting those notebooks.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_UpdateNotebookInstanceLifecycleConfig.html
    - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_DescribeNotebookInstance.html
    - https://docs.aws.amazon.com/sagemaker/latest/dg/nbi-al2.html
  notes: The evaluator joins the exact collected NotebookInstanceLifecycleConfigName, notebook ARN and RoleArn in one account and Region, then checks UpdateNotebookInstanceLifecycleConfig on that configuration ARN. A future start and the script's actual outcome remain conditional. Stopped AL1 and AL2 notebooks cannot restart on their retired platforms.

- id: aws-sagemaker-attach-studio-lifecycle-config-user-profile
  provider: aws
  service: sagemaker
  title: Attach a controlled Studio lifecycle configuration to an existing user profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#set-lifecycle-configuration-on-sagemaker-studio
  source_revision: b587e6bd26
  summary: The source can run startup code with a Studio user profile's execution role by attaching a controlled lifecycle configuration.
  requires:
    all_of:
      - action: sagemaker:CreateStudioLifecycleConfig
        resource: "arn:{source.partition}:sagemaker:*:{source.account}:studio-lifecycle-config/*"
      - action: sagemaker:UpdateUserProfile
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: sagemaker
      via_resource_type: sagemaker_user_profile
    scope: same_account
    aggregate_as: Roles of Studio user profiles with updatable lifecycle settings in {account}
    outcome: workload_execution
  conditions:
    - id: studio_app_start
      description: A compatible Studio app for the profile must start after the update so the lifecycle script runs.
    - id: controlled_configuration
      description: The source must create a Studio lifecycle configuration for the application type used by the profile.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict Studio lifecycle-configuration creation and user-profile updates and review startup scripts on profiles with privileged roles.
  references:
    - https://docs.aws.amazon.com/sagemaker/latest/dg/studio-lcc.html
  notes: Domain-level default settings and shared spaces need separate target-to-resource joins; this entry applies to an individually updatable user profile.
