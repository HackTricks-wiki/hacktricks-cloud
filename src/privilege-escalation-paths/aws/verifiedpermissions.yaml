- id: aws-s05-delete-or-corrupt-the-authorization-store
  provider: aws
  service: verifiedpermissions
  title: Delete or corrupt the authorization store
  source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-verified-permissions-post-exploitation/README.md#delete-or-corrupt-the-authorization-store
  source_revision: 0b36331
  summary: The source may obtain Application action authorized by a proven fail-open integration when the exact documented prerequisite is verified.
  requires:
    any_of:
    - - action: verifiedpermissions:DeletePolicy
        resource: '*'
    - - action: verifiedpermissions:DeletePolicyStore
        resource: '*'
    - - action: verifiedpermissions:UpdatePolicy
        resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-s05-delete-or-corrupt-the-authorization-store
    scope: same_account
    aggregate_as: Verified Application action authorized by a proven fail-open integration in {account}
    grants:
    - Application action authorized by a proven fail-open integration
  conditions:
  - id: exact_verified_prerequisites
    description: Specific policy/template/schema/identity-source mutation and a confirmed application integration that treats the resulting denial/evaluation error as allow. Default Verified Permissions decision remains deny; no edge without fail-open proof. Missing or unverified evidence is UNKNOWN and must not emit a definite edge.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed action on the exact resource and remove unnecessary access.
  references:
  - https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_Operations.html
  - https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/monitoring-cloudtrail.html
  notes: Requires an exact source/target evidence record; absent facts remain UNKNOWN.
