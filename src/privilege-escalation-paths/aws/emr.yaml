# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# Amazon EMR privilege escalation techniques.
# Source: hacktricks-cloud aws-emr-privesc/README.md (rev a53b46392c; GetClusterSessionCredentials at 171e422299).
# Uses {target.resource_arn}, {target.artifact_arn}, via_resource_type and via_artifact_type (see header of lambda.yaml).

- id: aws-emr-addjobflowsteps
  provider: aws
  service: emr
  title: Run a step on an existing EMR cluster with its instance role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#elasticmapreduceaddjobflowsteps--execute-as-an-existing-cluster-instance-profile
  source_revision: 171e422299
  summary: A principal allowed to add a command step to an active cluster may use the role of that cluster's EC2 instance profile.
  requires:
    all_of: []
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    scope: same_account
    aggregate_as: Instance roles of active EMR clusters in {account}
    outcome: workload_execution
  preconditions:
  - emr_existing_cluster_step_instance_role
  conditions:
  - id: command_step_runs
    description: The submitted command step must run on the cluster and be able to use its instance profile credentials.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict AddJobFlowSteps to approved cluster operators and keep EMR instance roles least privileged.
  references:
  - https://docs.aws.amazon.com/emr/latest/APIReference/API_AddJobFlowSteps.html
  - https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-commandrunner.html
  - https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-iam-role-for-ec2.html
  notes: The evaluator joins a RUNNING or WAITING cluster to its recorded EC2 instance profile, the exact attached IAM role, and AddJobFlowSteps on that cluster ARN. It excludes clusters with runtime-role isolation enabled and leaves uncollected security configurations unresolved. It does not require PassRole for the existing profile.

- id: aws-emr-passrole-runjobflow
  provider: aws
  service: emr
  source_kind: [aws_user, aws_role]
  title: Launch an EMR cluster with a passed EC2 instance profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#iampassrole-elasticmapreducerunjobflow
  source_revision: 171e422299
  summary: The source can launch an EMR cluster with a passable EC2 instance profile and run bootstrap code on its instances.
  requires:
    all_of: []
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: "EC2 instance-profile roles passable in {account}"
    outcome: workload_execution
  preconditions:
    - emr_new_cluster_instance_role_effect_reviewed
  conditions:
    - id: emr_service_role_passable
      description: RunJobFlow also requires passing an EMR service role (or the default EMR_DefaultRole must exist and be passable); PassRole must cover it too.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
    - id: runnable_step
      description: The caller must provide an executable bootstrap action or step, and the selected instance profile must be attached to instances that launch successfully.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on EC2 instance-profile and EMR service roles with iam:PassedToService, and restrict elasticmapreduce:RunJobFlow.
  references:
    - https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-iam-role-for-ec2.html
  notes: RunJobFlow has no resource type, while the selected EC2 instance-profile role and distinct EMR service role both need PassRole. A role edge requires fresh reviewed evidence of an accepted cluster launch, exact service and instance role IDs, an instance belonging to that cluster with the profile applied, controlled bootstrap or step execution and a useful action under the instance role. A requested Auto Scaling role and Spot service-linked role must also be ready when used. Missing launch or execution evidence remains unresolved.

- id: aws-emr-addjobflowsteps-runtime-role
  provider: aws
  service: emr
  title: Submit an EMR step under an authorized runtime role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#elasticmapreduceaddjobflowsteps--execute-as-an-existing-cluster-instance-profile
  source_revision: e0ecce7ba7
  summary: A caller may run a command step under a selected runtime role on an existing EMR cluster with runtime roles enabled.
  requires:
    all_of: []
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      emr_runtime_role_of_cluster: true
    scope: same_account
    aggregate_as: Runtime roles authorized on active EMR clusters in {account}
    outcome: workload_execution
  preconditions:
    - emr_existing_cluster_runtime_step_role
  conditions:
    - id: executable_step
      description: The submitted step must be accepted and run under the selected runtime role; an AddJobFlowSteps grant alone does not prove that execution occurred.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Scope AddJobFlowSteps to approved clusters and require elasticmapreduce:ExecutionRoleArn to name only the runtime roles each operator needs.
  references:
    - https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-steps-runtime-roles.html
    - https://docs.aws.amazon.com/emr/latest/APIReference/API_AddJobFlowSteps.html
  notes: The evaluator binds a RUNNING or WAITING cluster, its runtime-role security configuration and instance profile, the host role's AssumeRole and TagSession grants, target trust, and the caller's AddJobFlowSteps grant with the selected ExecutionRoleArn. This path does not require caller iam:PassRole.

- id: aws-emr-getclustersessioncredentials-runtime-role
  provider: aws
  service: emr
  source_kind: [aws_user, aws_role]
  title: Vend endpoint credentials for an EMR runtime role without iam:PassRole
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-privesc/README.md#elasticmapreducegetclustersessioncredentials--connect-to-a-runtime-role-cluster-endpoint
  source_revision: 171e422299
  summary: A caller may submit work under an EMR runtime role if it can obtain endpoint credentials for that role, reach a compatible endpoint and run a permitted workload.
  requires:
    all_of: []
  target:
    kind: aws_role
    selector:
      emr_runtime_role_of_cluster: true
    scope: same_account
    aggregate_as: "EMR runtime roles of clusters with a security configuration in {account}"
  conditions:
    - id: credentials_are_endpoint_credentials
      description: The API returns HTTP basic credentials for the cluster's endpoints (Livy / Spark through EMR Studio-style integrations) acting as the runtime role, not STS keys; the source uses the role through workloads it submits to the cluster.
    - id: execution_role_condition_key
      description: elasticmapreduce:ExecutionRoleArn conditions on the grant can restrict which runtime roles credentials can be retrieved for.
    - id: cluster_running_with_runtime_roles
      description: The cluster must be running with a security configuration that enables runtime roles (and Lake Formation / FGAC where applicable).
    - id: endpoint_and_workload
      description: The returned credentials authenticate only to supported HTTP endpoints; the source needs endpoint reachability and a permitted workload to obtain any role-authorized AWS effect.
  preconditions:
    - emr_cluster_session_runtime_role
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Constrain elasticmapreduce:GetClusterSessionCredentials with elasticmapreduce:ExecutionRoleArn to the caller's own runtime roles and keep runtime roles least-privileged.
  references:
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_emr.html
    - https://docs.aws.amazon.com/emr/latest/APIReference/API_GetClusterSessionCredentials.html
    - https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-steps-runtime-roles.html
  notes: The evaluator joins target role trust to the EC2 instance profile on a WAITING or RUNNING cluster whose named security configuration enables runtime roles. It checks GetClusterSessionCredentials on that exact cluster and requested ExecutionRoleArn. A role edge also requires fresh reviewed evidence that HTTP credentials connected to a supported endpoint, controlled work ran under the runtime role, and a useful role action succeeded. An exact sts:ExternalId trust value is compared with a SHA-256 digest from the configuration; missing evidence stays unresolved.
