- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iam-post-exploitation/README.md#iamuploadsigningcertificate--plant-a-credential-on-another-user
  historical_source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamuploadsigningcertificate--plant-a-credential-on-another-user
  historical_source_revision: 171e422299
  technique: "iam:UploadSigningCertificate"
  reason: "IAM X.509 signing certificates authenticate only legacy SOAP API requests, which current AWS services no longer accept; they cannot sign SigV4 requests or obtain STS credentials, so the planted certificate yields no usable identity. Persistence/hygiene concern only."
  source_revision: 3ad99dc7ac
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iam-post-exploitation/README.md#iam-delegation-requests--iamassociatedelegationrequest-iamacceptdelegationrequest-iamsenddelegationtoken
