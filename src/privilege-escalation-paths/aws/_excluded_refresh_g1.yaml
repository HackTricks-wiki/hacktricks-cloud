  technique: "IAM delegation requests"
  reason: "Accepting a delegation request exports the accepting identity's authority to an onboarded external partner; it does not escalate a principal in the snapshot, and sts:GetDelegatedAccessToken requires a provider-bound trade-in token from the approved workflow."
