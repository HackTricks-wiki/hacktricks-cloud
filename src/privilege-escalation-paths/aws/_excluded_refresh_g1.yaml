  technique: "sso-admin:CreateTrustedTokenIssuer"
  reason: "A rogue trusted token issuer impersonates users only towards trusted-identity-propagation applications (data-plane access in services such as Redshift, Q, S3 Access Grants); it yields no permission set session or IAM role."
  source_revision: f2aa915198
