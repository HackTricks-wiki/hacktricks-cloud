- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-control-tower-privesc/README.md#account-factory-customization-afc--run-cloudformation-in-managed-accounts
  technique: "Account Factory Customization blueprint tampering"
  reason: "The blueprint (a Service Catalog product in a hub account) is applied to managed accounts only when Control Tower enrolls, creates or updates an account with it; the blueprint-to-account mapping and the account-update step are not inferable from collected IAM facts, and a generic servicecatalog:CreateProvisioningArtifact edge would duplicate aws-servicecatalog-createprovisioningartifact-provisionproduct. Needs a Control Tower blueprint inventory (see SCHEMA EXTENSIONS in the G1 report)."
  source_revision: 171e422299
