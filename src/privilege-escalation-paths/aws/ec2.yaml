        resource: '*'
      - action: ec2:ModifyVpnTunnelOptions
        resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-s05-ec2modifyvpnconnection-ec2modifyvpntunneloptions-take-over-an-existing
    scope: same_account
    aggregate_as: Verified Site-to-Site VPN customer peer identity in {account}
    grants:
    - Site-to-Site VPN customer peer identity
