  source_revision: 57bd5c07df
  summary: A live paused CodeBuild debug session gives shell access with the project
    service role. Conditional principal access requires the exact inventoried identity,
    usable authority equivalent to its observed full IAM rights, fresh evidence and
    matching authorization fingerprint. A scoped token/session is insufficient.
  requires:
    all_of:
    - action: ssm:StartSession
      resource: '*'
  target:
    kind: aws_role
    selector:
      aws_challenge_fact: aws-codebuild-ssm-debug-session-role
    scope: same_account
    outcome: workload_execution
  conditions:
  - id: live_breakpoint
    description: A build with session connections enabled must be paused at codebuild-breakpoint.
  - id: verified_collector_fact
    description: The requested collector fact must bind the source, exact resource,
      newly reachable authority and all runtime prerequisites; without it the result
      is UNKNOWN.
  confidence: conditional
  severity: high
  mitigation: Restrict the named operation to trusted administrators and review downstream
