    Standard inventories never fabricate these facts.
- id: aws-devicefarm-schedulerun-existing-test-spec-passrole
  provider: aws
  service: devicefarm
  title: Schedule an existing malicious Device Farm test spec with a passed role
  summary: Attacker commands execute inside the Device Farm test runtime with the
    passed execution role. Conditional principal access requires the exact inventoried
    identity, usable authority equivalent to its observed full IAM rights, fresh evidence
    and matching authorization fingerprint. A scoped token/session is insufficient.
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-device-farm-privesc/README.md#devicefarmcreateprojectupdateprojectschedulerun--iampassrole
  source_revision: 57bd5c07df
  requires:
    all_of:
    - action: devicefarm:ScheduleRun
      resource: '*'
    - action: iam:PassRole
      resource: '*'
  target:
    kind: aws_role
    selector:
      aws_challenge_fact: aws-devicefarm-schedulerun-existing-test-spec-passrole
    scope: same_account
    outcome: workload_execution
  conditions:
  - id: condition_1
    description: An existing project, compatible app/test package, device pool and
      attacker-controlled custom test-spec upload already exist.
  - id: condition_2
    description: configuration.executionRoleArn in ScheduleRun overrides the project
      role; a new CreateUpload or CreateProject/UpdateProject is unnecessary in this
      case.
  - id: verified_collector_fact
    description: The requested collector fact must bind the source, exact resource,
      newly reachable authority and all runtime prerequisites; without it the result
      is UNKNOWN.
