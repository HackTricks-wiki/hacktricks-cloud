# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

- id: aws-audit-use-existing-parameterized-automation-runbook-with-runtime-passrole
  provider: aws
  service: ssm
  title: Use existing parameterized Automation runbook with runtime PassRole
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ssm-privesc/README.md#ssmstartautomationexecution--execute-a-preauthorized-runbook-role
  source_revision: 57bd5c07df
  summary: The source can execute caller-selected runbook steps as passable role only
    when the exact target and prerequisites are verified. Conditional principal access
    requires the exact inventoried identity, usable authority equivalent to its observed
    full IAM rights, fresh evidence and matching authorization fingerprint. A scoped
    token/session is insufficient.
  requires:
    all_of:
    - action: ssm:StartAutomationExecution
      resource: '*'
    - action: iam:PassRole
      resource: '*'
  target:
    kind: aws_role
    selector:
      aws_challenge_fact: aws-audit-use-existing-parameterized-automation-runbook-with-runtime-passrole
    scope: same_account
    outcome: workload_execution
  conditions:
  - id: exact_verified_prerequisites
    description: 'Evidence must bind source, exact target, and these prerequisites:
      Existing runbook accepts AutomationAssumeRole parameter and uses it as role;
      source can start it with allowed parameters; iam:PassRole covers exact role
      trusting ssm.amazonaws.com; step must have useful privileged effect.'
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed actions to approved operators and review the exact
    target configuration.
  notes: Missing exact principal, authority equivalence, fresh evidence, condition
    IDs, authorization fingerprint or action/resource joins remains UNKNOWN. Restricted
    sessions, revoked keys and audience-bound tokens do not reach the full identity.
    Standard inventories never fabricate these facts.
  references:
  - https://cloud.hacktricks.wiki/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ssm-privesc/
- id: aws-codebuild-ssm-debug-session-role
