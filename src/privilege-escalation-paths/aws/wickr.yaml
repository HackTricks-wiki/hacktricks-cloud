- id: aws-audit-reset-wickr-retention-bot-challenge-and-operate-bot
  provider: aws
  service: wickr
  title: Reset Wickr retention-bot challenge and operate bot
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-wickr-privesc/README.md#wickrcreatedataretentionbotchallenge--take-over-the-data-retention-bot
  source_revision: 0b36331
  summary: The source can authenticate bot and receive message/attachment copies only when the exact target and
    prerequisites are verified.
  requires:
    all_of:
    - action: wickr:CreateDataRetentionBotChallenge
      resource: '*'
  target:
    kind: aws_verified_authority
    selector:
      aws_challenge_fact: aws-audit-reset-wickr-retention-bot-challenge-and-operate-bot
    scope: same_account
    aggregate_as: Verified Authenticate bot and receive message/attachme in {account}
    grants:
    - Authenticate bot and receive message/attachment copies
  conditions:
  - id: exact_verified_prerequisites
    description: 'Evidence must bind the source, exact target, and these prerequisites: Retention enabled; exact
      network ARN; attacker operates compatible bot and captures returned challenge; enrollment may disrupt prior
      bot.'
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict the listed permissions to approved operators and review the exact target configuration.
  notes: Evidence must bind actor, exact resource, target and all prerequisites; absent evidence is UNKNOWN, with
    no definite privilege edge.
  references:
  - https://cloud.hacktricks.wiki/pentesting-cloud/aws-security/aws-privilege-escalation/aws-wickr-privesc/
