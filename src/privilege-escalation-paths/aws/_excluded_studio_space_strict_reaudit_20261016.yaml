- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sagemaker-privesc/README.md#set-lifecycle-configuration-on-sagemaker-studio
  source_revision: b587e6bd26
  technique: Attach a controlled Studio lifecycle configuration to an existing space
  reason: The current inventory does not collect DescribeSpace, so it cannot join a space's
    sharing type, owner and app type to the exact role. Shared spaces use the domain's
    DefaultSpaceSettings.ExecutionRole; private spaces use the owner profile's role.
    UpdateSpace must target the collected space ARN and attach a lifecycle configuration
    whose app type matches that existing space; the script runs only after a compatible
    app starts. A generic SageMaker trust relationship cannot substitute for this join.
  prior_id: aws-sagemaker-attach-studio-lifecycle-config-space
