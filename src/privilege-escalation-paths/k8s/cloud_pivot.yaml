# catalog_description: Only principal-to-principal or principal-to-additional-permission
# escalation paths belong here. A source must control a credential or hold the
# required verbs, perform the named action, and reach a known target identity
# or new effective permission. Generic Secret reads and guardrail changes
# without a proven identity or permission gain are excluded.
# Canonical provider policy: peaso/privesc/catalog_policy.yaml.
# Kubernetes <-> cloud identity pivots (EKS IRSA / Pod Identity / kiam / aws-auth, GKE Workload
# Identity, AKS Workload ID / identity bindings, node cloud identities).
# Conventions: see header of rbac.yaml. Entries with source_kind describe edges from an identity
# (ServiceAccount or node) to a cloud principal; who reaches that identity is modelled elsewhere
# (pods create, exec, tokens...). Source: hacktricks-cloud rev a53b46392c, re-verified against 171e422.

- id: k8s-cloud-eks-irsa
  provider: k8s
  service: eks
  title: ServiceAccount assumes an IAM role through IRSA (OIDC web identity)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#iam-role-for-k8s-service-accounts-via-oidc
  source_revision: 2415fadfbd
  summary: A ServiceAccount can obtain the privileges of the IAM roles whose trust policy accepts the cluster OIDC issuer with that ServiceAccount's subject.
  source_kind: k8s_service_account
  requires:
    all_of: []
  target:
    kind: cloud_identity
    selector:
      trust_allows_k8s_sa_oidc_subject: true
    scope: any
    aggregate_as: "IAM roles trusting {source.namespace}/{source.name} via IRSA"
  conditions:
    - id: aws_trust_not_collected
      description: Needs the AWS role trust and the EKS cluster OIDC issuer to join the exact federated provider, subject, and STS audience. An annotation alone does not establish that the role can be assumed.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Scope IRSA trust policies to an exact sub (system:serviceaccount:<ns>:<sa>) and aud sts.amazonaws.com; prefer EKS Pod Identity with tag conditions.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/associate-service-account-role.html
  notes: The annotation is not a security gate; any holder of a token for the ServiceAccount with audience sts.amazonaws.com (a pod can request a projected token with any audience) can call AssumeRoleWithWebIdentity. Hence the reachable set is defined by the trust policy, not the annotation. Trusts with wildcard or missing sub conditions are reached by every matching ServiceAccount.

- id: k8s-cloud-eks-irsa-create-matching-sa
  provider: k8s
  service: eks
  title: Create a ServiceAccount matching an IRSA trust
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#iam-role-for-k8s-service-accounts-via-oidc
  source_revision: 2415fadfbd
  summary: The source can obtain an IAM role by creating a ServiceAccount whose new name matches the role's IRSA trust and obtaining its STS-audience token.
  requires:
    all_of:
      - verb: create
        resource: serviceaccounts
        namespace: "{pivot.namespace}"
    any_of:
      - - any_of:
            - {verb: create, resource: pods, namespace: "{pivot.namespace}"}
            - {verb: create, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
            - {verb: create, resource: jobs, api_group: batch, namespace: "{pivot.namespace}"}
            - {verb: create, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: serviceaccounts, subresource: token, namespace: "{pivot.namespace}"}
  target:
    kind: cloud_identity
    selector:
      trust_allows_oidc_subject_wildcard: "system:serviceaccount:{pivot.namespace}:*"
    scope: any
    aggregate_as: "IAM roles with wildcard IRSA trust matching {pivot.namespace}"
  conditions:
    - id: aws_trust_not_collected
      description: Requires the AWS role trust, matching EKS OIDC issuer, and STS audience; a new ServiceAccount name must satisfy the subject pattern.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Never use wildcards in the sub condition of IRSA trust policies.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/associate-service-account-role.html
  notes: This path also covers an exact trusted ServiceAccount name that has not yet been created. Existing matching ServiceAccounts use the separate existing-SA route.

- id: k8s-cloud-eks-irsa-wildcard-trust-existing-sa
  provider: k8s
  service: eks
  title: Use an existing ServiceAccount trusted by an IRSA role
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#iam-role-for-k8s-service-accounts-via-oidc
  source_revision: 2415fadfbd
  summary: The source can obtain an IAM role by obtaining an STS-audience token for an existing ServiceAccount whose name matches the role's IRSA trust.
  requires:
    all_of: []
    any_of:
      - - any_of:
            - {verb: create, resource: pods, namespace: "{pivot.namespace}"}
            - {verb: create, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
            - {verb: create, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
            - {verb: create, resource: jobs, api_group: batch, namespace: "{pivot.namespace}"}
            - {verb: create, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: serviceaccounts, subresource: token, namespace: "{pivot.namespace}"}
  target:
    kind: cloud_identity
    selector:
      trust_allows_oidc_subject_wildcard: "system:serviceaccount:{pivot.namespace}:*"
    scope: any
    aggregate_as: "IAM roles with wildcard IRSA trust matching {pivot.namespace}"
  conditions:
    - id: existing_sa_matches_wildcard
      description: An inventoried ServiceAccount name in the namespace must match the trust's subject pattern; a trust for a name that does not exist needs the create-matching-SA path.
    - id: token_audience
      description: The token must carry the trusted audience (sts.amazonaws.com); a pod can request it with a projected serviceAccountToken volume and TokenRequest accepts any audience, so the eks.amazonaws.com/role-arn annotation is not needed.
    - id: aws_trust_not_collected
      description: Requires the AWS role trust and matching EKS OIDC issuer to evaluate the subject and STS audience.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Never use wildcards in the sub condition of IRSA trust policies; pin both sub and aud.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/associate-service-account-role.html
    - https://kubernetes.io/docs/concepts/storage/projected-volumes/#serviceaccounttoken
  notes: The annotation only drives webhook injection; the trust check is on token issuer, subject, and audience, so no ServiceAccount write is required when an existing matching ServiceAccount can supply a token.

- id: k8s-cloud-eks-pod-identity
  provider: k8s
  service: eks
  title: ServiceAccount receives an IAM role through EKS Pod Identity
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#eks-pod-identity
  source_revision: 2415fadfbd
  summary: A ServiceAccount can obtain the privileges of the IAM role of the EKS Pod Identity association for its (namespace, name).
  source_kind: k8s_service_account
  requires:
    all_of: []
  target:
    kind: cloud_identity
    selector:
      k8s_sa_cloud_binding: eks_pod_identity
    scope: any
    aggregate_as: "IAM roles associated with {source.namespace}/{source.name}"
  conditions:
    - id: pod_identity_association_from_related_aws
      description: The EKS association must name the source ServiceAccount and an initial role whose trust allows pods.eks.amazonaws.com to call AssumeRole and TagSession. A target role is a separate IAM role chain.
    - id: pod_identity_agent_running
      description: The EKS Pod Identity Agent must run on the nodes; credentials are served only to pods running as that ServiceAccount.
    - id: trust_tag_conditions
      description: Trust conditions on kubernetes-namespace/kubernetes-service-account/cluster tags may further restrict the role.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Associate roles only with dedicated ServiceAccounts in namespaces where untrusted subjects cannot create pods; add tag conditions to the trust.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
  notes: The roleArn in the association is the first role assumed by EKS. targetRoleArn, if present, is a later IAM role hop evaluated by the AWS catalog; it is not substituted for roleArn here.

- id: k8s-cloud-gke-workload-identity
  provider: k8s
  service: gke
  title: ServiceAccount impersonates a Google service account via GKE Workload Identity
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#workload-identity-federation-for-gke
  source_revision: 2415fadfbd
  summary: A ServiceAccount can obtain the privileges of the Google service accounts that grant roles/iam.workloadIdentityUser to its Workload Identity member.
  source_kind: k8s_service_account
  requires:
    all_of: []
  target:
    kind: cloud_identity
    selector:
      k8s_sa_cloud_binding: gke_workload_identity
      gcp_workload_identity_user_granted_to_k8s_sa: true
    scope: any
    aggregate_as: "GSAs impersonable by {source.namespace}/{source.name}"
  conditions:
    - id: gcp_iam_not_collected
      description: The IAM binding on the GSA must name the exact workload pool recorded on the joined GKE cluster and the source namespace and ServiceAccount. An annotation without that cluster and IAM join leaves the path unknown.
    - id: gke_metadata_server_required
      description: The pod must run on a GKE node pool using the GKE metadata server so it can exchange its Kubernetes identity for a Google access token.
    - id: identity_sameness
      description: Every cluster in the same project/fleet workload pool shares the member identity, so the same namespace/name in another cluster also reaches the GSA.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Grant workloadIdentityUser only to dedicated KSAs in namespaces untrusted subjects cannot write to; avoid shared workload pools across trust boundaries.
  references:
    - https://cloud.google.com/kubernetes-engine/docs/how-to/workload-identity
  notes: The IAM binding, not the annotation, is the authorization gate. Direct IAM grants to the KSA principal (principal://iam.googleapis.com/projects/<n>/locations/global/workloadIdentityPools/<pool>/subject/ns/<ns>/sa/<ksa>) also give it cloud privileges; the evaluator should treat that federated principal as the cloud_identity reached.

- id: k8s-cloud-aks-workload-identity
  provider: k8s
  service: aks
  title: ServiceAccount obtains an Entra identity via AKS Workload ID federation
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#azure--aks
  source_revision: 2415fadfbd
  summary: A ServiceAccount can obtain the privileges of the managed identities or app registrations whose federated identity credential matches the cluster issuer and its subject.
  source_kind: k8s_service_account
  requires:
    all_of: []
  target:
    kind: cloud_identity
    selector:
      k8s_sa_cloud_binding: azure_workload_identity
      azure_fic_matches_k8s_sa: true
    scope: any
    aggregate_as: "Entra identities federated with {source.namespace}/{source.name}"
  conditions:
    - id: azure_fic_not_collected
      description: The Entra federated credential must accept the joined AKS cluster issuer, exact ServiceAccount subject, and token exchange audience. A matching credential is sufficient even without the webhook annotation when the token audience can be requested directly.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Federate identities only with dedicated ServiceAccounts in namespaces where untrusted subjects cannot create pods or tokens.
  references:
    - https://learn.microsoft.com/en-us/azure/aks/workload-identity-overview
  notes: The annotation and the azure.workload.identity/use label only drive token injection by the webhook; any holder of a token for the SA with audience api://AzureADTokenExchange can exchange it, so they are not gates.

- id: k8s-cloud-node-cloud-identity
  provider: k8s
  service: nodes
  title: Control of a node host reaches its cloud identity
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#node-iam-role-to-cluster-admin
  source_revision: 2415fadfbd
  summary: Control of a node host can obtain the privileges of its attached cloud identity (EC2 instance profile role, GCE node service account, or AKS kubelet managed identity).
  source_kind: k8s_node
  requires:
    all_of: []
  target:
    kind: cloud_identity
    selector:
      k8s_node_cloud_identity: true
    scope: any
    aggregate_as: "Cloud identity of nodes in {cluster}"
  conditions:
    - id: node_cloud_identity_not_collected
      description: The attached identity is known from the cloud snapshot (instance profile, node pool service account, VMSS identity), not from the K8s collector.
    - id: node_host_control_required
      description: A Kubernetes node API credential alone does not expose the host's metadata service; the source must also control the node host or a workload that can reach the metadata service.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Give node identities only the minimal permissions (registry pull, CNI); never attach broad roles to node pools.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/create-node-role.html
    - https://cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster#use_least_privilege_sa
  notes: On GKE with Workload Identity enabled on the node pool, pods are served by the GKE metadata server, but the node itself still holds the node service account.

- id: k8s-cloud-pod-imds-node-identity
  provider: k8s
  service: nodes
  title: Ordinary pod reaches the node metadata service
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#node-iam-role-to-cluster-admin
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the node cloud identity by creating any pod when pods can reach the instance metadata service.
  requires:
    all_of:
      - any_of:
          - {verb: create, resource: pods, namespace: "{pivot.namespace}"}
          - {verb: create, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
          - {verb: create, resource: jobs, api_group: batch, namespace: "{pivot.namespace}"}
          - {verb: create, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
  target:
    kind: cloud_identity
    selector:
      k8s_node_cloud_identity: true
    scope: any
    aggregate_as: "Cloud identity of nodes in {cluster}"
  conditions:
    - id: imds_reachable_from_pod
      description: EKS needs an IMDS hop limit >= 2 (AL2023 managed node groups without a launch template and Auto Mode default to 1) and no disablePodIMDS; GKE needs node pools without Workload Identity/metadata concealment; AKS needs no network policy blocking 169.254.169.254.
    - id: network_policy_blocks_imds
      description: An egress NetworkPolicy denying the metadata address removes the edge.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: high
  mitigation: Block pod access to IMDS (hop limit 1, disablePodIMDS, GKE Workload Identity, egress policies) and use workload identities instead.
  references:
    - https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html#restrict-access-to-the-instance-profile-assigned-to-the-worker-node
  notes: Admission is not involved; only network reachability matters. Exec into existing pods gives the same reach and is modelled implicitly through the ServiceAccount chain.

- id: k8s-cloud-hostnetwork-pod-node-identity
  provider: k8s
  service: nodes
  title: hostNetwork pod reaches the node metadata service (not node root)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/workload-and-pod-access.md#pod-create---move-to-cloud
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the node cloud identity by creating a hostNetwork pod, which bypasses pod-level IMDS hop restrictions.
  requires:
    all_of:
      - any_of:
          - {verb: create, resource: pods, namespace: "{pivot.namespace}"}
          - {verb: create, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
          - {verb: create, resource: jobs, api_group: batch, namespace: "{pivot.namespace}"}
          - {verb: create, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
  target:
    kind: cloud_identity
    selector:
      k8s_node_cloud_identity: true
    scope: any
    aggregate_as: "Cloud identity of nodes in {cluster}"
  conditions:
    - id: other_admission_blocks_host_network
      description: Non-PSA admission may reject hostNetwork pods.
    - id: gke_metadata_server_on_host_network
      description: On GKE node pools with Workload Identity, hostNetwork pods are not intercepted by the GKE metadata server and reach the node service account, so Workload Identity is not a blocker here.
  blockers: [pivot_namespace_psa_enforce_baseline_or_restricted, admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: high
  mitigation: Enforce PSA baseline (which disallows hostNetwork) and minimize node identity permissions.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  notes: Distinct from k8s-cloud-pod-imds-node-identity because it is gated by PSA rather than IMDS network settings; it only adds reach where ordinary pods are kept from the metadata service (EKS hop limit 1 / disablePodIMDS, GKE metadata server, egress NetworkPolicy, which does not apply to hostNetwork pods). hostNetwork places the pod in the node network namespace but is not a host escape and does not reach node root or the kubelet credential; node-local loopback services remain subject to their own authentication.

- id: k8s-cloud-eks-node-role-to-node
  provider: k8s
  service: eks
  title: EKS node IAM role authenticates to the cluster as a node
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#privesc-to-cluster-admin
  source_revision: 2415fadfbd
  summary: Credentials of the EKS node IAM role can obtain the privileges of the node identity (system:node:<name>, group system:nodes) mapped to that instance session.
  source_kind: cloud_identity
  requires:
    all_of: []
  target:
    kind: k8s_node
    selector:
      k8s_nodes_mapped_to_cloud_identity: true
    scope: cluster
    aggregate_as: "Nodes mapped to the node role in {cluster}"
  conditions:
    - id: node_name_from_session
      description: The username is derived from the instance (EC2PrivateDNSName) of the role session; stolen instance credentials map to that instance's node. Principals able to assume the node role with another session can reach other nodes.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Block pod access to IMDS so node role credentials cannot be stolen from pods, and keep privileged ServiceAccounts' pods on dedicated nodes.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  notes: Combined with k8s-nodes-node-mint-pod-sa-tokens this reaches pod ServiceAccounts only on the same node. Mapping is via access entries of type EC2_LINUX or EC2_WINDOWS, or aws-auth mapRoles to system:nodes. A missing access entry remains conditional when aws-auth may still map the role; API-only authentication excludes that route.
