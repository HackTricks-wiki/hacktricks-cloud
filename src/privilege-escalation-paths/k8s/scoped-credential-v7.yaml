# catalog_description: Only principal-to-principal or principal-to-additional-permission
# escalation paths belong here. A source must control a credential or hold the
# required verbs, perform the named action, and reach a known target identity
# or new effective permission. Generic Secret reads and guardrail changes
# without a proven identity or permission gain are excluded.
# Canonical provider policy: peaso/privesc/catalog_policy.yaml.
- id: k8s-workloads-pods-mount-argocd-cluster-credential
  provider: k8s
  service: workloads
  title: Mount an Argo CD managed-cluster credential in a Pod
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/validating-admission-policies.md#pod-creation-policy-gaps
  source_revision: 2415fadfbd
  summary: A Pod author can obtain the registered-cluster identity from a credential-bearing
    Argo CD Secret in the same namespace without Secret-read RBAC.
  requires:
    all_of: []
    any_of:
    - - verb: create
        resource: pods
        namespace: '{target.namespace}'
    - - verb: create
        resource: deployments
        api_group: apps
        namespace: '{target.namespace}'
    - - verb: create
        resource: daemonsets
        api_group: apps
        namespace: '{target.namespace}'
    - - verb: create
        resource: statefulsets
        api_group: apps
        namespace: '{target.namespace}'
    - - verb: create
        resource: replicasets
        api_group: apps
        namespace: '{target.namespace}'
    - - verb: create
        resource: replicationcontrollers
        namespace: '{target.namespace}'
    - - verb: create
        resource: jobs
        api_group: batch
        namespace: '{target.namespace}'
    - - verb: create
        resource: cronjobs
        api_group: batch
        namespace: '{target.namespace}'
  target:
    kind: k8s_remote_cluster
    outcome: credentials
    selector:
      k8s_secret_holds_remote_cluster_credential: argocd.argoproj.io/secret-type=cluster
      k8s_challenge_fact: k8s-workloads-pods-mount-argocd-cluster-credential
    scope: cluster
    aggregate_as: Argo CD registered-cluster credentials in {cluster}
  conditions:
  - id: same_namespace_and_admitted_pod
    description: A Pod produced by the grant must run in the Secret namespace and
      be admitted with a Secret volume or environment reference; admission may deny
      the Pod, reference, image, or controller.
  - id: usable_remote_cluster_credential
    description: The Secret config must contain a currently usable bearer token or
      client certificate. An Argo CD label or exec credential-provider configuration
      alone does not prove this.
  blockers:
  - admission_policy
  - admission_webhook
  - kyverno_policy
  - gatekeeper_constraint
  confidence: conditional
  severity: high
  mitigation: Restrict Pod and controller creation in namespaces holding Argo CD cluster
    credentials; enforce Secret-reference admission rules.
  references:
  - https://kubernetes.io/docs/concepts/configuration/secret/
  - https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#clusters
  notes: Requires fresh metadata-only reviewed evidence binding the source, Secret
    UID, admitted workload namespace and kind, exact remote cluster, accepted credential
    subject, audience, expiry and effective remote rights. No Secret values are read
    or stored. The target denotes this stored remote credential only; it never implies
    cluster administrator privileges.
