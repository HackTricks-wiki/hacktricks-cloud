  notes: A RoleBinding limits the added rules to its namespace. Without escalate or prior ownership of the proposed rules, the new ClusterRole cannot add permissions that the source did not already hold.

- id: k8s-rbac-csr-kube-apiserver-client-serviceaccount
  provider: k8s
  service: certificates
  title: Issue and approve a client certificate for a bound ServiceAccount username
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#certificate-signing-requests
  source_revision: 2415fadfbd
  summary: The source can request a client certificate whose common name matches a ServiceAccount username already named in RBAC, then approve and read the signed certificate.
  requires:
    all_of:
      - {verb: create, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
