- id: k8s-rbac-bind-existing-role-new-permission
  provider: k8s
  service: rbac
  title: Bind an existing Role or ClusterRole that grants a new permission
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bind
  source_revision: 2415fadfbd
  summary: The source can create a RoleBinding to an existing Role or ClusterRole whose collected rules grant at least one concrete permission the source does not already hold in that namespace.
  requires:
    all_of:
      - verb: create
        resource: rolebindings
        api_group: rbac.authorization.k8s.io
        namespace: "{target.namespace}"
  target:
    kind: k8s_verified_authority
    selector:
      k8s_bound_role_gain: true
    scope: cluster
    outcome: permission_grant
    grants: ["The exact collected Role or ClusterRole permissions in the binding namespace"]
    aggregate_as: "New permissions from an existing RoleBinding target"
  conditions:
    - id: exact_role_and_new_permission
      description: The selected Role must exist, the source must have bind on it, and a concrete rule must grant a permission not already held by the source in the binding namespace.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: derived
  severity: high
  mitigation: Avoid combining RoleBinding creation with bind on roles that grant sensitive actions; restrict bind to specific low-privilege roles.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-binding-creation-or-update
  notes: This is a permission gain bounded to the named Role and namespace. It does not claim the source becomes another ServiceAccount. Missing RBAC inventory keeps a possible route conditional, and a complete inventory with no new permission produces no edge.

- id: k8s-rbac-modify-existing-rolebinding-new-permission
  provider: k8s
  service: rbac
  title: Add the source to an existing RoleBinding that grants a new permission
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bind
  source_revision: 2415fadfbd
  summary: An existing RoleBinding points to a collected Role or ClusterRole with a permission the source lacks, and the source can add itself to that exact binding.
  requires:
    any_of:
      - - verb: patch
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
      - - verb: update
          resource: rolebindings
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
  target:
    kind: k8s_verified_authority
    selector:
      k8s_existing_rolebinding_gain: true
    scope: cluster
    outcome: permission_grant
    grants: ["The exact collected Role or ClusterRole permissions in the binding namespace"]
    aggregate_as: "New permissions from an existing RoleBinding"
  conditions:
    - id: exact_existing_binding_and_new_permission
      description: A collected RoleBinding must point to the selected Role, the source must be able to modify that binding and bind the exact Role, and a concrete rule must add a permission the source lacks.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: derived
  severity: high
  mitigation: Limit writes to RoleBindings and bind access to roles that grant sensitive permissions.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-binding-creation-or-update
  notes: A RoleBinding roleRef cannot be changed. The selector joins the existing binding to its current Role and verifies patch or update on that exact binding. Missing or uncertain RBAC facts keep the path conditional.

- id: k8s-rbac-bind-existing-clusterrole-new-permission
  provider: k8s
  service: rbac
  title: Bind an existing ClusterRole that grants a new cluster-wide permission
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bind
