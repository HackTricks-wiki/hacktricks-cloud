# catalog_description: Only principal-to-principal or principal-to-additional-permission
# escalation paths belong here. A source must control a credential or hold the
# required verbs, perform the named action, and reach a known target identity
# or new effective permission. Generic Secret reads and guardrail changes
# without a proven identity or permission gain are excluded.
# Canonical provider policy: peaso/privesc/catalog_policy.yaml.
# Kubernetes RBAC-plane privilege-escalation techniques (secrets, tokens, impersonation,
# bind/escalate, CSR). Source: hacktricks-cloud rev a53b46392c, re-verified against 171e422.
#
# Conventions used across catalog/k8s/*.yaml (see SCHEMA EXTENSIONS in the agent report):
#   namespace: "{target.namespace}"  -> the effective grant (RoleBinding in that namespace, or a
#                                       ClusterRoleBinding) must cover the namespace of the target.
#   namespace: "{pivot.namespace}"   -> one namespace P in which EVERY requirement using
#                                       {pivot.namespace} holds at the same time; blockers and selectors
#                                       that mention the pivot are evaluated against P.
#   namespace: "*"                   -> cluster-wide grant (ClusterRoleBinding) or cluster-scoped resource.
#   resource_name: <name>            -> the rule must cover that object name (no resourceNames, or the
#                                       name is listed). {target.name} = name of the target object.
#   api_group omitted                -> core group "".
#   source_kind (top level)          -> the source is an identity of that kind rather than any RBAC
#                                       subject holding the listed permissions (requires may be empty).

- id: k8s-rbac-secrets-read-legacy-sa-token
  provider: k8s
  service: rbac
  title: Read Secrets containing legacy ServiceAccount tokens
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/secrets-and-configmaps.md#verified-legacy-serviceaccount-token-secret
  source_revision: c3052fe8de
  summary: The source can obtain the privileges of ServiceAccounts in the namespace that have a kubernetes.io/service-account-token Secret.
  requires:
    all_of: []
    any_of:
      - - verb: get
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: list
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: watch
          resource: secrets
          namespace: "{target.namespace}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      k8s_sa_has_legacy_token_secret: true
      k8s_challenge_fact: k8s-rbac-secrets-read-legacy-sa-token
    scope: same_namespace
    aggregate_as: "ServiceAccounts with legacy token Secrets in {target.namespace}"
  conditions:
    - id: legacy_sa_token_secret_exists
      description: A reviewed evidence record must bind the exact Secret UID and version to this ServiceAccount and prove that its token was accepted by the API server; metadata alone does not prove a usable token.
    - id: get_requires_secret_name
      description: The exact get, list or watch action must be authorized for the named Secret and a read of that Secret must have succeeded.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Remove get/list/watch on secrets from non-admin subjects, delete legacy service-account-token Secrets and rely on bound projected tokens.
  references:
    - https://kubernetes.io/docs/concepts/security/service-accounts/
    - https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/#legacy-serviceaccount-token-cleaner
  notes: The typed k8s_privesc_challenge_evidence proof must freshly attest the exact source, target ServiceAccount, Secret UID/version, accepted audience and subject, usable token, successful Secret read, and at least one effective permission previously denied to the source. Secret values are never stored. Reading other Secret types (cloud keys, kubeconfigs) can also yield identities, but those targets are not derivable from inventory and are excluded.

- id: k8s-rbac-secrets-create-sa-token-secret
  provider: k8s
  service: rbac
  title: Create a ServiceAccount token Secret and read it back
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/secrets-and-configmaps.md#creating-and-reading-secrets
  source_revision: 683485eae7
  summary: The source can obtain the privileges of any ServiceAccount in the namespace by having the token controller populate a token Secret it can read.
  requires:
    all_of:
      - verb: create
        resource: secrets
        namespace: "{target.namespace}"
    any_of:
      - - verb: get
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: list
          resource: secrets
          namespace: "{target.namespace}"
      - - verb: watch
          resource: secrets
          namespace: "{target.namespace}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      k8s_challenge_fact: k8s-rbac-secrets-create-sa-token-secret
    scope: same_namespace
    aggregate_as: "All ServiceAccounts in {target.namespace}"
  conditions:
    - id: admission_blocks_sa_token_secret
      description: A reviewed proof must verify that creation was admitted, the token controller populated the exact Secret, and the API server accepted its token as the named ServiceAccount; admission rejection or an inert Secret removes the edge.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Do not combine create and read on secrets for non-admin subjects; deny creation of kubernetes.io/service-account-token Secrets via admission policy.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#manually-create-an-api-token-for-a-serviceaccount
  notes: The typed k8s_privesc_challenge_evidence record must bind the source, target ServiceAccount, exact Secret UID/version, successful create and read, accepted token subject/audience, and at least one effective permission previously denied to the source. A get rule limited to resourceNames works only if it includes the chosen name; Secret metadata alone never creates this path.

- id: k8s-rbac-serviceaccounts-token-create
  provider: k8s
  service: rbac
  title: Mint tokens with the TokenRequest API
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#create-serviceaccounts-token
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the ServiceAccounts on which it can create serviceaccounts/token.
  requires:
    all_of:
      - verb: create
        resource: serviceaccounts
        subresource: token
        namespace: "{target.namespace}"
        resource_name: "{target.name}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      resource_permission_covers_target: serviceaccounts/token:create
    scope: same_namespace
    aggregate_as: "ServiceAccounts tokenable in {target.namespace}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Grant create on serviceaccounts/token only to the kubelet/system components that need it, scoped with resourceNames.
  references:
    - https://kubernetes.io/docs/reference/kubernetes-api/authentication-resources/token-request-v1/
  notes: resourceNames on serviceaccounts/token restrict which ServiceAccounts can be targeted (the request names the existing ServiceAccount). Nodes get this implicitly for pods bound to them; that case is modelled in nodes.yaml.

- id: k8s-rbac-impersonate-serviceaccounts
  provider: k8s
  service: rbac
  title: Impersonate ServiceAccounts
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#impersonating-privileged-accounts
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the ServiceAccounts it may impersonate.
  requires:
    all_of:
      - verb: impersonate
        resource: serviceaccounts
        namespace: "{target.namespace}"
        resource_name: "{target.name}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      resource_permission_covers_target: serviceaccounts:impersonate
    scope: same_namespace
    aggregate_as: "Impersonable ServiceAccounts in {target.namespace}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Remove impersonate on serviceaccounts from non-admin subjects or restrict it with resourceNames to low-privilege accounts.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Per Kubernetes docs, impersonating a username of the form system:serviceaccount:<ns>:<name> is authorized against the serviceaccounts resource in that namespace, not against users. The impersonated SA username also receives the system:serviceaccounts groups only if the source additionally impersonates them; RBAC bindings to the SA subject apply either way.

- id: k8s-rbac-impersonate-users
  provider: k8s
  service: rbac
  title: Impersonate users
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#impersonating-privileged-accounts
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the users it may impersonate.
  requires:
    all_of:
      - verb: impersonate
        resource: users
        namespace: "*"
        resource_name: "{target.name}"
  target:
    kind: k8s_user
    selector:
      resource_permission_covers_target: users:impersonate
    scope: cluster
    aggregate_as: "Impersonable users in {cluster}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Remove impersonate on users from non-admin subjects or restrict it with resourceNames.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Users are not API objects; the reachable set is the user names that appear as subjects in RoleBindings/ClusterRoleBindings (only those carry privileges). Usernames of the form system:serviceaccount:* are covered by k8s-rbac-impersonate-serviceaccounts, and system:node:* by k8s-rbac-impersonate-node.

- id: k8s-rbac-impersonate-groups
  provider: k8s
  service: rbac
  title: Impersonate groups (with user impersonation)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#impersonating-privileged-accounts
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the groups it may impersonate.
  requires:
    all_of:
      - verb: impersonate
        resource: groups
        namespace: "*"
        resource_name: "{target.name}"
      - verb: impersonate
        resource: users
        namespace: "*"
  target:
    kind: k8s_group
    selector:
      resource_permission_covers_target: groups:impersonate
      exclude_names: ["system:masters"]
    scope: cluster
    aggregate_as: "Impersonable groups in {cluster}"
  conditions:
    - id: user_impersonation_name_restricted
      description: Group impersonation requires impersonating some user in the same request; a users resourceNames restriction only limits which user name is sent, any covered name suffices.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Remove impersonate on groups from non-admin subjects; never allow impersonation of system:masters or groups bound to admin roles.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Verified in Kubernetes docs that Impersonate-Group requires Impersonate-User. Without impersonate on users this entry does not apply. system:masters is handled by k8s-rbac-impersonate-system-masters.

- id: k8s-rbac-impersonate-system-masters
  provider: k8s
  service: rbac
  title: Impersonate the system:masters group
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#impersonating-privileged-accounts
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of cluster-admin through the system:masters group, which bypasses RBAC.
  requires:
    all_of:
      - verb: impersonate
        resource: groups
        namespace: "*"
        resource_name: "system:masters"
      - verb: impersonate
        resource: users
        namespace: "*"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Never grant impersonate on groups without resourceNames; explicitly exclude system:masters.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles
  notes: Members of system:masters are authorized unconditionally by the API server before RBAC.

- id: k8s-rbac-impersonate-node
  provider: k8s
  service: rbac
  title: Impersonate a node identity
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#impersonating-privileged-accounts
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of a node (system:node:<name> in group system:nodes).
  requires:
    all_of:
      - verb: impersonate
        resource: users
        namespace: "*"
        resource_name: "system:node:{target.name}"
      - verb: impersonate
        resource: groups
        namespace: "*"
        resource_name: "system:nodes"
  target:
    kind: k8s_node
    selector:
      resource_permission_covers_target: users:impersonate
    scope: cluster
    aggregate_as: "Impersonable nodes in {cluster}"
  conditions: []
  blockers: []
  confidence: derived
  severity: high
  mitigation: Restrict impersonate on users and groups with resourceNames that exclude system:node:* and system:nodes.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/node/
  notes: The Node authorizer requires both the system:node:<name> username and the system:nodes group. Node identity then reaches the ServiceAccounts of pods on that node (see nodes.yaml).

- id: k8s-rbac-constrained-impersonation-user
  provider: k8s
  service: rbac
  title: Constrained impersonation of a user (user-info mode)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#constrained-impersonation
  source_revision: 2415fadfbd
  summary: The source can obtain a subset of the privileges of the users it may impersonate in user-info mode.
  requires:
    all_of:
      - verb_prefix: "impersonate-on:user-info:"
        resource_match: any
        namespace: "*"
    any_of:
      - - verb: "impersonate:user-info"
          resource: users
          api_group: authentication.k8s.io
          namespace: "*"
          resource_name: "{target.name}"
  target:
    kind: k8s_user
    selector:
      resource_permission_covers_target: "users:impersonate:user-info"
      k8s_constrained_impersonation_gain: user-info
    scope: cluster
    aggregate_as: "Users impersonable in constrained mode in {cluster}"
  conditions:
    - id: constrained_impersonation_action_subset
      description: The source's impersonate-on action must overlap a collected permission of the named user that the source does not already hold.
    - id: constrained_impersonation_enabled
      description: Requires Kubernetes 1.36+ (beta, on by default) or the feature gate.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Grant impersonate:<mode> and impersonate-on:<mode>:<verb> only as narrow, resourceName-scoped pairs for the exact delegated operation.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: The identity rule uses authentication.k8s.io, as in the upstream documentation and HackTricks Kubernetes 1.37 reproduction. The action half names the concrete verb and resource that may be used while impersonating; the source can gain only actions also held by the target.

- id: k8s-rbac-constrained-impersonation-serviceaccount
  provider: k8s
  service: rbac
  title: Constrained impersonation of a ServiceAccount
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#constrained-impersonation
  source_revision: 2415fadfbd
  summary: The source can obtain a subset of the privileges of the ServiceAccounts it may impersonate in serviceaccount mode.
  requires:
    all_of:
      - verb: "impersonate:serviceaccount"
        resource: serviceaccounts
        api_group: authentication.k8s.io
        namespace: "{target.namespace}"
        resource_name: "{target.name}"
      - verb_prefix: "impersonate-on:serviceaccount:"
        resource_match: any
        namespace: "*"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      resource_permission_covers_target: "serviceaccounts:impersonate:serviceaccount"
      k8s_constrained_impersonation_gain: serviceaccount
    scope: same_namespace
    aggregate_as: "ServiceAccounts impersonable in constrained mode in {target.namespace}"
  conditions:
    - id: constrained_impersonation_action_subset
      description: The source's impersonate-on action must overlap a collected permission of the named ServiceAccount that the source does not already hold.
    - id: constrained_impersonation_enabled
      description: Requires Kubernetes 1.36+ (beta, on by default) or the feature gate.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Grant constrained impersonation only as narrow, resourceName-scoped identity/action pairs.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: Official docs place the identity permission in authentication.k8s.io and scope it to the named ServiceAccount. The action half can use only the named verb and resource also allowed to that ServiceAccount.

- id: k8s-rbac-constrained-impersonation-node
  provider: k8s
  service: rbac
  title: Constrained impersonation of nodes (arbitrary-node mode)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#constrained-impersonation
  source_revision: 2415fadfbd
  summary: The source can obtain a subset of the privileges of any node it may impersonate in arbitrary-node mode.
  requires:
    all_of:
      - verb: "impersonate:arbitrary-node"
        resource: nodes
        api_group: authentication.k8s.io
        namespace: "*"
        resource_name: "{target.name}"
      - verb_prefix: "impersonate-on:arbitrary-node:"
        resource_match: any
        namespace: "*"
  target:
    kind: k8s_node
    selector:
      resource_permission_covers_target: "nodes:impersonate:arbitrary-node"
      k8s_constrained_impersonation_gain: arbitrary-node
    scope: cluster
    aggregate_as: "Nodes impersonable in constrained mode in {cluster}"
  conditions:
    - id: constrained_impersonation_action_subset
      description: The source's impersonate-on action must cover get on a pod assigned to the named node or a token request for that pod's ServiceAccount, and the source must lack that direct action.
    - id: constrained_impersonation_enabled
      description: Requires Kubernetes 1.36+ (beta, on by default) or the feature gate.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Do not grant node impersonation modes outside node-agent ServiceAccounts, and scope the impersonate-on verbs tightly.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: The official node-mode example grants the identity verb on nodes.authentication.k8s.io and limits it to the exact node name. Associated-node mode is modelled separately.

- id: k8s-rbac-constrained-impersonation-associated-node
  provider: k8s
  service: rbac
  title: Constrained impersonation of the node running the source's pod (associated-node mode)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#constrained-impersonation
  source_revision: 2415fadfbd
  summary: A ServiceAccount granted associated-node impersonation can obtain a subset of the privileges of the node that runs its own pod.
  requires:
    all_of:
      - verb: "impersonate:associated-node"
        resource: nodes
        api_group: authentication.k8s.io
        namespace: "*"
      - verb_prefix: "impersonate-on:associated-node:"
        resource_match: any
        namespace: "*"
  target:
    kind: k8s_node
    selector:
      k8s_node_hosting_pod_of_source: true
      k8s_constrained_impersonation_gain: associated-node
    scope: cluster
    aggregate_as: "Node hosting the source's pod in {cluster}"
  conditions:
    - id: constrained_impersonation_action_subset
      description: The source's impersonate-on action must cover get on a pod assigned to its node or a token request for that pod's ServiceAccount, and the source must lack that direct action.
    - id: constrained_impersonation_enabled
      description: Requires Kubernetes 1.36+ (beta, on by default) or the feature gate.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Do not grant node impersonation modes outside node-agent ServiceAccounts, and scope the impersonate-on verbs tightly.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  notes: associated-node mode only reaches the node bound into the source ServiceAccount's pod token; k8s_node_hosting_pod_of_source narrows the target to nodes hosting a collected pod that runs as the source ServiceAccount (no target without pod inventory).

- id: k8s-rbac-bind-clusterrolebinding-cluster-admin
  provider: k8s
  service: rbac
  title: Bind cluster-admin through a ClusterRoleBinding
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bind
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of cluster-admin by binding an admin-equivalent ClusterRole to itself cluster-wide.
  requires:
    all_of:
      - verb: bind
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
        resource_name: "{admin_equivalent_clusterrole}"
      - verb: create
        resource: clusterrolebindings
        api_group: rbac.authorization.k8s.io
        namespace: "*"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions:
    - id: bindable_role_admin_equivalent
      description: The collected ClusterRole covered by bind must grant every verb on every resource across all API groups. Binding a weaker ClusterRole only grants that role.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Do not grant bind on clusterroles (especially without resourceNames) together with clusterrolebinding writes.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-binding-creation-or-update
  notes: "{admin_equivalent_clusterrole} = any collected ClusterRole whose rules grant all verbs on all resource types in all API groups. Existing-binding patch/update paths are reported by the exact-binding permission-gain entry; resourceNames on create cannot restrict the new binding's name. Without bind, binding writes are limited to roles whose permissions the caller already holds (excluded)."

- id: k8s-rbac-bind-rolebinding-namespace
  provider: k8s
  service: rbac
  title: Bind cluster-admin into a namespace through a RoleBinding
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bind
  source_revision: 2415fadfbd
  summary: The source can bind the exact cluster-admin ClusterRole to itself in a namespace, gaining its workload and token permissions there and reaching that namespace's ServiceAccounts.
  requires:
    all_of:
      - verb: bind
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "{target.namespace}"
        resource_name: cluster-admin
      - verb: create
        resource: rolebindings
        api_group: rbac.authorization.k8s.io
        namespace: "{target.namespace}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      k8s_cluster_admin_role_exists: true
    scope: same_namespace
    aggregate_as: "All ServiceAccounts in {target.namespace}"
  conditions:
    - id: cluster_admin_role_exists
      description: The collected cluster-admin ClusterRole must retain wildcard workload and token permissions that cover the target namespace.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict bind with resourceNames to low-privilege roles and avoid granting rolebinding writes to tenants.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-binding-creation-or-update
  notes: A RoleBinding grants cluster-admin rules only inside its namespace. This entry requires create; separate entries join other Roles and existing bindings to their exact permissions.

- id: k8s-rbac-escalate-bound-clusterrole
  provider: k8s
  service: rbac
  title: Escalate a ClusterRole already bound to the source
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#escalate
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of cluster-admin by adding arbitrary rules to a ClusterRole bound to it cluster-wide.
  requires:
    all_of:
      - verb: escalate
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
        resource_name: "{source_bound_clusterrole}"
    any_of:
      - - verb: update
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "*"
          resource_name: "{source_bound_clusterrole}"
      - - verb: patch
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "*"
          resource_name: "{source_bound_clusterrole}"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions:
    - id: escalated_role_bound_cluster_wide
      description: The editable ClusterRole must be bound to the source (or a group it belongs to) by a ClusterRoleBinding; if only bound by RoleBindings the gain is limited to those namespaces.
    - id: aggregated_clusterrole_overwritten
      description: Rules added to an aggregated ClusterRole (aggregationRule) are overwritten by the controller.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Do not grant escalate on roles/clusterroles to non-admin subjects.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-creation-or-update
  notes: "{source_bound_clusterrole} = a ClusterRole referenced by a ClusterRoleBinding whose subjects include the source (a RoleBinding to a ClusterRole only confines it to one namespace and does not yield cluster-admin). escalate + create roles alone is not enough: binding the new role still needs bind or already-held permissions."

- id: k8s-rbac-escalate-aggregating-clusterrole
  provider: k8s
  service: rbac
  title: Create an aggregating ClusterRole that feeds a ClusterRole already bound to the source
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bindings-and-aggregated-clusterroles
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of cluster-admin by creating a ClusterRole with arbitrary rules and an aggregate-to-<role> label so the aggregation controller copies them into an aggregated ClusterRole already bound to it cluster-wide.
  source_selector:
    source_bound_to_aggregated_clusterrole: cluster
  requires:
    all_of:
      - verb: create
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
      - verb: escalate
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
      k8s_aggregation_new_role_path: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions:
    - id: source_bound_to_aggregated_clusterrole
      description: The source_selector checks that the source is bound to a ClusterRole with an aggregationRule (view, edit, admin or a custom one); the new role's labels must satisfy that role's clusterRoleSelectors.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Do not grant escalate on clusterroles; alert on new ClusterRoles carrying rbac.authorization.k8s.io/aggregate-to-* labels.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-creation-or-update
  notes: HackTricks (171e422) documents aggregation into an already-bound ClusterRole (lab adds patch on one ConfigMap to view) and states the caller still needs the proposed rules or escalate. Without escalate the source can only aggregate rules it already holds, which is not an escalation.

- id: k8s-rbac-escalate-bound-role-namespace
  provider: k8s
  service: rbac
  title: Escalate a Role already bound to the source in a namespace
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#escalate
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the ServiceAccounts in the namespace by adding workload or token rules to a Role bound to it there.
  requires:
    all_of:
      - verb: escalate
        resource: roles
        api_group: rbac.authorization.k8s.io
        namespace: "{target.namespace}"
        resource_name: "{source_bound_role}"
    any_of:
      - - verb: update
          resource: roles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
          resource_name: "{source_bound_role}"
      - - verb: patch
          resource: roles
          api_group: rbac.authorization.k8s.io
          namespace: "{target.namespace}"
          resource_name: "{source_bound_role}"
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
    scope: same_namespace
    aggregate_as: "All ServiceAccounts in {target.namespace}"
  conditions:
    - id: escalated_role_bound_to_source
      description: The editable Role must be bound to the source by a RoleBinding in the same namespace.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Do not grant escalate on roles to tenants.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#restrictions-on-role-creation-or-update
