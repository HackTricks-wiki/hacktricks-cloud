- id: k8s-rbac-escalate-aggregating-clusterrole-namespace
  provider: k8s
  service: rbac
  title: Add rules to a ClusterRole bound to the source in a namespace
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bindings-and-aggregated-clusterroles
  source_revision: 2415fadfbd
  summary: The source can create a ClusterRole whose labels feed an aggregated ClusterRole bound to it through a RoleBinding, adding workload and token rights in that binding's namespace.
  source_selector:
    source_bound_to_aggregated_clusterrole: namespace
  requires:
    all_of:
      - verb: create
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
      - verb: escalate
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
  target:
    kind: k8s_service_account
    selector:
      k8s_aggregated_rolebinding_namespace: true
      k8s_aggregation_new_role_path: true
    scope: cluster
    aggregate_as: "ServiceAccounts in an aggregated RoleBinding namespace"
  conditions:
    - id: namespace_aggregate_binding_and_controller
      description: A collected RoleBinding must give the source an aggregated ClusterRole in the target namespace, and the aggregation controller must add the source-created rules that permit workload or token access.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: high
  mitigation: Do not combine ClusterRole creation and escalate with an aggregated ClusterRole already bound to the same principal.
  references:
