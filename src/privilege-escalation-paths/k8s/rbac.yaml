- id: k8s-rbac-modify-existing-clusterrolebinding-new-permission
  provider: k8s
  service: rbac
  title: Add the source to an existing ClusterRoleBinding that grants a new permission
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bind
