- id: k8s-rbac-csr-kube-apiserver-client-user
  provider: k8s
  service: certificates
  title: Issue and approve a client certificate for an existing username
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#certificate-signing-requests
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of any user (or ServiceAccount username) that has RBAC bindings by self-approving a kube-apiserver-client certificate for it.
  requires:
    all_of:
      - {verb: create, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      # Read the issued certificate back (status.certificate).
      - any_of:
          - {verb: get, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: list, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: watch, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      - any_of:
          - {verb: update, resource: certificatesigningrequests, subresource: approval, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: patch, resource: certificatesigningrequests, subresource: approval, api_group: certificates.k8s.io, namespace: "*"}
      # The signer check also accepts the domain wildcard resourceName.
      - any_of:
          - {verb: approve, resource: signers, api_group: certificates.k8s.io, namespace: "*", resource_name: "kubernetes.io/kube-apiserver-client"}
          - {verb: approve, resource: signers, api_group: certificates.k8s.io, namespace: "*", resource_name: "kubernetes.io/*"}
  target:
    kind: k8s_user
    selector:
      any_principal_in_scope: true
      k8s_csr_same_name_path: true
    scope: cluster
    aggregate_as: "Users bound in RBAC in {cluster}"
  conditions:
    - id: kube_apiserver_client_signer_enabled
      description: The controller-manager must be signing kubernetes.io/kube-apiserver-client (cluster-signing key configured; some managed offerings disable or restrict it).
    - id: client_cert_auth_honored
      description: The API server must accept client certificates from the cluster CA (some managed clusters ignore or restrict them).
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Restrict approve on signers and certificatesigningrequests/approval to cluster administrators; never combine them with CSR create for other subjects.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/#kubernetes-signers
  notes: HackTricks reproduced on v1.37 that this signer refused a CSR requesting system:masters, so cluster-admin through that group is NOT claimed. ServiceAccount usernames are covered by k8s-rbac-csr-kube-apiserver-client-serviceaccount. Client certificates cannot be revoked short of rotating the CA.

- id: k8s-rbac-csr-kube-apiserver-client-group
  provider: k8s
  service: certificates
  title: Issue and approve a client certificate carrying groups
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#certificate-signing-requests
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of RBAC-bound groups (other than system:masters) by self-approving a kube-apiserver-client certificate with those organizations.
  requires:
    all_of:
      - {verb: create, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      # Read the issued certificate back (status.certificate).
      - any_of:
          - {verb: get, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: list, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: watch, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      - any_of:
          - {verb: update, resource: certificatesigningrequests, subresource: approval, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: patch, resource: certificatesigningrequests, subresource: approval, api_group: certificates.k8s.io, namespace: "*"}
      # The signer check also accepts the domain wildcard resourceName.
      - any_of:
          - {verb: approve, resource: signers, api_group: certificates.k8s.io, namespace: "*", resource_name: "kubernetes.io/kube-apiserver-client"}
          - {verb: approve, resource: signers, api_group: certificates.k8s.io, namespace: "*", resource_name: "kubernetes.io/*"}
  target:
    kind: k8s_group
    selector:
      any_principal_in_scope: true
      exclude_names: ["system:masters"]
      k8s_csr_same_name_path: true
    scope: cluster
    aggregate_as: "Groups bound in RBAC in {cluster}"
  conditions:
    - id: kube_apiserver_client_signer_enabled
      description: The controller-manager must be signing kubernetes.io/kube-apiserver-client.
    - id: signer_group_restrictions
      description: Signer or approver policy may refuse specific organizations; system:masters was refused in the HackTricks lab.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Restrict approve on signers and certificatesigningrequests/approval to cluster administrators.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/#kubernetes-signers
  notes: Official docs list no subject restrictions for kubernetes.io/kube-apiserver-client beyond approver/signer policy; the system:masters exclusion follows the HackTricks v1.37 lab result.

- id: k8s-rbac-dangling-serviceaccount-reference
  provider: k8s
  service: rbac
  title: Create a ServiceAccount referenced by an existing binding but missing
  source: src/pentesting-cloud/openshift-pentesting/openshift-privilege-escalation/openshift-missing-service-account.md#missing-service-account
  source_revision: a66f094ede
  summary: The source can use a binding for a missing ServiceAccount in an existing namespace by creating that ServiceAccount and then running as it.
  requires:
    all_of:
      - verb: create
        resource: serviceaccounts
        namespace: "{target.namespace}"
    any_of:
      # Run a workload as the recreated ServiceAccount (pod or any pod-creating controller).
      - - any_of:
            - {verb: create, resource: pods, namespace: "{target.namespace}"}
            - {verb: create, resource: deployments, api_group: apps, namespace: "{target.namespace}"}
            - {verb: create, resource: daemonsets, api_group: apps, namespace: "{target.namespace}"}
            - {verb: create, resource: statefulsets, api_group: apps, namespace: "{target.namespace}"}
            - {verb: create, resource: replicasets, api_group: apps, namespace: "{target.namespace}"}
            - {verb: create, resource: replicationcontrollers, namespace: "{target.namespace}"}
            - {verb: create, resource: jobs, api_group: batch, namespace: "{target.namespace}"}
            - {verb: create, resource: cronjobs, api_group: batch, namespace: "{target.namespace}"}
      - - {verb: create, resource: serviceaccounts, subresource: token, namespace: "{target.namespace}", resource_name: "{target.name}"}
      # Legacy token Secret for the recreated ServiceAccount, then read it back.
      - - {verb: create, resource: secrets, namespace: "{target.namespace}"}
        - any_of:
            - {verb: get, resource: secrets, namespace: "{target.namespace}"}
            - {verb: list, resource: secrets, namespace: "{target.namespace}"}
            - {verb: watch, resource: secrets, namespace: "{target.namespace}"}
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_absent_but_bound: true
      k8s_dangling_sa_permission_gain: true
      k8s_sa_in_namespace: "{target.namespace}"
    scope: same_namespace
    aggregate_as: "Dangling ServiceAccount references in {target.namespace}"
  conditions:
    - id: service_account_use_allowed
      description: Admission policy and ServiceAccount token settings must allow the selected workload or token route.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Remove bindings that reference missing ServiceAccounts or restrict who can recreate those ServiceAccounts.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-subjects
  notes: Applies to vanilla Kubernetes too (RBAC subjects are matched by name, not UID). The target is the binding subject name; the evaluator should synthesize a virtual k8s_service_account node for each subject that does not exist in the snapshot, carrying the bound privileges. Controller creates are alternatives to pods create (the book requires "a way to use the account, such as permission to create a workload under it"); list/watch return Secret data like get (a66f094ede).

- id: k8s-rbac-serviceaccount-in-absent-namespace
  provider: k8s
  service: rbac
  title: Create the missing namespace and ServiceAccount named by a binding or SCC
  source: src/pentesting-cloud/openshift-pentesting/openshift-privilege-escalation/openshift-missing-service-account.md#missing-service-account
  source_revision: a66f094ede
  summary: The source can obtain the privileges granted to a ServiceAccount whose namespace does not exist by creating that namespace and ServiceAccount and then running as it.
  requires:
    all_of: []
    any_of:
      - - {verb: create, resource: namespaces, namespace: "*"}
        - {verb: create, resource: serviceaccounts, namespace: "*"}
        - any_of:
            - {verb: create, resource: pods, namespace: "*"}
            - {verb: create, resource: deployments, api_group: apps, namespace: "*"}
            - {verb: create, resource: daemonsets, api_group: apps, namespace: "*"}
            - {verb: create, resource: statefulsets, api_group: apps, namespace: "*"}
            - {verb: create, resource: replicasets, api_group: apps, namespace: "*"}
            - {verb: create, resource: replicationcontrollers, namespace: "*"}
            - {verb: create, resource: jobs, api_group: batch, namespace: "*"}
            - {verb: create, resource: cronjobs, api_group: batch, namespace: "*"}
      - - {verb: create, resource: namespaces, namespace: "*"}
        - {verb: create, resource: serviceaccounts, namespace: "*"}
        - {verb: create, resource: serviceaccounts, subresource: token, namespace: "*", resource_name: "{target.name}"}
      - - {verb: create, resource: namespaces, namespace: "*"}
        - {verb: create, resource: serviceaccounts, namespace: "*"}
        - {verb: create, resource: secrets, namespace: "*"}
        - any_of:
            - {verb: get, resource: secrets, namespace: "*"}
            - {verb: list, resource: secrets, namespace: "*"}
            - {verb: watch, resource: secrets, namespace: "*"}
      - - {verb: create, resource: projectrequests, api_group: project.openshift.io, namespace: "*"}
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_namespace_absent: true
    scope: cluster
    aggregate_as: "ServiceAccounts in absent namespaces of {cluster}"
  conditions:
    - id: namespace_name_allowed
      description: Namespace or project creation can be restricted by admission or the project request template; the exact referenced name must be creatable.
    - id: projectrequest_grants_admin
      description: The projectrequests alternative applies only on OpenShift, where the default project template makes the requester admin of the new project (enough to create the ServiceAccount and pods there).
  blockers: [admission_policy]
  confidence: conditional
  severity: high
  mitigation: Remove bindings and SCC users entries whose ServiceAccount namespace no longer exists; restrict namespace and project creation.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-subjects
  notes: k8s_sa_namespace_absent targets ServiceAccounts referenced by a binding that adds a concrete right or by a host-access SCC users[] entry whose namespace is absent from a complete namespace inventory (unknown if the inventory is incomplete). The serviceaccount and pod grants must be cluster-wide (namespace "*") because the namespace does not exist yet. Complements k8s-rbac-dangling-serviceaccount-reference (namespace exists).

- id: k8s-rbac-escalate-rolebound-clusterrole-namespace
  provider: k8s
  service: rbac
  title: Escalate a ClusterRole bound in one namespace
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#escalate
  source_revision: 2415fadfbd
