      - verb: escalate
        resource: clusterroles
        api_group: rbac.authorization.k8s.io
        namespace: "*"
        resource_name: "{source_rolebound_clusterrole}"
    any_of:
      - - verb: update
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "*"
          resource_name: "{source_rolebound_clusterrole}"
      - - verb: patch
          resource: clusterroles
          api_group: rbac.authorization.k8s.io
          namespace: "*"
          resource_name: "{source_rolebound_clusterrole}"
  target:
    kind: k8s_service_account
    selector: {k8s_sa_in_namespace: "{target.namespace}"}
    scope: same_namespace
