- id: azure-sre-agent-microsoftappagentsdataconnectorslistsecretsaction
  provider: azure
  service: sre_agent
  title: Read an SRE Agent connector credential
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-sre-agent-privesc.md#microsoftappagentsdataconnectorslistsecretsaction
  source_revision: 0b36331
  summary: Returns the cleartext protected configuration of one connector (dataSource and protected CustomHeader values normally redacted on GET) -> reusable credentials to source code, telemetry, incident-management systems, or other external data. Scope is the downstream service permissions of each returned credential; callable against a known connector ID without agent/connector read.
  requires:
    all_of:
    - action: Microsoft.App/agents/dataconnectors/listSecrets/action
      scope: '{target.scope}'
  target:
    kind: azure_dataplane_admin
    selector:
      azure_challenge_fact: azure-sre-agent-microsoftappagentsdataconnectorslistsecretsaction
    scope: inherited_scope
    aggregate_as: Pending service authority for sre_agent
    outcome: application_admin
    grants:
    - The exact SRE Agent OAuth/private-key credential or named data connector credential returned by listSecrets.
  conditions:
  - id: collector_fact_required
    description: The azure_sre_connector_secrets inventory must identify the exact target and rights; absent or incomplete facts remain UNKNOWN.
  confidence: conditional
  severity: medium
  mitigation: Restrict the listed permissions to trusted operators and rotate or revoke resulting credentials or grants.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/azure-security/az-privilege-escalation/az-sre-agent-privesc.md
  notes: 'Collector fact required: azure_sre_connector_secrets. UNKNOWN until a reusable credential and its target principal/rights are identified.'
- id: azure-sre-agent-microsoftappagentslistsecretsaction
  provider: azure
  service: sre_agent
  title: Read an SRE Agent protected credential
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-sre-agent-privesc.md#microsoftappagentslistsecretsaction
  source_revision: 0b36331
  summary: Control-plane action returning the protected secrets of an SRE Agent (can include private key material / generated OAuth key). Callable against a known agent ID without Microsoft.App/agents/read -> credential disclosure; downstream scope is whatever the recovered key grants.
  requires:
    all_of:
    - action: Microsoft.App/agents/listSecrets/action
      scope: '{target.scope}'
  target:
    kind: azure_dataplane_admin
    selector:
      azure_challenge_fact: azure-sre-agent-microsoftappagentslistsecretsaction
    scope: inherited_scope
    aggregate_as: Pending service authority for sre_agent
    outcome: application_admin
    grants:
    - The exact SRE Agent OAuth/private-key credential or named data connector credential returned by listSecrets.
  conditions:
  - id: collector_fact_required
    description: The azure_sre_agent_secrets inventory must identify the exact target and rights; absent or incomplete facts remain UNKNOWN.
  confidence: conditional
  severity: medium
  mitigation: Restrict the listed permissions to trusted operators and rotate or revoke resulting credentials or grants.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/azure-security/az-privilege-escalation/az-sre-agent-privesc.md
  notes: 'Collector fact required: azure_sre_agent_secrets. UNKNOWN until the protected value is known to be a reusable privileged credential.'
