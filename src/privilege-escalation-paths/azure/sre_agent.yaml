- id: azure-sre-agent-drive-managed-identity
  provider: azure
  service: sre_agent
  title: Instruct or reconfigure an SRE Agent to act with its managed identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-sre-agent-privesc.md#drive-the-agents-managed-identity--instruction--tool-config-injection-agentsthreads-agentswrite-
  source_revision: a66f094ede
  summary: Opening threads, creating scheduled tasks or rewriting the agent configuration lets the source steer the agent into performing actions with its managed identity's RBAC.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.App/agents/threads/write
          scope: "{target.host_resource}"
      - - action: Microsoft.App/agents/scheduledtasks/write
          scope: "{target.host_resource}"
      - - action: Microsoft.App/agents/write
          scope: "{target.host_resource}"
      - - action: Microsoft.App/agents/memory/write
          scope: "{target.host_resource}"
      - - action: Microsoft.App/agents/dataconnectors/write
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.App/agents
    scope: inherited_scope
    aggregate_as: "Managed identities of SRE Agent {target.host_resource}"
  conditions:
    - id: run_mode
      description: In Review mode write actions need approval (threads/approve/action, held by SRE Agent Administrators); without that right only Autonomous mode lets the agent act unapproved.
    - id: tool_policies
      description: Per-tool allow, ask or deny policies and agent hooks limit which actions the agent will perform.
    - id: model_mediated
      description: Actions are chosen by the agent's model from the source's instructions, so the source steers the identity but gets no token and no arbitrary code execution.
    - id: indirect_steering
      description: memory/write and dataconnectors/write only steer later runs (persistent memory or attacker-controlled incident data) that a thread, schedule or incident must start.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict threads/write, scheduledtasks/write and agents/write, keep agents in Review mode, scope the agent identity's RBAC narrowly, and set deny or ask policies for write tools.
  references:
    - https://learn.microsoft.com/en-us/azure/sre-agent/overview
    - https://learn.microsoft.com/en-us/azure/sre-agent/run-modes
  notes: threads/approve/action alone only approves actions the agent already proposed, so it is not an alternative here.
- id: azure-sre-agent-assign-user-assigned-identity
  provider: azure
  service: sre_agent
  title: Rebind an SRE Agent to a user-assigned identity and steer it
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-sre-agent-privesc.md#drive-the-agents-managed-identity--instruction--tool-config-injection-agentsthreads-agentswrite-
  source_revision: a66f094ede
  summary: Rewriting the agent configuration to use an assignable user-assigned identity lets the source steer the agent into acting with that identity's RBAC.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: "{target.id}"
      - action: Microsoft.App/agents/write
        scope: "{pivot}"
  pivot_resource_type: Microsoft.App/agents
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: "User-assigned identities assignable in {scope}"
  conditions:
    - id: run_mode
      description: In Review mode write actions need approval (threads/approve/action); only Autonomous mode lets the agent act unapproved.
    - id: model_mediated
      description: Actions are chosen by the agent's model, so the source steers the identity but gets no token and no arbitrary code execution.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and agents/write, and keep agents in Review mode.
  references:
    - https://learn.microsoft.com/en-us/azure/sre-agent/overview
  notes: agents/write is also the instruction channel used by azure-sre-agent-drive-managed-identity.
