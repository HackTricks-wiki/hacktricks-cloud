# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Microsoft Purview techniques (declarative only).
# Source: hacktricks-cloud az-purview-privesc.md (rev 171e422).
# Action names checked against the Azure RBAC permissions reference (Analytics > Microsoft.Purview).

- id: azure-purview-add-root-collection-admin
  provider: azure
  service: purview
  title: Add a principal as Purview root collection administrator from the ARM control plane
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-purview-privesc.md#microsoftpurviewaccountsaddrootcollectionadminaction--root-collection-administrator-grant
  source_revision: 79c56e647f
  summary: The source can make itself (or any principal) root collection administrator of the Purview account, the top of the Purview data-plane role hierarchy.
  requires:
    all_of:
      - action: Microsoft.Purview/accounts/addrootcollectionadmin/action
        scope: "{target.scope}"
  target:
    kind: azure_dataplane_admin
    selector:
      any_principal_in_scope: true
      azure_resource_type: Microsoft.Purview/accounts
    scope: inherited_scope
    aggregate_as: "Purview root collection admin of {target.scope}"
  conditions:
    - id: purview_dataplane_only
      description: The gain is Purview data-plane administration (collection roles, data sources, scan credentials, access policies); it does not yield a token for the Purview account's managed identity or for scan credentials stored in Key Vault.
    - id: root_admin_api_authorization
      description: Microsoft Purview guidance says the root-admin API requires Owner or User Access Administrator on the account, even though the action is included in broader ARM roles; a role grant alone may not suffice.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Remove addrootcollectionadmin/action from broad roles (it is included in Contributor) with a custom role or deny assignment, and review Purview root collection role membership.
  references:
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/analytics#microsoftpurview
    - https://learn.microsoft.com/en-us/purview/how-to-create-and-manage-collections
  notes: ARM RBAC grants the action to roles including Contributor, but Microsoft Purview guidance also states an Owner or User Access Administrator requirement for the API. Until that extra check is verified on an account, show a conditional path. The resulting grant lives in the Purview role model, not Azure RBAC.
