  service: avs
  title: Reach the named AVS NSX-T admin with a verified returned credential
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-vmware-solution-avs-privesc.md#cloudadmin--nsx-t-credential-disclosure-listadmincredentials
  source_revision: 171e422
  summary: Reading AVS administrator credentials can reach the exact NSX-T admin only when a reviewed login proves that the returned credential grants a new NSX-T action.
  requires:
    all_of:
      - action: Microsoft.AVS/privateClouds/listAdminCredentials/action
        scope: '{target.scope}'
  target:
    kind: azure_external_principal
    selector:
