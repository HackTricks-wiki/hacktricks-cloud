# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure Batch techniques (declarative only).
# Source: hacktricks-cloud az-batch-privesc.md (rev 171e422, re-verified).
# Pool identities are user-assigned only; {target.host_resource} is the Batch account owning the pool.

- id: azure-batch-shared-key-task-submission
  provider: azure
  service: batch
  title: Batch shared key allows task submission to pools with managed identities
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-batch-privesc.md#microsoftbatchbatchaccountslistkeysaction
  source_revision: a66f094ede
  summary: The source can obtain the privileges of user-assigned identities attached to the Batch account's pools.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Batch/batchAccounts/listkeys/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Batch/batchAccounts/regeneratekeys/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Batch/batchAccounts/pools
      managed_identity_type: user_assigned
      azure_batch_shared_key_pool_identity: true
    scope: inherited_scope
    aggregate_as: "Pool identities of Batch account {target.host_resource}"
  conditions:
    - id: shared_key_auth_mode
      description: allowedAuthenticationModes must include SharedKey or the source must be able to enable it on the same account.
    - id: pool_node_allocation
      description: The existing pool must be able to allocate nodes for submitted tasks.
    - id: batch_data_plane_reachability
      description: The source must be able to reach the Batch service endpoint allowed by the account's network settings.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Remove SharedKey from allowedAuthenticationModes and restrict listkeys/regeneratekeys.
  references:
    - https://learn.microsoft.com/en-us/azure/batch/managed-identity-pools
  notes: The selector joins the key action to the exact account of a native pool carrying a verified user-assigned identity and checks SharedKey mode or an account/write re-enablement path. regeneratekeys also disrupts legitimate key users.

- id: azure-batch-job-task-submission
  provider: azure
  service: batch
  title: Submit Batch jobs/tasks via data actions to pools with managed identities
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-batch-privesc.md#azure-batch-job-and-task-data-actions
  source_revision: 171e422
  summary: The source can obtain the privileges of user-assigned identities attached to the Batch account's pools.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Batch/batchAccounts/jobs/write
          data_action: true
          scope: "*"
      - - action: Microsoft.Batch/batchAccounts/jobSchedules/write
          data_action: true
          scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Batch/batchAccounts/pools
      managed_identity_type: user_assigned
      azure_batch_job_pool_identity: true
    scope: inherited_scope
    aggregate_as: "Pool identities of Batch account {target.host_resource}"
  conditions:
    - id: pool_has_nodes
      description: The exact native pool must have compute nodes or a configured path to allocate them.
    - id: task_can_reach_imds
      description: Task user isolation and network configuration must allow tasks to request the pool identity token.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Limit Azure Batch Job Submitter assignments and keep pool identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/batch/batch-role-based-access-control
  notes: The selector joins jobs/write or jobSchedules/write on the exact AAD-enabled Batch account to a native pool with the target user-assigned identity and node capacity. Both job and schedule creation can include a Job Manager or Job Preparation Task, so separate task submission permission is not needed for code execution. Task isolation and actual scheduling remain conditional.

- id: azure-batch-pool-write-starttask
  provider: azure
  service: batch
  title: Rewrite a pool start task to run code on nodes with the pool identities
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-batch-privesc.md#microsoftbatchbatchaccountspoolswrite--node-rce-via-pool-starttask--managed-identity-attach-control-plane-no-keys
  source_revision: 171e422
  summary: A pool start task the source controls runs on every node through the control plane (no account keys), exposing the user-assigned identities attached to the pool.
  requires:
    all_of:
      - action: Microsoft.Batch/batchAccounts/pools/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Batch/batchAccounts/pools
      managed_identity_type: user_assigned
      azure_batch_pool_starttask_identity: true
    scope: inherited_scope
    aggregate_as: "Pool identities of Batch account {target.host_resource}"
  conditions:
    - id: nodes_restart_or_join
      description: The new start task runs when nodes join or are rebooted/reimaged; existing idle nodes do not rerun it on their own.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict pools/write (included in Contributor) and keep pool identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/rest/api/batchmanagement/pool/update
    - https://learn.microsoft.com/en-us/azure/batch/managed-identity-pools
  notes: The selector requires an exact native pool carrying the verified target identity and a pools/write grant on that pool. New pool identity attachment is modelled separately in azure-batch-pool-write-assign-user-assigned-identity.

- id: azure-batch-pool-write-assign-user-assigned-identity
  provider: azure
  service: batch
  title: Attach a user-assigned identity to a Batch pool and run code on its nodes
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-batch-privesc.md#microsoftbatchbatchaccountspoolswrite--node-rce-via-pool-starttask--managed-identity-attach-control-plane-no-keys
  source_revision: 171e422
  summary: The source can attach a user-assigned identity to a Batch pool it can create or update, run a start task on new nodes, and use that identity's privileges.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_batch_pool_assignable_uami: true
    scope: inherited_scope
    aggregate_as: User-assigned identities attachable to Batch pools in {scope}
  conditions:
    - id: pool_core_quota
      description: The Batch account needs quota and a supported VM configuration to allocate nodes; an updated pool must first scale to zero for its new identity to reach nodes.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and pools/write.
  references:
    - https://learn.microsoft.com/en-us/azure/batch/managed-identity-pools
    - https://learn.microsoft.com/en-us/rest/api/batchmanagement/pool/update
  notes: The evaluator checks pools/write on an exact existing pool or a new pool path under an inventoried Batch account. Pool allocation remains conditional.
