    scope: inherited_scope
    aggregate_as: Pending service authority for storage
    outcome: application_admin
    grants:
    - Target Azure Files path whose NTFS ACL the principal can modify; access requires a separate file data read action.
  conditions:
  - id: collector_fact_required
    description: The azure_files_acls inventory must identify the exact target and rights; absent or incomplete facts remain UNKNOWN.
  confidence: conditional
  severity: medium
  mitigation: Restrict the listed permissions to trusted operators and rotate or revoke resulting credentials or grants.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/azure-security/az-privilege-escalation/az-storage-privesc.md
