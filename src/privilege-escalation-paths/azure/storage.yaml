- id: azure-storage-blob-content-credential
  provider: azure
  service: storage
  title: Read Entra credentials embedded in blobs
  source: src/pentesting-cloud/azure-security/az-post-exploitation/az-blob-storage-post-exploitation.md#microsoftstoragestorageaccountsblobservicescontainersblobsread
  source_revision: 0b36331
  summary: Read a verified usable credential from a readable blob and gain its Entra service principal permissions.
  requires:
    all_of:
    - action: Microsoft.Storage/storageAccounts/blobServices/containers/blobs/read
      scope: '{pivot}'
      data_action: true
  pivot_resource_type: Microsoft.Storage/storageAccounts
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: '{pivot}'
    scope: any
    aggregate_as: Verified credential holders in {pivot}
  conditions:
  - id: verified_credential
    description: Only a collected, mapped, still-valid service-principal credential in the readable content creates
      this edge; uncollected, partial, or unverified content is UNKNOWN.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Remove reusable Entra credentials from the content and restrict the listed read permission.
  references:
  - https://learn.microsoft.com/en-us/rest/api/storageservices/get-blob
  notes: Draft requires azure.storage.blob_credential_holders; the evaluator must join only verified holders, and
    return UNKNOWN if that fact is missing or incomplete.
- id: azure-storage-hns-acl-takeover-and-blob-super-user-data-action
  provider: azure
  service: storage
  title: Rewrite ADLS Gen2 path ACLs for new access
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-storage-privesc.md#hns-acl-takeover-and-blob-super-user-data-action
  source_revision: 0b36331
  summary: modifyPermissions can grant the caller previously denied file access when ancestor execute and a read grant are present; the exclusion treats the gain as ordinary data read.
  requires:
    all_of: []
    any_of:
    - - action: Microsoft.Storage/storageAccounts/blobServices/containers/blobs/modifyPermissions/action
        scope: '{target.scope}'
        data_action: true
    - - action: Microsoft.Storage/storageAccounts/blobServices/containers/blobs/manageOwnership/action
        scope: '{target.scope}'
        data_action: true
    - - action: Microsoft.Storage/storageAccounts/blobServices/containers/blobs/runAsSuperUser/action
        scope: '{target.scope}'
        data_action: true
  target:
    kind: azure_dataplane_admin
    selector:
      azure_challenge_fact: azure-storage-hns-acl-takeover-and-blob-super-user-data-action
    scope: inherited_scope
    aggregate_as: Pending service authority for storage
    outcome: application_admin
    grants:
    - Target ADLS Gen2 path whose POSIX ACL the principal can modify; access requires ancestor execute plus data read.
  conditions:
  - id: collector_fact_required
    description: The azure_adls_acl_paths inventory must identify the exact target and rights; absent or incomplete facts remain UNKNOWN.
  confidence: conditional
  severity: medium
  mitigation: Restrict the listed permissions to trusted operators and rotate or revoke resulting credentials or grants.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/azure-security/az-privilege-escalation/az-storage-privesc.md
  notes: 'Collector fact required: azure_adls_acl_paths. UNKNOWN until path ACL, ancestors, and separate data-read grant are collected.'
