# Entra ID group membership escalation (membership/owner write, group ownership,
# dynamic membership rules and attribute control).
# Source: hacktricks-cloud az-entraid-privesc/README.md, az-entraid-privesc/dynamic-groups.md,
# az-services/az-azuread.md (rev 171e422; all entries re-verified against the page text at that revision).
#
# Target kind entra_group (SCHEMA EXTENSION): obtaining membership of the group, i.e. the
# group's Entra role assignments (role-assignable groups only), Azure RBAC assignments,
# app-role assignments and any other access granted to the group.
#
# Protections encoded in selectors:
#  - Role-assignable groups (isAssignableToRole=true) are excluded from the granular
#    groups/* permissions and from Group.ReadWrite.All; only Privileged Role Administrator,
#    Global Administrator, RoleManagement.ReadWrite.Directory and the group's owners can
#    change their membership. They cannot be dynamic and cannot contain groups.
#  - Groups in a restricted management AU can only be modified by admins assigned at that
#    RMAU scope; owners and tenant-scoped admins (incl. Global Administrator) are blocked
#    and Graph application permissions do not apply.

- id: azure-entraid-group-members-update
  provider: azure
  service: entraid
  title: Add yourself to non-role-assignable groups
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-entraid-privesc/README.md#microsoftdirectorygroupsmembersupdate
  source_revision: 171e422
  summary: A principal allowed to update group membership (e.g. Groups Administrator, User Administrator) can obtain the privileges of any assigned, non-role-assignable group in its scope.
  requires:
    any_of:
      - - entra_permission: microsoft.directory/groups/members/update
          scope: "{target.scope}"
      - - entra_permission: microsoft.directory/groups/allProperties/update
          scope: "{target.scope}"
      - - entra_permission: microsoft.directory/groups.security/members/update
          scope: "{target.scope}"
      - - entra_permission: microsoft.directory/groups.unified/members/update
          scope: "{target.scope}"
  target:
    kind: entra_group
    selector:
      entra_group_role_assignable: false
      entra_group_membership_type: assigned
      entra_group_type_covered_by_permission: true
      entra_role_assignment_scope_covers_target: true
      entra_target_not_in_restricted_au: true
    scope: tenant
    aggregate_as: "Assigned, non-role-assignable groups in {scope}"
  conditions:
    - id: on_prem_synced_group
      description: Membership of groups synchronised from on-premises AD cannot be changed in Entra.
  blockers:
    - restricted_management_au
  confidence: derived
  severity: high
  mitigation: Do not grant Azure RBAC Owner/User Access Administrator or sensitive app roles to ordinary security groups; use role-assignable groups or restricted management AUs for privileged groups.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/custom-available-permissions
    - https://learn.microsoft.com/en-us/graph/api/group-post-members?view=graph-rest-1.0
  notes: groups.security/* covers security groups and groups.unified/* covers Microsoft 365 groups only (entra_group_type_covered_by_permission). Groups holding Azure RBAC at subscription/management-group scope make this edge escalate into the Azure resource plane even though role-assignable groups are protected.

- id: azure-entraid-graph-group-readwrite-all
  provider: azure
  service: entraid
  title: Graph Group.ReadWrite.All / GroupMember.ReadWrite.All adds members to groups
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-entraid-privesc/README.md#sensitive-graph-permissions
  source_revision: 171e422
  summary: A service principal holding Group.ReadWrite.All or GroupMember.ReadWrite.All can obtain the privileges of any assigned, non-role-assignable group outside restricted management AUs.
  requires:
    any_of:
      - - graph_app_permission: Group.ReadWrite.All
      - - graph_app_permission: GroupMember.ReadWrite.All
      - - graph_app_permission: Directory.ReadWrite.All
  target:
    kind: entra_group
    selector:
      entra_group_role_assignable: false
      entra_group_membership_type: assigned
      entra_target_not_in_restricted_au: true
    scope: tenant
    aggregate_as: "Assigned, non-role-assignable groups in {scope}"
  conditions:
    - id: on_prem_synced_group
      description: Membership of groups synchronised from on-premises AD cannot be changed in Entra.
    - id: service_principal_member_needs_application_permission
      description: Adding a service principal (e.g. the source itself) as a member additionally requires Application.ReadWrite.All app-only; without it the source must add a user it controls.
  blockers:
    - restricted_management_au
  confidence: derived
  severity: high
  mitigation: Prefer GroupMember.ReadWrite.All scoped alternatives or resource-specific consent, and keep privileged groups role-assignable or in restricted management AUs.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/groups-concept
    - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/admin-units-restricted-management#programmability
  notes: Microsoft states Group.ReadWrite.All does not work on role-assignable groups (RoleManagement.ReadWrite.Directory is required). Group.ReadWrite.All can also add owners, which leads to the same target set.

- id: azure-entraid-group-owners-update
  provider: azure
  service: entraid
  title: Make yourself owner of non-role-assignable groups
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-entraid-privesc/README.md#microsoftdirectorygroupsownersupdate
  source_revision: 171e422
  summary: A principal allowed to update group owners can obtain the privileges of any assigned, non-role-assignable group in its scope.
  requires:
    any_of:
      - - entra_permission: microsoft.directory/groups/owners/update
          scope: "{target.scope}"
      - - entra_permission: microsoft.directory/groups.security/owners/update
          scope: "{target.scope}"
      - - entra_permission: microsoft.directory/groups.unified/owners/update
          scope: "{target.scope}"
  target:
    kind: entra_group
    selector:
      entra_group_role_assignable: false
      entra_group_membership_type: assigned
      entra_group_type_covered_by_permission: true
      entra_role_assignment_scope_covers_target: true
      entra_target_not_in_restricted_au: true
    scope: tenant
    aggregate_as: "Assigned, non-role-assignable groups in {scope}"
  conditions:
    - id: on_prem_synced_group
      description: Membership of groups synchronised from on-premises AD cannot be changed in Entra.
  blockers:
    - restricted_management_au
  confidence: derived
  severity: high
  mitigation: Restrict groups/owners/update and review owner additions on groups that hold access.
  references:
    - https://learn.microsoft.com/en-us/graph/api/group-post-owners?view=graph-rest-1.0
  notes: Reaches the same target set as azure-entraid-group-members-update because group owners can manage assigned membership.

- id: azure-entraid-group-owner-membership
  provider: azure
  service: entraid
  title: Group owner adds itself to the owned group (incl. role-assignable groups)
  source: src/pentesting-cloud/azure-security/az-services/az-azuread.md#add-user-to-group
  source_revision: 171e422
  summary: An owner of an assigned-membership group can obtain the privileges of that group, including directory roles assigned to a role-assignable group.
  requires:
    all_of:
      - entra_owner_of: "{target.id}"
        object_type: group
  target:
    kind: entra_group
    selector:
      entra_source_is_owner_of_group: true
      entra_group_membership_type: assigned
      entra_target_not_in_restricted_au: true
    scope: tenant
    aggregate_as: "Assigned groups owned by {source}"
  conditions:
    - id: owner_is_service_principal
      description: A service principal owner also needs a usable token with group write ability (e.g. app permission) to exercise ownership via Graph.
    - id: on_prem_synced_group
      description: Membership of groups synchronised from on-premises AD cannot be changed in Entra.
  blockers:
    - restricted_management_au
  confidence: derived
  severity: high
  mitigation: Keep owners of role-assignable and privileged groups to Tier-0 administrators only; use PIM for Groups with approval for ownership.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/groups-concept
  notes: Microsoft documents that management of role-assignable groups can be delegated by adding group owners, so owners reach the group's directory roles; evaluator should raise severity to critical when the group holds a privileged role. Owners are blocked for groups in restricted management AUs.

- id: azure-entraid-group-dynamic-rule-update
  provider: azure
  service: entraid
  title: Rewrite a dynamic group's membership rule
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-entraid-privesc/README.md#microsoftdirectorygroupsdynamicmembershipruleupdate
  source_revision: 171e422
  summary: A principal allowed to update dynamic membership rules can obtain the privileges of any dynamic group in its scope.
  requires:
    any_of:
      - - entra_permission: microsoft.directory/groups/dynamicMembershipRule/update
          scope: "{target.scope}"
      - - entra_permission: microsoft.directory/groups/allProperties/update
          scope: "{target.scope}"
      - - graph_app_permission: Group.ReadWrite.All
      - - graph_app_permission: Directory.ReadWrite.All
  target:
    kind: entra_group
    selector:
      entra_group_membership_type: dynamic
      entra_role_assignment_scope_covers_target: true
      entra_target_not_in_restricted_au: true
    scope: tenant
    aggregate_as: "Dynamic groups in {scope}"
  conditions:
    - id: dynamic_processing_delay
      description: Membership is applied asynchronously by the dynamic membership processor; processing may be paused.
    - id: license
      description: Dynamic user membership requires Entra ID P1 licensing.
  blockers:
    - restricted_management_au
  confidence: derived
  severity: high
  mitigation: Restrict dynamicMembershipRule update and avoid granting Azure RBAC or sensitive app roles to dynamic groups.
  references:
    - https://learn.microsoft.com/en-us/graph/api/group-update?view=graph-rest-1.0
  notes: Role-assignable groups cannot be dynamic, so directory roles are never reached directly; the gain is the group's Azure RBAC / app access. Group.ReadWrite.All / Directory.ReadWrite.All application permissions can update membershipRule (Update group API) outside restricted management AUs; built-in holders of dynamicMembershipRule/update are Groups Administrator, User Administrator and Directory Writers.

- id: azure-entraid-dynamic-group-attribute-control
  provider: azure
  service: entraid
  title: Change user attributes referenced by a dynamic membership rule
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-entraid-privesc/dynamic-groups.md#privesc
  source_revision: a66f094ede
  summary: A principal able to write user attributes referenced by a dynamic membership rule, on a user it controls, can obtain the privileges of that dynamic group.
  requires:
    any_of:
      - - entra_permission: microsoft.directory/users/basic/update
          scope: "{source.controlled_user}"
      - - entra_permission: microsoft.directory/users/manager/update
          scope: "{source.controlled_user}"
      - - graph_app_permission: User.ReadWrite.All
      - - graph_app_permission: User-Mail.ReadWrite.All
      - - graph_app_permission: Directory.ReadWrite.All
  target:
    kind: entra_group
    selector:
      entra_group_membership_type: dynamic
      entra_dynamic_rule_attributes_writable_by_source: true
      entra_target_not_in_restricted_au: true
    scope: tenant
    aggregate_as: "Dynamic groups whose rule uses attributes {source} can write"
  conditions:
    - id: controlled_user_required
      description: The source must control a user object to modify, and the permission scope is that user ({source.controlled_user}). For a user source this is the source itself. For any other source the controlled user is not identified and the edge is conditional (controlled_user_not_identified). The controlled user then becomes the group member.
    - id: sensitive_attribute
      description: Sensitive attributes (otherMails, mobilePhone, businessPhones, accountEnabled, userPrincipalName) require roles per Microsoft's "who can perform sensitive actions" table, and app-only writes need a supporting directory role.
    - id: synced_attribute
      description: Attributes sourced from on-premises AD are overwritten by sync and must be changed at the source directory.
  blockers:
    - restricted_management_au
  confidence: conditional
  severity: high
  mitigation: Base dynamic rules on attributes only administrators (or HR-sourced sync) can write, never on self-service or guest-controlled values, and avoid granting privileged access to dynamic groups.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/users/groups-dynamic-membership
    - https://www.mnemonic.io/resources/blog/abusing-dynamic-groups-in-azure-ad-for-privilege-escalation/
  notes: The evaluator must parse membershipRule and intersect referenced attributes with what the source can write (users/basic/update covers non-sensitive basic properties such as department/jobTitle; manager/update covers user.manager rules). Device rules (device.*) are not modelled here.

- id: azure-entraid-dynamic-group-guest-invite
  provider: azure
  service: entraid
  title: Invite a guest that satisfies a dynamic membership rule
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-entraid-privesc/dynamic-groups.md#privesc
  source_revision: 171e422
  summary: A principal allowed to invite guests can obtain the privileges of dynamic groups whose rule a newly invited guest satisfies.
  requires:
    any_of:
      - - entra_permission: microsoft.directory/users/inviteGuest
      - - entra_tenant_setting: guest_invites_allowed_for_source
  target:
    kind: entra_group
    selector:
      entra_group_membership_type: dynamic
      entra_dynamic_rule_satisfiable_by_invited_guest: true
      entra_target_not_in_restricted_au: true
    scope: tenant
    aggregate_as: "Dynamic groups whose rule a newly invited guest can satisfy"
  conditions:
    - id: external_collaboration_settings
      description: The tenant's allowInvitesFrom setting (default "everyone", including guests) and cross-tenant access / domain allow-deny lists decide whether the source can invite.
    - id: guest_cannot_edit_sensitive_props
      description: An ordinary guest cannot later edit sensitive properties such as otherMails; only values set at invitation/redemption are controllable.
  blockers: []
  confidence: conditional
  severity: medium
  mitigation: Restrict guest invitations to specific admin roles and never use guest-controllable attributes (mail, otherMails, displayName) in dynamic rules that grant access.
  references:
    - https://learn.microsoft.com/en-us/entra/external-id/external-collaboration-settings-configure
    - https://learn.microsoft.com/en-us/entra/fundamentals/users-default-permissions
  notes: Severity is medium by default; the evaluator should raise it based on the group's access. The source becomes able to act as a new guest principal it creates, not as an existing principal.
