- source: src/pentesting-cloud/azure-security/az-lateral-movement-cloud-on-prem/az-pta-pass-through-authentication.md#pivoting
  technique: PTA agent backdoor on the sync host, or rogue PTA agent registered by a Global Administrator
  source_revision: a66f094ede
  reason: Agent backdoor needs local administrator on the on-prem PTA host (outside the cloud graph); registering a rogue agent needs Global Administrator, which
    already reaches every user, so it adds only credential harvesting (persistence of held privileges).
- source: src/pentesting-cloud/azure-security/az-lateral-movement-cloud-on-prem/az-connect-sync.md#abusing-connectsyncprovisioning_connectsync_
  technique: ConnectSyncProvisioning application certificate theft and key addition
  source_revision: a66f094ede
  reason: Requires stealing the application certificate from the sync server process (host compromise); the application has no directory roles and its sync-API abuse
    is undocumented, so there is no configuration-derived edge. Adding keys afterwards is persistence of the same identity.
