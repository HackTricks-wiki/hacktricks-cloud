# Azure Confidential Ledger techniques (declarative only).
# Source: hacktricks-cloud az-confidential-ledger-privesc.md (rev 171e422).

- id: azure-confidentialledger-ledgers-write-principal
  provider: azure
  service: confidential_ledger
  title: Add a principal as ledger Administrator through ledgers/write
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-confidential-ledger-privesc.md#data-plane-role-self-grant-via-ledgerswrite
  source_revision: 171e422
  summary: The ledger's aadBasedSecurityPrincipals list is part of the ARM resource, so ledgers/write grants the Administrator data-plane role.
  requires:
    all_of:
      - action: Microsoft.ConfidentialLedger/ledgers/write
        scope: "{target.scope}"
  target:
    kind: azure_dataplane_admin
    selector:
      any_principal_in_scope: true
    scope: inherited_scope
    aggregate_as: "Confidential Ledger administrators of {target.scope}"
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: medium
  mitigation: Restrict ledgers/write and monitor aadBasedSecurityPrincipals changes.
  references:
    - https://learn.microsoft.com/en-us/rest/api/confidentialledger/ledger/update
    - https://learn.microsoft.com/en-us/azure/confidential-ledger/manage-azure-ad-users
  notes: ""
