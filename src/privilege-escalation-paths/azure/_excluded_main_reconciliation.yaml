# Main-only privilege paths reviewed and excluded from CSPM execution and UI. HackTricks Cloud source remains.
- id: azure-apim-tenant-git-deploy-managed-identity-token
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-api-management-privesc.md#microsoftapimanagementservicetenantdeployaction--bulk-config-overwrite-via-built-in-git
  technique: Deploy attacker policies through the APIM built-in Git configuration repository
  reason: Microsoft retired the built-in API Management Git save/deploy feature after 15 March 2025, so
    tenant deploy plus listSecrets no longer establishes a policy-install path.
  disposition: invalid-or-retired
- id: azure-datafactory-dataplane-access-token
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-data-factory-privesc.md#mint-a-factory-data-plane-access-token-with-factoriesgetdataplaneaccessaction
  technique: Use a factory data-plane token to execute as one exact managed identity
  reason: The target selector requires externally reviewed evidence of a usable data-plane token, a runnable
    pipeline, successful run, and an obtained managed-identity token. The scanner cannot safely perform
    these active steps from the management permission alone; synthetic positive/negative tests cover only
    supplied proof.
  disposition: manual-only
- id: azure-service-linker-read-connection-configuration-to-exfiltrate-the-backing-secret
  source: src/pentesting-cloud/azure-security/az-post-exploitation/az-service-connector-post-exploitation.md#read-connection-configuration-to-exfiltrate-the-backing-secret
  technique: Read a Service Linker backing credential
  reason: Service Connector configuration reads may disclose connection strings, but the target is modeled
    as data-plane admin without a typed exact credential subject or authorization proof. The old reviewed
    strict-principal-boundary exclusion classifies this as terminal secret disclosure, not a privilege-escalation
    edge.
  disposition: manual-only
