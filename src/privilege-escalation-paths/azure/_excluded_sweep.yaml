# Reviewed privilege-escalation sweep exclusions.
- source: src/pentesting-cloud/azure-security/az-basic-information/az-tokens-and-public-applications.md#naa--broci-nested-app-authentication--broker-client-injection
  technique: Redeem a broker-context refresh token as another first-party client and resource
  reason: Live refresh-token possession, broker issuance context, consent and Conditional Access decisions are not derivable
    from an Entra configuration snapshot. The FOCI exclusion covers ordinary family-client reuse, not this broker-context
    exchange.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-app-services-functions-unauth.md#publishingdeployment-credentials
  technique: Use publicly leaked App Service publishing credentials to deploy code as the app
  reason: The catalog models RBAC-based credential retrieval and publishing, but external publication of a password is a live
    secret-exposure fact. The snapshot cannot establish that the source possesses a leaked credential.
- source: src/pentesting-cloud/azure-security/az-unauthenticated-enum-and-initial-entry/az-app-services-functions-unauth.md#source--secrets-served-as-static-content
  technique: Recover an Entra or managed-service credential from publicly served app configuration
  reason: The file contents and credential validity are not configuration-snapshot facts; the page gives a content-leak class,
    not a deterministic identity edge from public reachability.
