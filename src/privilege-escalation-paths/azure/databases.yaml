- id: azure-sqlmi-entra-admin-write
  provider: azure
  service: databases
  title: Set the Azure SQL Managed Instance Entra administrator
  source: src/pentesting-cloud/azure-security/az-persistence/az-sql-persistence.md#sql-managed-instance-parity-and-clr-based-persistence
  source_revision: 171e422
  summary: The source can obtain Entra administrator on the SQL Managed Instance, the instance analogue of the logical-server Entra admin grant.
  requires:
    all_of:
      - action: Microsoft.Sql/managedInstances/administrators/write
        scope: '{target.scope}'
  target:
    kind: azure_dataplane_admin
    selector:
      any_principal_in_scope: true
    scope: inherited_scope
    aggregate_as: SQL Managed Instance admin of {target.scope}
  conditions:
    - id: network_reachable
      description: The instance endpoint (VNet-local, or public endpoint if enabled) must be reachable from the source.
  blockers: []
  confidence: derived
  severity: high
  mitigation: Restrict managedInstances/administrators/write and alert on Entra admin changes.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-configure
  notes: Sourced from the HackTricks SQL persistence page, which lists the Managed Instance equivalents of the SQL privesc page's control-plane techniques.

- id: azure-sqlmi-admin-password-reset
  provider: azure
  service: databases
  title: Reset the Azure SQL Managed Instance administrator password
  source: src/pentesting-cloud/azure-security/az-persistence/az-sql-persistence.md#sql-managed-instance-parity-and-clr-based-persistence
  source_revision: 171e422
  summary: The source can obtain the SQL Managed Instance administrator login.
  requires:
    all_of:
      - action: Microsoft.Sql/managedInstances/write
        scope: '{target.scope}'
  target:
    kind: azure_dataplane_admin
    selector:
      any_principal_in_scope: true
    scope: inherited_scope
    aggregate_as: SQL Managed Instance admin of {target.scope}
  conditions:
    - id: sql_auth_allowed
      description: Entra-only authentication must be disabled on the instance (managedInstances/azureADOnlyAuthentications/write can disable it).
    - id: network_reachable
      description: The instance endpoint must be reachable from the source.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Enforce Entra-only authentication on managed instances and restrict managedInstances/write.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication
  notes: Disruptive to clients using the old password.
