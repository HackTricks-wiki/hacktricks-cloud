# Azure Key Vault techniques (declarative only).
# Source: hacktricks-cloud az-key-vault-privesc.md (rev 171e422).

- id: azure-keyvault-secret-read-sp-credentials
  provider: azure
  service: key_vault
  title: Read Key Vault secrets/certificates containing service-principal credentials
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-key-vault-privesc.md#microsoftkeyvaultvaultsaccesspolicieswrite-microsoftkeyvaultvaultsread
  source_revision: 171e422
  summary: The source can obtain the privileges of service principals whose credentials are stored in the vault.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.KeyVault/vaults/accessPolicies/write
          scope: '{pivot}'
      - - action: Microsoft.KeyVault/vaults/write
          scope: '{pivot}'
      - - action: Microsoft.KeyVault/vaults/secrets/getSecret/action
          data_action: true
          scope: '{pivot}'
  pivot_resource_type: Microsoft.KeyVault/vaults
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: '{pivot}'
    scope: any
    aggregate_as: Service principals with credentials stored in {pivot}
  conditions:
    - id: permission_model
      description: accessPolicies/write and vaults/write (which can rewrite the vault's accessPolicies property) apply only when enableRbacAuthorization is false/null; getSecret applies only when it is true.
    - id: credential_content_unknown
      description: The vault must actually hold a client secret or certificate private key of a service principal; content is not visible from RBAC.
    - id: network_reachable
      description: Vault firewall/private endpoint must allow the source (vaults/write can change network ACLs).
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Use Azure RBAC vault permission model, restrict accessPolicies/write, vaults/write (Contributor, Key Vault Contributor) and Secrets User roles, and avoid storing SP secrets where managed identities suffice.
  references:
    - https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-access-policy
  notes: The getSecret alternative is the RBAC-model equivalent requested by the catalog semantics; HackTricks documents only the access-policy grant on this page. HackTricks rev 171e422 states vaults/write alone is not the access-policy write operation; the vaults/write branch relies on a full vault PUT replacing properties.accessPolicies (and on the enableRbacAuthorization toggle described on the same page), so treat that branch as the least certain. Certificates are read through secrets (the private key is only returned by the secret), which this entry already covers.

- id: azure-keyvault-template-deployment-secret-reference
  provider: azure
  service: key_vault
  title: Resolve a Key Vault secret through an ARM template deployment
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-key-vault-privesc.md#microsoftkeyvaultvaultsdeployaction--microsoftresourcesdeploymentswrite
  source_revision: 171e422
  summary: The source can obtain the privileges of service principals whose credentials are stored in the vault.
  requires:
    all_of:
      - action: Microsoft.KeyVault/vaults/deploy/action
        scope: '{pivot}'
      - action: Microsoft.Resources/deployments/write
        scope: '*'
  pivot_resource_type: Microsoft.KeyVault/vaults
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: '{pivot}'
    scope: any
    aggregate_as: Service principals with credentials stored in {pivot}
  conditions:
    - id: enabled_for_template_deployment
      description: The vault must have enabledForTemplateDeployment set.
    - id: credential_content_unknown
      description: The referenced secret must contain a service-principal credential.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Disable enabledForTemplateDeployment where unused and restrict vaults/deploy/action.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/key-vault-parameter
  notes: ''
