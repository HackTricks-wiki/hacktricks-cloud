  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#microsoftwebsitessitecontainerswrite-and-microsoftwebsitesslotssitecontainerswrite
  source_revision: 171e422
  summary: Setting the main SiteContainer image/startup command executes attacker code with the app's managed identities.
