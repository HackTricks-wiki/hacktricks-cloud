# Azure App Service (Microsoft.Web/sites) privilege escalation techniques.
# Applies to Web Apps AND Function Apps (both are Microsoft.Web/sites); Function-only techniques live in functions.yaml.
# Source: hacktricks-cloud az-app-services-privesc.md and az-functions-app-privesc.md (rev 171e422, re-verified).
# Placeholder conventions: see catalog/azure/authorization.yaml header.
# Deployment slots (Microsoft.Web/sites/slots) have their own managed identity configuration and their own
# RBAC actions; they are modelled separately in azure-appservice-slot-code-execution.

- id: azure-appservice-kudu-publish-action
  provider: azure
  service: app_services
  title: Use the Kudu/SCM API with Entra credentials to run commands in the app
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#microsoftwebsitespublishaction-and-microsoftwebsitesslotspublishaction
  source_revision: 171e422
  summary: Microsoft.Web/sites/publish/action authorizes the SCM site (command API, SSH, zip deploy, WebJobs), giving code execution as the app and its managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/publish/action
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
    scope: inherited_scope
    aggregate_as: "Managed identities of App Service {target.host_resource}"
  conditions:
    - id: scm_network_access
      description: SCM site access restrictions / private endpoints may require network reachability.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict Microsoft.Web/sites/publish/action (Website Contributor, Contributor), restrict SCM site network access, and keep app identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/resources-kudu
  notes: Also covers continuous WebJob creation via the SCM API.

- id: azure-appservice-publishing-credentials-enable-basic-auth
  provider: azure
  service: app_services
  title: Obtain SCM/FTP publishing credentials and enable basic auth to deploy code
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#obtaining-scm-credentials--enabling-basic-authentication
  source_revision: 171e422
  summary: Publishing credentials (publishing profile or publishing-credentials list) plus the ability to allow SCM/FTP basic auth let the source deploy code that runs as the app's managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/basicPublishingCredentialsPolicies/write
        scope: "{target.host_resource}"
    any_of:
      - - action: Microsoft.Web/sites/publishxml/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/config/list/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
    scope: inherited_scope
    aggregate_as: "Managed identities of App Service {target.host_resource}"
  conditions:
    - id: scm_network_access
      description: SCM/FTP endpoints must be reachable.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Keep SCM/FTP basic authentication disabled (enforce with Azure Policy) and restrict publishxml/config list and basicPublishingCredentialsPolicies/write.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-basic-auth-disable
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-configure-credentials
  notes: Covers zip deploy, local Git push, Kudu VFS and FTP uploads with the disclosed credentials.

- id: azure-appservice-publishing-credentials-basic-auth-enabled
  provider: azure
  service: app_services
  title: Obtain SCM/FTP publishing credentials when basic auth is already enabled
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#publish-code-using-scm-credentials
  source_revision: 171e422
  summary: With basic auth already allowed, disclosed publishing credentials alone allow deploying code that runs as the app's managed identities.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Web/sites/publishxml/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/config/list/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
    scope: inherited_scope
    aggregate_as: "Managed identities of App Service {target.host_resource}"
  conditions:
    - id: scm_basic_auth_enabled
      description: Edge exists only if basicPublishingCredentialsPolicies scm or ftp has allow=true (otherwise credentials are REDACTED/rejected).
  blockers:
    - scm_and_ftp_basic_auth_disabled
  confidence: conditional
  severity: high
  mitigation: Disable SCM and FTP basic authentication and restrict publishxml/config list.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-basic-auth-disable
  notes: config/list/action also returns app settings/connection strings (data exposure, not modelled).

- id: azure-appservice-sourcecontrols-write
  provider: azure
  service: app_services
  title: Redirect App Service deployment to an attacker repository
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#microsoftwebsitessourcecontrolswrite-and-microsoftwebsitesslotssourcecontrolswrite
  source_revision: 171e422
  summary: Pointing the app's source control at an attacker repository deploys attacker code that runs with the app's managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/sourcecontrols/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
    scope: inherited_scope
    aggregate_as: "Managed identities of App Service {target.host_resource}"
  conditions:
    - id: build_succeeds
      description: The deployment/build must succeed for the code to run.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict sourcecontrols/write and monitor deployment source changes.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-continuous-deployment
  notes: Also the "Change GitHub repo" technique on the Function App page.

