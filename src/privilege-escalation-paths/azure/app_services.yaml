- id: azure-appservice-assign-user-assigned-identity
  provider: azure
  service: app_services
  title: Attach a user-assigned identity to an App Service the source can execute code in
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#microsoftwebsiteswrite-microsoftwebsitesread-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: 171e422
  summary: Adding a user-assigned identity to an app where the source can run code exposes that identity's tokens.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: "{target.id}"
      - action: Microsoft.Web/sites/write
        scope: "{pivot}"
    any_of:
      - - action: Microsoft.Web/sites/publish/action
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/config/write
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/sourcecontrols/write
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/sitecontainers/write
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/extensions/write
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/hostruntime/vfs/write
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/host/listkeys/action
          scope: "{pivot}"
  pivot_resource_type: Microsoft.Web/sites
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_identity_assignable_in_scope: true
    scope: inherited_scope
    aggregate_as: "User-assigned identities assignable in {scope}"
  conditions:
    - id: app_compromised_outside_rbac
      description: HackTricks also covers apps compromised by non-RBAC means (vulnerable code); not detectable from RBAC.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and Microsoft.Web/sites/write.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/overview-managed-identity
  notes: Microsoft.Web/sites/write on a resource group also allows creating a new app (with serverfarms/join) carrying the identity. hostruntime/vfs/write and host/listkeys code paths apply to Function Apps.

- id: azure-appservice-slot-code-execution
  provider: azure
  service: app_services
  title: Run code in a deployment slot
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#microsoftwebsitesslotsconfigwrite--recycle-a-deployment-slot-into-attacker-code
  source_revision: 171e422
  summary: Slot-scoped publish, source control, SiteContainer, config or key permissions give code execution in the slot, exposing the slot's managed identities.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Web/sites/slots/publish/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/sourcecontrols/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/sitecontainers/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/config/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/host/listkeys/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites/slots
    scope: inherited_scope
    aggregate_as: "Managed identities of deployment slot {target.host_resource}"
  conditions:
    - id: slot_swap
      description: A later slot swap moves the slot's content (not its identity) into production; slot identities are configured per slot.
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Treat slot permissions like production permissions and keep slot identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
  notes: slots/host/listkeys/action applies to Function App slots (master key -> admin VFS).

- id: azure-appservice-slot-publishxml
  provider: azure
  service: app_services
  title: Obtain slot publishing credentials and deploy into the slot
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-functions-app-privesc.md#microsoftwebsitesslotspublishxmlaction
  source_revision: a66f094ede
  summary: The slot publishing profile with secrets (or the slot publishing credentials returned by slot config listing) allows Kudu zip deployment into the slot when SCM basic auth is allowed.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Web/sites/slots/publishxml/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/config/list/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites/slots
    scope: inherited_scope
    aggregate_as: "Managed identities of deployment slot {target.host_resource}"
  conditions:
    - id: scm_basic_auth_enabled
      description: SCM (or FTP) basic auth must be allowed for the slot; enabling it needs basicPublishingCredentialsPolicies write.
  blockers:
    - scm_and_ftp_basic_auth_disabled
  confidence: conditional
  severity: high
  mitigation: Disable basic auth on slots and restrict slots/publishxml/action.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-basic-auth-disable
  notes: slots/config/list/action is the slot counterpart of config/list/action (the Function App page documents it as the same capability for a slot); it authorizes listing the slot's security-sensitive settings, including its publishing credentials.

- id: azure-appservice-slot-swap-promote-code
  provider: azure
  service: app_services
  title: Plant code in a deployment slot and swap it into production
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#microsoftwebsitesslotsswapaction-promote-staged-code--steal-production-sticky-secrets
  source_revision: 171e422
  summary: Code planted in a slot runs under the production site's managed identities after a swap, because identities stay with the site and are not swapped.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Web/sites/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/publish/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/sourcecontrols/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/sitecontainers/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/config/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/publish/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/sourcecontrols/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/sitecontainers/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/slots/slotsswap/action
          scope: "{target.host_resource}"
        - action: Microsoft.Web/sites/slots/config/write
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
    scope: inherited_scope
    aggregate_as: "Managed identities of production site {target.host_resource}"
  conditions:
    - id: slot_exists
      description: The site must have a deployment slot (creating one needs Microsoft.Web/sites/slots/write and a Standard or higher plan).
    - id: swap_not_gated
      description: Swap with preview or deployment pipelines gating swaps can delay or surface the promotion.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict slotsswap/action to release automation and treat slot write permissions like production permissions.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots#which-settings-are-swapped
  notes: Microsoft documents that managed identities are not swapped, so promoted code authenticates as the production site's identities. Grants scoped only to the slot resource (not the site) are not matched by this entry.

- id: azure-appservice-easyauth-client-secret
  provider: azure
  service: app_services
  title: Read the Easy Auth identity-provider client secret from app settings
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#easy-auth-secret-theft--authentication-bypass
  source_revision: a66f094ede
  summary: App Service Authentication stores the Entra app registration's client secret in an app setting, which config/list/action (or a config snapshot secret listing) returns, yielding the application's service principal.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Web/sites/config/list/action
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/config/snapshots/listsecrets/action
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/slots/config/list/action
          scope: "{pivot}"
      - - action: Microsoft.Web/sites/slots/config/snapshots/listsecrets/action
          scope: "{pivot}"
  pivot_resource_type: Microsoft.Web/sites
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: "{pivot}"
    scope: inherited_scope
    aggregate_as: "Easy Auth application credential stored in {pivot}"
  conditions:
    - id: easyauth_confidential_client
      description: Easy Auth must be configured with an Entra provider using a client secret (MICROSOFT_PROVIDER_AUTHENTICATION_SECRET); certificate or federated-credential setups expose no secret.
    - id: app_has_privileges
      description: The gain matters only if the application's service principal holds roles or API permissions.
  blockers: []
  confidence: conditional
  severity: medium
  mitigation: Use a federated identity credential (managed identity) for Easy Auth instead of a client secret; restrict config/list/action.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-authentication-provider-aad
  notes: The same settings listings also expose any other service-principal secret kept in app settings or connection strings (e.g. AZURE_CLIENT_SECRET); historical snapshots can return secrets that were later removed from the live configuration, valid unless rotated. Slot-scoped listings return the slot's settings, which commonly carry the same credential.

- id: azure-appservice-process-dump-cached-tokens
  provider: azure
  service: app_services
  title: Dump the worker process memory through the ARM processes surface
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#kudu-process-memory-dump-harvest-in-memory-mi-tokens--decrypted-secrets
  source_revision: 171e422
  summary: A full memory dump of the running worker can contain managed-identity access tokens the app has cached, giving the source those identities' privileges until the tokens expire.
  requires:
    all_of:
      - action: Microsoft.Web/sites/instances/processes/read
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
    scope: inherited_scope
    aggregate_as: "Managed identities of App Service {target.host_resource} (cached tokens)"
  conditions:
    - id: token_cached_in_memory
      description: Only tokens the app already requested and still holds in memory are exposed; the IMDS secret alone is not usable from outside the worker.
    - id: scm_network_access
      description: The dump is served by the SCM site; access restrictions or private endpoints may require network reachability.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict Microsoft.Web/sites/instances/processes/* (Website Contributor, Contributor) and the SCM site's network access, and keep app identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/rest/api/appservice/web-apps/get-process-dump
  notes: The Kudu path with publishing credentials or publish/action is already covered by azure-appservice-kudu-publish-action and the publishing-credential entries.
- id: azure-app-services-read-configured-third-party-credentials
  provider: azure
  service: app_services
  title: Read configured third-party source-control OAuth tokens
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-static-web-apps-privesc.md#read-configured-third-party-credentials
  source_revision: 0b36331
  summary: Read the stored third-party source-control OAuth tokens (GitHub, Bitbucket, Dropbox, OneDrive) exposed to the account → pivot into those external accounts (repos, files) with the returned tokens.
  requires:
    all_of:
    - action: Microsoft.Web/sourcecontrols/read
      scope: '{target.scope}'
  target:
    kind: azure_dataplane_admin
    selector:
      azure_challenge_fact: azure-app-services-read-configured-third-party-credentials
    scope: inherited_scope
    aggregate_as: Pending service authority for app_services
    outcome: application_admin
    grants:
    - The configured third-party GitHub, Bitbucket, Dropbox or OneDrive OAuth identity.
  conditions:
  - id: collector_fact_required
    description: The azure_web_sourcecontrols inventory must identify the exact target and rights; absent or incomplete facts remain UNKNOWN.
  confidence: conditional
  severity: medium
  mitigation: Restrict the listed permissions to trusted operators and rotate or revoke resulting credentials or grants.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/azure-security/az-privilege-escalation/az-static-web-apps-privesc.md
  notes: 'Collector fact required: azure_web_sourcecontrols. UNKNOWN until configured token, owner, and scope are inventoried.'
