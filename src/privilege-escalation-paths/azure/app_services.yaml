- id: azure-appservice-config-write
  provider: azure
  service: app_services
  title: Change app configuration to load attacker code
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#microsoftwebsitesconfigwrite
  source_revision: 171e422
  summary: Writing site config (container image, startup command, WEBSITE_RUN_FROM_PACKAGE, interpreter environment variables, remote debugging) makes the app run attacker code with its managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/config/write
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
    scope: inherited_scope
    aggregate_as: "Managed identities of App Service {target.host_resource}"
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Restrict Microsoft.Web/sites/config/write (Website Contributor, Contributor) and alert on appsettings/container/startup command changes.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-common
    - https://learn.microsoft.com/en-us/azure/azure-functions/run-functions-from-deployment-package
  notes: The CLI container-image flow also reads config (config/read, config/list/action, sites/read) to preserve settings; the write is what grants the gain. Covers the Function App WEBSITE_RUN_FROM_PACKAGE external URL, container image change and remote debugging techniques.

