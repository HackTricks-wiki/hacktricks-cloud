- source: src/pentesting-cloud/azure-security/az-persistence/az-kubernetes-persistence.md#trusted-access-role-binding--service-identity-access-through-the-aks-gateway-trustedaccessrolebindingswrite
  technique: Trusted Access role binding — service identity access through the AKS gateway (`trustedAccessRoleBindings/write`)
  source_revision: a66f094ede
  reason: The binding grants a predefined Trusted Access role to another resource's system-assigned identity; the source gains cluster access only if it already controls
    that resource's behaviour (page), and the Trusted Access role permissions are not collected. Persistence of an already-held foothold.
- source: src/pentesting-cloud/azure-security/az-persistence/az-spring-apps-persistence.md#spring-apps
  technique: Attach an identity and grant it RBAC; keep the test endpoint and key
  source_revision: a66f094ede
  reason: Identity attachment plus roleAssignments/write is persistence of privileges the source already holds (role assignment write is modelled by the authorization
    entries; identity attach by azure-springapps-app-write-user-assigned-identity). The test endpoint key gives unauthenticated app HTTP reach only (see the listTestKeys
    exclusion).
