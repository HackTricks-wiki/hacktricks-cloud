- source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-kubernetes-privesc.md#alternative-cluster-credential-retrieval-apis
  technique: managedNamespaces/listCredential, listClusterMonitoringUserCredential
  source_revision: a66f094ede
  reason: 'The clusterMonitoringUser kubeconfig is bound to a read-mostly monitoring role (no other principal''s privileges). The managed-namespace kubeconfig is
