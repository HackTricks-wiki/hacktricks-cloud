# Azure VM Image Builder techniques (declarative only).
# Source: hacktricks-cloud az-image-builder-privesc.md (rev 171e422).
# Customizers run as root/SYSTEM on the build VM. Only the build-VM identities
# (vmProfile.userAssignedIdentities) are exposed through IMDS; the template's top-level identity is
# the service identity used by Image Builder and is not attached to the build VM.

- id: azure-imagebuilder-template-hijack-existing
  provider: azure
  service: image_builder
  title: Recreate and run an existing image template with an injected customizer
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-image-builder-privesc.md#hijack-an-existing-image-template
  source_revision: 171e422
  summary: The source can obtain the privileges of the build-VM identities already configured on an existing image template.
  requires:
    all_of:
      - action: Microsoft.VirtualMachineImages/imageTemplates/read
        scope: "{target.host_resource}"
      - action: Microsoft.VirtualMachineImages/imageTemplates/delete
        scope: "{target.host_resource}"
      - action: Microsoft.VirtualMachineImages/imageTemplates/write
        scope: "{target.host_resource}"
      - action: Microsoft.VirtualMachineImages/imageTemplates/run/action
        scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.VirtualMachineImages/imageTemplates
      managed_identity_type: user_assigned
    scope: inherited_scope
    aggregate_as: "Build-VM identities of image template {target.host_resource}"
  conditions:
    - id: build_vm_identity_only
      description: Only identities listed in the template's vmProfile.userAssignedIdentities are reachable from customizer code; the template's top-level identity is also attached to the template resource but is not exposed on the build VM.
    - id: identity_reference_check
      description: Recreating the template re-references its top-level UAMI, which ARM may check against userAssignedIdentities/assign/action for the caller.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict imageTemplates write/delete/run (Contributor), avoid attaching privileged build-VM identities, and grant the template UAMI Managed Identity Operator only on dedicated build identities.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
    - https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-permissions-cli
  notes: The template is immutable, so modification is delete plus recreate. The attachment inventory cannot distinguish top-level from build-VM identities, so the target set may over-include the template's service identity; hence conditional.

- id: azure-imagebuilder-template-create-via-template-identity
  provider: azure
  service: image_builder
  title: Create and run a new image template whose template identity attaches a build-VM identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-image-builder-privesc.md#customizer-rce--build-identity-token-theft-marquee
  source_revision: 171e422
  summary: A source that can create and run image templates and assign a user-assigned identity T as the template identity can obtain the privileges of the build-VM identities that T is itself allowed to assign.
  requires:
    all_of:
      - action: Microsoft.VirtualMachineImages/imageTemplates/write
      - action: Microsoft.VirtualMachineImages/imageTemplates/run/action
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_assignable_via_identity_holding: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
    scope: any
    aggregate_as: "UAMIs assignable by an Image Builder template identity the source can assign"
    outcome: workload_execution
  conditions:
    - id: build_vm_identity_only
      description: Customizer code runs on the build VM; only identities listed in vmProfile.userAssignedIdentities are reachable through IMDS, and Image Builder checks that the template identity (not the caller) holds Managed Identity Operator / assign on each of them.
    - id: template_identity_is_intermediate
      description: The edge names the intermediate template identity T (via_intermediate_identity condition); the source must hold userAssignedIdentities/assign/action on T, which the selector checks.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Grant Managed Identity Operator to image template identities only on dedicated, least-privileged build identities, and restrict imageTemplates/write and run/action.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-json
    - https://learn.microsoft.com/en-us/azure/virtual-machines/linux/image-builder-permissions-cli
  notes: Complements azure-imagebuilder-template-hijack-existing (existing templates). The imageTemplates write/run requirements are matched at any scope where the source can create a template; the staging resource group and region constraints are not evaluated. Running the base customizer without any build-VM identity reaches no principal and is not an edge.
