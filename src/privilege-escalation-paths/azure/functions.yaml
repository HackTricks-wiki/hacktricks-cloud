# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure Function App-specific privilege escalation techniques (declarative only).
# Generic Microsoft.Web/sites techniques are in app_services.yaml and also apply to Function Apps.
# Source: hacktricks-cloud az-functions-app-privesc.md / az-app-services-privesc.md
# (rev 171e422, re-verified).
# Placeholder {target.host_resource.content_storage}: the storage account referenced by the app's
# AzureWebJobsStorage / WEBSITE_CONTENTAZUREFILECONNECTIONSTRING / WEBSITE_RUN_FROM_PACKAGE settings.

- id: azure-functions-hostruntime-vfs-write
  provider: azure
  service: functions
  title: Modify Function App files through the host runtime VFS
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-functions-app-privesc.md#microsoftwebsiteshostruntimevfswrite
  source_revision: b2319b83d9
  summary: Writing executable Function App content through the ARM runtime VFS may let it run with the app's managed identity.
  requires:
    all_of:
      - action: Microsoft.Web/sites/hostruntime/vfs/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
      azure_site_kind: functionapp
      azure_function_host_vfs_code_path: true
    scope: inherited_scope
    aggregate_as: "Managed identities of Function App {target.host_resource}"
  conditions:
    - id: writable_runtime_content
      description: The running host must accept the VFS write to executable content and load the changed code.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict hostruntime/vfs/write.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-functions/deployment-zip-push
  notes: The ARM hostruntime VFS permission is distinct from Kudu/SCM VFS authorization. The exact Function App host and a non-Flex, non-container, writable-content route are required. A known run-from-package mount blocks this file-editing path; unknown deployment mode and later execution remain conditional.

- id: azure-functions-functions-write
  provider: azure
  service: functions
  title: Create or update a function definition
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-app-services-privesc.md#replace-a-functions-code-with-microsoftwebsitesfunctionswrite
  source_revision: 3d70185315
  summary: The source can obtain the privileges of the Function App's managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/functions/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
      azure_site_kind: functionapp
      azure_function_definition_code_path: true
    scope: inherited_scope
    aggregate_as: "Managed identities of Function App {target.host_resource}"
  conditions:
    - id: writable_content
      description: Function content must be writable and the changed function must run before its managed identity is reached.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict Microsoft.Web/sites/functions/write.
  references:
    - https://learn.microsoft.com/en-us/rest/api/appservice/web-apps/create-function?view=rest-appservice-2026-07-15
    - https://learn.microsoft.com/en-us/azure/azure-functions/deployment-zip-push
  notes: The dynamic selector binds this action to the exact Function App hosting the identity, including a role scoped to an existing function child. Flex/package-based content cannot be modified through this route. Where package mode is not recorded, runtime execution remains conditional.

- id: azure-functions-sites-write-source-control
  provider: azure
  service: functions
  title: Repoint a Function App's deployment source
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-functions-app-privesc.md#change-github-repo
  source_revision: 14edac2ecb
  summary: Rewriting the app's source-control configuration to an attacker repository may deploy code with the Function App's managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/sourcecontrols/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
      azure_site_kind: functionapp
      azure_appservice_sourcecontrol_code_path: true
    scope: inherited_scope
    aggregate_as: "Managed identities of Function App {target.host_resource}"
  conditions:
    - id: deployment_runs
      description: Changing the source-control metadata does not push code; a deployment from the new source must authenticate and succeed.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict sourcecontrols/write and monitor deployment source changes.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/deploy-continuous-deployment
    - https://learn.microsoft.com/en-us/rest/api/appservice/web-apps/create-or-update-source-control?view=rest-appservice-2026-07-15
  notes: The same source-control operation is also modeled by azure-appservice-sourcecontrols-write. The selector binds the permission to this Function App's sourcecontrols/web child and leaves successful deployment and code execution conditional.

- id: azure-functions-remote-debugging
  provider: azure
  service: functions
  title: Enable remote debugging and attach a debugger to the Function App worker
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-functions-app-privesc.md#remote-debugging
  source_revision: 9772b41e74
  summary: Publishing credentials may permit remote debugger attachment to a supported running Function App after debugging is enabled, exposing its managed identity in the worker process.
  requires:
    any_of:
      - - action: Microsoft.Web/sites/publishxml/action
          scope: "*"
      - - action: Microsoft.Web/sites/config/list/action
          scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
      azure_site_kind: functionapp
      azure_function_remote_debug_path: true
    scope: inherited_scope
    aggregate_as: "Managed identities of Function App {target.host_resource}"
  conditions:
    - id: remote_debugging_supported
      description: Remote debugging requires a running Windows C# Function App on Premium or an App Service plan and is automatically turned off after 48 hours.
    - id: basic_auth_allowed
      description: The debugger needs usable publishing credentials and a reachable debug endpoint; SCM basic auth must be allowed or enableable.
  blockers:
    - scm_and_ftp_basic_auth_disabled
  confidence: conditional
  severity: high
  mitigation: Keep remote debugging off, disable basic auth and restrict config/write.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-common#configure-general-settings
    - https://learn.microsoft.com/en-us/azure/azure-functions/functions-develop-vs
    - https://learn.microsoft.com/en-us/rest/api/appservice/web-apps/list-publishing-credentials?view=rest-appservice-2026-07-15
  notes: The exact app must grant publishing-profile read or config/list on its publishingcredentials child. If remote debugging is not already enabled, config/write on that app's config/web child is also required. If SCM basic auth is disabled, basicPublishingCredentialsPolicies/write on that app's scm child is required. The worker language and debugger reachability remain conditional when not recorded.
