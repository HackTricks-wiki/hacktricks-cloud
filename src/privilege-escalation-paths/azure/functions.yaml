- id: azure-functions-config-list-storage-key
  provider: azure
  service: functions
  title: Read app settings exposing the content storage connection string
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-functions-app-privesc.md#microsoftwebsitesconfiglistaction
  source_revision: 171e422
  summary: The source can obtain the privileges of the Function App's managed identities.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Web/sites/config/list/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/config/snapshots/listsecrets/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
      azure_site_kind: functionapp
    scope: inherited_scope
    aggregate_as: "Managed identities of Function App {target.host_resource}"
  conditions:
    - id: key_based_storage_connection
      description: Only when the content storage setting contains an account key (not identity-based connections).
    - id: snapshot_key_still_valid
      description: For the snapshots/listsecrets path, a key recovered from a historical config snapshot must not have been rotated since.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Use identity-based storage connections, rotate storage keys after setting changes, and restrict config/list/action and config/snapshots/listsecrets/action.
  references:
    - https://learn.microsoft.com/en-us/azure/azure-functions/functions-reference#connecting-to-host-storage-with-an-identity
  notes: The publishing-credential path of config/list/action is modelled in app_services.yaml.

- id: azure-functions-remote-debugging
  provider: azure
  service: functions
  title: Enable remote debugging and attach a debugger to the Function App worker
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-functions-app-privesc.md#remote-debugging
  source_revision: 171e422
  summary: Enabling remote debugging and attaching with publishing credentials gives code execution in the worker process, exposing the Function App's managed identities.
  requires:
    all_of:
      - action: Microsoft.Web/sites/config/write
        scope: "{target.host_resource}"
    any_of:
      - - action: Microsoft.Web/sites/publishxml/action
          scope: "{target.host_resource}"
      - - action: Microsoft.Web/sites/config/list/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Web/sites
      azure_site_kind: functionapp
    scope: inherited_scope
    aggregate_as: "Managed identities of Function App {target.host_resource}"
  conditions:
    - id: remote_debugging_supported
      description: Remote debugging is only available on Windows plans and is automatically turned off after 48 hours.
    - id: basic_auth_allowed
      description: The debugger authenticates with publishing credentials, so SCM basic auth must be allowed.
  blockers:
    - scm_and_ftp_basic_auth_disabled
  confidence: conditional
  severity: high
  mitigation: Keep remote debugging off, disable basic auth and restrict config/write.
  references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-common#configure-general-settings
  notes: config/write alone already yields code execution (azure-appservice-config-write); this entry records the debugger route separately.
