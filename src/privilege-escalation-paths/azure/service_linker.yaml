- id: azure-service-linker-read-connection-configuration-to-exfiltrate-the-backing-secret
  provider: azure
  service: service_linker
  title: Read a Service Linker backing credential
  source: src/pentesting-cloud/azure-security/az-post-exploitation/az-service-connector-post-exploitation.md#read-connection-configuration-to-exfiltrate-the-backing-secret
  source_revision: 0b36331
  summary: for every secret-based connection, listConfigurations / generateConfigurations return the plaintext connection string with the embedded secret (e.g. AZURE_STORAGEBLOB_CONNECTIONSTRING=...;AccountKey=<real key>;..., a SQL/PostgreSQL password, a Cosmos DB key). The crucial part is that Service Connector Contributor is scoped to Microsoft.ServiceLinker/* only — it does not include Microsoft.Storage/storageAccounts/listKeys, Microsoft.DocumentDB/.../listKeys, the DB listKeys/admin actions, or Key Vault data actions — yet the config read hands back the underlying secret anyway. So a principal holdi
  requires:
    all_of: []
    any_of:
    - - action: Microsoft.ServiceLinker/linkers/read
        scope: '{target.scope}'
      - action: Microsoft.ServiceLinker/linkers/listConfigurations/action
        scope: '{target.scope}'
    - - action: Microsoft.ServiceLinker/linkers/read
        scope: '{target.scope}'
      - action: Microsoft.ServiceLinker/linkers/generateConfigurations/action
        scope: '{target.scope}'
  target:
    kind: azure_dataplane_admin
    selector:
      azure_challenge_fact: azure-service-linker-read-connection-configuration-to-exfiltrate-the-backing-secret
    scope: inherited_scope
    aggregate_as: Pending service authority for service_linker
    outcome: application_admin
    grants:
    - Each source linker’s backing Storage, SQL, PostgreSQL or Cosmos DB credential returned in its configuration.
  conditions:
  - id: collector_fact_required
    description: The azure_service_linkers inventory must identify the exact target and rights; absent or incomplete facts remain UNKNOWN.
  confidence: conditional
  severity: medium
  mitigation: Restrict the listed permissions to trusted operators and rotate or revoke resulting credentials or grants.
  references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/0b36331/src/pentesting-cloud/azure-security/az-post-exploitation/az-service-connector-post-exploitation.md
  notes: 'Collector fact required: azure_service_linkers. UNKNOWN until the linker authentication type and target credential principal are collected; never persist secret values.'
