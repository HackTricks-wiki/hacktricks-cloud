- source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-service-fabric-privesc.md#cluster--client-certificate-theft--data-plane-admin
  technique: Cluster / admin client certificate theft from Key Vault
  source_revision: a66f094ede
  reason: A credential or permission gain is documented, but it is deferred until the collector supplies serviceFabric.certSecretLinks[{clusterId,secretId,thumbprint,isAdmin,active}].
    Without a verified active cluster admin PFX-to-cluster link, a vault secret may be unrelated.
- source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-batch-privesc.md#microsoftbatchbatchaccountswrite--re-enable-sharedkey-auth-re-point-auto-storage-attach-account-identity
  technique: Batch account write
  source_revision: a66f094ede
  reason: Re-enabling SharedKey only lifts the shared_key_auth_mode condition of azure-batch-shared-key-task-submission (listkeys/regeneratekeys still required);
    auto-storage repoint is storage tampering; the account-level identity is used by the service (CMK, auto-storage) and is not exposed to node code. Pool identity
    paths are azure-batch-pool-write-starttask and azure-batch-pool-write-assign-user-assigned-identity.
