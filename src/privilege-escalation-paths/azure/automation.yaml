# Azure Automation account privilege escalation techniques.
# Source: hacktricks-cloud az-automation-accounts-privesc.md (rev 171e422).
# Placeholder conventions: see catalog/azure/authorization.yaml header.

- id: azure-automation-runbook-author-and-run
  provider: azure
  service: automation
  title: Create or modify a runbook and run it as the Automation account identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-automation-accounts-privesc.md#microsoftautomationautomationaccountsjobswrite-microsoftautomationautomationaccountsrunbooksdraftwrite-microsoftautomationautomationaccountsrunbooksdraftcontentwrite-microsoftautomationautomationaccountsjobsoutputread-microsoftautomationautomationaccountsrunbookspublishaction-microsoftresourcessubscriptionsresourcegroupsread-microsoftautomationautomationaccountsrunbookswrite
  source_revision: 171e422
  summary: The source runs arbitrary runbook code inside the Automation account sandbox and obtains tokens for the account's system- and user-assigned managed identities.
  requires:
    all_of: []
    any_of:
      - # edit an existing runbook draft, publish and start it
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{target.host_resource}"
      - # create a new runbook, upload content, publish and start it
        - action: Microsoft.Automation/automationAccounts/runbooks/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{target.host_resource}"
      - # edit the draft and run it as a test job without publishing
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{target.host_resource}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/testJob/write
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Automation/automationAccounts
    scope: inherited_scope
    aggregate_as: "Managed identities of Automation account {target.host_resource}"
  conditions: []
  blockers:
    - azure_deny_assignment
  confidence: derived
  severity: high
  mitigation: Limit runbook authoring/publish/job permissions (Automation Contributor, Automation Operator + Runbook Operator, Contributor) and give the Automation account identity only the roles its runbooks need.
  references:
    - https://learn.microsoft.com/en-us/azure/automation/automation-role-based-access-control
    - https://learn.microsoft.com/en-us/azure/automation/enable-managed-identity-for-automation
  notes: Reaches only identities attached to the Automation account whose runbook/job permissions the source holds. Output-read permissions are only needed to read results and are not required for the gain. Credential and encrypted-variable assets are modelled separately (azure-automation-runbook-credential-assets); Hybrid Worker VM identities separately (azure-automation-runbook-hybrid-worker).

- id: azure-automation-runbook-credential-assets
  provider: azure
  service: automation
  title: Decrypt Automation credential/variable assets from runbook code
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-automation-accounts-privesc.md#microsoftautomationautomationaccountsjobswrite-microsoftautomationautomationaccountsrunbooksdraftwrite-microsoftautomationautomationaccountsrunbooksdraftcontentwrite-microsoftautomationautomationaccountsjobsoutputread-microsoftautomationautomationaccountsrunbookspublishaction-microsoftresourcessubscriptionsresourcegroupsread-microsoftautomationautomationaccountsrunbookswrite
  source_revision: a66f094ede
  summary: Runbook code the source controls can read credential assets and encrypted variables, which may hold passwords or client secrets of users or service principals.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/output/read
          scope: "{pivot}"
      - - action: Microsoft.Automation/automationAccounts/runbooks/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/publish/action
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/jobs/output/read
          scope: "{pivot}"
      - - action: Microsoft.Automation/automationAccounts/runbooks/draft/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/content/write
          scope: "{pivot}"
        - action: Microsoft.Automation/automationAccounts/runbooks/draft/testJob/write
          scope: "{pivot}"
  pivot_resource_type: Microsoft.Automation/automationAccounts
  target:
    kind: azure_service_principal
    selector:
      credential_stored_in_scope: "{pivot}"
    scope: any
    aggregate_as: "Principals whose credentials are stored as assets in Automation account {pivot}"
  conditions:
    - id: credential_content_unknown
      description: Which principals' credentials (if any) are stored in credential assets/encrypted variables is not visible from RBAC metadata; the edge is conditional on asset contents.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Do not store user or service principal secrets as Automation credentials/variables; use the account managed identity instead.
  references:
    - https://learn.microsoft.com/en-us/azure/automation/shared-resources/credentials
  notes: Entra users stored in credential assets are modelled by azure-automation-runbook-credential-assets-user; evaluator should render a single conditional aggregate node per account and kind.

