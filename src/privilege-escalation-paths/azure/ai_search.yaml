# Azure AI Search techniques (declarative only).
# Source: hacktricks-cloud az-ai-search-privesc.md (rev 171e422).

- id: azure-ai-search-skillset-write-identity-token
  provider: azure
  service: ai_search
  title: Custom Web API skill sends a Search managed-identity token to the source
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-ai-search-privesc.md#managed-identity-token-theft-with-microsoftsearchsearchservicesskillsetswrite
  source_revision: 171e422
  summary: The source can obtain the privileges of the Search service's managed identity toward a tenant-owned application audience.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Search/searchServices/skillsets/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Search/searchServices/indexes/write
          scope: "{target.host_resource}"
      - - action: Microsoft.Search/searchServices/debugSessions/write
          scope: "{target.host_resource}"
        - action: Microsoft.Search/searchServices/debugSessions/execute/action
          scope: "{target.host_resource}"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Search/searchServices
    scope: inherited_scope
    aggregate_as: "Managed identities of Search service {target.host_resource}"
  conditions:
    - id: tenant_app_audience_only
      description: The token audience must be a tenant-owned application accepted by Search, not ARM/Graph; impact is limited to what that application grants the identity.
    - id: skillset_referenced_by_scheduled_indexer
      description: The replaced skillset must be referenced by an indexer that runs.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict skillsets/write and do not grant Search identities access to internal app registrations unless required.
  references:
    - https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api
  notes: Partial identity gain; evaluator should not propagate the identity's ARM role assignments. indexes/write reaches the same token through an index vectorizer pointing at a source-controlled custom Web API endpoint; debugSessions/write plus execute/action runs a skillset on demand without an indexer schedule.
