# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS EC2 / Auto Scaling / EC2 Instance Connect privilege escalation techniques.
# Source: hacktricks-cloud aws-ec2-privesc/README.md.

- id: aws-ec2-passrole-runinstances
  provider: aws
  service: ec2
  source_kind: [aws_user, aws_role]
  title: Launch an EC2 instance with a passed instance profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#iampassrole-ec2runinstances
  source_revision: 171e422299
  summary: The source can launch an EC2 instance it controls with a passable instance profile and may run code using the attached role.
  requires:
    all_of:
      - action: iam:PassRole
      - action: ec2:RunInstances
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: "Roles trusting ec2.amazonaws.com with an instance profile in {account}"
    outcome: workload_execution
  preconditions:
    - ec2_runinstances_instance_role_effect_reviewed
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService / iam:AssociatedResourceArn conditions may restrict this.
    - id: instance_access
      description: The source needs a way to run code on the instance (user data, an SSH key pair, SSM); user data needs no extra permission.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on EC2 roles with iam:PassedToService and specific role ARNs; require IMDSv2 and monitor RunInstances with instance profiles.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html
  notes: RunInstances authorizes every resource in one launch request, including the image, generated instance, subnet, security group, network interface and storage resources when applicable. A role edge needs the exact accepted launch request, a profile carrying the target role, observed execution of controlled user data and a useful role action unavailable directly to the source. Evaluate PassRole with both iam:PassedToService and iam:AssociatedResourceArn for the launched instance. Creating a new instance profile for a role without one additionally needs iam:CreateInstanceProfile and iam:AddRoleToInstanceProfile.

- id: aws-ec2-passrole-associate-instance-profile
  provider: aws
  service: ec2
  title: Associate or replace the instance profile of an instance the source controls
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#iampassrole-with-ec2associateiaminstanceprofile-and-ec2disassociateiaminstanceprofile-or-ec2replaceiaminstanceprofileassociation
  source_revision: 171e422299
  summary: The source can obtain the privileges of passable roles trusting ec2.amazonaws.com in existing instance profiles by attaching such a profile to an instance it controls.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
    any_of:
      - - action: ec2:AssociateIamInstanceProfile
          resource: "*"
        - action: ec2:DisassociateIamInstanceProfile
          resource: "*"
      - - action: ec2:ReplaceIamInstanceProfileAssociation
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: "Roles trusting ec2.amazonaws.com with an instance profile in {account}"
    outcome: workload_execution
  conditions:
    - id: controls_ec2_instance
      description: The source must already control an EC2 instance; Disassociate is only needed when the instance already has a profile.
    - id: replacement_requires_running_instance
      description: Direct profile replacement requires a running instance; a stopped instance with a profile needs the detach-then-associate branch and permission to start it.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict instance-profile association actions and iam:PassRole on EC2 roles.
  references:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/attach-iam-role.html
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/permission-to-pass-iam-roles.html
  notes: Exact instance control and access to its new role credentials require fresh reviewed evidence.

- id: aws-ec2-requestspotinstances-passrole
  provider: aws
  service: ec2
  source_kind: [aws_user, aws_role]
  title: Request a Spot Instance with a passed instance profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#ec2requestspotinstances-iampassrole
  source_revision: 171e422299
  summary: The source can request a Spot Instance it controls with a passable instance profile and may run code using the attached role.
  requires:
    all_of:
      - action: iam:PassRole
      - action: ec2:RequestSpotInstances
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: "Roles trusting ec2.amazonaws.com with an instance profile in {account}"
    outcome: workload_execution
  preconditions:
    - ec2_spot_request_instance_role_effect_reviewed
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService and iam:AssociatedResourceArn may restrict which role can be passed to the launched instance.
    - id: spot_service_linked_role
      description: The first Spot request in an account also needs iam:CreateServiceLinkedRole for spot.amazonaws.com when AWSServiceRoleForEC2Spot does not exist yet; ec2:CreateFleet / RequestSpotFleet are not a bypass because the fleet authorizes ec2:RunInstances as the caller.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on EC2 roles with iam:PassedToService, and restrict ec2:RequestSpotInstances.
  references:
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonec2.html
  notes: RequestSpotInstances authorizes the selected image, generated Spot request and launch resources, with iam:PassRole on the instance role; ec2:RunInstances is a separate API. A role edge needs one accepted request, a launched member instance with the target profile, executed controlled user data and a useful role action unavailable directly to the source. PassRole is evaluated with the exact instance as iam:AssociatedResourceArn. Caller grants alone leave the route unresolved.

- id: aws-ec2-modifyinstanceattribute-userdata
  provider: aws
  service: ec2
  title: Replace the user data of an existing instance and restart it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#replace-user-data
  source_revision: 171e422299
  summary: The source can obtain the privileges of the instance-profile role of an existing instance by changing its user data and restarting it.
  requires:
    all_of:
      - action: ec2:ModifyInstanceAttribute
        resource: "{target.attached_resource_arn}"
      - action: ec2:StartInstances
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: ec2
      attached_resource_covered_by: ec2:ModifyInstanceAttribute
    scope: same_account
    aggregate_as: "Instance roles of instances covered by ec2:ModifyInstanceAttribute in {account}"
    outcome: workload_execution
  preconditions:
    - ec2_userdata_restart_execution_reviewed
  conditions:
    - id: userdata_execution
      description: The exact instance must be known to execute changed user data on its next start and make its role credentials available to that code. A running instance also needs StopInstances and disabled API stop protection.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict ec2:ModifyInstanceAttribute and stop/start permissions on instances with privileged roles.
  references:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/user-data.html
  notes: No principal edge is emitted from these IAM grants alone. Fresh reviewed evidence must bind changed-user-data execution, instance-profile membership, role credential access and stop protection to the same instance; missing evidence remains unresolved. The security-group replacement variant is excluded.

- id: aws-ec2-launchtemplate-version-asg
  provider: aws
  service: ec2
  title: Publish a new default launch-template version consumed by an Auto Scaling group
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#ec2createlaunchtemplateversion-ec2createlaunchtemplate-ec2modifylaunchtemplate
  source_revision: 171e422299
  summary: The source can place an EC2 instance-profile role in a new launch-template version that an Auto Scaling group may use on its next launch.
  requires:
    all_of:
      - action: ec2:CreateLaunchTemplateVersion
        resource: "{target.consumer_input_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: "Roles trusting ec2.amazonaws.com with an instance profile in {account}"
  conditions:
    - id: asg_uses_unpinned_version
      description: A recorded Auto Scaling group must reference this template with $Latest, or with $Default when the source can also modify that template.
    - id: delayed_launch
      description: A new instance must launch (scale-out, replacement, instance refresh); the source may not control timing.
    - id: slr_passrole
      description: A later Auto Scaling launch uses its service-linked role to pass the selected EC2 instance-profile role; changing a version does not require the source to hold iam:PassRole.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Pin Auto Scaling groups to specific launch-template versions and restrict template version management.
  references:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/permissions-for-launch-templates.html
    - https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-launch-template-permissions.html
  notes: "{target.consumer_input_arn} resolves only to a collected launch template referenced by an Auto Scaling group with available capacity. The evaluator checks CreateLaunchTemplateVersion on that exact ARN and also ModifyLaunchTemplate on the same ARN for $Default. Mixed-instance overrides are joined to their own template. Later launch and user-data execution remain conditional."

- id: aws-ec2-autoscaling-create-update-asg-passrole
  provider: aws
  service: ec2
  title: Launch an Auto Scaling instance with a passed role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#autoscalingcreatelaunchconfiguration--ec2createlaunchtemplate--iampassrole-autoscalingcreateautoscalinggroup--autoscalingupdateautoscalinggroup
  source_revision: 171e422299
  summary: A caller can configure an Auto Scaling group to launch an instance using a passable instance-profile role, then run controlled code under that role when the launch and code execution are observed.
  requires:
    all_of:
      - action: iam:PassRole
    any_of:
      - - action: autoscaling:CreateAutoScalingGroup
      - - action: autoscaling:UpdateAutoScalingGroup
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: "Roles trusting ec2.amazonaws.com with an instance profile in {account}"
    outcome: workload_execution
  preconditions:
    - autoscaling_created_launch_input_role_effect_reviewed
  conditions:
    - id: exact_launch_and_role_effect
      description: Fresh reviewed evidence must join a controlled launch configuration or template, the Auto Scaling group that accepted it, the launched instance and a useful action executed under the exact instance role.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Limit who can pass EC2 instance roles and choose launch inputs for Auto Scaling groups; pin launch-template versions where possible.
  references:
    - https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-launch-template-permissions.html
    - https://docs.aws.amazon.com/autoscaling/ec2/userguide/launch-configurations.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_autoscaling.html
  notes: CreateLaunchConfiguration and CreateLaunchTemplate are checked on the exact created ARN, and CreateAutoScalingGroup or UpdateAutoScalingGroup on the exact group ARN. The template branch also checks every recorded RunInstances authorization resource. The role pass is checked for ec2.amazonaws.com. A witnessed instance, applied profile, executed user data and useful role action are required. AWS no longer permits new launch configurations in accounts created on or after October 1, 2024; an accepted creation witness decides that branch.

- id: aws-ec2-instance-connect-sendsshpublickey
  provider: aws
  service: ec2
  title: Push a temporary SSH key to an instance with EC2 Instance Connect
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#ec2-instance-connectsendsshpublickey
  source_revision: 171e422299
  summary: The source can obtain the privileges of the instance-profile role of an instance it can push an SSH key to and reach over the network.
  requires:
    all_of:
      - action: ec2-instance-connect:SendSSHPublicKey
        resource: "{target.attached_resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: ec2
      attached_resource_covered_by: ec2-instance-connect:SendSSHPublicKey
    scope: same_account
    aggregate_as: "Instance roles of instances covered by ec2-instance-connect:SendSSHPublicKey in {account}"
  preconditions:
    - ec2_instance_connect_same_running_role_host
  conditions:
    - id: network_reachability
      description: The source needs SSH network access (public IP, VPN, or an EC2 Instance Connect Endpoint with ec2-instance-connect:OpenTunnel).
    - id: agent_installed
      description: The instance must run the EC2 Instance Connect agent (Amazon Linux 2+/Ubuntu images include it).
    - id: os_user_condition
      description: The ec2:osuser condition may restrict which OS user can be used.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict ec2-instance-connect:SendSSHPublicKey by instance and ec2:osuser; prefer SSM Session Manager with logging.
  references:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-connect-methods.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_ec2-instance-connect.html
  notes: The permission, running state, Linux platform and enabled applied instance metadata must belong to the same instance carrying the target role. A concrete conditional edge additionally needs fresh reviewed evidence that the pushed key was accepted, an SSH session used it as an IAM-allowed OS user, and that session could use credentials whose role ID matches the target. Without that witness, host access and role-credential use remain unresolved.

- id: aws-ec2-passrole-requestspotfleet
  provider: aws
  service: ec2
  title: Create a Spot Fleet with a passable EC2 instance-profile role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc/README.md#spot-fleet-request
  source_revision: b587e6bd26
  summary: A caller can request a Spot Fleet with a separate fleet role and a passable instance-profile role, then run controlled code under the instance role if a matching instance actually launches.
  requires:
    all_of:
      - action: iam:PassRole
      - action: ec2:RequestSpotFleet
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: EC2 instance-profile roles passable to Spot Fleet in {account}
    outcome: workload_execution
  preconditions:
    - ec2_spot_fleet_instance_role_effect_reviewed
  conditions:
    - id: exact_fleet_launch_role_effect
      description: Fresh reviewed evidence must bind a successful fleet request, both exact passed roles, all launch authorization resources, a member instance using the profile, and a useful action executed under the instance role.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict ec2:RequestSpotFleet and iam:PassRole to approved instance profiles and fleet service roles.
  references:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-fleet-prerequisites.html
  notes: The evaluator checks PassRole on both the fleet role and the instance role with their respective service contexts. It checks RequestSpotFleet and RunInstances on each recorded authorization resource, then requires a witnessed fleet member instance, applied instance profile and useful role action. Missing launch-resource lists, fleet-role identity, capacity or execution evidence remain unresolved.
