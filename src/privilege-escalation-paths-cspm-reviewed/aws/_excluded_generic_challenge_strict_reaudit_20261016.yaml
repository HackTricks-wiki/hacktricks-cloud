- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudformation-privesc/README.md#change-cdktoolkit-trustedaccounts-to-attacker-account-and-deploy-role-trust
  source_revision: b587e6bd26
  technique: Change CDKToolkit TrustedAccounts to attacker account and deploy role trust
  reason: CloudFormation stack update can alter a bootstrap trust list, but the source is not
    proved to control the admitted external-account principal or receive role credentials; the
    generic challenge fact has no typed source-to-target contract.
  prior_id: aws-pa-persist-s01-30
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ecs-privesc/README.md#periodic-ecs-task-through-eventbridge
  source_revision: b587e6bd26
  technique: Schedule attacker-controlled ECS code under a task role
  reason: 'A scheduled ECS target can run with a task role, but the selected task definition
    must contain attacker-controlled code and name the exact task role. The EventBridge invocation
    role must trust EventBridge and allow ecs:RunTask for that task definition and iam:PassRole for
    the task role; the caller must be allowed to attach that invocation role to the target. A
    role-less task definition, such as the source example, supplies no task-role escalation.
    The current generic challenge fact records none of these target-to-role joins or execution
    conditions, so a permission-only path would be a false positive.'
  prior_id: aws-ecs-eventbridge-scheduled-task-role
