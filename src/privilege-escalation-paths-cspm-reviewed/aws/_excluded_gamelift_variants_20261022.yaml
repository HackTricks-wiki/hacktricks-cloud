# GameLift fleet variants not proven by the active new-build EC2 fleet route.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-gamelift/README.md#gameliftcreatefleet--iampassrole--run-code-on-fleet-ec2-as-a-passed-instance-role
  source_revision: 3b6983e5a8
  technique: Create a container fleet with a passed role and controlled container group
  reason: CreateContainerFleet is a separate API using FleetRoleArn and named container group definitions. The active CreateBuild plus CreateFleet route does not authorize it. A role edge needs a group definition whose image and runtime the source controls, a runnable deployment and the exact role's availability inside that container.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-gamelift/README.md#gameliftcreatefleet--iampassrole--run-code-on-fleet-ec2-as-a-passed-instance-role
  source_revision: 3b6983e5a8
  technique: Create an EC2 fleet with a passed role and a pre-existing controlled build or script
  reason: The active new-build route requires CreateBuild. An existing build or script could be usable without that action only if the source controls its executable bytes or startup path and can select it in an authorized CreateFleet request with the exact passed role. Those artifact-control and request joins are not yet proven.
