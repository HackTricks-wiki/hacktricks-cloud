# Browser and gateway roles need an exact caller-controlled action before they become privilege edges.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-bedrock-agentcore-privesc/README.md#bedrock-agentcorecreatecodeinterpreter--createbrowser-iampassrole--sandbox-actions-with-an-execution-role
  source_revision: e350a39af5
  technique: Drive an AgentCore browser with a passed execution role
  reason: CreateBrowser and InvokeBrowser give browser automation, not the arbitrary code action supplied by InvokeCodeInterpreter. A role edge needs a concrete browser operation that lets the source obtain credentials or perform a role-authorized action, plus exact browser and role permission joins.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-bedrock-agentcore-privesc/README.md#bedrock-agentcoreupdateagentruntime--updategateway-iampassrole--change-an-existing-resources-role
  source_revision: e350a39af5
  technique: Change an AgentCore gateway role and invoke a target under it
  reason: UpdateGateway can change the service role, but the role is used only for configured target calls. A privilege edge needs a caller-invokable exact gateway target whose operation can use the newly allowed permission, plus target authorization, trust, PassRole and exact gateway grants.
