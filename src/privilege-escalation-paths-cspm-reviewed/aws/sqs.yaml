# Amazon SQS queue-policy permission gain for an exact same-account IAM user.
# Source: hacktricks-cloud aws-sqs-privesc/README.md (rev fd9bf8863b).

- id: aws-sqs-setqueueattributes-self-receive
  provider: aws
  service: sqs
  title: Grant the caller permission to receive messages from a queue
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sqs-privesc/README.md#sqssetqueueattributes--grant-queue-access-to-a-controlled-iam-user
  source_revision: fd9bf8863b
  summary: A same-account IAM user who can replace one queue policy can name itself and gain ReceiveMessage on that queue.
  source_kind: [aws_user]
  requires:
    all_of:
      - action: sqs:SetQueueAttributes
        resource: "{target.arn}"
  target:
    kind: aws_verified_authority
    selector:
      aws_sqs_policy_self_grant: true
    scope: same_account
    outcome: permission_grant
    grants: ["sqs:ReceiveMessage on the exact reviewed queue"]
    aggregate_as: "SQS ReceiveMessage self-grants in {account}"
  conditions:
    - id: queue_policy_propagation
      description: SQS policy changes can take time to propagate; this route is the newly granted permission, not an observed message read.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict sqs:SetQueueAttributes on sensitive queues and use explicit denies where a caller must never gain message access.
  references:
    - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
    - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/troubleshooting-access-denied.html
  notes: Only an exact collected queue and a same-account IAM user with effective SetQueueAttributes, no prior ReceiveMessage and no surviving identity, boundary or organization deny qualify. For an SSE-KMS queue, the exact key ARN or ID must resolve to a collected regional KMS key and policy, and the user must have effective kms:Decrypt on that key; aliases and unavailable key policies remain unresolved. This grants the queue permission, not an observed message read; messages encrypted under earlier keys may need other Decrypt grants. An existing direct queue-policy Allow means the user already has access unless a queue-policy Deny blocks it; an account-root Allow only delegates to IAM. A replacement queue policy can remove its old Deny, including NotPrincipal Deny. A direct user grant bypasses a boundary's implicit deny, while an explicit boundary Deny still blocks it.
