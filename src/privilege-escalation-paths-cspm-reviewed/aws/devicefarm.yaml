# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS Device Farm privilege escalation techniques.
# Source: hacktricks-cloud aws-device-farm-privesc/README.md (rev 171e422299).

- id: aws-devicefarm-passrole-project-schedulerun
  provider: aws
  service: devicefarm
  title: Run a custom test with a passed execution role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-device-farm-privesc/README.md#devicefarmcreateprojectupdateprojectschedulerun--iampassrole
  source_revision: 171e422299
  summary: The source can create a web test package and custom test specification in an existing Device Farm project, then schedule them on a compatible pool with a passed execution role.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
        request_context:
          iam:PassedToService: devicefarm.amazonaws.com
  target:
    kind: aws_role
    selector:
      trust_allows_service: devicefarm.amazonaws.com
    scope: same_account
    aggregate_as: "Roles runnable through a compatible Device Farm project in {account}"
    outcome: workload_execution
  preconditions:
    - devicefarm_existing_project_new_web_test_role
  conditions:
    - id: exact_project_and_pool
      description: A collected existing project has a device pool with at least one web test compatible device, and the source can create uploads in that project and schedule runs on that project and pool.
    - id: generated_upload_scope
      description: ScheduleRun permission covers every generated package and test-spec upload ARN in the selected project; scoped or conditional grants that cannot be proved remain unresolved.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:PassRole on Device Farm execution roles with iam:PassedToService and specific role ARNs; limit run scheduling to CI.
  references:
    - https://docs.aws.amazon.com/devicefarm/latest/developerguide/custom-test-environments-iam-roles.html
    - https://docs.aws.amazon.com/devicefarm/latest/APIReference/API_GetDevicePoolCompatibility.html
  notes: This route uses an existing project and a run-level executionRoleArn. Creating a new project, editing an existing test specification, and using a project-default role are distinct paths requiring their own joins.
