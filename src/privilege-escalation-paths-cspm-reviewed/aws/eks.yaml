# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS EKS privilege escalation techniques (AWS-API side: access entries, Pod Identity, node groups).
# Source: hacktricks-cloud aws-eks-privesc/README.md (rev 171e422299).
# k8s_cluster_admin targets are the collected EKS clusters of the source's own account (eks_cluster: describe_cluster
# arn + accessConfig.authenticationMode), labelled "EKS cluster <name> (cluster-admin)". The access-entry APIs need
# authenticationMode API or API_AND_CONFIG_MAP (eks_authentication_mode); a cluster whose mode was not collected is an
# unresolved placeholder. With a K8s snapshot of the cluster passed as related_snapshots the entity links to the
# cluster's K8s cluster-admin node. Pod Identity / node-group entries need an existing cluster (eks_cluster_exists).

- id: aws-eks-createaccessentry-associateaccesspolicy
  provider: aws
  service: eks
  title: Create an EKS access entry for the source and associate a cluster-admin access policy
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md#ekscreateaccessentry-eksassociateaccesspolicy--iam-only-path-to-cluster-admin
  source_revision: 6fb9ac51fd
  summary: The source can become Kubernetes cluster-admin of an EKS cluster using only EKS API permissions, by mapping
    a principal it controls into the cluster and associating AmazonEKSClusterAdminPolicy with cluster scope.
  requires:
    all_of:
    - action: eks:CreateAccessEntry
      resource: '{target.scope}'
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
      eks_authentication_mode:
      - API
      - API_AND_CONFIG_MAP
    scope: cluster
    aggregate_as: Cluster-admin of EKS clusters whose access entries the source can create
  preconditions:
  - eks_new_self_access_entry_can_receive_cluster_admin
  conditions:
  - id: authentication_mode_api
    description: The cluster authenticationMode must be API or API_AND_CONFIG_MAP (checked by eks_authentication_mode);
      with CONFIG_MAP only, the access-entry APIs are unavailable (switching mode needs eks:UpdateClusterConfig
      and is one-way).
  - id: source_controls_mapped_principal
    description: The access entry must name an IAM principal the source can authenticate as (normally itself).
  - id: api_endpoint_reachable
    description: The source must reach the Kubernetes API endpoint (public endpoint CIDR allowlist or private VPC
      access).
  - id: associate_policy_resource_scope
    description: eks:AssociateAccessPolicy is authorized on the access-entry ARN; eks:policyArn / eks:accessScope
      condition keys can restrict which access policy and scope may be associated.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Treat eks:CreateAccessEntry and eks:AssociateAccessPolicy as cluster-admin grants; restrict them to
    platform administrators and use the eks:policyArn / eks:accessScope condition keys to forbid AmazonEKSClusterAdminPolicy.
  references:
  - https://docs.aws.amazon.com/eks/latest/userguide/access-entries.html
  - https://docs.aws.amazon.com/eks/latest/userguide/setting-up-access-entries.html
  - https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_AssociateAccessPolicy.html
  - https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazonelastickubernetesservice.html
  notes: The cluster creator's bootstrap admin entry is not required; access entries work on clusters created before
    the feature once the authentication mode allows it. An existing-entry AssociateAccessPolicy path is covered
    separately by aws-eks-associateaccesspolicy-existing-entry. A CONFIG_MAP cluster can enable access entries through
    aws-eks-updateclusterconfig-enable-access-entries.


- id: aws-eks-updateclusterconfig-enable-access-entries
  provider: aws
  service: eks
  title: Switch a CONFIG_MAP EKS cluster to access-entry authentication and grant the source cluster-admin
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md#associate-a-cluster-admin-access-policy-with-an-existing-eks-access-entry-the-source-controls
  source_revision: b587e6bd26
  summary: The source can become Kubernetes cluster-admin of an EKS cluster that only uses the aws-auth ConfigMap by enabling access-entry authentication and then creating an access entry with AmazonEKSClusterAdminPolicy for itself.
  requires:
    all_of:
      - action: eks:UpdateClusterConfig
        resource: "{target.scope}"
        request_context:
          eks:authenticationMode: API_AND_CONFIG_MAP
      - action: eks:CreateAccessEntry
        resource: "{target.scope}"
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
      eks_authentication_mode:
        - CONFIG_MAP
    scope: cluster
    aggregate_as: "Cluster-admin of CONFIG_MAP EKS clusters whose authentication mode the source can change"
    outcome: permission_grant
  preconditions:
    - eks_new_self_access_entry_can_receive_cluster_admin
  conditions:
    - id: eligible_cluster_platform
      description: The cluster must be ACTIVE and its Kubernetes and EKS platform versions must support access entries.
    - id: mode_change_propagates
      description: The authentication mode change to API_AND_CONFIG_MAP is one-way and must complete before access entries can be created.
    - id: associate_policy_condition_keys
      description: eks:policyArn and eks:accessScope condition keys can restrict which access policy and scope may be associated.
    - id: api_endpoint_reachable
      description: The source must reach the Kubernetes API endpoint (public endpoint CIDR allowlist or private VPC access).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict eks:UpdateClusterConfig to platform administrators, migrate clusters to API authentication deliberately and alert on authenticationMode changes.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/setting-up-access-entries.html
    - https://docs.aws.amazon.com/eks/latest/APIReference/API_UpdateClusterConfig.html
  notes: The existing exclusion of eks:UpdateClusterConfig on the privesc page covers only endpoint exposure; this entry models the authentication-mode change that unlocks the access-entry APIs.

- id: aws-eks-associateaccesspolicy-existing-entry
  provider: aws
  service: eks
  title: Give the source's existing EKS access entry cluster administrator access
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md#associate-a-cluster-admin-access-policy-with-an-existing-eks-access-entry-the-source-controls
  source_revision: b587e6bd26
  summary: The source can associate AmazonEKSClusterAdminPolicy at cluster scope with its own existing STANDARD access entry.
  requires:
    all_of:
      - action: eks:AssociateAccessPolicy
        resource: "*"
        request_context:
          eks:policyArn: arn:{source.partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          eks:accessScope: cluster
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
      eks_authentication_mode:
        - API
        - API_AND_CONFIG_MAP
    scope: cluster
    aggregate_as: Cluster-admin of EKS clusters with a controlled access entry
    outcome: permission_grant
  preconditions:
    - eks_existing_self_access_entry_can_receive_cluster_admin
  conditions:
    - id: api_endpoint_reachable
      description: The source must reach the Kubernetes API endpoint to use the granted cluster privileges.
    - id: access_entry_identity_current
      description: An entry for a deleted and recreated IAM principal has a stale internal identity even when its ARN still matches.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict AssociateAccessPolicy on access entries and use eks:policyArn and eks:accessScope conditions to limit administrator grants.
  references:
    - https://docs.aws.amazon.com/eks/latest/userguide/access-policies.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_eks.html
    - https://docs.aws.amazon.com/eks/latest/APIReference/API_AccessEntry.html
  notes: The evaluator joins a recorded STANDARD entry to the source's exact IAM principal, uses its accessEntryArn for authorization, and ignores an entry that already has cluster-wide AmazonEKSClusterAdminPolicy.
