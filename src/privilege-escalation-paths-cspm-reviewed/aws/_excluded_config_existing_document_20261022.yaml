# Existing Automation documents can avoid CreateDocument, but need an exact runnable step.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-config-privesc/README.md#privilege-escalation-through-automatic-remediation
  source_revision: f4d5491c17
  technique: Attach an existing useful Automation document to automatic Config remediation
  reason: An existing Automation document could remove the need for ssm:CreateDocument, but PutRemediationConfigurations and PassRole alone do not prove that the document accepts AutomationAssumeRole, executes an action the passed role permits, and produces a usable gain. The route also needs a non-service-linked rule, a noncompliant resource, automatic mode and the remediation service-linked role. Current inventory does not join these facts.
