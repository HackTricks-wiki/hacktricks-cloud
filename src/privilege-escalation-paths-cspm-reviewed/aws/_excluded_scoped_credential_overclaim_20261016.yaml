# Credential claims without an exact full principal or permission target.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cloudwatch-omni-privesc/README.md#cloudwatchgetspacecredentialsfororganization--obtain-member-account-space-credentials
  technique: aws-cloudwatch-omni-getspacecredentialsfororganization
  reason: The response returns space-scoped credentials but does not name the vended IAM principal. The configured
    dataAccessRoleArn is the operator-role ceiling for space operations, not proof that the caller receives all of
    that role's IAM permissions. A concrete edge needs a successful session identity and exact effective authority.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-datazone-privesc/README.md#getenvironmentcredentials-as-a-custom-environment-role
  technique: aws-datazone-getenvironmentcredentials
  reason: DataZone vends a session explicitly narrower than the associated IAM role (role chaining removed), while
    the entry targets the full role. Project membership is also not collected.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-datazone-privesc/README.md#associateenvironmentrole--iampassrole
  technique: aws-datazone-passrole-associateenvironmentrole
  reason: The DataZone credential session excludes role chaining and project-level authorization is not collected.
    A full passable-role edge is not established.
- source: src/pentesting-cloud/aws-security/aws-post-exploitation/aws-pcs-post-exploitation/README.md#pcsgetcluster-secretsmanagergetsecretvalue--steal-the-slurm-scheduler-authentication-key
  historical_source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-pcs-privesc/README.md#pcsgetcluster-secretsmanagergetsecretvalue--steal-the-slurm-scheduler-authentication-key
  source_revision: 3ad99dc7ac
  technique: aws-pcs-getcluster-slurm-secret-node-roles
  reason: The PCS secret ARN is matched account-wide as pcs!* and target roles are inferred only from instance-profile
    naming. No exact cluster-to-secret-to-queue-to-node-group-to-role join or accepted job/code-execution evidence
    is evaluated.
