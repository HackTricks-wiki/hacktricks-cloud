# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# Amazon GameLift Servers privilege escalation techniques.
# Source: hacktricks-cloud aws-gamelift/README.md (rev 171e422299).

- id: aws-gamelift-passrole-createfleet
  provider: aws
  service: gamelift
  title: Create a GameLift fleet with a passed instance or container-fleet role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-gamelift/README.md#gameliftcreatefleet--iampassrole--run-code-on-fleet-ec2-as-a-passed-instance-role
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any passable role trusting gamelift.amazonaws.com by running a server build or container it controls on a fleet created with that role.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
    any_of:
      - - action: gamelift:CreateFleet
          resource: "*"
      - - action: gamelift:CreateContainerFleet
          resource: "*"
  target:
    kind: aws_role
    selector:
      trust_allows_service: gamelift.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting gamelift.amazonaws.com passable in {account}"
    outcome: workload_execution
  conditions:
    - id: controlled_build
      description: The fleet must run a build, script or container group definition the source controls (an existing one, or gamelift:CreateBuild / CreateScript / CreateContainerGroupDefinition with an upload or image).
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict iam:PassRole on GameLift instance and fleet roles and gamelift:CreateFleet / CreateContainerFleet to build pipelines.
  references:
    - https://docs.aws.amazon.com/gamelift/latest/developerguide/setting-up-role.html
    - https://docs.aws.amazon.com/gamelift/latest/apireference/API_CreateFleet.html
    - https://docs.aws.amazon.com/gamelift/latest/apireference/API_CreateContainerFleet.html
  notes: The InstanceRoleArn (CreateFleet) or FleetRoleArn (CreateContainerFleet) credentials are available to processes on fleet instances or containers. CreateGameServerGroup is excluded separately (its role is used by FleetIQ to manage the Auto Scaling group, not exposed to instance code).
