    separate log store, so the required read action and exact event resource also vary. A
    principal edge needs the actual decoded ZIP, a complete usable credential, its verified
    AWS principal and additional effective authority; no such content is inventoried by the
    CSPM. Do not infer another role from the ability to read a workflow event.'
- source: src/pentesting-cloud/aws-security/aws-services/aws-keyspaces-enum.md#enumerate-and-read-cdc-streams
