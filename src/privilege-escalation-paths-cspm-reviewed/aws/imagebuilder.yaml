# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS EC2 Image Builder privilege escalation techniques.
# Source: hacktricks-cloud aws-ec2-image-builder-privesc/README.md.

- id: aws-imagebuilder-component-version-hijack
  provider: aws
  service: imagebuilder
  title: Publish a newer component version consumed by a wildcard recipe and run the pipeline
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-image-builder-privesc/README.md#imagebuildercreatecomponent--imagebuilderstartimagepipelineexecution
  source_revision: 3a7851fefe
  summary: The source can obtain the privileges of the infrastructure instance-profile role of an Image Builder pipeline whose recipe references an account-owned component by a version wildcard.
  requires:
    all_of: []
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
      via_resource_type: imagebuilder_pipeline
    scope: same_account
    aggregate_as: "Image Builder infrastructure roles of pipelines with unpinned component builds in {account}"
  preconditions:
    - imagebuilder_component_publish_and_pipeline_start
  conditions:
    - id: unpinned_component
      description: The recipe must reference an account-owned component by a wildcard semantic version or an exact semantic version without a build number. A pinned build ARN and AWS-owned components are not affected.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Pin component build versions in recipes and restrict imagebuilder:CreateComponent for consumed component names.
  references: []
  notes: No iam:PassRole is needed. The build role is the instance-profile role of the infrastructure configuration and trusts ec2.amazonaws.com. The evaluator joins a collected recipe component, the pipeline carrying that profile role, CreateComponent permission covering a future matching version or build, and StartImagePipelineExecution on that same pipeline. A policy scoped to one fixed existing build does not establish publication of a newer build. Missing recipe or pipeline facts stay unresolved. Scheduled pipelines may also pick up a new component version later, but this entry needs a source-startable pipeline to establish execution.
