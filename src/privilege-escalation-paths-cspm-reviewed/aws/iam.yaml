- id: aws-iam-modify-assumable-role-policy
  provider: aws
  service: iam
  title: Grant permissions to a role the source can already assume
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 171e422299
  summary: The source can obtain administrator privileges through a role it can assume and whose policies it can change.
  requires:
    any_of:
      - - action: iam:AttachRolePolicy
          resource: "{source.assumable_role_arn}"
          request_context:
            iam:PolicyARN:
              admin_managed_policy: true
      - - action: iam:PutRolePolicy
          resource: "{source.assumable_role_arn}"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_covered_by: iam:AttachRolePolicy
    scope: same_account
    aggregate_as: "Administrator of {account} (via an assumable role)"
  preconditions:
    - assumable_role_allows_account_admin
  conditions:
    - id: same_assumable_role
      description: The role whose policies the source can change must be one it can assume; {source.assumable_role_arn} already restricts the requirement to such roles.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Separate who can edit a role's permissions from who can assume it; apply permissions boundaries on delegated role administration.
  references: []
  notes: "{source.assumable_role_arn} is a role the source can already assume (the trust admits it, and its identity policy allows sts:AssumeRole on the role unless the trust names its ARN in the same account), so no separate sts:AssumeRole requirement is listed. via_assumable_role_covered_by applies to whichever any_of action matched (AttachRolePolicy or PutRolePolicy)."

- id: aws-iam-createrole-attach-assume
  provider: aws
  service: iam
  title: Create a new role trusting the source, grant it admin, and assume it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamattachrolepolicy-stsassumerole--iamcreaterole--iamputuserpolicy--iamputgrouppolicy--iamputrolepolicy
  source_revision: 171e422299
  summary: The source can obtain administrator privileges through a new role it creates, grants permissions to and assumes.
  requires:
    all_of:
      - action: iam:CreateRole
        resource: "*"
        bind: new_role
        request_context:
          iam:PermissionsBoundary:
            absent: true
    any_of:
      - - action: iam:AttachRolePolicy
          resource: "*"
          bind: new_role
          request_context:
            iam:PolicyARN:
              admin_managed_policy: true
      - - action: iam:PutRolePolicy
          resource: "*"
          bind: new_role
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
    scope: same_account
    aggregate_as: "Administrator of {account} (via a newly created role)"
  conditions:
    - id: permissions_boundary_condition
      description: Creating an unbounded administrator role requires CreateRole to allow a request without iam:PermissionsBoundary. A role forced to carry a boundary needs a separate assessment of that boundary's effective permissions.
    - id: resource_path_restriction
      description: If CreateRole/AttachRolePolicy/PutRolePolicy are restricted to a role path or name pattern, the actions must all cover the same role ARN.
    - id: same_account_trust_no_assumerole_needed
      description: The source writes the new role's trust policy naming its own ARN; in the same account that trust alone authorizes sts:AssumeRole, so no identity grant is required (an explicit identity-policy or SCP deny on sts:AssumeRole still blocks it).
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Require iam:PermissionsBoundary on iam:CreateRole for delegated administrators and restrict role attach/put to boundary-carrying roles.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: "The AttachRolePolicy branch tries AdministratorAccess and collected customer-managed policies whose default version clearly grants unrestricted actions and resources. Every action must cover the same newly creatable role ARN, and the source must be able to assume that role after creation."

- id: aws-iam-createrole-satisfy-cross-account-trust
  provider: aws
  service: iam
  title: Create a role accepted by a cross-account trust
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#path-name-and-arn-conditions
  source_revision: b587e6bd26
  summary: The source can create and assume a role whose ARN matches another account's role trust, then grant the new role permission to assume that target.
  requires:
    all_of: []
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector: {}
    scope: any
    aggregate_as: Cross-account roles accepting a new source-account role
    outcome: credentials
  preconditions:
    - iam_new_role_cross_account_trust
  conditions:
    - id: role_creation_and_assumption
      description: The source must create one unused role ARN matching the target trust, give that role sts:AssumeRole on the target, and assume the new role.
    - id: trust_uses_principal_arn
      description: The target must delegate to the source account and match the future role through aws:PrincipalArn; a directly named role Principal is tied to an immutable role ID.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Scope cross-account trust to established role identities and tightly restrict who can create roles or write their policies in trusted paths.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_principal.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
  notes: The evaluator joins a collected target trust with one unoccupied role ARN in the source account, exact CreateRole and PutRolePolicy grants on that ARN, a source-to-new-role assumption path, and source-account SCP permission for the new role to assume the target. A direct role ARN in Principal, incomplete role inventory, uncertain trust conditions, or a required permissions boundary does not establish a conditional edge. The role must still be created and assumed.

- id: aws-iam-addusertogroup
  provider: aws
  service: iam
  title: Add the source user to an IAM group
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamaddusertogroup
  source_revision: 171e422299
  summary: The source IAM user can obtain the privileges of IAM groups it can add itself to.
  requires:
    all_of:
      - action: iam:AddUserToGroup
        resource: "{target.arn}"
  target:
    kind: aws_group
    selector:
      resource_permission_covers_target: iam:AddUserToGroup
      source_kind: aws_user
    scope: same_account
    aggregate_as: "IAM groups covered by iam:AddUserToGroup in {account}"
  preconditions:
    - group_adds_policy_to_source
  conditions: []
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:AddUserToGroup to administrators or to specific low-privilege groups.
  references: []
  notes: The Resource of iam:AddUserToGroup is the group ARN. Only IAM users can be group members. The evaluator confirms a new effective self-policy edit, administrator policy attachment, or assumption of a specific trusted role; other policy gains remain unresolved until their action and resource are joined to an outcome.

- id: aws-iam-putuserpermissionsboundary-self-admin
  provider: aws
  service: iam
  title: Widen the source user's permissions boundary
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputuserpermissionsboundary
  source_revision: 171e422299
  summary: The source IAM user already has an administrator identity policy limited by its current boundary and can remove that boundary or replace it with AdministratorAccess.
  requires:
    any_of:
      - - action: iam:DeleteUserPermissionsBoundary
          resource: "{source.arn}"
      - - action: iam:PutUserPermissionsBoundary
          resource: "{source.arn}"
          request_context:
            iam:PermissionsBoundary: "arn:{source.partition}:iam::aws:policy/AdministratorAccess"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_user
    scope: same_account
    aggregate_as: "Administrator of {account} (self-escalation)"
  preconditions:
    - iam_user_boundary_admin_gain
  conditions:
    - id: existing_identity_grant
      description: An existing identity policy must already grant unrestricted administrator actions; changing a boundary does not create a new identity grant.
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Do not let a bounded user remove or replace its own boundary; constrain any boundary updates to approved policy ARNs.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_PutUserPermissionsBoundary.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  notes: The evaluator compares current and post-change effective administrator authority, checks the exact source user, and tests a Put request with the AdministratorAccess boundary ARN. Existing IAM and SCP Deny statements still apply.

- id: aws-iam-putrolepermissionsboundary-self-admin
  provider: aws
  service: iam
  title: Widen the source role's permissions boundary
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 171e422299
  summary: The source role already has an administrator identity policy limited by its current boundary and can remove or widen that boundary.
  requires:
    any_of:
      - - action: iam:DeleteRolePermissionsBoundary
          resource: "{source.arn}"
      - - action: iam:PutRolePermissionsBoundary
          resource: "{source.arn}"
          request_context:
            iam:PermissionsBoundary: "arn:{source.partition}:iam::aws:policy/AdministratorAccess"
  target:
    kind: aws_account_admin
    selector:
      same_as_source: true
      source_kind: aws_role
    scope: same_account
    aggregate_as: "Administrator of {account} (after a fresh role session)"
  preconditions: [iam_role_boundary_admin_gain]
  conditions:
    - id: fresh_session
      description: The changed boundary applies to a new role session, so the source must obtain another session of this role.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Keep role boundary changes separate from the role's own permissions and restrict replacement policies.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_update-role-permissions.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_iam-condition-keys.html
  notes: A current role session does not gain the new boundary. The route remains conditional until another session of this role is obtained.

- id: aws-iam-putrolepermissionsboundary-assumable-admin
  provider: aws
  service: iam
  title: Widen the boundary of a role the source can assume
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 6fb9ac51fd
  summary: An existing assumable role has an administrator identity policy limited by its current boundary, and the source can remove or widen that boundary before assuming it.
  requires:
    any_of:
      - - action: iam:DeleteRolePermissionsBoundary
          resource: "{source.assumable_role_arn}"
      - - action: iam:PutRolePermissionsBoundary
          resource: "{source.assumable_role_arn}"
          request_context:
            iam:PermissionsBoundary: "arn:{source.partition}:iam::aws:policy/AdministratorAccess"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_covered_by: iam:PutRolePermissionsBoundary
    scope: same_account
    aggregate_as: "Administrator of {account} (via an assumable role)"
  preconditions: [iam_role_boundary_admin_gain]
  conditions: []
  blockers: []
  confidence: derived
  severity: critical
  mitigation: Separate role boundary administration from role assumption and restrict replacement policies.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_update-role-permissions.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_iam-condition-keys.html
  notes: The same assumable role must satisfy trust, mutation permission, existing identity grant and restrictive old boundary; the new assumption obtains a fresh session.

- id: aws-iam-updateassumerolepolicy
  provider: aws
  service: iam
  title: Rewrite a role's trust policy to allow the source
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateassumerolepolicy
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust policy it can rewrite.
  requires:
    all_of:
      - action: iam:UpdateAssumeRolePolicy
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      resource_permission_covers_target: iam:UpdateAssumeRolePolicy
    scope: same_account
    aggregate_as: "IAM roles covered by iam:UpdateAssumeRolePolicy in {account}"
  preconditions:
    - role_trust_rewrite_assumable
  conditions:
    - id: assumerole_grant
      description: If the rewritten trust names the source principal ARN (same account) no identity-policy sts:AssumeRole is needed; if it names only the account root, sts:AssumeRole on the role is also required.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateAssumeRolePolicy to administrators; monitor trust-policy changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
  notes: Service-linked roles cannot have their trust policy edited and must be excluded from the target set.

- id: aws-iam-updatesamlprovider
  provider: aws
  service: iam
  title: Replace the metadata of a SAML provider trusted by roles
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdatesamlprovider-iamlistsamlproviders-iamgetsamlprovider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting a SAML provider whose metadata it can replace.
  requires:
    all_of:
      - action: iam:UpdateSAMLProvider
        resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_saml_provider_covered_by: iam:UpdateSAMLProvider
    scope: same_account
    aggregate_as: "Roles trusting a SAML provider covered by iam:UpdateSAMLProvider in {account}"
  conditions:
    - id: trust_conditions_on_saml_attributes
      description: Trust conditions on SAML attributes (e.g. saml:aud, saml:sub) must be satisfiable; a forged assertion normally can satisfy them.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:UpdateSAMLProvider/CreateSAMLProvider to administrators; alert on SAML provider changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateSAMLProvider.html
  notes: "Requires a new placeholder {target.saml_provider_arn}: the SAML provider ARN named in the target role's trust policy. sts:AssumeRoleWithSAML needs no identity permissions."

- id: aws-iam-recreate-samlprovider
  provider: aws
  service: iam
  title: Replace a trusted SAML provider with an attacker-controlled one of the same name
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles trusting a SAML provider by deleting it and registering a provider with the same name and its own signing metadata.
  requires:
    all_of:
      - action: iam:DeleteSAMLProvider
        resource: "{target.saml_provider_arn}"
      - action: iam:CreateSAMLProvider
        resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_saml_provider_covered_by: iam:DeleteSAMLProvider
    scope: same_account
    aggregate_as: "Roles trusting a SAML provider the source can recreate in {account}"
  conditions:
    - id: trust_conditions_on_saml_attributes
      description: Trust conditions on SAML attributes (saml:aud, saml:sub, saml:iss) must be satisfiable by an assertion the source signs; normally they are.
    - id: disruption
      description: Deleting the provider breaks legitimate federation until it is recreated, which is noisy.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict iam:CreateSAMLProvider / DeleteSAMLProvider / UpdateSAMLProvider to administrators and alert on identity-provider changes.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateSAMLProvider.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_saml.html
  notes: Registering a brand-new provider only escalates combined with a role that trusts it, which iam:CreateRole / iam:UpdateAssumeRolePolicy already grant directly (aws-iam-createrole-attach-assume, aws-iam-updateassumerolepolicy). The OIDC audience variant is aws-iam-oidcprovider-add-client-id and planting a provider that a trust names but that no longer exists is aws-iam-createsamlprovider-orphaned-trust / aws-iam-createoidcprovider-orphaned-trust.

- id: aws-iam-createsamlprovider-orphaned-trust
  provider: aws
  service: iam
  title: Register a SAML provider that a role trusts but that no longer exists
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreateopenidconnectprovider--iamcreatesamlprovider--bring-your-own-identity-provider
  source_revision: 171e422299
  summary: The source can obtain the privileges of roles whose trust names a SAML provider ARN of the account that does not exist, by creating that provider with its own signing metadata.
  requires:
    all_of:
      - action: iam:CreateSAMLProvider
        resource: "{target.saml_provider_arn}"
  target:
    kind: aws_role
    selector:
      trust_federated_provider_missing: saml
    scope: same_account
    aggregate_as: "Roles trusting a missing SAML provider in {account}"
  conditions:
    - id: trust_conditions_on_saml_attributes
      description: Trust conditions on SAML attributes (saml:aud, saml:sub, saml:iss) must be satisfiable by an assertion the source signs; normally they are.
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Remove trust statements naming deleted identity providers and restrict iam:CreateSAMLProvider to administrators.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateSAMLProvider.html
  notes: Needs the account's SAML provider inventory (iam:ListSAMLProviders); without it the targets are unresolved placeholders.

- id: aws-iam-enable-attacker-mfa-device-other-user
  provider: aws
  service: iam
  title: Enrol an attacker-controlled virtual MFA device on another user and mint its credentials
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreatevirtualmfadevice-iamenablemfadevice-and-the-target-users-access-keys
  source_revision: 6fb9ac51fd
  summary: The source can obtain MFA-authenticated sessions of IAM users on which it can enable a virtual MFA device it created and create access keys or a console password, including users whose permissions are gated on MFA or whose console sign-in is protected by MFA.
  requires:
    all_of:
      - action: iam:CreateVirtualMFADevice
        resource: "arn:{source.partition}:iam::{target.account}:mfa/*"
      - action: iam:EnableMFADevice
        resource: "{target.arn}"
    any_of:
      - - action: iam:CreateAccessKey
          resource: "{target.arn}"
      - - action: iam:CreateLoginProfile
          resource: "{target.arn}"
      - - action: iam:UpdateLoginProfile
          resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:EnableMFADevice
    scope: same_account
    aggregate_as: IAM users on which the source can enrol its own MFA device and mint credentials in {account}
    outcome: credentials
  preconditions:
    - mfa_enrollment_credential_ready
  conditions:
    - id: mfa_device_limit
      description: An IAM user can hold at most eight MFA devices; a user already at the limit also needs iam:DeactivateMFADevice on the target.
    - id: credential_state
      description: CreateAccessKey needs fewer than two existing keys (or iam:DeleteAccessKey plus a known existing key ID); CreateLoginProfile needs the user to have no console password; UpdateLoginProfile needs an existing one.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:EnableMFADevice and iam:CreateVirtualMFADevice to self-service on the caller's own user (aws:username), and alert on a second MFA enrolment for a user that already has one.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_EnableMFADevice.html
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateVirtualMFADevice.html
    - https://docs.aws.amazon.com/STS/latest/APIReference/API_GetSessionToken.html
  notes: Complements aws-iam-createaccesskey-other-user / aws-iam-createloginprofile-other-user / aws-iam-updateloginprofile-other-user by removing their MFA caveats (aws:MultiFactorAuthPresent-gated policies and MFA-protected console sign-in). GetSessionToken needs no IAM permission. The page notes the technique needs the target's access keys; the any_of supplies the credential-creation half that makes it reachable from configuration alone.

- id: aws-iam-deactivate-mfa-loginprofile-other-user
  provider: aws
  service: iam
  title: Remove another user's MFA device and set its console password
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamuploadsshpublickey--iamdeactivatemfadevice
  source_revision: 6fb9ac51fd
  summary: The source can obtain console access as MFA-protected IAM users by deactivating their MFA device and creating or resetting their console password.
  requires:
    all_of:
      - action: iam:DeactivateMFADevice
        resource: "{target.arn}"
    any_of:
      - - action: iam:CreateLoginProfile
          resource: "{target.arn}"
      - - action: iam:UpdateLoginProfile
          resource: "{target.arn}"
  target:
    kind: aws_user
    selector:
      resource_permission_covers_target: iam:DeactivateMFADevice
    scope: same_account
    aggregate_as: IAM users whose MFA the source can remove and whose password it can set in {account}
    outcome: credentials
  preconditions:
    - mfa_removal_password_ready
  conditions:
    - id: all_devices_removed
      description: Every MFA device of the target must be deactivated (one DeactivateMFADevice per device serial) before password-only sign-in works.
    - id: login_profile_state
      description: CreateLoginProfile needs the user to have no console password; UpdateLoginProfile needs an existing one.
    - id: mfa_gated_permissions_lost
      description: Permissions conditioned on aws:MultiFactorAuthPresent are not usable from the resulting password-only session.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:DeactivateMFADevice and login-profile management on other users to break-glass administrators and alert on DeactivateMFADevice.
  references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeactivateMFADevice.html
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateLoginProfile.html
  notes: Lifts the target_mfa condition of aws-iam-createloginprofile-other-user / aws-iam-updateloginprofile-other-user. DeactivateMFADevice alone (password unknown) stays out of scope.

- id: aws-iam-createpolicyversion-assumable-role
  provider: aws
  service: iam
  title: Rewrite a managed policy attached to an assumable role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamcreatepolicyversion
  source_revision: 8d6a341c8a
  summary: A new default version of a customer-managed policy can grant administration to a role the source can assume.
  requires:
    all_of:
      - action: iam:CreatePolicyVersion
        resource: "{source.assumable_role_attached_policy_arn}"
  target:
    kind: aws_account_admin
    selector:
      via_assumable_role_attached_policy_covered_by: iam:CreatePolicyVersion
    scope: same_account
    outcome: scope_control
  conditions:
    - id: policy_version_capacity
      description: A policy with five versions requires permission to delete a nondefault version before creation.
  blockers: [scp_or_boundary_deny]
  confidence: conditional
  severity: critical
  mitigation: Separate policy-version editing from role assumption and constrain the role with a boundary.

- id: aws-iam-createuser-policy-accesskey
  provider: aws
  service: iam
  title: Create a privileged IAM user and obtain its access key
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#common-iam-persistence
  source_revision: b587e6bd26
  summary: The source can create a new IAM user, grant it administrator permissions, and obtain credentials independent of the source identity.
  requires:
    all_of:
    - action: iam:CreateUser
      resource: arn:{source.partition}:iam::{source.account}:user/*
      bind: new_user
    - action: iam:CreateAccessKey
      resource: arn:{source.partition}:iam::{source.account}:user/*
      bind: new_user
    any_of:
    - - action: iam:PutUserPolicy
        resource: arn:{source.partition}:iam::{source.account}:user/*
        bind: new_user
    - - action: iam:AttachUserPolicy
        resource: arn:{source.partition}:iam::{source.account}:user/*
        bind: new_user
        request_context:
          iam:PolicyARN:
            admin_managed_policy: true
  target:
    kind: aws_account_admin
    selector:
      any_principal_in_scope: true
    scope: same_account
    outcome: scope_control
    aggregate_as: Administrator of {account} through a newly created IAM user
  conditions:
  - id: new_user_policy
    description: The caller can choose an administrator-equivalent inline policy or attach an administrator-equivalent managed policy to the same new user, and retains its access key.
  - id: effective_permissions
    description: SCPs, permissions boundaries, session conditions and policy attachment restrictions must permit the resulting administrator actions.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Separate user creation from policy grants and credential issuance; restrict each action to approved identity administration.
  references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateUser.html
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateAccessKey.html
  notes: The same new user must be covered by every action; managed-policy attachment additionally requires a policy ARN that actually grants the desired permissions.
