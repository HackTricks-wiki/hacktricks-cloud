- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputuserpermissionsboundary
  source_revision: 171e422299
  technique: Replace or remove the permissions boundary of the source user
  reason: The old broad claim is replaced by active aws-iam-putuserpermissionsboundary-self-admin.
