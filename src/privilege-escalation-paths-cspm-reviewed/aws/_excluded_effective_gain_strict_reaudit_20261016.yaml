- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 171e422299
  technique: Replace or remove the permissions boundary of the source role
  reason: Replaced by active aws-iam-putrolepermissionsboundary-self-admin, which checks the
    exact mutation and existing capped administrator grant and keeps the result conditional
    until a fresh session of the same role can be obtained.
  prior_id: aws-iam-putrolepermissionsboundary-self
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 171e422299
  technique: Move another user into an IAM path where the source's credential permissions already
    apply
  reason: No exact new user ARN/path is selected and authorized for both UpdateUser and credential
    creation; the evaluator only checks an unrelated wildcard path.
  prior_id: aws-iam-updateuser-path-move
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 171e422299
  technique: Move a group into an IAM path where the source can add members
  reason: No exact new group ARN/path is selected and authorized for both UpdateGroup and AddUserToGroup;
    the evaluator only checks some group path.
  prior_id: aws-iam-updategroup-path-move
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 6fb9ac51fd
  technique: Move the source user into an IAM path where it can edit user policies
  reason: No exact post-move source ARN is proven to satisfy both UpdateUser and self policy-edit
    authorization; the evaluator checks any user path.
  prior_id: aws-iam-updateuser-path-move-self-policy
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateuser--iamupdategroup--moving-the-target-into-a-path-you-already-control
  source_revision: 6fb9ac51fd
  technique: Move one of the source's groups into an IAM path where it can edit group policies
  reason: No exact post-move group ARN is proven to satisfy both UpdateGroup and policy-edit authorization;
    the evaluator checks any group path.
  prior_id: aws-iam-updategroup-path-move-self-policy
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamputrolepermissionsboundary
  source_revision: 6fb9ac51fd
  technique: Replace or remove the permissions boundary of a role the source can assume
  reason: Replaced by active aws-iam-putrolepermissionsboundary-assumable-admin, which joins
    the exact assumable role, restrictive old boundary, existing administrator identity
    grant, mutation permission, requested replacement boundary, and fresh AssumeRole path.
  prior_id: aws-iam-rolepermissionsboundary-assumable-role
