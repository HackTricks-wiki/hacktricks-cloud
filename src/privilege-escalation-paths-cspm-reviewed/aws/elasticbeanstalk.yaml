# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS Elastic Beanstalk privilege escalation techniques.
# Source: hacktricks-cloud aws-elastic-beanstalk-privesc/README.md (rev a53b46392c).
# Uses {target.resource_arn}, {target.artifact_arn}, via_resource_type and via_artifact_type (see header of lambda.yaml).
# Environment role execution requires a bound application version, environment,
# instance profile and actual code execution; IAM grants alone cannot prove it.

- id: aws-elasticbeanstalk-passrole-create-environment
  provider: aws
  service: elasticbeanstalk
  source_kind: [aws_user, aws_role]
  title: Create a Beanstalk application and environment with a passed instance profile
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-elastic-beanstalk-privesc/README.md#elasticbeanstalkcreateapplication-elasticbeanstalkcreateenvironment-elasticbeanstalkcreateapplicationversion-elasticbeanstalkupdateenvironment-iampassrole-and-more
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any passable EC2-trusting role with an instance profile, used as the instance profile of a new Beanstalk environment or of an existing one it updates.
  requires:
    any_of:
      - - action: elasticbeanstalk:CreateEnvironment
      - - action: elasticbeanstalk:UpdateEnvironment
  target:
    kind: aws_role
    selector:
      trust_allows_service: ec2.amazonaws.com
      has_instance_profile: true
    scope: same_account
    aggregate_as: EC2 instance-profile roles passable in {account}
    outcome: workload_execution
  preconditions:
  - elasticbeanstalk_environment_role_effect_reviewed
  conditions:
  - id: exact_environment_role_effect
    description: Fresh reviewed evidence must bind the exact application version, environment, instance profile, launched instance and useful role action performed by controlled code.
  blockers:
  - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on instance-profile roles and grant Beanstalk environment-creation rights only to deployment principals.
  references:
  - https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AdministratorAccess-AWSElasticBeanstalk.html
  notes: CreateEnvironment and UpdateEnvironment authorize the exact environment; CreateApplicationVersion authorizes the application and version. A source-controlled S3 bundle must deploy to the same environment, and a launched instance must execute it with the passed role. The service role and any required underlying resource permissions must actually support the operation; an accepted deployment witness establishes this. The PassRole service and associated resource context must be recorded and evaluated.
