# AWS privilege escalation catalog: include only a known principal gaining another
# exact principal or new effective permissions through specified actions. A secret,
# token, API key, or password read is an edge only after evidence proves its exact
# credential subject, usability, and additional authority. Generic data disclosure,
# application effects, and unknown targets are not privilege escalation paths.

# AWS Glue privilege escalation techniques.
# Source: hacktricks-cloud aws-glue-privesc/README.md (rev a53b46392c; re-pointed to rev 171e422299).
# Uses {target.resource_arn}, {target.artifact_arn}, via_resource_type and via_artifact_type (see header of lambda.yaml).

- id: aws-glue-passrole-createdevendpoint
  provider: aws
  service: glue
  title: Create a Glue development endpoint with a passed role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-a-legacy-development-endpoint-with-a-privileged-role
  source_revision: 171e422299
  summary: The source can create a public Glue development endpoint with an SSH key it controls, read its address and use a passable execution role.
  requires:
    all_of:
      - action: glue:CreateDevEndpoint
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      trust_allows_service: glue.amazonaws.com
    scope: same_account
    aggregate_as: "Roles trusting glue.amazonaws.com passable in {account}"
    outcome: workload_execution
  preconditions:
    - glue_new_public_dev_endpoint_role
  conditions:
    - id: dev_endpoint_availability
      description: A complete Glue endpoint read must show that the chosen Region and account still support the legacy endpoint API, and a new endpoint name is available.
    - id: public_ssh_path
      description: The source can create a non-VPC endpoint with its SSH public key, and GetDevEndpoint on the new endpoint or GetDevEndpoints on the account lets it read the public address after provisioning.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Glue roles with iam:PassedToService=glue.amazonaws.com and deny glue:CreateDevEndpoint.
  references:
    - https://docs.aws.amazon.com/glue/latest/dg/development.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_CreateDevEndpoint.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_GetDevEndpoints.html
  notes: The evaluator checks CreateDevEndpoint on *, one unused endpoint name, a matching endpoint read permission and exact iam:PassRole. It excludes recorded disabled or unsupported Region/account states; provisioning, quotas and SSH connectivity remain conditional.

- id: aws-glue-updatedevendpoint
  provider: aws
  service: glue
  title: Add an SSH key to an existing Glue development endpoint
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#replace-the-ssh-key-on-a-legacy-development-endpoint
  source_revision: 171e422299
  summary: The source may use the role of an existing Glue development endpoint after adding an SSH key it controls.
  requires:
    all_of:
      - action: glue:UpdateDevEndpoint
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue_dev_endpoint
    scope: same_account
    aggregate_as: "Execution roles of accessible Glue development endpoints in {account}"
    outcome: workload_execution
  preconditions:
    - glue_existing_dev_endpoint_ssh_access
  conditions:
    - id: ssh_reachability
      description: The recorded public address may still be blocked by network controls outside the IAM policy model.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict glue:UpdateDevEndpoint to endpoint administrators and keep development endpoint roles least-privileged.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_UpdateDevEndpoint.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_DevEndpoint.html
    - https://docs.aws.amazon.com/glue/latest/dg/glue-specifying-resource-arns.html
  notes: The endpoint must be READY, have a public address and a free managed SSH-key slot. Private endpoints and legacy single-key configurations need separate reachability or key-change evidence.

- id: aws-glue-startjobrun-override-script
  provider: aws
  service: glue
  title: Run an existing Glue job overriding its script or dependency arguments
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-or-modify-and-run-a-glue-job
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of the execution role of existing Glue jobs it can start directly or through a trigger it creates with overriding arguments.
  requires:
    any_of:
      - - action: glue:StartJobRun
          resource: "{target.resource_arn}"
      - - action: glue:CreateTrigger
          resource: "arn:{source.partition}:glue:*:{target.account}:trigger/*"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_resource_type: glue_job
    scope: same_account
    aggregate_as: Execution roles of Glue jobs startable in {account}
    outcome: workload_execution
  preconditions:
    - glue_job_override_arguments_available
  conditions:
    - id: job_role_reads_attacker_object
      description: The job role must be able to read an S3 location whose content the source controls (its own public/cross-account bucket or a writable bucket the role can read).
    - id: runtime_packaging
      description: Dependency override format depends on job type/runtime.
    - id: trigger_fires
      description: The CreateTrigger variant needs a scheduled or conditional trigger created as started, or glue:StartTrigger for an on-demand trigger; trigger actions carry the overriding job arguments.
  blockers:
    - glue_nonoverridable_arguments
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Pin script and executable dependency arguments, including --python-virtual-env, in NonOverridableArguments and restrict glue:StartJobRun and glue:CreateTrigger to orchestrators.
  references:
    - https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-glue-arguments.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_CreateTrigger.html
  notes: The evaluator requires an unpinned --scriptLocation, StartJobRun on the exact job or a creatable scheduled trigger, and one S3 script object the source can PutObject and the target role can GetObject. A script outside recorded job definitions can also prove the route through fresh reviewed evidence of a matching job run, script read and execution, and a useful action under the exact role. Dependency override formats without such evidence remain unresolved. Creating a trigger for an existing job does not itself require iam:PassRole.


- id: aws-glue-overwrite-existing-job-script
  provider: aws
  service: glue
  title: Replace the script read by an existing Glue job
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#replace-the-script-of-an-existing-glue-job
  source_revision: f6c5b04636
  summary: The source may run its code under an existing Glue job role by replacing the exact S3 script object used by that job and causing the job to run.
  requires:
    all_of:
      - action: s3:PutObject
  source_kind: [aws_user, aws_role]
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_resource_type: glue_job
    scope: same_account
    aggregate_as: Execution roles of Glue jobs whose exact script object is writable and runnable in {account}
    outcome: workload_execution
  preconditions:
    - glue_existing_job_script_object_writable_and_runnable
  conditions:
    - id: object_replacement_and_run
      description: The exact S3 script object must accept the replacement and the job must subsequently load it. A non-overridable --scriptLocation or scheduled trigger action that redirects the script leaves the route unresolved.
    - id: scheduled_run
      description: The scheduled-trigger variant requires the recorded active schedule to fire after the object replacement.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Limit write access to Glue job script objects to trusted deployment identities and restrict who can start jobs that use privileged roles.
  references:
    - https://docs.aws.amazon.com/glue/latest/dg/aws-glue-api-jobs-job.html
    - https://docs.aws.amazon.com/glue/latest/dg/edit-nodes-script.html
  notes: The evaluator joins Command.ScriptLocation, the same job's role, exact s3:PutObject and role s3:GetObject permissions, and StartJobRun or an active scheduled trigger. A direct StartJobRun can explicitly select the recorded script URI only when --scriptLocation is not non-overridable; a scheduled run also needs collected job defaults and trigger action arguments without a script redirect. It never infers a role edge from a generic writable bucket or a different job.

- id: aws-glue-passrole-createjob-or-updatejob-run
  provider: aws
  service: glue
  title: Create or update a Glue job with a passed role and run it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-or-modify-and-run-a-glue-job
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting glue.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: glue.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting glue.amazonaws.com passable in {account}"
    outcome: workload_execution
  preconditions:
    - glue_job_role_and_execution_bind
  conditions:
    - id: script_location_readable
      description: The passed role must be able to read the script location the source supplies.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
    - id: updatejob_existing_job
      description: The UpdateJob variants need an existing job within the UpdateJob Resource.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Glue roles with iam:PassedToService, and restrict job creation/update and trigger creation to the deployment pipeline.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_CreateJob.html
  notes: The machine precondition checks a creatable unused job or an existing updateable job and StartJobRun on that same job, or a creatable trigger in its Region. It binds exact Glue PassRole and an S3 script object the source can PutObject and the passed role can GetObject. A script outside recorded job definitions can also prove the route through fresh reviewed evidence of the accepted job change, matching run, script execution and useful action under the exact role.

- id: aws-glue-updatejob-existing-role
  provider: aws
  service: glue
  title: Replace an existing Glue job definition that keeps its attached role
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-or-modify-and-run-a-glue-job
  source_revision: 171e422299
  summary: The source can obtain the privileges of the execution role of existing Glue jobs it can update.
  requires:
    all_of:
      - action: glue:UpdateJob
        resource: "{target.resource_arn}"
      - action: iam:PassRole
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue
      via_resource_type: glue_job
    scope: same_account
    aggregate_as: "Execution roles of Glue jobs updatable in {account}"
    outcome: workload_execution
  preconditions:
    - glue_existing_job_has_runnable_trigger
  conditions:
    - id: job_runs_later
      description: An active scheduled trigger or a source-startable on-demand trigger is linked to the exact job; the job runs only when that trigger fires.
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: high
  mitigation: Restrict glue:UpdateJob to the deployment pipeline on specific job ARNs.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_UpdateJob.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_JobUpdate.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsglue.html
  notes: JobUpdate requires Role and completely overwrites the prior definition, and the Service Authorization Reference lists iam:PassRole as a dependent action of glue:UpdateJob, so PassRole on the job's role is required. The evaluator joins a runnable trigger and an S3 script object the source can PutObject and the attached role can GetObject. A script outside recorded job definitions can also prove the route through fresh reviewed evidence of the accepted update, trigger firing, matching run, script execution and useful action under the exact role. Direct StartJobRun is covered by aws-glue-passrole-createjob-or-updatejob-run.

- id: aws-glue-passrole-createsession
  provider: aws
  service: glue
  title: Create a Glue interactive session with a passed role and run statements in it
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#create-an-interactive-session-with-a-privileged-role
  source_revision: 171e422299
  summary: The source can obtain the privileges of any passable role trusting glue.amazonaws.com.
  requires:
    all_of:
      - action: iam:PassRole
        resource: "{target.arn}"
  target:
    kind: aws_role
    selector:
      trust_allows_service: glue.amazonaws.com
      resource_permission_covers_target: iam:PassRole
    scope: same_account
    aggregate_as: "Roles trusting glue.amazonaws.com passable in {account}"
    outcome: workload_execution
  preconditions:
    - glue_new_session_with_statement
  conditions:
    - id: passrole_condition_key
      description: iam:PassedToService conditions may restrict which roles can be passed.
    - id: statement_output
      description: Reading statement output needs glue:GetStatement; code still runs without it.
  blockers:
    - scp_or_boundary_deny
  confidence: conditional
  severity: critical
  mitigation: Restrict iam:PassRole on Glue roles with iam:PassedToService=glue.amazonaws.com, scope glue:CreateSession and glue:RunStatement to owner-tagged sessions, and keep session roles least-privileged.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_CreateSession.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_RunStatement.html
    - https://docs.aws.amazon.com/glue/latest/dg/glue-is-security.html
    - https://docs.aws.amazon.com/service-authorization/latest/reference/list_awsglue.html
  notes: Distinct from aws-glue-runstatement-interactive-session (existing session, no PassRole). CreateSession and RunStatement must cover the same unused session ID in one Region; the session may need time to become ready before code runs.

- id: aws-glue-runstatement-interactive-session
  provider: aws
  service: glue
  title: Run code in an existing Glue interactive session
  source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#execute-code-in-an-existing-interactive-session
  source_revision: 171e422299
  summary: The source can run code under the role attached to a ready Glue interactive session it can use.
  requires:
    all_of:
      - action: glue:RunStatement
        resource: "{target.resource_arn}"
  target:
    kind: aws_role
    selector:
      attached_to_service: glue_session
    scope: same_account
    aggregate_as: "Execution roles of runnable Glue sessions in {account}"
    outcome: workload_execution
  preconditions:
    - glue_existing_session_ready_for_statement
  conditions: []
  blockers:
    - scp_or_boundary_deny
  confidence: derived
  severity: critical
  mitigation: Restrict glue:RunStatement to sessions owned by the caller and keep their execution roles least-privileged.
  references:
    - https://docs.aws.amazon.com/glue/latest/webapi/API_RunStatement.html
    - https://docs.aws.amazon.com/glue/latest/webapi/API_Session.html
  notes: The target role comes from the recorded session rather than a generic Glue service trust. The session must be READY and RunStatement must cover that exact session ARN.
