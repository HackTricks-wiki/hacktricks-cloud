# EMR Serverless custom-image substitution needs an exact future workload and role.
- source: src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-emr-serverless-privesc/README.md#emr-serverlessupdateapplication--replace-a-custom-image-for-future-workloads
  source_revision: 45ec8dc775
  technique: Replace an EMR Serverless application's custom image for future workloads
  reason: UpdateApplication can replace imageConfiguration on an existing application, including some running applications, but the update does not execute the image. A principal edge needs effective UpdateApplication on the exact application, controlled compatible ECR image bytes and service pull access, digest-resolution behavior, a later workload that uses the changed image, its exact execution role and an executable image component. Current inventory does not join these facts.
