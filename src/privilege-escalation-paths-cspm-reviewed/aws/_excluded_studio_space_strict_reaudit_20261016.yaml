  source_revision: b587e6bd26
  technique: Attach a controlled Studio lifecycle configuration to an existing space
  reason: The IAM-domain shared-space subset is implemented as
    aws-sagemaker-attach-studio-lifecycle-config-shared-space with exact role, app type,
    free lifecycle-config name, CreateStudioLifecycleConfig, UpdateSpace, CreateApp and
    AddTags joins. Private spaces, non-IAM domains and already-running apps require
    separate owner, authorization and restart evidence; the shared-space subset must not
    be generalized to them.
