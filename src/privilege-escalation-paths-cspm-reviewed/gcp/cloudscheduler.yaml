# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP Cloud Scheduler privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-cloudscheduler-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# HTTP jobs with an OAuth token make attacker-defined requests to *.googleapis.com as the SA (the token is minted by the
# Scheduler service agent at delivery; the creator needs actAs). OIDC-only paths are excluded (audience-bound tokens).
# Scheduler jobs have no resource-level IAM.

- id: gcp-cloudscheduler-jobs-create-actas
  provider: gcp
  service: cloudscheduler
  title: Create a scheduler job that calls Google APIs authenticated as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-cloudscheduler-privesc.md#cloudschedulerjobscreate-or-update--iamserviceaccountsactas--authenticated-http-dispatch-as-a-service-account
  source_revision: 171e422
  summary: The source can schedule selected OAuth-authenticated Google API requests as a service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: cloudscheduler.jobs.create
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_cloudscheduler_authenticated_delivery: true
    scope: same_project
    aggregate_as: "Service accounts usable as Cloud Scheduler OAuth identity in {project}"
  conditions:
    - id: service_agent
      description: The project's Cloud Scheduler service agent needs its service agent role to mint the OAuth token.
    - id: request_level
      description: The source acts as the SA one predefined HTTP request at a time (no token in hand); any Google API reachable over a single authenticated request is usable, which is sufficient to self-grant further access.
    - id: response_visibility
      description: The response body is not returned to the source; only status is visible in execution logs.
    - id: trigger
      description: The job fires on its schedule; on-demand firing needs cloudscheduler.jobs.run.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on specific SAs and restrict roles/cloudscheduler.admin.
  references:
    - https://cloud.google.com/scheduler/docs/http-target-auth
  notes: OAuth target hosts are restricted to *.googleapis.com. HackTricks also describes a key-upload chain through the scheduled request (iam.serviceAccountKeys.create held by the job SA).

- id: gcp-cloudscheduler-jobs-update-actas
  provider: gcp
  service: cloudscheduler
  title: Update an existing scheduler job to call Google APIs as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-cloudscheduler-privesc.md#cloudschedulerjobscreate-or-update--iamserviceaccountsactas--authenticated-http-dispatch-as-a-service-account
  source_revision: 171e422
  summary: The source can change an existing job to send selected OAuth-authenticated Google API requests as a service account on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
      - action: cloudscheduler.jobs.update
        resource: "*"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
      gcp_cloudscheduler_update_job_path: true
      gcp_cloudscheduler_authenticated_delivery: true
    scope: same_project
    aggregate_as: "Service accounts attachable to existing Cloud Scheduler jobs in {project}"
  conditions:
    - id: existing_job
      description: Needs an enabled job, a paused job the source can resume, or a failed update the source can retry.
    - id: service_agent
      description: The project's Cloud Scheduler service agent needs its service agent role to mint the OAuth token.
    - id: request_level
      description: The source acts as the SA through predefined HTTP requests to *.googleapis.com, not with a token in hand.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Restrict cloudscheduler.jobs.update and grant actAs only on specific SAs.
