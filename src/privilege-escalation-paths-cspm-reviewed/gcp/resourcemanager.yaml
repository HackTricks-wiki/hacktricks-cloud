- id: gcp-resourcemanager-projects-setiampolicy-sa-token
  provider: gcp
  source_kind:
    - gcp_user
    - gcp_service_account
  service: resourcemanager
  title: Grant access to impersonate a project service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-resourcemanager-privesc.md#organizationsfoldersprojectssetiampolicy--self-grant-on-a-hierarchy-node
  source_revision: 171e422
  summary: A principal that can change a project's IAM policy may grant itself Service Account Token Creator on the project and mint a token for an enabled service account it could not already impersonate.
  requires:
    all_of:
      - action: resourcemanager.projects.setIamPolicy
        resource: "{target.scope}"
  target:
    kind: gcp_service_account
    selector:
      gcp_project_iam_sa_token_grant: true
    scope: any
    aggregate_as: "Service accounts reachable through a project IAM Token Creator grant"
  conditions:
    - id: allowed_member_domains
      description: Effective organization policy can reject the new Token Creator binding for the source principal.
  blockers:
    - gcp_deny_policy
    - disabled_service_account
  confidence: conditional
  severity: critical
  mitigation: Limit project IAM policy writers and grant Service Account Token Creator only on the specific accounts that need impersonation.
  notes: The prospective path joins an active exact project, full project and service-account IAM policies, an enabled named service account, a full Token Creator role, absent prior token access, and resolved IAM, member, deny, group, and PAB evidence.
