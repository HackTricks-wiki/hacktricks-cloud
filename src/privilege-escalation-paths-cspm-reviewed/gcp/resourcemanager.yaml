# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP Resource Manager (organization / folder / project IAM) privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-resourcemanager-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# Writing the IAM policy of a node grants any role on it and, through inheritance, on all descendants.

- id: gcp-resourcemanager-organizations-setiampolicy
  provider: gcp
  source_kind:
    - gcp_user
    - gcp_service_account
  service: resourcemanager
  title: Self-grant Organization Policy Admin access
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-resourcemanager-privesc.md#organizationsfoldersprojectssetiampolicy--self-grant-on-a-hierarchy-node
  source_revision: 171e422
  summary: A principal that can change an active organization's IAM policy may grant itself Organization Policy Admin when it lacks the policy-setting permission.
  requires:
    all_of:
      - action: resourcemanager.organizations.setIamPolicy
        resource: "{target.policy_resource}"
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
      - orgpolicy.policy.set
    aggregate_as: "Organization policy-setting permission the source could grant itself"
  conditions:
    - id: allowed_member_domains
      description: iam.allowedPolicyMemberDomains can reject bindings for principals outside allowed domains.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: critical
  mitigation: Restrict roles/resourcemanager.organizationAdmin and roles/iam.securityAdmin at the organization to break-glass identities.
  notes: The prospective path requires the active organization and full IAM policy, the grantable Organization Policy Admin role, a newly effective policy-setting permission, and no unresolved IAM, member, deny, or PAB blocker. Other grantable roles may provide different new permissions and need separate evidence.
  references:
    - https://cloud.google.com/resource-manager/docs/access-control-org

- id: gcp-resourcemanager-folders-setiampolicy
  provider: gcp
  source_kind:
    - gcp_user
    - gcp_service_account
  service: resourcemanager
  title: Self-grant Folder Admin access on a folder
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-resourcemanager-privesc.md#organizationsfoldersprojectssetiampolicy--self-grant-on-a-hierarchy-node
  source_revision: 171e422
  summary: A principal that can change an active folder's IAM policy may grant itself Folder Admin when it lacks at least one supported folder permission.
  requires:
    all_of:
      - action: resourcemanager.folders.setIamPolicy
        resource: "{target.policy_resource}"
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
      - resourcemanager.folders.create
      - resourcemanager.folders.delete
      - resourcemanager.folders.move
      - resourcemanager.folders.update
      - resourcemanager.folders.undelete
      - resourcemanager.projects.setIamPolicy
    aggregate_as: "Folder Admin permissions the source could grant itself"
  conditions:
    - id: allowed_member_domains
      description: iam.allowedPolicyMemberDomains can reject bindings for principals outside allowed domains.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: critical
  mitigation: Restrict roles/resourcemanager.folderAdmin and roles/resourcemanager.folderIamAdmin.
  notes: The prospective path requires an active exact folder, its complete IAM policy, a grantable Folder Admin role, a new effective permission on that folder or a known descendant project, and no unresolved IAM or policy blockers. The policy change has not been executed.

- id: gcp-resourcemanager-projects-setiampolicy
  provider: gcp
  source_kind:
    - gcp_user
    - gcp_service_account
  service: resourcemanager
  title: Self-grant Editor access on a project
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-resourcemanager-privesc.md#organizationsfoldersprojectssetiampolicy--self-grant-on-a-hierarchy-node
  source_revision: 171e422
  summary: A principal that can change an active project's IAM policy may grant itself Editor when that role adds at least one permission it lacks at the project.
  requires:
    all_of:
      - action: resourcemanager.projects.setIamPolicy
        resource: "{target.policy_resource}"
  target:
    kind: gcp_verified_authority
    selector:
      gcp_resource_self_grant: true
    scope: any
    outcome: permission_grant
    grants:
      - roles/editor
    aggregate_as: "Editor role the source could grant itself on a project"
  conditions:
    - id: allowed_member_domains
      description: iam.allowedPolicyMemberDomains can reject bindings for principals outside allowed domains.
    - id: default_service_account_basic_role_block
      description: iam.managed.preventPrivilegedBasicRolesForDefaultServiceAccounts can reject Editor grants to default service accounts.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: critical
  mitigation: Restrict roles/resourcemanager.projectIamAdmin, roles/iam.securityAdmin and roles/owner.
  notes: The prospective path needs an active exact project, its complete IAM policy, a complete grantable Editor role, a new effective permission, and resolved IAM conditions, member and basic-role restrictions, deny, group, and PAB evidence. Other project roles may provide different new permissions and need separate evidence.

