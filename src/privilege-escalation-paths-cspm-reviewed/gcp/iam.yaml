- id: gcp-iam-serviceaccounts-setiampolicy
  provider: gcp
  service: iam
  title: Rewrite a service account's IAM policy to self-grant impersonation
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-iam-privesc.md#iamserviceaccountssetiampolicy--grant-yourself-token-creation-access
  source_revision: 171e422
  summary: The source can obtain the privileges of every service account on which it holds iam.serviceAccounts.setIamPolicy.
  requires:
    all_of:
      - action: iam.serviceAccounts.setIamPolicy
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      resource_permission_covers_target: iam.serviceAccounts.setIamPolicy
    scope: any
    aggregate_as: "Service accounts whose IAM policy the source controls"
  conditions:
    - id: allowed_member_domains
      description: iam.allowedPolicyMemberDomains can reject the new binding when the source is an external principal.
  blockers:
    - gcp_deny_policy
    - disabled_service_account
    - {id: org_policy_constraint, constraint: iam.allowedPolicyMemberDomains+iam.managed.allowedPolicyMembers}
  confidence: derived
  severity: critical
  mitigation: Restrict roles/iam.serviceAccountAdmin and roles/iam.securityAdmin; grant SA-level admin only to owners of that SA.
  references:
    - https://cloud.google.com/iam/docs/manage-access-service-accounts
  notes: Also covers the iam.roles.create + iam.serviceAccounts.setIamPolicy variant (the custom role is unnecessary; the SA policy write is the escalation).

- id: gcp-iam-roles-update-own-custom-role
  provider: gcp
  service: iam
  title: Add permissions to a custom role bound to the source
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-iam-privesc.md#iamrolesupdate--add-permissions-to-an-already-bound-custom-role
  source_revision: 171e422
  summary: The source can obtain the privileges of the scope owner of every project/folder/org where a custom role it can update is bound to it.
  requires:
    all_of:
      - action: iam.roles.update
        resource: "*"
  target:
    kind: gcp_scope_owner
    selector:
      gcp_custom_role_bound_to_source: true
    scope: any
    aggregate_as: "Scopes where a source-bound custom role is editable"
  conditions:
    - id: add_permission_limits
      description: The caller need not hold the added permission, but it must be supported in custom roles at that level (project-level roles cannot contain folder/org-only permissions, no wildcards), the role must be active (roles.update can also re-activate a disabled role), and any binding condition must hold.
  blockers:
    - gcp_deny_policy
  confidence: conditional
  severity: critical
  mitigation: Separate custom-role administration (roles/iam.roleAdmin) from principals bound to those roles.
  references:
    - https://cloud.google.com/iam/docs/creating-custom-roles
  notes: The selector uses the scope of the source's recorded role binding and checks iam.roles.update on that exact collected custom role. Adding a supported IAM policy permission may then grant control of that binding scope.
