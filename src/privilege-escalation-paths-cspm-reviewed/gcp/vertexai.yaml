- id: gcp-vertex-customjob-custom-code-agent
  provider: gcp
  service: aiplatform
  title: Run a Vertex AI job with no service account so it runs as the Custom Code Service Agent
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#omit-serviceaccount-to-run-custom-training-as-the-custom-code-service-agent
  source_revision: 171e422
  summary: The source can obtain the privileges of the Vertex AI Custom Code Service Agent of every project where it can create custom jobs, hyperparameter tuning jobs or custom training pipelines.
  requires:
    any_of:
    - - action: aiplatform.customJobs.create
        resource: '*'
    - - action: aiplatform.hyperparameterTuningJobs.create
        resource: '*'
    - - action: aiplatform.trainingPipelines.create
        resource: '*'
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: vertex_custom_code_agent
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Vertex AI Custom Code Service Agent of {project}
  conditions:
  - id: agent_roles
    description: Power equals the agent's current bindings (roles/aiplatform.customCodeServiceAgent by default, which HackTricks reports as including token minting for project SAs and broad storage/BigQuery access).
  - id: agent_node
    description: The selector resolves the project-number service agent and confirms its expected project IAM role binding; a missing binding remains unresolved.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  references:
  - https://docs.cloud.google.com/vertex-ai/docs/general/custom-service-account
  confidence: conditional
  severity: critical
  mitigation: Review the bindings of service-<number>@gcp-sa-aiplatform-cc and restrict aiplatform.customJobs.create / pipelineJobs.create (roles/aiplatform.user).
  notes: No actAs is checked when no service account is pinned (Google documents the Custom Code Service Agent as the default identity of CustomJob, HyperparameterTuningJob and custom TrainingPipeline training containers). PipelineJobs are not documented to default to this agent.
- id: gcp-vertex-workbench-instance-update-or-setiampolicy
  provider: gcp
  service: notebooks
  title: Take over an existing Workbench instance through update/reset or an instance IAM self-grant
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#notebooksinstancesupdate--notebooksinstancesreset-on-an-existing-workbench-instance
  source_revision: 171e422
  summary: The source can obtain the privileges of the service accounts attached to existing Workbench instances it can update and reset or whose IAM policy it controls.
  requires:
    all_of: []
  source_kind:
    - gcp_user
    - gcp_service_account
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: notebooks_instance
      gcp_workbench_existing_takeover_path: true
    scope: same_project
    aggregate_as: SAs of Workbench instances the source can take over
  conditions:
  - id: followup_access
    description: The selector joins update and reset on the same active instance, update and start on a stopped instance, or an instance policy self-grant to obtain those rights. The metadata startup script runs on boot.
  - id: instance_owners
    description: JupyterLab access is separate from the instance role and is not required for the metadata boot path.
  blockers:
  - gcp_deny_policy
  confidence: conditional
  severity: high
  mitigation: Restrict notebooks.instances.update/reset/setIamPolicy (roles/notebooks.admin, roles/editor) on instances with privileged SAs and set instance-owners explicitly.
  references:
  - https://docs.cloud.google.com/gemini-enterprise-agent-platform/notebooks/workbench/reference/rest/v2/projects.locations.instances/patch
  - https://docs.cloud.google.com/gemini-enterprise-agent-platform/notebooks/workbench/instances/manage-metadata
- id: gcp-vertex-reasoningengines-create-default-agent
  provider: gcp
  service: aiplatform
  title: Deploy an Agent Engine with no service account so it runs as the Reasoning Engine Service Agent
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#omit-agent-engine-specserviceaccount-to-run-as-the-reasoning-engine-service-agent
  source_revision: 171e422
  summary: The source can obtain the privileges of the AI Platform Reasoning Engine Service Agent of every project where it can create reasoning engines.
  requires:
    all_of:
    - action: aiplatform.reasoningEngines.create
      resource: '*'
  target:
    kind: gcp_service_account
    selector:
      attached_to_service: vertex_reasoning_engine_agent
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Reasoning Engine Service Agent of {project}
  conditions:
  - id: identity_selection
    description: spec.serviceAccount must be omitted and identityType AGENT_IDENTITY not selected.
  - id: agent_roles
    description: The selector confirms the expected project IAM role binding. Power equals roles/aiplatform.reasoningEngineServiceAgent (project-scoped Cloud Storage object get/list among others) plus any extra bindings on service-<number>@gcp-sa-aiplatform-re.
  - id: staging_build
    description: The staging/build permissions needed to deploy attacker-controlled agent code are also required.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: medium
  mitigation: Review bindings of the Reasoning Engine Service Agent and restrict aiplatform.reasoningEngines.create (roles/aiplatform.user).
  references:
  - https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-agent-access
  notes: No actAs is checked for the default identity. This is not arbitrary service-account impersonation.
