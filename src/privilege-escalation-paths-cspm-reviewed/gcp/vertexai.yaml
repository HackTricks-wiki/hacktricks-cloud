- id: gcp-vertex-batchprediction-create-actas
  provider: gcp
  service: aiplatform
  title: Create a batch prediction job running a chosen container as a service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#aiplatformbatchpredictionjobscreate--iamserviceaccountsactas
  source_revision: 171e422
  summary: The source can supply an unmanaged container and command in a batch prediction job that runs as a service account it can act as.
  requires:
    all_of:
    - action: iam.serviceAccounts.actAs
      resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_vertex_batch_prediction_path: true
    scope: same_project
    aggregate_as: Service accounts usable as Vertex AI workload SA in {project}
  conditions:
  - id: container_execution
    description: The job request can include an unmanagedContainerModel with a chosen container image and command; no prior model upload is needed, but the image must be usable by Vertex AI.
  - id: input_output
    description: A valid input source and output destination accessible to the Vertex AI service agent are required for the job to start.
  - id: service_agent_io
    description: Vertex still uses its service agent for Cloud Storage/BigQuery I/O even with a custom SA.
  - id: service_agent_delegation
    description: The selector checks that the project's Vertex AI Service Agent has an unconditional roles/iam.serviceAccountAdmin grant on the target SA or an ancestor.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on dedicated Vertex AI workload SAs; no aiplatform.* role contains actAs but roles/editor contains both.
  references:
  - https://docs.cloud.google.com/vertex-ai/docs/reference/rpc/google.cloud.aiplatform.v1#batchpredictionjob

- id: gcp-vertex-models-upload-endpoint-deploy-actas
  provider: gcp
  service: aiplatform
  title: Deploy a controlled model to a Vertex AI endpoint under a chosen service
    account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#deploy-an-attacker-controlled-model-to-an-endpoint-as-a-target-service-account
  source_revision: 6fb9ac51fd
  summary: The source can upload a controlled custom-container model and deploy it to a new endpoint under a service account it can use.
  requires:
    all_of:
    - action: iam.serviceAccounts.actAs
      resource: '{target.email}'
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_vertex_new_model_endpoint_path: true
    scope: same_project
    aggregate_as: Service accounts usable as Vertex AI workload SA in {project}
  conditions:
  - id: controlled_model
    description: The selector checks aiplatform.models.upload to create a model with a chosen custom container. An existing controlled model remains unresolved without model inventory.
  - id: endpoint
    description: The selector checks aiplatform.endpoints.create and project-level deploy rights. An existing endpoint with narrower deploy rights remains unresolved without endpoint inventory.
  - id: service_agent_delegation
    description: The selector checks that the project's Vertex AI Service Agent has an unconditional roles/iam.serviceAccountAdmin grant on the target SA or an ancestor.
  - id: container_contract
    description: Custom containers must pass Vertex health/prediction checks for the
      deployment to stay up.
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on dedicated Vertex AI workload SAs; no aiplatform.*
    role contains actAs but roles/editor contains both.
  references:
  - https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/custom-service-account

