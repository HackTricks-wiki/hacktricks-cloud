# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP Vertex AI (aiplatform) and Workbench (notebooks) privilege escalation techniques.
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-vertex-ai-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.
# attached_to_service: vertex_custom_code_agent -> service-<number>@gcp-sa-aiplatform-cc of the project;
# notebooks_instance -> SA attached to an existing Workbench instance ("{target.host_resource}").
# vertex_reasoning_engine_agent -> service-<number>@gcp-sa-aiplatform-re of the project (Agent Engine default runtime identity).

- id: gcp-vertex-customjobs-create-actas
  provider: gcp
  service: aiplatform
  title: Create a Vertex AI custom job or custom training pipeline running as a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-vertex-ai-privesc.md#aiplatformcustomjobscreate--iamserviceaccountsactas
  source_revision: 6fb9ac51fd
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs, by creating a Vertex AI custom job or a custom TrainingPipeline whose workload runs as that service account.
  requires:
    all_of:
    - action: iam.serviceAccounts.actAs
      resource: '{target.email}'
    any_of:
    - - action: aiplatform.customJobs.create
        resource: '*'
    - - action: aiplatform.trainingPipelines.create
        resource: '*'
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_sa_in_scope_of_permission: true
    scope: same_project
    aggregate_as: Service accounts usable as Vertex AI workload SA in {project}
  conditions:
  - id: metadata_reachable
    description: The workload code must be able to use the attached identity (metadata server or default credentials in the runtime).
  blockers:
  - gcp_deny_policy
  - vpc_sc_perimeter
  confidence: derived
  severity: critical
  mitigation: Grant actAs only on dedicated Vertex AI workload SAs; no aiplatform.* role contains actAs but roles/editor contains both.
  notes: A custom TrainingPipeline wraps the same custom job spec, so aiplatform.trainingPipelines.create is an equivalent alternative.

