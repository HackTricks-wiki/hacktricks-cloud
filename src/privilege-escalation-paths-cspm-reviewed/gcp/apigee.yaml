# Active GCP privilege escalation catalog: each entry must show the source principal's permissions and actions leading to a named second principal or to additional effective permissions for the source. A data read or secret access alone is not escalation; credential paths require verified usable credentials tied to the exact target principal. Every active source must cite a GCP privilege-escalation page and the technique's heading anchor.
# GCP Apigee privilege escalation techniques (GCP identity only; API traffic/credential tampering is excluded).
# Source: hacktricks-cloud gcp-privilege-escalation/gcp-apigee-privesc.md (rev 171e422).
# Placeholder / selector conventions: see the header of catalog/gcp/iam.yaml.

- id: gcp-apigee-proxy-deploy-with-sa-actas
  provider: gcp
  service: apigee
  title: Deploy a proxy revision bound to a chosen service account
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-apigee-privesc.md#apigeeproxiescreate--apigeedeploymentscreate--apigeeproxyrevisionsdeploy--iamserviceaccountsactas--deploy-a-malicious-api-proxy-revision
  source_revision: 171e422
  summary: The source can obtain the privileges of any service account in the project on which it holds iam.serviceAccounts.actAs.
  requires:
    all_of:
      - action: apigee.proxyrevisions.deploy
        resource: "*"
      - action: apigee.deployments.create
        resource: "*"
      - action: apigee.proxies.create
        resource: "*"
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_apigee_proxy_deploy_path: true
    scope: any
    aggregate_as: "Service accounts bindable to Apigee proxy deployments in {project}"
  conditions:
    - id: apigee_org
      description: The project must host an Apigee organization with an environment the proxy can be deployed to.
    - id: proxy_token_use
      description: The bound SA is used by proxy policies that authenticate to Google APIs; the source reaches it through requests to its own proxy.
    - id: token_creator_for_runtime
      description: The proxy SA must be in the Apigee organization's project and the active runtime identity must be allowed to mint tokens for it (normally Token Creator on the SA); otherwise the proxy cannot obtain Google tokens.
    - id: standard_environment
      description: Archive-deployment environments and Apigee Space-associated proxies follow different authorization and do not support SA-bound Google authentication in the same way.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: critical
  mitigation: Grant actAs only on dedicated Apigee proxy SAs and restrict apigee.proxyrevisions.deploy.
  references:
    - https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
  notes: Deploying without a service account needs no actAs and yields no GCP identity (traffic tamper only, excluded). apigee.proxies.create is checked on the organization for both a new proxy and a new revision of an existing proxy, apigee.deployments.create on the environment and apigee.proxyrevisions.deploy on the revision. Direct environment IAM bindings are read from that environment. Managed Apigee service-agent delegation is evaluated; Hybrid's separately configured runtime SA remains unresolved when its identity is not collected. roles/apigee.apiAdminV2 lacks deployments.create and roles/apigee.environmentAdmin lacks authoring.

- id: gcp-apigee-sharedflow-flowhook-with-sa-actas
  provider: gcp
  service: apigee
  title: Deploy a shared flow bound to a chosen service account and attach it to an environment flow hook
  source: src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-apigee-privesc.md#apigeesharedflowscreate--apigeedeploymentscreate--apigeesharedflowrevisionsdeploy--apigeeflowhooksattachsharedflow--execute-a-malicious-shared-flow-across-an-environment
  source_revision: 80bf7fe60f
  summary: The source can obtain the Google API privileges of any service account in the Apigee project on which it holds iam.serviceAccounts.actAs, through a shared flow it deploys and attaches to a flow hook.
  requires:
    all_of:
      - action: apigee.sharedflows.create
        resource: "*"
      - action: apigee.deployments.create
        resource: "*"
      - action: apigee.sharedflowrevisions.deploy
        resource: "*"
      - action: apigee.flowhooks.attachSharedFlow
        resource: "*"
      - action: iam.serviceAccounts.actAs
        resource: "{target.email}"
  target:
    kind: gcp_service_account
    selector:
      gcp_actas_granted_on_target: true
      gcp_apigee_sharedflow_hook_path: true
    scope: any
    aggregate_as: "Service accounts bindable to Apigee shared-flow deployments in {project}"
  conditions:
    - id: apigee_org
      description: The project must host an Apigee organization with a standard (non-archive) environment that serves proxy traffic so the hooked flow executes.
    - id: token_creator_for_runtime
      description: The SA must be in the Apigee organization's project and the active runtime identity must be allowed to mint tokens for it; the flow uses the SA only through Google-authentication policies, request by request.
  blockers:
    - gcp_deny_policy
    - vpc_sc_perimeter
  confidence: conditional
  severity: high
  mitigation: Restrict apigee.flowhooks.attachSharedFlow and apigee.sharedflowrevisions.deploy, and grant actAs only on dedicated Apigee SAs.
  references:
    - https://docs.cloud.google.com/apigee/docs/api-platform/fundamentals/shared-flows
    - https://docs.cloud.google.com/apigee/docs/api-platform/security/google-auth/overview
  notes: Without a service account the shared flow yields traffic interception only (excluded). sharedflows.create is checked on the organization, deployments.create on the environment, sharedflowrevisions.deploy on the revision, and flowhooks.attachSharedFlow on an environment flow-hook child. A deployed proxy must exist in that environment for the hook to receive proxy traffic. Managed Apigee service-agent delegation is evaluated; Hybrid's separately configured runtime SA remains unresolved when its identity is not collected.
