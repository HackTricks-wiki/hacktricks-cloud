# catalog_description: Only principal-to-principal or principal-to-additional-permission
# escalation paths belong here. A source must control a credential or hold the
# required verbs, perform the named action, and reach a known target identity
# or new effective permission. Generic Secret reads and guardrail changes
# without a proven identity or permission gain are excluded.
# Canonical provider policy: peaso/privesc/catalog_policy.yaml.
# Kubernetes node-level techniques: reach node credentials (k8s_node) through host-privileged
# pods, PSA/namespace manipulation, kubelet access or node client certificates, and what a node
# identity reaches. Conventions: see header of rbac.yaml. Source: hacktricks-cloud rev a53b46392c, refreshed to 171e422.

- id: k8s-nodes-privileged-pod-create
  provider: k8s
  service: nodes
  title: Create a host-privileged pod (privileged container or host-root hostPath)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/workload-and-pod-access.md#pod-create--escape
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the nodes it can schedule a host-privileged pod onto.
  requires:
    all_of:
      - verb: create
        resource: pods
        namespace: "{pivot.namespace}"
  target:
    kind: k8s_node
    selector:
      k8s_node_schedulable: true
    scope: cluster
    aggregate_as: "Nodes of {cluster}"
  conditions:
    - id: other_admission_blocks_host_access
      description: Non-PSA admission (Kyverno, Gatekeeper, VAP, OpenShift SCC) may reject privileged/hostPath/hostPID pods.
    - id: psa_cluster_default_not_collected
      description: An unlabeled namespace can still inherit a baseline or restricted cluster-wide PSA default, which is not in the Kubernetes resource inventory.
    - id: node_reachable_by_scheduling
      description: The pod can pin itself with nodeName/tolerations, so tainted nodes (including self-managed control-plane nodes) are reachable unless admission strips them; managed control planes are not nodes.
  blockers: [pivot_namespace_psa_enforce_baseline_or_restricted, admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: critical
  mitigation: Enforce Pod Security Admission baseline or restricted on every namespace where untrusted subjects can create pods.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    - https://kubernetes.io/docs/concepts/security/pod-security-admission/
  notes: The blocker reads the pod-security.kubernetes.io/enforce label of the pivot namespace; the cluster-wide PSA default is not collected, so an unlabeled namespace stays conditional. A privileged container or a writable hostPath of / (or a runtime-socket mount) yields node root; hostPID, hostIPC or hostNetwork alone do not (hostNetwork reaches node metadata, see k8s-cloud-hostnetwork-pod-node-identity). Added SYS_ADMIN/SYS_MODULE without privileged mode is runtime-dependent. PSA baseline forbids all of these, so the blocker covers every variant.

- id: k8s-nodes-privileged-controller-create
  provider: k8s
  service: nodes
  title: Create or modify a controller with a host-privileged pod template
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/workload-and-pod-access.md#createpatch-deployment-daemonsets-statefulsets-replicationcontrollers-replicasets-jobs-and-cronjobs
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the nodes onto which a controller it controls schedules a host-privileged pod (every node for a DaemonSet).
  requires:
    all_of: []
    any_of:
      - - {verb: create, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: jobs, api_group: batch, namespace: "{pivot.namespace}"}
      - - {verb: create, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
      - - {verb: patch, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: update, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: patch, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: update, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: patch, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: update, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: patch, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: update, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
      - - {verb: patch, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
      - - {verb: update, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
      - - {verb: patch, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
      - - {verb: update, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
  target:
    kind: k8s_node
    selector:
      k8s_node_schedulable: true
    scope: cluster
    aggregate_as: "Nodes of {cluster}"
  conditions:
    - id: other_admission_blocks_host_access
      description: Non-PSA admission may reject privileged/hostPath/hostPID pod templates.
    - id: psa_cluster_default_not_collected
      description: An unlabeled namespace can still inherit a restrictive cluster-wide PSA default, which is not collected.
    - id: controller_object_exists
      description: A patch or update grant must cover the name of an existing controller in the same namespace; create rights do not need an existing controller.
  blockers: [pivot_namespace_psa_enforce_baseline_or_restricted, admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: critical
  mitigation: Enforce PSA baseline/restricted on namespaces where untrusted subjects manage workloads.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-admission/
  notes: PSA evaluates pods created by controllers (and warns on templates). For patch/update, the evaluator joins exact named controller inventory before reaching nodes. Separate from k8s-nodes-privileged-pod-create because the permission set differs.

- id: k8s-nodes-privileged-ephemeral-container
  provider: k8s
  service: nodes
  title: Add a privileged ephemeral container to an existing pod
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/workload-and-pod-access.md#ephemeralcontainers
  source_revision: 2415fadfbd
  summary: The source may obtain the privileges of a node hosting a target pod by adding a privileged ephemeral container when the runtime exposes a usable host escape surface.
  requires:
    all_of: []
    any_of:
      - - {verb: patch, resource: pods, subresource: ephemeralcontainers, namespace: "{pivot.namespace}"}
      - - {verb: update, resource: pods, subresource: ephemeralcontainers, namespace: "{pivot.namespace}"}
  target:
    kind: k8s_node
    selector:
      k8s_node_hosting_pods_in_namespace: "{pivot.namespace}"
    scope: cluster
    aggregate_as: "Nodes running pods of {pivot.namespace}"
  conditions:
    - id: host_namespaces_fixed_by_pod
      description: hostPID/hostNetwork and volumes are fixed by the existing pod. Privileged mode gives broad device and capability access, but node control still depends on the runtime, host mounts or another verified escape surface.
    - id: exact_running_pod_write
      description: The patch or update grant must cover an existing running Pod by name; permission limited to a different Pod does not reach this node.
    - id: other_admission_blocks_host_access
      description: Non-PSA admission may reject privileged ephemeral containers.
  blockers: [pivot_namespace_psa_enforce_baseline_or_restricted, admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: critical
  mitigation: Restrict pods/ephemeralcontainers and enforce PSA baseline/restricted.
  references:
    - https://kubernetes.io/docs/concepts/workloads/pods/ephemeral-containers/
  notes: PSA checks ephemeral containers at the pods/ephemeralcontainers subresource. The evaluator joins the grant to an exact running Pod on the target node.

- id: k8s-nodes-exec-into-host-privileged-pod
  provider: k8s
  service: nodes
  title: Exec into an existing pod with a privileged container or escape capability
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/workload-and-pod-access.md#privileged-pod-and-hostpid-escape
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the nodes that run pods it can exec into whose containers are privileged or carry a node-escape capability.
  requires:
    all_of:
      - verb: create
        resource: pods
        subresource: exec
        namespace: "{pivot.namespace}"
  target:
    kind: k8s_node
    selector:
      k8s_node_hosting_privileged_pod_in_namespace: "{pivot.namespace}"
    scope: cluster
    aggregate_as: "Nodes running privileged pods of {pivot.namespace}"
  conditions:
    - id: cap_sys_admin_constrained_by_seccomp_apparmor
      description: Added SYS_ADMIN (or ALL) without privileged mode is an escape only when seccomp/AppArmor/SELinux and the user namespace allow the needed mount or namespace-entry operation (cgroup v1 release_agent, a host device or a host PID to join).
    - id: kernel_module_loading_restricted
      description: SYS_MODULE needs the initial user namespace and a kernel without lockdown or mandatory module signing.
    - id: open_by_handle_at_blocked_by_seccomp
      description: DAC_READ_SEARCH reads host files through open_by_handle_at only when the syscall is allowed and a host file handle is reachable; it yields node credentials (read), not direct execution.
    - id: ptrace_restricted_by_apparmor_or_yama
      description: SYS_PTRACE with hostPID needs an attachable host process; the runtime AppArmor profile or Yama ptrace_scope may block it.
    - id: target_container_selectable
      description: The exec grant must cover the exact Pod by name, and the privileged or escape-capable container must be running; completed init containers do not supply this path.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Remove pods/exec in namespaces that run privileged DaemonSets (kube-system, CNI, monitoring agents) and drop privileged mode and SYS_ADMIN/SYS_MODULE/SYS_PTRACE/DAC_READ_SEARCH from workloads that do not need them.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
    - https://kubernetes.io/docs/concepts/security/linux-kernel-security-constraints/
    - https://man7.org/linux/man-pages/man7/capabilities.7.html
  notes: Not blocked by PSA because the pod already exists. Only active containers contribute privileged mode or capabilities; completed init containers are excluded. hostNetwork, hostIPC and hostPID alone do not match (hostNetwork is modelled as node cloud-identity reach in k8s-cloud-hostnetwork-pod-node-identity). Sensitive hostPath mounts are a separate entry (k8s-nodes-exec-into-host-mount-pod). Privileged DaemonSets (CNI, CSI, log agents) make this reach every node. The same applies to get pods/exec on clusters older than 1.35 (see k8s-workloads-pods-exec-get-websocket).

- id: k8s-nodes-exec-into-host-mount-pod
  provider: k8s
  service: nodes
  title: Exec into an existing pod that mounts a runtime socket or sensitive host path
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/workload-and-pod-access.md#runtime-sockets-and-kernel-helper-paths
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the nodes that run pods it can exec into which mount a container runtime socket, node credential files, or a host-executed path writable.
  requires:
    all_of:
      - verb: create
        resource: pods
        subresource: exec
        namespace: "{pivot.namespace}"
  target:
    kind: k8s_node
    selector:
      k8s_node_hosting_host_mount_pod_in_namespace: "{pivot.namespace}"
    scope: cluster
    aggregate_as: "Nodes running host-mount pods of {pivot.namespace}"
  conditions:
    - id: node_credential_location_varies
      description: A readOnly /etc or /etc/kubernetes mount exposes node or cluster credentials only where the distribution keeps them there (kubeadm kubelet.conf / control-plane admin.conf and PKI, k3s); managed node images often do not.
    - id: host_write_needs_host_consumer
      description: Writable /home, /var/lib/docker, /var/lib/containerd or /sys/fs/cgroup lead to host execution only if a host process later consumes the written file (SSH login, image layer, cgroup v1 release_agent).
    - id: hostpath_subpath_narrows_mount
      description: A subPath mount exposes only the named subdirectory of the hostPath volume.
    - id: socket_usable_by_container_user
      description: A runtime socket must be connectable by the container user (file mode, SELinux label); a readOnly mount does not prevent connecting.
    - id: exact_active_container_mount
      description: The exec grant must cover the exact Pod by name, and the sensitive host path must be mounted in a running container; a completed init container does not expose it through exec.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Do not mount runtime sockets, /, /var/lib/kubelet, /etc or host binary directories into workloads; mount specific paths readOnly and restrict pods/exec in namespaces running such agents.
  references:
    - https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
    - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  notes: Derived matches are runtime sockets (docker, containerd, CRI-O, k3s, podman, buildkit) or any ancestor of them, readOnly mounts of / or of the kubelet credential paths (/var/lib/kubelet/pki, kubeconfig, pods), and writable mounts of host-executed paths (/etc cron/systemd/manifests/passwd, /root/.ssh, binary and library directories, /opt/cni/bin, /proc/sys/kernel/core_pattern, /sys/kernel/uevent_helper). Writable /var/log (kubelet log-symlink read) is not counted because it is kubelet-version dependent (see _excluded.yaml). Other hostPaths such as /etc/ssl/certs, /var/log or data directories do not match.

- id: k8s-nodes-hostpath-persistentvolume
  provider: k8s
  service: nodes
  title: Mount the node filesystem through a hostPath PersistentVolume
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/storage-and-networking.md#storage-control-objects
  source_revision: a66f094ede
  summary: The source can obtain the privileges of nodes by consuming a hostPath PersistentVolume it created, which Pod Security Admission does not inspect.
  requires:
    all_of:
      - verb: create
        resource: persistentvolumes
        namespace: "*"
      - verb: create
        resource: persistentvolumeclaims
        namespace: "{pivot.namespace}"
      - any_of:
          - {verb: create, resource: pods, namespace: "{pivot.namespace}"}
          - {verb: create, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
          - {verb: create, resource: jobs, api_group: batch, namespace: "{pivot.namespace}"}
          - {verb: create, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
  target:
    kind: k8s_node
    selector:
      k8s_node_schedulable: true
    scope: cluster
    aggregate_as: "Nodes of {cluster}"
  conditions:
    - id: admission_blocks_hostpath_pv
      description: Admission policies on PersistentVolume objects (e.g. Gatekeeper/Kyverno disallowing hostPath PVs) remove the edge.
    - id: pv_binding_succeeds
      description: The claim must bind to the created PV (storageClassName/selector match).
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: critical
  mitigation: Restrict persistentvolumes create to storage administrators and deny hostPath PersistentVolumes via admission.
  references:
    - https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
  notes: PSA restricted allows persistentVolumeClaim volumes regardless of backing PV type, so the PSA blocker does not apply. A writable host root mount is required for full node access (writing a root-level file such as a cron or kubelet static pod gives code exec as root); without privileged mode, node credentials are still readable from the mounted filesystem.

- id: k8s-nodes-namespace-psa-relabel
  provider: k8s
  service: nodes
  title: Relax a namespace's Pod Security labels and create host-privileged pods
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-namespace-escalation.md#escape-to-the-node
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of nodes by removing the PSA enforcement label of a namespace where it can create pods.
  requires:
    all_of:
      - any_of:
          - {verb: create, resource: pods, namespace: "{pivot.namespace}"}
          - {verb: create, resource: deployments, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: daemonsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: statefulsets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicasets, api_group: apps, namespace: "{pivot.namespace}"}
          - {verb: create, resource: replicationcontrollers, namespace: "{pivot.namespace}"}
          - {verb: create, resource: jobs, api_group: batch, namespace: "{pivot.namespace}"}
          - {verb: create, resource: cronjobs, api_group: batch, namespace: "{pivot.namespace}"}
    any_of:
      - - {verb: patch, resource: namespaces, namespace: "*", resource_name: "{pivot.namespace}"}
      - - {verb: update, resource: namespaces, namespace: "*", resource_name: "{pivot.namespace}"}
      - - {verb: patch, resource: namespaces, subresource: status, namespace: "*", resource_name: "{pivot.namespace}"}
      - - {verb: update, resource: namespaces, subresource: status, namespace: "*", resource_name: "{pivot.namespace}"}
      - - {verb: update, resource: namespaces, subresource: finalize, namespace: "*", resource_name: "{pivot.namespace}"}
  target:
    kind: k8s_node
    selector:
      k8s_node_schedulable: true
    scope: cluster
    aggregate_as: "Nodes of {cluster}"
  conditions:
    - id: existing_restrictive_namespace_label
      description: The namespace must currently enforce baseline or restricted PSA; a namespace already permitting privileged Pods needs no relabel and belongs to the direct Pod-create path.
    - id: other_admission_blocks_host_access
      description: Non-PSA admission (policies protecting namespace labels or rejecting privileged pods) may remove the edge.
    - id: psa_cluster_default_not_collected
      description: Removing a restrictive namespace label may still leave a baseline or restricted cluster-wide PSA default in force.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: critical
  mitigation: Do not grant namespace update/patch (or namespaces/status, namespaces/finalize) to tenants; protect pod-security.kubernetes.io labels with a ValidatingAdmissionPolicy.
  references:
    - https://kubernetes.io/docs/concepts/security/pod-security-admission/
  notes: HackTricks reproduced on v1.37 that namespaces/status and namespaces/finalize writes can change Namespace labels consumed by PSA. Namespaces are cluster-scoped, so the namespace grant must come from a ClusterRole/ClusterRoleBinding with resourceNames covering the pivot.

- id: k8s-nodes-namespace-create-privileged-pod
  provider: k8s
  service: nodes
  title: Create a new namespace and host-privileged pods in it
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-namespace-escalation.md#escape-to-the-node
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of nodes by creating a namespace without PSA enforcement and creating pods there.
  requires:
    all_of:
      - verb: create
        resource: namespaces
        namespace: "*"
      - any_of:
          - {verb: create, resource: pods, namespace: "*"}
          - {verb: create, resource: deployments, api_group: apps, namespace: "*"}
          - {verb: create, resource: daemonsets, api_group: apps, namespace: "*"}
          - {verb: create, resource: statefulsets, api_group: apps, namespace: "*"}
          - {verb: create, resource: replicasets, api_group: apps, namespace: "*"}
          - {verb: create, resource: replicationcontrollers, namespace: "*"}
          - {verb: create, resource: jobs, api_group: batch, namespace: "*"}
          - {verb: create, resource: cronjobs, api_group: batch, namespace: "*"}
  target:
    kind: k8s_node
    selector:
      k8s_node_schedulable: true
    scope: cluster
    aggregate_as: "Nodes of {cluster}"
  conditions:
    - id: psa_cluster_default_level
      description: The PSA AdmissionConfiguration default (not collected) may enforce baseline/restricted on unlabeled namespaces; an admission policy may require PSA labels on new namespaces.
    - id: other_admission_blocks_host_access
      description: Non-PSA admission may reject privileged pods.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: critical
  mitigation: Restrict namespace creation; set a cluster-wide PSA default of baseline or restricted.
  references:
    - https://kubernetes.io/docs/tasks/configure-pod-container/enforce-standards-admission-controller/
  notes: Pods create must be effective in the newly created namespace, i.e. granted cluster-wide (a RoleBinding cannot pre-exist in a namespace that does not yet exist unless created by automation the source triggers).

- id: k8s-nodes-nodes-proxy-pod-sas
  provider: k8s
  service: nodes
  title: Use the kubelet API through nodes/proxy
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/node-permissions-and-status.md#nodes-proxy
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of the ServiceAccounts of pods running on nodes covered by its nodes/proxy grant, by executing in those pods through the kubelet.
  requires:
    all_of: []
    any_of:
      - - {verb: create, resource: nodes, subresource: proxy, namespace: "*", resource_name: "{target.node}"}
      - - {verb: get, resource: nodes, subresource: proxy, namespace: "*", resource_name: "{target.node}"}
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "*"
      k8s_sa_used_by_running_pod: true
    scope: cluster
    aggregate_as: "ServiceAccounts of pods on proxied nodes in {cluster}"
  conditions:
    - id: kubelet_webhook_authorization
      description: The kubelet must authorize via the API server (Webhook mode, default in managed clusters) so the nodes/proxy grant is honored.
    - id: get_only_needs_direct_kubelet
      description: With only get, execution needs direct network reach to the kubelet port (WebSocket upgrade to the kubelet); the API-server proxy path maps exec to create.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Remove nodes/proxy from monitoring and other roles; use the fine-grained kubelet subresources (nodes/metrics, nodes/stats, nodes/log) instead.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
  notes: "{target.node} = the node hosting the target pod. Bypasses API-server audit for pods/exec. Executing into privileged pods on those nodes also reaches the node (k8s-nodes-nodes-proxy-node)."

- id: k8s-nodes-nodes-proxy-node
  provider: k8s
  service: nodes
  title: Use nodes/proxy to execute in privileged pods
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/node-permissions-and-status.md#nodesproxy-get---kubelet-exec-via-websocket-verb-confusion
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of covered nodes that run at least one pod with a privileged container or node-escape capability.
  requires:
    all_of: []
    any_of:
      - - {verb: create, resource: nodes, subresource: proxy, namespace: "*", resource_name: "{target.name}"}
      - - {verb: get, resource: nodes, subresource: proxy, namespace: "*", resource_name: "{target.name}"}
  target:
    kind: k8s_node
    selector:
      k8s_node_hosting_privileged_pod_in_namespace: "*"
    scope: cluster
    aggregate_as: "Proxied nodes running privileged pods in {cluster}"
  conditions:
    - id: kubelet_webhook_authorization
      description: The kubelet must authorize via the API server.
    - id: get_only_needs_direct_kubelet
      description: With only get, direct network reach to the kubelet port is required.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Remove nodes/proxy from non-admin roles.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
  notes: Clusters running privileged DaemonSets (CNI, CSI, kube-proxy) make every node reachable. Uses the same pod classification as k8s-nodes-exec-into-host-privileged-pod (added capabilities are conditional); sensitive hostPath pods are covered by k8s-nodes-nodes-proxy-host-mount-node.

- id: k8s-nodes-nodes-proxy-host-mount-node
  provider: k8s
  service: nodes
  title: Use nodes/proxy to execute in pods mounting a runtime socket or sensitive host path
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/node-permissions-and-status.md#nodes-proxy
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of covered nodes that run at least one pod mounting a container runtime socket, node credential files, or a host-executed path writable.
  requires:
    all_of: []
    any_of:
      - - {verb: create, resource: nodes, subresource: proxy, namespace: "*", resource_name: "{target.name}"}
      - - {verb: get, resource: nodes, subresource: proxy, namespace: "*", resource_name: "{target.name}"}
  target:
    kind: k8s_node
    selector:
      k8s_node_hosting_host_mount_pod_in_namespace: "*"
    scope: cluster
    aggregate_as: "Proxied nodes running host-mount pods in {cluster}"
  conditions:
    - id: kubelet_webhook_authorization
      description: The kubelet must authorize via the API server.
    - id: get_only_needs_direct_kubelet
      description: With only get, direct network reach to the kubelet port is required.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Remove nodes/proxy from non-admin roles and avoid runtime-socket or host-root mounts in node agents.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
  notes: Same hostPath classification and conditions as k8s-nodes-exec-into-host-mount-pod.

- id: k8s-nodes-csr-kubelet-client-signer
  provider: k8s
  service: certificates
  title: Issue and approve a node client certificate
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#certificate-signing-requests
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of any node identity (system:node:<name>) by self-approving a kube-apiserver-client-kubelet certificate.
  requires:
    all_of:
      - {verb: create, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      # Read the issued certificate back (status.certificate).
      - any_of:
          - {verb: get, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: list, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: watch, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      - any_of:
          - {verb: update, resource: certificatesigningrequests, subresource: approval, api_group: certificates.k8s.io, namespace: "*"}
          - {verb: patch, resource: certificatesigningrequests, subresource: approval, api_group: certificates.k8s.io, namespace: "*"}
      # The signer check also accepts the domain wildcard resourceName.
      - any_of:
          - {verb: approve, resource: signers, api_group: certificates.k8s.io, namespace: "*", resource_name: "kubernetes.io/kube-apiserver-client-kubelet"}
          - {verb: approve, resource: signers, api_group: certificates.k8s.io, namespace: "*", resource_name: "kubernetes.io/*"}
  target:
    kind: k8s_node
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "Nodes of {cluster}"
  conditions:
    - id: kubelet_client_signer_enabled
      description: The controller-manager must sign kubernetes.io/kube-apiserver-client-kubelet with the cluster CA (managed offerings may differ).
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Restrict CSR approval and signer approve to the controller-manager and cluster administrators.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/#kubernetes-signers
  notes: Per Kubernetes docs this signer only issues subjects with organization system:nodes and CN system:node:<name>, so the reachable identities are nodes (not users or system:masters). NodeRestriction then limits each node identity to its own node's pods and objects.

- id: k8s-nodes-csr-nodeclient-autoapprove
  provider: k8s
  service: certificates
  title: Obtain an auto-approved node client certificate (bootstrap nodeclient)
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#certificate-signing-requests
  source_revision: 2415fadfbd
  summary: The source can obtain the privileges of any node identity by submitting a node client CSR that the controller-manager auto-approves.
  requires:
    all_of:
      - {verb: create, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      - {verb: get, resource: certificatesigningrequests, api_group: certificates.k8s.io, namespace: "*"}
      - {verb: create, resource: certificatesigningrequests, subresource: nodeclient, api_group: certificates.k8s.io, namespace: "*"}
  target:
    kind: k8s_node
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "Nodes of {cluster}"
  conditions:
    - id: csrapproving_controller_enabled
      description: The csrapproving controller of kube-controller-manager must be enabled (default with TLS bootstrapping); managed providers may use their own approvers.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Grant certificatesigningrequests/nodeclient only to system:bootstrappers with short-lived bootstrap tokens, and remove bootstrap tokens after node join.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/kubelet-tls-bootstrapping/#approval
  notes: Based on the official TLS bootstrapping docs (HackTricks only mentions that node bootstrap signers have different checks). The nodeclient approval does not tie the requested node name to the requester, unlike selfnodeclient, which only renews the requester's own node certificate.

- id: k8s-nodes-node-mint-pod-sa-tokens
  provider: k8s
  service: nodes
  title: Node identity mints tokens for ServiceAccounts of its pods
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/kubernetes-pivoting-to-clouds.md#privesc-to-cluster-admin
  source_revision: 2415fadfbd
  summary: A node identity can request API tokens for the ServiceAccounts used by pods running on that node when Node authorization permits it.
  source_kind: k8s_node
  requires:
    all_of: []
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "*"
      k8s_node_hosting_pods_with_sa: true
    scope: cluster
    aggregate_as: "ServiceAccounts of pods on {source.name}"
  conditions:
    - id: node_authorizer_and_audience
      description: The Node authorizer must allow a token for the Pod's ServiceAccount; NodeRestriction can limit requested audiences to those referenced by Pods on that node.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Keep privileged ServiceAccounts' pods off nodes that run untrusted workloads (taints, dedicated node pools) and minimize host-privileged pods.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/node/
  notes: The evaluator derives a definite target from a running Pod on the source node; a Pod bound but not running stays conditional. NodeRestriction limits non-default token audiences to those referenced by Pods on that node unless extra RBAC grants them. HackTricks also covers reading existing tokens from the node filesystem (attacking-kubernetes-from-inside-a-pod.md#steal-secrets).

- id: k8s-nodes-control-plane-node
  provider: k8s
  service: nodes
  title: Control of a self-managed control-plane host
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/node-permissions-and-status.md#control-plane-node-artifacts
  source_revision: 2415fadfbd
  summary: Control of a self-managed control-plane host may expose its API-server or etcd credentials and their cluster-admin privileges.
  source_kind: k8s_node
  source_selector:
    k8s_node_role: control-plane
  requires:
    all_of: []
  target:
    kind: k8s_cluster_admin
    selector:
      any_principal_in_scope: true
    scope: cluster
    aggregate_as: "cluster-admin of {cluster}"
  conditions:
    - id: self_managed_control_plane
      description: Only self-managed clusters (kubeadm, OpenShift, k3s) have control-plane nodes; EKS/GKE/AKS control planes are not reachable as nodes.
    - id: control_plane_host_access
      description: A node API credential alone cannot read local API-server or etcd files; the source must control the host filesystem or a workload with access to those files.
  blockers: []
  confidence: conditional
  severity: critical
  mitigation: Taint control-plane nodes, block untrusted pods from tolerating the taint via admission, and protect /etc/kubernetes/pki and etcd.
  references:
    - https://kubernetes.io/docs/setup/best-practices/certificates/
  notes: Control-plane nodes hold the cluster CA key, admin kubeconfig and etcd client certificates. Identify control-plane nodes by the node-role.kubernetes.io/control-plane label.

- id: k8s-nodes-replacement-pod-to-controlled-node
  provider: k8s
  service: nodes
  title: Force a controller-managed pod onto a controlled node
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/node-permissions-and-status.md#delete-pods--unschedulable-nodes
  source_revision: 2415fadfbd
  summary: A source that already controls a node can obtain the privileges of ServiceAccounts of controller-managed pods in the namespace by forcing their replacements onto that node.
  source_selector:
    source_reaches_kind: k8s_node
  requires:
    all_of: []
    any_of:
      # A NoExecute taint written through nodes patch/update both evicts the running pod and excludes competing nodes.
      - - {verb: patch, resource: nodes, namespace: "*"}
      - - {verb: update, resource: nodes, namespace: "*"}
      # Otherwise: one way to make the controller create a replacement, plus one way to exclude competing nodes.
      - - any_of:
            - {verb: delete, resource: pods, namespace: "{target.namespace}"}
            - {verb: create, resource: pods, subresource: eviction, namespace: "{target.namespace}"}
            - {verb: patch, resource: pods, namespace: "{target.namespace}"}
            - {verb: update, resource: pods, namespace: "{target.namespace}"}
            - {verb: patch, resource: pods, subresource: status, namespace: "{target.namespace}"}
            - {verb: update, resource: pods, subresource: status, namespace: "{target.namespace}"}
        - any_of:
            - {verb: patch, resource: nodes, subresource: status, namespace: "*"}
            - {verb: update, resource: nodes, subresource: status, namespace: "*"}
            - {verb: delete, resource: nodes, namespace: "*"}
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_in_namespace: "{target.namespace}"
      k8s_sa_used_by_controller_managed_pod: true
    scope: same_namespace
    aggregate_as: "ServiceAccounts of controller-managed pods in {target.namespace}"
  conditions:
    - id: replacing_controller_reference
      description: The Pod must have a controller owner reference to a ReplicaSet, ReplicationController, DaemonSet, StatefulSet, or Job; an arbitrary owner reference does not establish replacement.
    - id: controlled_node_satisfies_pod_constraints
      description: The node the source controls (enforced by source_reaches_kind k8s_node) must satisfy the replacement pod's scheduling constraints.
    - id: not_a_node_credential
      description: Default node credentials cannot do this (NodeRestriction limits deletes and status writes to their own node); the grants must belong to a non-node identity.
    - id: pdb_blocks_eviction
      description: A PodDisruptionBudget may block the eviction variant.
    - id: replacement_trigger_accepted
      description: A pods patch/update replacement works only by changing labels so the pod leaves its controller selector (the orphan keeps running); a pods/status write works only if the terminal phase is accepted and the controller replaces failed pods.
    - id: every_competing_node_excluded
      description: Every other node that satisfies the pod's constraints must be excluded (allocatable pods set to 0 via nodes/status, Node object deletion, or NoSchedule/NoExecute taint or cordon via nodes patch/update); kubelets restore status and re-register deleted Nodes, and tolerations or spec.nodeName defeat taints.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: medium
  mitigation: Do not grant nodes, nodes/status, pods/status or Node delete permissions to non-node identities; use dedicated node pools with taints for privileged workloads.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/node/
    - https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  notes: Replacement triggers and exclusion methods follow HackTricks node-permissions-and-status.md#delete-pods--unschedulable-nodes and dosing-other-nodes.md#cause-a-replacement-pod / #taints-cordon-and-eviction (a66f094ede). Composite path; source_selector source_reaches_kind k8s_node keeps the edge only when the source is a node or a chain in the same run reaches one (then condition source_reaches_k8s_node_via_chain). Kubelets restore their reported capacity, so the window is timing dependent.

- id: k8s-nodes-pods-binding-pending-pod-to-controlled-node
  provider: k8s
  service: nodes
  title: Bind a pending pod to a controlled node with pods/binding
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/node-permissions-and-status.md#nodes-and-pods-status
  source_revision: 2415fadfbd
  summary: A source that already controls a node can obtain the privileges of the ServiceAccount of a pending (unscheduled) pod by binding that pod to its node with pods/binding or the legacy bindings resource.
  source_selector:
    source_reaches_kind: k8s_node
  requires:
    all_of: []
    any_of:
      - - {verb: create, resource: pods, subresource: binding, namespace: "{target.namespace}"}
      - - {verb: create, resource: bindings, namespace: "{target.namespace}"}
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_used_by_pending_pod: true
    scope: cluster
    aggregate_as: "ServiceAccounts of pending pods in {cluster}"
  conditions:
    - id: pod_still_pending_at_bind_time
      description: The pod must still be unscheduled when the Binding is created; the scheduler may place it first.
    - id: not_a_node_credential
      description: Default node credentials cannot bind pods (NodeRestriction); the binding grant must belong to a non-node identity.
  blockers: [admission_policy, admission_webhook, kyverno_policy, gatekeeper_constraint]
  confidence: conditional
  severity: high
  mitigation: Grant pods/binding and bindings create only to the scheduler; keep privileged workloads on dedicated, tainted node pools.
  references:
    - https://kubernetes.io/docs/reference/kubernetes-api/cluster-resources/binding-v1/
  notes: HackTricks (171e422) states direct scheduling with create pods/binding or core bindings assigns an unscheduled pod to a node, bypassing the scheduler's placement decision; creating or modifying the pod is a separate permission. k8s_sa_used_by_pending_pod targets ServiceAccounts of collected pods with status.phase Pending and no spec.nodeName. The pod's token is then readable from the controlled node.

- id: k8s-nodes-attract-pending-pod-to-controlled-node
  provider: k8s
  service: nodes
  title: Attract a pending pod to a controlled node through node labels or status, or pod nomination
  source: src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/node-permissions-and-status.md#nodes-and-pods-status
  source_revision: 2415fadfbd
  summary: A source that already controls a node can obtain the privileges of the ServiceAccount of a pending pod by making that node the scheduler's choice (adding the label the pod's nodeSelector requires, forging capacity, or setting the pod's nominated node).
  source_selector:
    source_reaches_kind: k8s_node
  requires:
    all_of: []
    any_of:
      - - {verb: patch, resource: nodes, subresource: status, namespace: "*"}
      - - {verb: update, resource: nodes, subresource: status, namespace: "*"}
      - - {verb: patch, resource: nodes, namespace: "*"}
      - - {verb: update, resource: nodes, namespace: "*"}
      - - {verb: patch, resource: pods, subresource: status, namespace: "{target.namespace}"}
      - - {verb: update, resource: pods, subresource: status, namespace: "{target.namespace}"}
  target:
    kind: k8s_service_account
    selector:
      k8s_sa_used_by_pending_pod: true
    scope: cluster
    aggregate_as: "ServiceAccounts of pending pods in {cluster}"
  conditions:
    - id: pod_pending_for_missing_placement
      description: The pod must be pending because no node satisfies its nodeSelector/affinity or capacity needs (or, for nominatedNodeName, because scoring prefers another node); the label or forged status must make the controlled node feasible before another node becomes so.
    - id: node_write_name_matches_controlled_node
      description: If nodes or nodes/status permission has resourceNames, an allowed node name must be the node already controlled by the source.
    - id: hard_filters_still_apply
      description: Taints, tolerations, resource requests and admission still apply; pods/status nomination does not bypass hard filters.
    - id: kubelet_reconciles_status
      description: Kubelets restore forged nodes/status capacity and conditions; labels added through /status persist on legacy strategies.
    - id: not_a_node_credential
      description: Default node credentials cannot label or status-patch other objects freely (NodeRestriction); the grants must belong to a non-node identity.
  blockers: []
  confidence: conditional
  severity: high
  mitigation: Do not grant nodes, nodes/status or pods/status writes to non-node identities; place sensitive workloads on node pools selected by labels under the node-restriction.kubernetes.io/ prefix, which kubelets cannot self-assign.
  references:
    - https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/#noderestriction
  notes: HackTricks (a66f094ede) reproduced a non-node identity adding a scheduling label through nodes/status that scheduled a pending nodeSelector pod onto the node, forged capacity/image status attracting eligible pods, and pods/status nominatedNodeName selecting a feasible attacker node. The scheduler (not admission) places the pod, so no admission blocker applies. Complements k8s-nodes-pods-binding-pending-pod-to-controlled-node (direct binding).
