  technique: AKS namespace RoleBinding self-grant and bound ClusterRole escalation variants
  reason: "NEEDS SCHEMA: rolebindings/write plus clusterroles/bind grants only the named namespace's effective permissions, not cluster-admin. clusterroles/write plus clusterroles/escalate reaches the source only if the exact edited ClusterRole is already bound to that source. A resource-to-subject binding and resulting permission delta must be proved before either becomes an active edge. The cluster-scoped cluster-admin ClusterRoleBinding variant remains active."
