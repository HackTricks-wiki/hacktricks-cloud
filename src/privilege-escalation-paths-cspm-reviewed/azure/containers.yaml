# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure Container Instances, Container Apps and Container Apps Jobs techniques (declarative only).
# Source: hacktricks-cloud az-container-instances-apps-jobs-privesc.md (rev 171e422, re-verified).

- id: azure-aci-container-exec
  provider: azure
  service: containers
  title: Execute commands in a running Container Instances container
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftcontainerinstancecontainergroupsread-microsoftcontainerinstancecontainergroupscontainersexecaction
  source_revision: 171e422
  summary: The source can run a command inside a running container group and use the managed identity attached to that same group.
  requires:
    all_of:
      - action: Microsoft.ContainerInstance/containerGroups/containers/exec/action
        scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.ContainerInstance/containerGroups
      azure_aci_exec_running_identity: true
    scope: inherited_scope
    aggregate_as: Identities of container group {target.host_resource}
  conditions:
    - id: exact_running_container
      description: A running container in the exact group must carry the named identity and accept a command from the source.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict containers/exec/action and keep container group identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-exec
  notes: The direct exec action is checked on the exact group; CLI discovery may also need containerGroups/read. Missing runtime or identity facts stay unresolved.

- id: azure-aci-containergroup-write-existing
  provider: azure
  service: containers
  title: Redeploy an existing container group with changed command, image or environment
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftcontainerinstancecontainergroupswrite-environment-update
  source_revision: 171e422
  summary: The source can redeploy an existing running container group with changed code or command and use the managed identity attached to that same group.
  requires:
    all_of:
      - action: Microsoft.ContainerInstance/containerGroups/write
        scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.ContainerInstance/containerGroups
      azure_aci_existing_write_identity: true
    scope: inherited_scope
    aggregate_as: Identities of container group {target.host_resource}
  conditions:
    - id: exact_existing_group_update
      description: The native group must be running with the target identity and accept an in-place image, command or environment update.
    - id: uami_linked_access_check
      description: Container groups are updated by a full PUT that re-submits the identity block; for groups carrying user-assigned identities ARM may also require userAssignedIdentities/assign/action on each of them (system-assigned identities are unaffected).
    - id: interpreter_startup_hook
      description: The environment-only variant needs a container whose entrypoint honours an attacker-set startup variable; changing image/command removes this dependency.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict containerGroups/write.
  references:
    - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-update
  notes: The write permission must apply to the exact existing group. Stopped or unknown group state stays unresolved; succeeded and failed groups cannot be updated in place. Identity linked access checks and update limits remain conditional.

- id: azure-aci-assign-user-assigned-identity
  provider: azure
  service: containers
  title: Create or update a container group with a user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftresourcessubscriptionsresourcegroupsread-microsoftcontainerinstancecontainergroupswrite-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: 171e422
  summary: The source can attach an assignable user-assigned identity to a container group it can create or update, then run code as that identity.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
      - action: Microsoft.ContainerInstance/containerGroups/write
        scope: '*'
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_aci_assignable_uami: true
    scope: inherited_scope
    aggregate_as: User-assigned identities assignable in {scope}
  conditions:
    - id: aci_deployment_and_identity_use
      description: The container group must accept the update or creation, start attacker-controlled code, and expose the assigned identity token to that code.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and containerGroups/write.
  references:
    - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-managed-identity
  notes: Requires the exact identity assignment right and a writable inventoried container group, or a known resource group where a new container group can be written. Missing group inventory remains unresolved.

- id: azure-containerapp-exec
  provider: azure
  service: containers
  title: Open a console in a running Container App
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappcontainerappsread-microsoftappmanagedenvironmentsread-microsoftappcontainerappsrevisionsreplicasread-microsoftappcontainerappsrevisionsread-microsoftappcontainerappsgetauthtokenaction-microsoftappcontainerappsexecaction-microsoftappcontainerappsdebugaction
  source_revision: 171e422
  summary: A console in a running Container App may use a managed identity available to its main container.
  requires:
    all_of:
      - action: Microsoft.App/containerApps/getAuthToken/action
        scope: '{target.host_resource}'
    any_of:
      - - action: Microsoft.App/containerApps/exec/action
          data_action: true
          scope: '{target.host_resource}'
      - - action: Microsoft.App/containerApps/debug/action
          data_action: true
          scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      azure_containerapp_exec_identity: true
    scope: inherited_scope
    aggregate_as: Identities of Container App {target.host_resource}
  conditions:
    - id: replica_running
      description: The exact app must have a revision with a running replica.
    - id: identity_main_stage
      description: The target identity must be available during the app's main lifecycle.
    - id: client_reads
      description: CLI clients also use containerApps/read, revisions/read, revisions/replicas/read and managedEnvironments/read.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict exec/debug/getAuthToken actions on Container Apps.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/container-console
  notes: Native app GET and revision LIST evidence bind the current identity and running replica to the exact app where both permissions apply.

- id: azure-containerapp-write-existing
  provider: azure
  service: containers
  title: Update an existing Container App's image, command or environment
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappcontainerappswrite
  source_revision: 171e422
  summary: A writable, usable Container App can run a changed revision with its currently attached managed identity.
  requires:
    all_of:
      - action: Microsoft.App/containerApps/write
        scope: '*'
  target:
    kind: azure_managed_identity
    selector:
      azure_containerapp_write_existing_identity: true
    scope: inherited_scope
    aggregate_as: Identities of Container App {target.host_resource}
  conditions:
    - id: controlled_revision_execution
      description: Updating the app can create a controlled revision, but deployment and identity use still must succeed.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict containerApps/write.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
  notes: Native Container App GET binds the exact current identity and usable app state; the selector checks containerApps/write on that app and start/action if it is stopped. The write can set a new image, command, scale and identity lifecycle for a new revision.

- id: azure-containerapp-assign-user-assigned-identity
  provider: azure
  service: containers
  title: Attach a user-assigned identity to an existing Container App
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappcontainerappswrite-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: 171e422
  summary: The source can attach a user-assigned identity to a writable existing Container App and run a new revision with it.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_containerapp_assignable_uami: true
    scope: inherited_scope
    aggregate_as: User-assigned identities attachable to Container Apps in {scope}
  conditions:
    - id: app_revision_execution
      description: The controlled revision must start and be able to request the attached identity's token.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and containerApps/write.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
  notes: The selector checks containerApps/write on an exact inventoried app, its running status, and start/action for a stopped app. An identity change alone does not create a revision; the same write grant can change the app template to run code.

- id: azure-containerapp-create-with-user-assigned-identity
  provider: azure
  service: containers
  title: Create a Container App with a user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappcontainerappswrite-microsoftmanagedidentityuserassignedidentitiesassignaction-microsoftappmanagedenvironmentsjoinaction
  source_revision: 171e422
  summary: The source can create a Container App that runs controlled code with a user-assigned identity in a joinable environment.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_containerapp_create_uami_path: true
    scope: inherited_scope
    aggregate_as: User-assigned identities usable by new Container Apps in {scope}
  conditions:
    - id: app_and_environment_deployment
      description: The app and its environment must deploy, allocate a replica, and let controlled code request the identity token.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict managedEnvironments/join/action and userAssignedIdentities/assign/action.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/managed-identity
  notes: The selector joins a new app path under an inventoried resource group with an exact joinable existing managed environment, or a creatable environment for which the source has both managedEnvironments/write and join/action. The app and environment share a subscription; deployment remains conditional.

- id: azure-containerapp-job-start-template-override
  provider: azure
  service: containers
  title: Start a Container Apps Job execution with an overridden template
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftappjobsstartaction-microsoftappjobsread
  source_revision: 171e422
  summary: The source can obtain the privileges of the job's managed identities.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.App/jobs/start/action
          scope: '{target.host_resource}'
      - - action: Microsoft.App/jobs/write
          scope: '{target.host_resource}'
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.App/jobs
      azure_containerapp_job_execution_identity: true
    scope: inherited_scope
    aggregate_as: Identities of Container Apps Job {target.host_resource}
  conditions:
    - id: execution_template
      description: Starting the job with a controlled template, or updating it to a controlled scheduled template, must produce an execution.
    - id: identity_main_stage
      description: The identity must be available to the overridden main or supported init container, or the writer must change that setting.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict jobs/start/action and jobs/write; keep job identities least-privileged.
  references:
    - https://learn.microsoft.com/en-us/rest/api/containerapps/jobs/start
  notes: Native Job GET binds the current identity and lifecycle to one usable Job and managed environment. jobs/start/action can override one execution, including init containers on a confirmed Consumption workload profile; jobs/write can change the job to a controlled scheduled template. Actual execution remains conditional.

- id: azure-containerapp-job-assign-user-assigned-identity
  provider: azure
  service: containers
  title: Create or update a Container Apps Job with a user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-container-instances-apps-jobs-privesc.md#microsoftmanagedidentityuserassignedidentitiesassignaction-microsoftappjobswrite
  source_revision: 171e422
  summary: The source can obtain the privileges of user-assigned identities assignable in scope.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: '{target.id}'
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_containerapp_job_assignable_uami: true
    scope: inherited_scope
    aggregate_as: User-assigned identities usable by writable Container Apps Jobs in {scope}
  conditions:
    - id: job_execution
      description: The writable job must run a controlled scheduled execution to request the attached identity token.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and jobs/write.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/jobs
  notes: The selector checks jobs/write on an exact existing job in a usable managed environment, or a new job path in an inventoried group with managedEnvironments/join/action on an exact usable or creatable environment. The user-assigned identity must be verified, and deployment remains conditional.

- id: azure-containerapp-sourcecontrols-write
  provider: azure
  service: containers
  title: Repoint a Container App's GitHub Actions deployment to an attacker repository
  source: src/pentesting-cloud/azure-security/az-persistence/az-container-apps-persistence.md#microsoftappcontainerappssourcecontrolswrite--repoint-github-actions-deployment
  source_revision: 658a097d5c
  summary: A reviewed attacker-controlled build and running revision may use the Container App's current managed identity.
  requires:
    all_of:
      - action: Microsoft.App/containerApps/sourcecontrols/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      azure_challenge_fact: azure-containerapp-sourcecontrols-write
    scope: inherited_scope
    aggregate_as: "Verified deployed identity of Container App {target.host_resource}"
  conditions:
    - id: exact_source_control_deployment
      description: Reviewed evidence must bind the source-control change, attacker-controlled build and running deployed revision to the exact Container App and its current usable managed identity.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict Microsoft.App/containerApps/sourcecontrols/write (Container Apps Contributor, Contributor) and alert on source-control binding changes.
  references:
    - https://learn.microsoft.com/en-us/azure/container-apps/github-actions
  notes: Uses typed azure_privesc_challenge_evidence and native Container App GET/revision LIST validated by azure_deployment_pivots. The selector checks the action grant on the exact sourcecontrols child resource named in the reviewed evidence. A sourcecontrols/write grant or source-binding change alone cannot create an identity edge.
