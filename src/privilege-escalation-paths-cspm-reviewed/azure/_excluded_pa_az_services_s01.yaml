# Verified exclusion proposals from pa-az-services-s01.yaml.
- source: src/pentesting-cloud/azure-security/az-services/az-ai-foundry.md#monitoring--supply-chain
  technique: Read Git or external-source PATs and alter a later ML pipeline or prompt flow
  source_revision: 0b36331
  reason: A connection secret must actually be a live push-capable PAT for a specific repository; that repository must be
    linked to a privileged pipeline or prompt flow, and a later run must execute the changed code. Neither repository authorization
    nor repository-to-workload dependency and trigger are established by the workspace connection metadata.
- source: src/pentesting-cloud/azure-security/az-services/az-ai-foundry.md#data--secret-stores
  technique: Recover a storage SAS/key or Search/OpenAI API key from an ML datastore or connection
  source_revision: 0b36331
  reason: The returned secret content must establish credential type, validity, target service, and authorization beyond the
    caller. The page lists several possible types; the existing azure-ml-connection-secrets entry already covers service-principal
    secrets, while a SAS or API key does not identify a reusable Azure or Entra principal. A service-plane edge also needs
    the specific backing resource and its local-auth/network state.
- source: src/pentesting-cloud/azure-security/az-services/az-api-management.md#named-values
  technique: Read APIM Named Values containing arbitrary API keys or service secrets
  source_revision: 0b36331
  reason: The Named Value must actually contain a live credential, and its content must identify a target service and effective
    privileges. Key Vault references resolve through the APIM identity; the section alone does not prove the reader can use
    the referenced secret. Service-principal credentials are already covered by azure-apim-named-value-secret.
- source: src/pentesting-cloud/azure-security/az-services/az-app-services.md#app-service-basic-information
  technique: Read App Service settings or mount configuration containing a database or storage key
  source_revision: 0b36331
  reason: The configuration must actually contain a valid database or storage credential, identify its backing service, and
    grant access beyond the caller; the section only says these details may be exposed. Subsequent identity gain through data
    poisoning additionally requires a consuming privileged workload and execution.
- source: src/pentesting-cloud/azure-security/az-services/az-arm-templates.md#search-sensitive-info
  technique: Read deployment history or template containing a plaintext password, token, or secret
  source_revision: 0b36331
  reason: The saved template must actually contain an unredacted live credential and identify a stronger principal or service
    to which it authenticates. Deployment read permission and searching for password/secret/token/key strings do not establish
    that content fact or a privilege gain.
