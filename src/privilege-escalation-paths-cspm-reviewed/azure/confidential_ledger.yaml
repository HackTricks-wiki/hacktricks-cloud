# catalog_description: Active Azure entries require an identified source principal or intrinsic credential foothold,
# X permission or capability enabling a stated action, and an exact target principal credential, token,
# role/group membership, or additional permissions granted to the caller. Secret/config reads alone
# are excluded unless verified content establishes a usable credential for a named target principal.
# Canonical policy: peaso/privesc/catalog_policy.yaml
# Azure Confidential Ledger techniques (declarative only).
# Source: hacktricks-cloud az-confidential-ledger-privesc.md (rev 171e422).

- id: azure-confidentialledger-ledgers-write-principal
  provider: azure
  service: confidential_ledger
  title: Add a principal as ledger Administrator through ledgers/write
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-confidential-ledger-privesc.md#data-plane-role-self-grant-via-ledgerswrite
  source_revision: 171e422
  summary: The source can add its own Entra principal as a ledger Administrator by updating the ledger's aadBasedSecurityPrincipals list.
  requires:
    all_of:
      - action: Microsoft.ConfidentialLedger/ledgers/write
        scope: "{target.scope}"
  target:
    kind: azure_dataplane_admin
    selector:
      any_principal_in_scope: true
      azure_confidential_ledger_admin_path: true
    scope: inherited_scope
    aggregate_as: "Confidential Ledger administrators of {target.scope}"
  conditions:
    - id: ledger_data_plane_access
      description: The source must obtain a ledger audience token and reach the ledger endpoint to use the new role.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: medium
  mitigation: Restrict ledgers/write and monitor aadBasedSecurityPrincipals changes.
  references:
    - https://learn.microsoft.com/en-us/rest/api/resource-manager/confidentialledger/ledger/update?view=rest-resource-manager-confidentialledger-2022-05-13
    - https://learn.microsoft.com/en-us/azure/confidential-ledger/manage-azure-ad-users
  notes: The selector requires an inventoried usable ledger and a source user, service principal, or managed identity. The ARM update can grant Administrator; data-plane use remains conditional.
