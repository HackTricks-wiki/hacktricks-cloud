- id: azure-vm-create-with-user-assigned-identity
  provider: azure
  service: virtual_machines
  title: Create a VM with an attached user-assigned identity
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftresourcesdeploymentswrite-microsoftnetworkvirtualnetworkswrite-microsoftnetworknetworksecuritygroupswrite-microsoftnetworknetworksecuritygroupsjoinaction-microsoftnetworkpublicipaddresseswrite-microsoftnetworkpublicipaddressesjoinaction-microsoftnetworknetworkinterfaceswrite-microsoftcomputevirtualmachineswrite-microsoftnetworkvirtualnetworkssubnetsjoinaction-microsoftnetworknetworkinterfacesjoinaction-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: f96d849321
  summary: A newly created VM the source administers carries any user-assigned identity the source can assign, so its tokens become available from the guest.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: "{target.id}"
      - action: Microsoft.Compute/virtualMachines/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_vm_create_uami_path: true
    scope: inherited_scope
    aggregate_as: "User-assigned identities assignable in {scope}"
  conditions:
    - id: guest_access_path
      description: The source must reach the guest (public IP + NSG rule, which needs publicIPAddresses/write+join and networkSecurityGroups/write+join, or outbound-only custom data/cloud-init executed at provisioning).
    - id: vnet_creation
      description: Without an existing joinable subnet, virtualNetworks/write is also needed.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action to specific identities and deployment principals; use Azure Policy to restrict which identities can be attached to new compute.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-configure-managed-identities
  notes: The source must be able to create a VM in a known resource group and either join an inventoried unattached NIC with a subnet-linked IP configuration or create a NIC with join permission on an inventoried subnet. Microsoft.Resources/deployments/write is only needed when creating through an ARM/CLI deployment.

- id: azure-vm-assign-user-assigned-identity-existing
  provider: azure
  service: virtual_machines
  title: Attach a user-assigned identity to an existing VM the source can execute code on
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachineswrite-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: 73e3da7a24
  summary: Adding a user-assigned identity to a VM where the source already has code execution exposes that identity's tokens via IMDS.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: "{target.id}"
      - action: Microsoft.Compute/virtualMachines/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_vm_assign_existing_uami_path: true
    scope: inherited_scope
    aggregate_as: "User-assigned identities assignable in {scope}"
  conditions:
    - id: guest_compromise_outside_rbac
      description: HackTricks also covers the case where the VM is compromised by non-RBAC means (SSRF, existing shell); that case is not detectable from RBAC alone.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and virtualMachines/write; alert on identity changes on VMs.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-configure-managed-identities
  notes: The VM must be inventoried, writable and have a usable direct guest route on that same VM. Run Command, managed Run Command and extension child grants are checked at their exact scopes. Entra login needs the login extension and a system identity. A stopped VM requires start/action. Conditional indirect routes are modelled separately.

- id: azure-vm-assign-user-assigned-identity-indirect-exec
  provider: azure
  service: virtual_machines
  title: Attach a user-assigned identity to an existing VM and run code through an indirect guest route
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachineswrite-microsoftmanagedidentityuserassignedidentitiesassignaction
  source_revision: e577627314
  summary: Adding a user-assigned identity to a VM and reaching the guest through customData re-provisioning, Serial Console, a VM Application, an OS disk swap or a guest configuration assignment exposes that identity's tokens via IMDS.
  requires:
    all_of:
      - action: Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        scope: "{target.id}"
      - action: Microsoft.Compute/virtualMachines/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      managed_identity_type: user_assigned
      azure_vm_assign_indirect_uami_path: true
    scope: inherited_scope
    aggregate_as: "User-assigned identities assignable in {scope}"
  conditions:
    - id: route_prerequisites
      description: Each route keeps the prerequisites of its own entry (azure-vm-customdata-reimage, azure-vm-serial-console-connect, azure-vm-gallery-application-install, azure-vm-os-disk-swap, azure-guestconfiguration-assignment-write), such as cloud-init re-provisioning, boot diagnostics and a guest recovery path, a gallery application in the VM's region, a compatible attacker disk, or the guest configuration extension.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict userAssignedIdentities/assign/action and virtualMachines/write; alert on identity changes on VMs together with reimage, Serial Console, applicationProfile, OS disk and guest configuration changes.
  references:
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-configure-managed-identities
