    - https://learn.microsoft.com/en-us/azure/virtual-machines/vm-applications-how-to
  notes: Split from the direct code route. One inventoried VM must be writable; the indirect route must apply to that VM. Gallery routes need an inventoried application; disk routes need an inventoried disk in the VM region. Runtime execution remains conditional on route-specific prerequisites.

