- id: azure-vm-os-disk-swap
  provider: azure
  service: virtual_machines
  title: Swap a VM's OS disk for an attacker-prepared disk
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachineswrite-os-disk-swap
  source_revision: e577627314
  summary: Replacing a VM's OS disk with one containing attacker-controlled code can expose its attached managed identities when the VM boots the replacement disk.
  requires:
    all_of:
      - action: Microsoft.Compute/virtualMachines/write
        scope: "*"
      - action: Microsoft.Compute/disks/read
        scope: "*"
      - action: Microsoft.Compute/disks/write
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
      azure_vm_os_disk_swap_path: true
    scope: inherited_scope
    aggregate_as: "Managed identities of VM {target.host_resource}"
  conditions:
    - id: attacker_disk_available
      description: The source needs a managed disk whose content it controls (uploaded image or a modified copy of a snapshot), in the same region with a compatible OS, generation and security type.
    - id: downtime_tolerated
      description: The VM need not be deallocated for the swap, but the workload can be disrupted; a stopped VM needs start/action to boot the replacement disk.
    - id: encryption_compatible
      description: Disk encryption sets, confidential or Trusted Launch settings can prevent attaching a foreign disk.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict virtualMachines/write and disk writes, alert on OS disk changes, and use resource locks on critical VMs.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/linux/os-disk-swap
    - https://learn.microsoft.com/en-us/azure/virtual-machines/windows/os-disk-swap
  notes: The evaluator joins VM write with an existing compatible disk or a disk the source can create in a known resource group. Disk content control and boot compatibility remain conditional; an attached disk or a known incompatible disk is excluded. Attaching a data disk is a separate data-access route.

- id: azure-vmss-model-write
  provider: azure
  service: virtual_machines
  title: Tamper with a scale-set model (extensions, custom data) to run code on instances
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#microsoftcomputevirtualmachinescalesetswrite-scale-set-model-tampering
  source_revision: 24dfc65df0
  summary: Adding an extension to a scale-set model, once applied to instances, runs code as root/SYSTEM and exposes the scale set's managed identities.
  requires:
    all_of: []
    any_of:
      - - action: Microsoft.Compute/virtualMachineScaleSets/write
          scope: "*"
      - - action: Microsoft.Compute/virtualMachineScaleSets/extensions/write
          scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachineScaleSets
      azure_vmss_model_rollout_path: true
    scope: inherited_scope
    aggregate_as: "Managed identities of scale set {target.host_resource}"
  conditions:
    - id: model_rollout
      description: A Uniform scale set model change reaches existing instances under automatic or rolling policy, or after manualUpgrade, reimage or reapply action on that scale set. Scale-set write can also change the upgrade policy or affect new instances.
    - id: aks_node_pools
      description: For AKS node pools the node resource group is normally protected by a deny assignment.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict virtualMachineScaleSets/write and extensions/write, allow-list extensions with Azure Policy, and alert on scale-set model changes.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-policy
    - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-orchestration-modes
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/compute
  notes: The documented rollout action is virtualMachineScaleSets/manualUpgrade/action on the scale set. Exact extension-child grants must join that scale set; known monitoring-only handlers are excluded and unknown handlers remain unresolved. Flexible orchestration instance identity effects remain unresolved.

- id: azure-vm-customdata-reimage
  provider: azure
  service: virtual_machines
  title: Supply customData while reimaging a VM
  source: src/pentesting-cloud/azure-security/az-privilege-escalation/az-virtual-machines-and-network-privesc.md#reimage-a-vm-with-new-customdata
  source_revision: b9040926a9
  summary: A reimage request can supply customData to a Linux VM; if its provisioning agent runs the payload, code in the guest can obtain the VM's managed identity tokens.
  requires:
    all_of:
      - action: Microsoft.Compute/virtualMachines/reimage/action
        scope: "*"
  target:
    kind: azure_managed_identity
    selector:
      attached_to_service: Microsoft.Compute/virtualMachines
      azure_vm_reimage_customdata_path: true
    scope: inherited_scope
    aggregate_as: "Managed identities of VM {target.host_resource}"
  conditions:
    - id: cloud_init_reprocesses_customdata
      description: The Linux image must run cloud-init (or an equivalent agent) on reimage and process the request-body customData. Normal VM updates cannot change customData and redeploy does not supply a new payload.
    - id: destructive
      description: Reimage resets the OS disk, which is disruptive to the workload.
  blockers:
    - azure_deny_assignment
  confidence: conditional
  severity: high
  mitigation: Restrict virtualMachines/reimage/action and alert on reimage requests carrying customData.
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-machines/custom-data
    - https://learn.microsoft.com/en-us/rest/api/compute/virtual-machines/reimage?view=rest-compute-2026-04-01
