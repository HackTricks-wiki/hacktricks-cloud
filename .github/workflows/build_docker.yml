name: Build and Push Docker Image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .github/workflows/build_docker.yml
  workflow_dispatch:

concurrency:
  group: build-translator-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hacktricks-wiki/hacktricks-cloud/translator-image

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=translator-image
          cache-to: type=gha,mode=max,scope=translator-image

      - name: Smoke-test published image
        run: |
          docker pull "${IMAGE}:latest"
          docker run --rm "${IMAGE}:latest" bash -euc '
            python --version
            aws --version
            gh --version
            git --version
            mdbook --version
            mdbook-alerts --version
            test -x "$(command -v mdbook-reading-time)"
            test -x "$(command -v mdbook-pagetoc)"
            test -x "$(command -v mdbook-tabs)"
            test -x "$(command -v mdbook-codename)"
            python -c "import openai, tiktoken, tqdm"
          '
