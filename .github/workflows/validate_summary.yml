name: Validate SUMMARY.md

# A malformed SUMMARY.md kills `mdbook build`, which means it takes down the
# English site AND all 16 translated deploys at once. This runs in ~20s so the
# breakage is caught (and named) immediately instead of surfacing 40 minutes
# later as 16 confusing "Translator All" failures.

on:
  pull_request:
    paths:
      - 'src/**'
  push:
    branches:
      - master
    paths:
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: validate-summary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check SUMMARY.md
        id: check
        run: |
          if python3 scripts/check_summary.py; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # On a pull request we never rewrite the contributor's branch - just fail
      # with the diagnosis so they can run `--fix` themselves.
      - name: Fail the pull request
        if: steps.check.outputs.ok == 'false' && github.event_name == 'pull_request'
        run: |
          echo "::error file=src/SUMMARY.md::SUMMARY.md is invalid - mdbook would fail to build."
          echo "Run 'python3 scripts/check_summary.py --fix' locally and commit the result."
          exit 1

      # On master the site is already broken, so repair what is safely
      # repairable (exact duplicate entries) and push, which retriggers the
      # build. Anything not auto-fixable still fails loudly below.
      - name: Auto-fix duplicates on master
        if: steps.check.outputs.ok == 'false' && github.event_name != 'pull_request'
        run: |
          python3 scripts/check_summary.py --fix || true
          if git diff --quiet -- src/SUMMARY.md; then
            echo "Nothing was auto-fixable."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add src/SUMMARY.md
            git commit -m "Remove duplicate SUMMARY.md entries (automated)"
            git push origin HEAD:master
            echo "Pushed an automatic SUMMARY.md repair."
          fi

      - name: Re-check and fail if anything remains
        if: steps.check.outputs.ok == 'false' && github.event_name != 'pull_request'
        run: |
          python3 scripts/check_summary.py || {
            echo "::error file=src/SUMMARY.md::SUMMARY.md still invalid after auto-fix - needs a human."
            exit 1
          }
