name: Translator All

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.gitignore'
      - Dockerfile
      - '.github/**'
      - 'autonomous_research/**'
  workflow_dispatch:
    inputs:
      files:
        description: 'Optional comma-separated src/*.md paths to retry in addition to the language backlog'
        required: false
        default: ''
      only_language:
        description: 'Optional language branch code to resume only that language'
        required: false
        default: ''

permissions:
  packages: write
  id-token: write
  contents: write
  actions: read
  pull-requests: read

jobs:
  select-languages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: select
        env:
          ONLY_LANGUAGE: ${{ inputs.only_language }}
        run: python3 scripts/translation_matrix.py --only "$ONLY_LANGUAGE" >> "$GITHUB_OUTPUT"

  translate:
    name: Translate → ${{ matrix.name }} (${{ matrix.branch }})
    needs: select-languages
    runs-on: ubuntu-latest
    environment: prod

    # Translate each language independently. The per-branch concurrency group
    # prevents overlapping runs from writing to the same language branch.
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.select-languages.outputs.matrix) }}

    # Ensure only one job per branch runs at a time (even across workflow runs)
    concurrency:
      group: translate-${{ matrix.branch }}
      cancel-in-progress: false

    container:
      image: ghcr.io/hacktricks-wiki/hacktricks-cloud/translator-image:latest

    env:
      LANGUAGE: ${{ matrix.language }}
      BRANCH:   ${{ matrix.branch }}

    steps:
      - name: Wait for build_master to start
        run: |
          echo "Waiting 30 seconds to let build_master.yml initialize and reset the searchindex repo..."
          sleep 30
          echo "Continuing with translation workflow"
      
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate translator directive safeguards
        run: |
          python scripts/test_translator_directives.py -v
          python scripts/test_translator_batch.py -v
          python scripts/test_translation_backlog.py -v

      - name: Verify image tools and download scripts
        run: |
          gh --version
          wget --version | head -n 1

          cp scripts/get_and_save_refs.py /tmp/get_and_save_refs.py
          cp scripts/compare_and_fix_refs.py /tmp/compare_and_fix_refs.py
          cp scripts/translator.py /tmp/translator.py
          cp scripts/translation_backlog.py /tmp/translation_backlog.py
          cp scripts/push_branch_with_retry.sh /tmp/push_branch_with_retry.sh
          cp scripts/seo_postprocess.py /tmp/seo_postprocess.py
          cp scripts/mark_unchanged_s3_files.py /tmp/mark_unchanged_s3_files.py
          cp scripts/upload_immutable_images.sh /tmp/upload_immutable_images.sh
          cp .github/build_compact_search_index.py /tmp/build_compact_search_index.py
          cp theme/ht_searcher.js /tmp/ht_searcher.js
          mkdir -p /tmp/immutable-images
          cp \
            src/images/hacktricks-summer-discount-2026-v1.webp \
            src/images/arte-badge-v1.webp \
            src/images/grte-badge-v1.webp \
            src/images/azrte-badge-v1.webp \
            src/images/lee-sponsor-v1.webp \
            src/images/azrte-sponsor-v1.webp \
            src/images/grte-sponsor-v1.webp \
            src/images/lhe-sponsor-v1.webp \
            src/images/arte-sponsor-v1.webp \
            /tmp/immutable-images/
          cp theme/discount.js /tmp/discount.js

      - name: Run get_and_save_refs.py
        run: |
          python /tmp/get_and_save_refs.py

      - name: Download language branch & update refs
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name 'Translator'
          git config --global user.email 'github-actions@github.com'
          git config pull.rebase false
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          python /tmp/compare_and_fix_refs.py --files-unmatched-paths /tmp/ref-mismatches.txt
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Fix unmatched refs"
            bash /tmp/push_branch_with_retry.sh "$BRANCH"
          fi

      - name: Run translation script on changed files
        shell: bash
        env:
          INPUT_FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          git checkout master
          # Repair known SUMMARY.md breakage (duplicate entries) before it is
          # captured here, so the fixed copy is what gets synced to every
          # language branch below and mdbook does not abort the whole build.
          python3 scripts/check_summary.py --fix
          cp src/SUMMARY.md /tmp/master-summary.md
          git restore -- src/SUMMARY.md
          python /tmp/translation_backlog.py plan \
            --language "$BRANCH" \
            --output /tmp/pending-pages.txt \
            --extras /tmp/ref-mismatches.txt \
            --extra-env INPUT_FILES
          echo "$(wc -l < /tmp/pending-pages.txt) pages pending for $BRANCH"

          if [ -s /tmp/pending-pages.txt ]; then
            split -l 80 -d -a 3 /tmp/pending-pages.txt /tmp/translation-batch-
            for batch in /tmp/translation-batch-*; do
              git checkout master
              python /tmp/translator.py \
                --language "$LANGUAGE" \
                --branch "$BRANCH" \
                --api-key "${{ secrets.OPENAI_API_KEY }}" \
                --file-list "$batch" \
                --threads 3
              python /tmp/translation_backlog.py mark \
                --language "$BRANCH" \
                --file-list "$batch"
              git add .translation-source-blobs.json
              if ! git diff --cached --quiet; then
                git commit -m "Record translated English source blobs for $BRANCH"
                bash /tmp/push_branch_with_retry.sh "$BRANCH"
              fi
            done
          fi
          git checkout master
          python /tmp/translation_backlog.py verify --language "$BRANCH"

      - name: Sync SUMMARY.md from master
        run: |
          git checkout "$BRANCH"
          git pull
          if [ -f /tmp/master-summary.md ]; then
            cp /tmp/master-summary.md src/SUMMARY.md
            git add src/SUMMARY.md
            git commit -m "Sync SUMMARY.md with master" || echo "SUMMARY already up to date"
            bash /tmp/push_branch_with_retry.sh "$BRANCH"
          else
            echo "master summary not exported; failing"
            exit 1
          fi

      - name: Build mdBook
        run: |
          git checkout "$BRANCH"
          git pull
          MDBOOK_BOOK__LANGUAGE=$BRANCH mdbook build || (echo "Error logs" && cat hacktricks-preprocessor-error.log && echo "" && echo "" && echo "Debug logs" && (cat hacktricks-preprocessor.log | tail -n 20) && exit 1)
          cp /tmp/immutable-images/* ./book/images/
          cp /tmp/discount.js ./book/discount.js
          cp /tmp/ht_searcher.js ./book/theme/ht_searcher.js

      - name: Push search index to hacktricks-searchindex repo
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail

          ASSET="book/searchindex.js"
          COMPACT_ASSET="/tmp/searchindex-v2.json"
          TARGET_REPO="HackTricks-wiki/hacktricks-searchindex"
          FILENAME="searchindex-cloud-${BRANCH}.js"
          COMPACT_FILENAME="searchindex-cloud-v2-${BRANCH}.json"

          if [ ! -f "$ASSET" ]; then
            echo "Expected $ASSET to exist after build" >&2
            exit 1
          fi

          TOKEN="${PAT_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No PAT_TOKEN available" >&2
            exit 1
          fi

          # Clone the searchindex repo
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git" /tmp/searchindex-repo
          
          # Compress the searchindex file
          python3 /tmp/build_compact_search_index.py "$ASSET" "$COMPACT_ASSET"
          gzip -9 -k -f "$ASSET"
          gzip -9 -k -f "$COMPACT_ASSET"
          
          # Show compression stats
          ORIGINAL_SIZE=$(wc -c < "$ASSET")
          COMPRESSED_SIZE=$(wc -c < "${ASSET}.gz")
          RATIO=$(awk "BEGIN {printf \"%.1f\", ($COMPRESSED_SIZE / $ORIGINAL_SIZE) * 100}")
          echo "Compression: ${ORIGINAL_SIZE} bytes -> ${COMPRESSED_SIZE} bytes (${RATIO}%)"
          
          # XOR encrypt the compressed file
          KEY='Prevent_Online_AVs_From_Flagging_HackTricks_Search_Gzip_As_Malicious_394h7gt8rf9u3rf9g'
          cat > /tmp/xor_encrypt.py << 'EOF'
          import sys
          key = sys.argv[1]
          input_file = sys.argv[2]
          output_file = sys.argv[3]
          with open(input_file, 'rb') as f:
              data = f.read()
          key_bytes = key.encode('utf-8')
          encrypted = bytearray(len(data))
          for i in range(len(data)):
              encrypted[i] = data[i] ^ key_bytes[i % len(key_bytes)]
          with open(output_file, 'wb') as f:
              f.write(encrypted)
          print(f"Encrypted: {len(data)} bytes")
          EOF
          python3 /tmp/xor_encrypt.py "$KEY" "${ASSET}.gz" "${ASSET}.gz.enc" 
          python3 /tmp/xor_encrypt.py "$KEY" "${COMPACT_ASSET}.gz" "${COMPACT_ASSET}.gz.enc"
          
          # Copy ONLY the encrypted .gz version to the searchindex repo (no uncompressed .js)
          cp "${ASSET}.gz.enc" "/tmp/searchindex-repo/${FILENAME}.gz"
          cp "${COMPACT_ASSET}.gz.enc" "/tmp/searchindex-repo/${COMPACT_FILENAME}.gz"
          
          # Commit and push with retry logic resilient to concurrent writers/history rewrites
          cd /tmp/searchindex-repo
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

          MAX_RETRIES=20
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push attempt ${RETRY_COUNT}/${MAX_RETRIES}"

            # Rebuild commit from latest remote state each attempt.
            git fetch origin master
            git checkout -B master origin/master
            cp "${GITHUB_WORKSPACE}/${ASSET}.gz.enc" "${FILENAME}.gz"
            cp "${COMPACT_ASSET}.gz.enc" "${COMPACT_FILENAME}.gz"
            git add "${FILENAME}.gz" "${COMPACT_FILENAME}.gz"

            if git diff --staged --quiet; then
              echo "No changes to commit"
              break
            fi

            git commit -m "Update ${FILENAME} from hacktricks-cloud build"

            if git push origin master 2>&1 | tee /tmp/push_output.txt; then
              echo "Successfully pushed on attempt ${RETRY_COUNT}"
              break
            fi

            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              if grep -q "cannot lock ref 'refs/heads/master'" /tmp/push_output.txt; then
                echo "Concurrent update detected on remote master. Retrying..."
              else
                echo "Push failed. Retrying with fresh remote state..."
              fi
              sleep 1
            else
              echo "Failed to push after ${MAX_RETRIES} attempts"
              exit 1
            fi
          done
      
      # Login in AWs
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Post-process SEO artifacts
        run: |
          python3 /tmp/seo_postprocess.py pages \
            --book-dir ./book \
            --site-url https://cloud.hacktricks.wiki \
            --lang "$BRANCH" \
            --default-lang en \
            --site-name "HackTricks Cloud"
      
      # Sync the build to S3
      - name: Sync to S3
        run: |
          echo "Current branch:"
          git rev-parse --abbrev-ref HEAD
          echo "Syncing $BRANCH to S3"
          # mdBook refreshes mtimes on every build. Age byte-identical files
          # based on single-part S3 ETags so `s3 sync` skips redundant PUTs.
          aws s3api list-objects-v2 \
            --bucket hacktricks-cloud \
            --prefix "$BRANCH/" \
            --output json > /tmp/s3-branch-manifest.json
          python3 /tmp/mark_unchanged_s3_files.py \
            --source ./book \
            --manifest /tmp/s3-branch-manifest.json \
            --remote-prefix "$BRANCH/"
          aws s3 sync ./book "s3://hacktricks-cloud/$BRANCH" --delete
          bash /tmp/upload_immutable_images.sh hacktricks-cloud "$BRANCH"
          echo "Sync completed"
          echo "Cat 3 files from the book"
          find . -type f -name 'index.html' -print | head -n 3 | xargs -r cat

  finalize-deployment:
    name: Finalize translated deployment
    needs: translate
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Refresh root sitemap index
        shell: bash
        run: |
          set -euo pipefail
          LANGS=$(aws s3api list-objects-v2 --bucket hacktricks-cloud --delimiter / --query 'CommonPrefixes[].Prefix' --output text | tr '\t' '\n' | sed 's:/$::' | grep -E '^[a-z]{2}$' | sort | paste -sd, - || true)
          if [ -z "$LANGS" ]; then
            LANGS="en"
          fi
          python3 scripts/seo_postprocess.py index \
            --site-url https://cloud.hacktricks.wiki \
            --languages "$LANGS" \
            --output ./sitemap.xml
          if aws s3 cp s3://hacktricks-cloud/sitemap.xml /tmp/current-root-sitemap.xml >/dev/null 2>&1 && cmp -s /tmp/current-root-sitemap.xml ./sitemap.xml; then
            echo "Root sitemap unchanged; skipping its upload."
          else
            aws s3 cp ./sitemap.xml s3://hacktricks-cloud/sitemap.xml \
              --content-type application/xml \
              --cache-control max-age=300
          fi

      # A push to the default branch fans out into several workflows that each
      # invalidate an overlapping set of paths, and CloudFront bills every path
      # past the first 1000 a month. Skip the ones another run already covers.
      - name: Check whether this invalidation is still needed
        id: invalidation
        uses: ./.github/actions/invalidation-needed
        with:
          github-token: ${{ github.token }}
          merge-comment-author: ""

      - name: Invalidate translated HTML and SEO assets once
        if: steps.invalidation.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
