name: Validate privilege-escalation paths
on:
  pull_request:
    paths:
      - 'src/privilege-escalation-paths/**'
      - 'scripts/privesc_paths_schema.py'
      - 'scripts/validate_privesc_paths.py'
      - '.github/workflows/validate-privilege-escalation-paths.yml'
  push:
    branches: [master]
    paths:
      - 'src/privilege-escalation-paths/**'
      - 'scripts/privesc_paths_schema.py'
      - 'scripts/validate_privesc_paths.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - run: python scripts/validate_privesc_paths.py --book-root .
